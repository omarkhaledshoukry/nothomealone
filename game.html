      });
      wordLoadInfo = { status: "loaded", url: source, count: eligible.length, error: null };
      console.info(`Loaded ${eligible.length} matching answers of up to ${maxLength} letters from ${source}`);
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      readyButton.disabled = !levelMediaIsPrepared();
      startWord(0);
      populateClueList();
      wordsReadyForClue = true;
      rememberCurrentRoom();
      revealWhenMediaReady();
    }

    function showWordLoadError(error) {
      const reason = error.name === "AbortError"
        ? "The request timed out. Check your connection and retry."
        : error.message;
      wordLoadInfo = { ...wordLoadInfo, status: "error", count: 0, error: reason };
      wordsReadyForClue = false;
      readyButton.disabled = true;
      loadingWord.hidden = true;
      wordLoadError.hidden = false;
      wordLoadReason.textContent = reason;
      wordLoadTitle.textContent = `Couldn’t load ${levelDataFile()}`;
      wordLoadHelp.textContent = isPuzzleLevel() ? "Retry, or choose your puzzle text file directly." : "Retry, or choose your word list directly.";
      document.getElementById("retryWordsButton").hidden = false;
      document.getElementById("chooseWordsButton").textContent = `Choose ${levelDataFile()}`;
      wordLoadUrl.hidden = false;
      wordLoadUrl.href = wordLoadInfo.url;
      wordLoadUrl.textContent = wordLoadInfo.url;
      console.warn("Could not load the word list.", wordLoadInfo);
    }

    function showLocalFolderPrompt(reason = "") {
      loadingScreen.classList.remove("hidden");
      loadingWord.hidden = true;
      wordLoadError.hidden = false;
      wordLoadTitle.textContent = "Choose your game folder";
      wordLoadReason.textContent = reason || "Select the folder containing config.txt, your word list and puzzle file.";
      wordLoadHelp.textContent = "The text files will be read together. A missing or invalid config uses the built-in settings.";
      wordLoadUrl.hidden = true;
      document.getElementById("retryWordsButton").hidden = true;
      chooseGameFolderButton.hidden = false;
      document.getElementById("chooseWordsButton").textContent = "Choose word list only";
      if (!("webkitdirectory" in gameFolderInput)) chooseGameFolderButton.textContent = "Choose config and words";
      readyButton.disabled = true;
      wordLoadInfo = { ...wordLoadInfo, status: reason ? "error" : "waiting-for-folder", error: reason || null };
    }

    function rememberLocalFiles(data) {
      // Cache imported settings, words and optional save text for reopening; never media.
      // Storage may be blocked for file://, so it must remain optional.
      let stored = false;
      const cached = { ...data };
      if (data.languageFiles) {
        cached.version = 4;
        for (const key of ["wordsText", "wordsSource", "puzzlesText", "puzzlesSource"]) delete cached[key];
      }
      for (const store of ["localStorage", "sessionStorage"]) {
        try { window[store].setItem(LOCAL_FILES_CACHE_KEY, JSON.stringify(cached)); stored = true; } catch {}
      }
      return stored;
    }

    function restoreLocalFiles() {
      for (const store of ["sessionStorage", "localStorage"]) {
       try {
        const raw = window[store].getItem(LOCAL_FILES_CACHE_KEY);
        if (!raw) continue;
        const data = JSON.parse(raw);
        if (![1, 2, 3, 4].includes(data.version) || !(data.configText === null || typeof data.configText === "string")) throw new Error("Invalid saved local files.");
        if (data.version < 4 && (typeof data.wordsText !== "string" || typeof data.wordsSource !== "string")) throw new Error("Invalid cached text files.");
        if (data.version === 4 && (!data.languageFiles || typeof data.languageFiles !== "object" || Array.isArray(data.languageFiles))) throw new Error("Invalid cached language files.");
        let cachedLanguage = "en";
        try { cachedLanguage = parseGameConfig(data.configText || 'language.code="en"').resolved.language.code; } catch {}
        if (!data.language) data.language = cachedLanguage;
        const selected = readLanguagePreference() || cachedLanguage;
        if (selectLocalLanguage(data, selected)) {
          if (data.wordsText.trim()) parseWordList(data.wordsText, "", selected);
          else parsePuzzleList(data.puzzlesText, "", selected);
        }
        return data;
       } catch {
        try { window[store].removeItem(LOCAL_FILES_CACHE_KEY); } catch {}
       }
      }
      return null;
    }

    function selectedFolderPath(path) {
      const normalized = decodeURIComponent(path.replace(/\\/g, "/"));
      if (/^[a-z][a-z\d+.-]*:|^\//i.test(normalized)) throw new Error("The configured word list must be inside the selected folder.");
      const parts = [];
      for (const part of normalized.split("/")) {
        if (!part || part === ".") continue;
        if (part === "..") {
          if (!parts.length) throw new Error("The configured word list is outside the selected folder.");
          parts.pop();
        } else parts.push(part);
      }
      return parts.join("/");
    }

    async function importGameFolder(files) {
      if (location.protocol !== "file:" || folderImportBusy || wordsLoading || gameInitializationStarted || !files.length) return;
      folderImportBusy = true;
      chooseGameFolderButton.disabled = true;
      document.getElementById("chooseWordsButton").disabled = true;
      wordLoadReason.textContent = "Reading local files…";
      try {
        const entries = new Map();
        let folderName = "Game folder";
        for (const file of files) {
          const path = file.webkitRelativePath;
          if (path) {
            const slash = path.indexOf("/");
            folderName = path.slice(0, slash);
            entries.set(path.slice(slash + 1), file);
          } else entries.set(file.name, file);
        }
        const find = path => entries.get(path) || [...entries].find(([name]) => name.toLowerCase() === path.toLowerCase())?.[1];
        const configFile = find(CONFIG_FILE);
        let configText = null;
        if (configFile) {
          try { configText = await configFile.text(); }
          catch (error) { console.warn("Could not read local config; using built-in settings.", error); }
        }
        let selectedConfig = JSON.parse(JSON.stringify(CONFIG_DEFAULTS));
        if (configText !== null) {
          try { selectedConfig = parseGameConfig(configText).resolved; }
          catch { /* The same built-in fallback as automatic config loading. */ }
        }
        const preferredLanguage = readLanguagePreference();
        if (preferredLanguage) selectedConfig.language.code = preferredLanguage;
        const wordsPath = selectedFolderPath(wordsFileFor(selectedConfig));
        const wordsFile = find(wordsPath);
        const needsWords = Object.entries(selectedConfig.levels).some(([name, level]) => !isPuzzleType(name) && level.chance > 0);
        if (!wordsFile && needsWords) throw new Error(`The selected folder does not contain ${wordsPath}. Choose the folder containing that file.`);
        const wordsText = wordsFile ? await wordsFile.text() : "";
        if (wordsFile) parseWordList(wordsText, wordsFile.type, selectedConfig.language.code);
        const puzzlesPath = selectedFolderPath(puzzlesFileFor(selectedConfig)), puzzlesFile = find(puzzlesPath);
        const needsPuzzles = Object.entries(selectedConfig.levels).some(([name, level]) => isPuzzleType(name) && level.chance > 0);
        if (!puzzlesFile && needsPuzzles) throw new Error(`The selected folder does not contain ${puzzlesPath}. Add it beside config.txt, then choose the folder again.`);
        const puzzlesText = puzzlesFile ? await puzzlesFile.text() : null;
        if (puzzlesFile) parsePuzzleList(puzzlesText, puzzlesFile.type, selectedConfig.language.code);
        let saveText = null;
        try {
          const saveFile = find(selectedFolderPath(selectedConfig.assets.saveFile));
          if (saveFile) saveText = await saveFile.text();
        } catch (error) { console.info("No readable local save.txt.", error.message); }
        const levelsPrefix = selectedFolderPath(selectedConfig.assets.levelsDirectory).replace(/\/?$/, "/");
        const levelFiles = [...entries.keys()].filter(path => path.startsWith(levelsPrefix) && !path.slice(levelsPrefix.length).includes("/")).map(path => path.slice(levelsPrefix.length));
        const languageFiles = { [selectedConfig.language.code]: { wordsText, wordsSource: `${folderName}/${wordsPath}`, puzzlesText, puzzlesSource: `${folderName}/${puzzlesPath}` } };
        for (const language of ["en", "ar"]) {
          if (language === selectedConfig.language.code) continue;
          const otherConfig = { ...selectedConfig, language: { code: language } };
          const otherWordsPath = selectedFolderPath(wordsFileFor(otherConfig)), otherPuzzlePath = selectedFolderPath(puzzlesFileFor(otherConfig));
          const otherWords = find(otherWordsPath), otherPuzzle = find(otherPuzzlePath);
          if (needsWords && !otherWords || needsPuzzles && !otherPuzzle) continue;
          try {
            const otherWordsText = otherWords ? await otherWords.text() : "", otherPuzzleText = otherPuzzle ? await otherPuzzle.text() : null;
            if (otherWordsText.trim()) parseWordList(otherWordsText, "", language);
            if (otherPuzzleText) parsePuzzleList(otherPuzzleText, "", language);
            languageFiles[language] = { wordsText: otherWordsText, wordsSource: `${folderName}/${otherWordsPath}`, puzzlesText: otherPuzzleText, puzzlesSource: `${folderName}/${otherPuzzlePath}` };
          } catch (error) { console.info("Optional language files were not cached.", language, error.message); }
        }
        const data = { version: 4, language: selectedConfig.language.code, configText, wordsText, wordsSource: `${folderName}/${wordsPath}`,
          puzzlesText, puzzlesSource: `${folderName}/${puzzlesPath}`, saveText, levelFiles, languageFiles };
        rememberLocalFiles(data);
        await initializeGame(data);
      } catch (error) {
        showLocalFolderPrompt(error.message);
      } finally {
        folderImportBusy = false;
        chooseGameFolderButton.disabled = false;
        document.getElementById("chooseWordsButton").disabled = false;
        gameFolderInput.value = "";
      }
    }

    chooseGameFolderButton.addEventListener("click", () => gameFolderInput.click());
    gameFolderInput.addEventListener("change", () => importGameFolder([...gameFolderInput.files]));
    document.getElementById("changeLocalFilesButton").addEventListener("click", () => {
      if (gameplayStarted || gameplayStarting) return;
      for (const store of ["localStorage", "sessionStorage"]) {
        try { window[store].removeItem(LOCAL_FILES_CACHE_KEY); } catch {}
      }
      location.reload();
    });

    async function loadWords() {
      if (isPuzzleLevel()) return loadRandomLevel();
      if (wordsLoading || gameplayStarted) return;
      wordsLoading = true;
      readyButton.disabled = true;
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      wordLoadInfo = { status: "loading", url: new URL(WORDS_FILE, document.baseURI).href, count: 0, error: null };
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), WORDS_TIMEOUT_MS);
      try {
        const response = await fetch(wordLoadInfo.url, { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error(`The server returned HTTP ${response.status} for ${WORDS_FILE}.`);
        const text = await response.text();
        acceptWordList(text, response.url, response.headers.get("content-type") || "");
      } catch (error) {
        if (error instanceof TypeError) {
          error = new Error(location.protocol === "file:"
            ? `This browser blocked automatic loading from a local HTML file. Choose ${WORDS_FILE} below, or open the hosted game.`
            : `The browser could not read ${WORDS_FILE}. Check the file address below and your connection.`);
        }
        showWordLoadError(error);
      } finally {
        window.clearTimeout(timeout);
        wordsLoading = false;
      }
    }

    document.getElementById("retryWordsButton").addEventListener("click", loadWords);
    document.getElementById("chooseWordsButton").addEventListener("click", () => wordFileInput.click());
    wordFileInput.addEventListener("change", async () => {
      const file = wordFileInput.files[0];
      if (!file || wordsLoading || folderImportBusy || gameplayStarted) return;
      wordsLoading = true;
      try {
        const text = await file.text();
        if (location.protocol === "file:" && !gameInitializationStarted) {
          const puzzleAnswer = /\[([^\[\]]+)\]\s*$/m.exec(text)?.[1];
          const language = /[ء-ي]/.test(puzzleAnswer || text) ? "ar" : "en";
          if (puzzleAnswer) parsePuzzleList(text, file.type, language);
          else parseWordList(text, file.type, language);
          const data = { version: 3, language, configText: `language.code=${JSON.stringify(language)}\nlevels.standard.chance=${puzzleAnswer ? 0 : 1}\nlevels.puzzle.chance=${puzzleAnswer ? 1 : 0}\nlevels.flyingPuzzle.chance=0`,
            wordsText: puzzleAnswer ? "" : text, wordsSource: file.name, puzzlesText: puzzleAnswer ? text : null, puzzlesSource: file.name };
          rememberLocalFiles(data);
          await initializeGame(data);
        } else if (isPuzzleLevel()) {
          parsePuzzleList(text, file.type);
          puzzleTextOverride = { text, source: file.name };
          if (localFolderImport) {
            localFolderImport.puzzlesText = text; localFolderImport.puzzlesSource = file.name;
            rememberLocalFiles(localFolderImport);
          }
          await loadRandomLevel();
        } else acceptWordList(text, file.name, file.type);
      } catch (error) {
        if (location.protocol === "file:" && !gameInitializationStarted) showLocalFolderPrompt(error.message);
        else showWordLoadError(error);
      } finally {
        wordFileInput.value = "";
        wordsLoading = false;
      }
    });

    function fitClueList() {
      if (exitConfirmationActive || !cluePaper.naturalHeight) return;
      if (isPuzzleLevel()) {
        const font = CONFIG.puzzles[CONFIG.language.code];
        let size = Math.min(font.maxFontPx, Math.max(font.minFontPx,
          viewport.getBoundingClientRect().height * font.fontHeightFraction));
        puzzleText.style.fontSize = `${size}px`;
        const text = document.getElementById("cluePaperText"), title = document.getElementById("clueTitle");
        const available = Math.max(1, text.clientHeight - title.offsetHeight - parseFloat(getComputedStyle(title).marginBottom));
        for (let attempt = 0; attempt < 8 && (puzzleText.scrollHeight > available || puzzleText.scrollWidth > text.clientWidth); attempt++) {
          size *= Math.min(.95, available / Math.max(1, puzzleText.scrollHeight), text.clientWidth / Math.max(1, puzzleText.scrollWidth));
          puzzleText.style.fontSize = `${Math.max(4, size)}px`;
        }
        return;
      }
      if (!clueList.children.length) return;
      clueList.style.fontSize = "";
      clueList.style.gap = "";
      const text = document.getElementById("cluePaperText"), title = document.getElementById("clueTitle");
      const available = Math.max(1, text.clientHeight - title.offsetHeight - parseFloat(getComputedStyle(title).marginBottom));
      const current = getComputedStyle(clueList);
      const scale = Math.min(1, available / Math.max(1, clueList.scrollHeight), clueList.clientWidth / Math.max(1, clueList.scrollWidth));
      if (scale < 1) {
        clueList.style.fontSize = `${parseFloat(current.fontSize) * scale}px`;
        clueList.style.gap = `${parseFloat(current.rowGap) * scale}px`;
      }
    }
    cluePaper.addEventListener("load", fitClueList);

    function puzzlePaperHeading() {
      const number = isArabic() ? String(progressionLevel()).replace(/\d/g, digit => "٠١٢٣٤٥٦٧٨٩"[Number(digit)]) : String(progressionLevel());
      return gameText(CONFIG.text.puzzleLevelFormat, {
        title: isArabic() ? CONFIG.text.puzzleTitleAr : CONFIG.text.puzzleTitle, number
      });
    }

    function populateClueList() {
      clueList.replaceChildren();
      clueList.hidden = isPuzzleLevel();
      puzzleText.hidden = !isPuzzleLevel();
      puzzleText.textContent = isPuzzleLevel() ? currentPuzzle.prompt : "";
      puzzleText.lang = CONFIG.language.code;
      const title = document.getElementById("clueTitle");
      title.textContent = isPuzzleLevel() ? puzzlePaperHeading() : CONFIG.text.clueTitle;
      title.lang = isPuzzleLevel() && isArabic() ? "ar" : "en";
      title.dir = isPuzzleLevel() && isArabic() ? "rtl" : "ltr";
      title.classList.toggle("riddle-title", isPuzzleLevel());
      if (isPuzzleLevel()) { fitClueList(); return; }
      words.forEach(word => {
        const item = document.createElement("li");
        item.textContent = isArabic() ? word : word.toUpperCase();
        clueList.appendChild(item);
      });
      fitClueList();
    }

    function maybeShowClueIntro() {
      if (menuPage !== null || gameplayPaused || clueIntroShown || !wordsReadyForClue || !videosReadyForClue || !languageFontReady || !levelMediaIsPrepared()) return;
      readyButton.disabled = false;
      fitClueList();
      clueIntroShown = true;
      viewport.classList.add("clue-intro-active");
      clueIntro.classList.add("show");
      clueIntro.setAttribute("aria-hidden", "false");

      // Fade the black loader away only once the blurred clue scene is ready beneath it.
      const generation = levelGeneration;
      requestAnimationFrame(() => {
        if (generation === levelGeneration && menuPage === null && !gameOver &&
            clueIntroShown && clueIntro.classList.contains("show")) loadingScreen.classList.add("hidden");
      });
    }

    function beginGameplayFromClues() {
      if (menuPage !== null || gameplayPaused || !wordsReadyForClue || !videosReadyForClue || gameplayStarted || gameplayStarting || gameOver) return;
      if (!levelMediaIsPrepared()) { prepareMediaBeforeReady(); return; }
      gameplayStarting = true;
      readyButton.disabled = true;
      const activeRoom = levelRooms[activeRoomIndex];
      const roomPlayback = activeRoom && activeRoom.media === activeRoom.video
        ? showRoomVideo(activeRoom, { withAudio: true }) : null;
      // Download, buffering, decoded-frame parking and the silent audio-unlock
      // playback all succeeded before this button became visible. READY does
      // no video warm-up, rewind, download or asynchronous preparation.
      resumeJumpscareAudio();
      unlockSpiderSound();
      if (gameOver) return;
      gameplayStarting = false;
      gameplayStarted = true;
      watchRoomPlayback(activeRoom, roomPlayback);
      cameraOverlay.setAttribute("aria-hidden", "false");
      updateCameraControls();
      startCameraTimer();
      clueIntro.classList.add("dismiss");
      viewport.classList.remove("clue-intro-active");
      anchors.forEach(anchor => { anchor.hidden = true; });
      showCurrentLetter();
      clueDismissTimer = levelTimeout(() => {
        clueDismissTimer = null;
        clueIntro.classList.remove("show", "dismiss");
        clueIntro.setAttribute("aria-hidden", "true");
      }, CONFIG.ui.clueDismissMs);
      if (CONFIG.anomaly.enabled && completedWordCount >= anomalyWordThreshold()) { anomalyEnabled = true; scheduleAnomalyCheck(); }
      scheduleNextHandCheck();
      scheduleSpiderCheck();
    }

    readyButton.addEventListener("click", beginGameplayFromClues);

    function usesSingleRoomControls() { return isSingleRoomLevel() || levelRooms.length === 1; }
    function puzzleHintControl() { return usesSingleRoomControls() ? prevRoomButton : status; }

    function updateLevelStatus() {
      const single = usesSingleRoomControls(), control = puzzleHintControl();
      status.textContent = isPuzzleLevel() ? CONFIG.text.hunt : gameText(CONFIG.text.clueFormat, { current: wordIndex + 1, total: words.length });
      status.classList.toggle("puzzle-hint", isPuzzleLevel() && !single);
      prevRoomButton.classList.toggle("hold-hint", isPuzzleLevel() && single);
      prevRoomButton.textContent = single ? CONFIG.text.hint : CONFIG.text.previousRoom;
      nextRoomButton.textContent = single ? CONFIG.text.exit : CONFIG.text.nextRoom;
      for (const element of [status, prevRoomButton]) for (const name of ["role", "tabindex", "aria-controls", "aria-label", "aria-expanded", "aria-disabled"]) element.removeAttribute(name);
      if (isPuzzleLevel()) {
        if (control === status) { control.setAttribute("role", "button"); control.setAttribute("tabindex", "0"); }
        control.setAttribute("aria-controls", "clueIntro");
        control.setAttribute("aria-label", `${CONFIG.text.hint}: hold to read the puzzle`);
        control.setAttribute("aria-expanded", String(hintActive));
      }
    }

    function showPuzzleHint() {
      if (gameplayPaused || menuPage !== null || !isPuzzleLevel() || !gameplayStarted || handVisible || gameOver || roomCompleted || !currentPuzzle) return false;
      clueIntro.classList.remove("exit-mode");
      document.getElementById("exitConfirmContent").hidden = true;
      clearLevelTimeout(hintHideTimer); clearLevelTimeout(clueDismissTimer);
      hintHideTimer = clueDismissTimer = null;
      finishPanGesture(); finishShutterGesture(); stopShutterEffect();
      hintActive = true;
      clueIntro.classList.remove("dismiss");
      clueIntro.classList.add("hint-mode", "show");
      clueIntro.setAttribute("aria-hidden", "false");
      viewport.classList.add("hint-active", "hint-transition");
      puzzleHintControl().setAttribute("aria-expanded", "true");
      fitClueList();
      updateCameraControls();
      return true;
    }

    function hidePuzzleHint({ immediate = false } = {}) {
      if (!hintActive && hintPointerId === null && hintKey === null && !(immediate && clueIntro.classList.contains("hint-mode"))) return;
      const pointerId = hintPointerId;
      const control = hintPointerControl || puzzleHintControl();
      hintActive = false; hintPointerId = null; hintKey = null;
      hintPointerControl = null;
      if (pointerId !== null) {
        try { if (control.hasPointerCapture(pointerId)) control.releasePointerCapture(pointerId); } catch {}
      }
      clearLevelTimeout(hintHideTimer);
      viewport.classList.remove("hint-active");
      clueIntro.classList.remove("show", "dismiss");
      clueIntro.setAttribute("aria-hidden", "true");
      puzzleHintControl().setAttribute("aria-expanded", "false");
      if (immediate) { clueIntro.classList.remove("hint-mode"); viewport.classList.remove("hint-transition"); }
      else hintHideTimer = levelTimeout(finishHintFade, CONFIG.puzzles.hintFadeMs * 2);
      updateCameraControls();
    }

    function finishHintFade() {
      if (hintActive) return;
      clearLevelTimeout(hintHideTimer); hintHideTimer = null;
      clueIntro.classList.remove("hint-mode");
      viewport.classList.remove("hint-transition");
    }
    clueIntro.addEventListener("transitionend", event => {
      if (event.target === clueIntro && event.propertyName === "opacity" && !hintActive &&
          Number(getComputedStyle(clueIntro).opacity) === 0) finishHintFade();
    });

    for (const control of [status, prevRoomButton]) {
      control.addEventListener("pointerdown", event => {
        if (control !== puzzleHintControl() || event.isPrimary === false || event.button !== 0 || !isPuzzleLevel()) return;
        event.stopPropagation();
        if (!showPuzzleHint()) return;
        hintPointerId = event.pointerId;
        hintPointerControl = control;
        try { control.setPointerCapture(event.pointerId); } catch {}
      });
      control.addEventListener("lostpointercapture", event => {
        if (control === hintPointerControl && event.pointerId === hintPointerId) hidePuzzleHint();
      });
      control.addEventListener("keydown", event => {
        if (control !== puzzleHintControl() || ![" ", "Enter"].includes(event.key) || !isPuzzleLevel()) return;
        event.preventDefault(); event.stopPropagation();
        if (!event.repeat && showPuzzleHint()) hintKey = event.key;
      });
      control.addEventListener("keyup", event => {
        if (event.key === hintKey) { event.preventDefault(); hidePuzzleHint(); }
      });
      control.addEventListener("blur", () => { if (hintKey !== null) hidePuzzleHint(); });
    }
    for (const name of ["pointerup", "pointercancel"]) window.addEventListener(name, event => {
      if (event.pointerId === hintPointerId) hidePuzzleHint();
    }, true);

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getRoomDimensions() {
      return roomMedia === roomImage
        ? { width: roomImage.naturalWidth, height: roomImage.naturalHeight }
        : { width: video.videoWidth, height: video.videoHeight };
    }

    function syncVisibleViewport() {
      const visible = window.visualViewport;
      const height = visible?.height || window.innerHeight;
      const width = visible?.width || window.innerWidth;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty("--game-height", `${height}px`);
      rootStyle.setProperty("--game-width", `${width}px`);
      rootStyle.setProperty("--game-top", `${visible?.offsetTop || 0}px`);
      rootStyle.setProperty("--game-left", `${visible?.offsetLeft || 0}px`);
      rootStyle.setProperty("--view-unit", `${height / 100}px`);
      if (!menuShell.hidden) syncHomePoster();
    }

    function fitCameraText() {
      const { width, height, left, right } = viewport.getBoundingClientRect();
      const visible = window.visualViewport;
      const visibleLeft = visible?.offsetLeft || 0;
      viewport.style.setProperty("--frame-left-gap", `${Math.max(0, left - visibleLeft)}px`);
      viewport.style.setProperty("--frame-right-gap", `${Math.max(0, visibleLeft + (visible?.width || window.innerWidth) - right)}px`);
      viewport.style.setProperty("--ui-font-size", `${Math.min(CONFIG.ui.maxFontPx, Math.max(CONFIG.ui.minFontPx, height * CONFIG.ui.fontHeightFraction), width * CONFIG.ui.fontWidthFraction)}px`);
      viewport.style.setProperty("--battery-width", `${Math.min(CONFIG.ui.batteryMaxWidthPx, Math.max(CONFIG.ui.batteryMinWidthPx, height * CONFIG.ui.batteryHeightFraction), width * CONFIG.ui.batteryWidthFraction)}px`);
      hud.style.top = `${status.getBoundingClientRect().bottom - viewport.getBoundingClientRect().top + CONFIG.ui.wordTopGapPx}px`;
      fitHudWord();
      const band = getSafeLetterBand();
      const baseSize = Math.min(CONFIG.letters.maxFontPx, Math.max(CONFIG.letters.minFontPx, height * CONFIG.letters.fontHeightFraction), Math.max(4, (band.bottom - band.top - 30) / 1.5));
      viewport.style.setProperty("--letter-base-size", `${baseSize}px`);
    }

    function updateLimits() {
      fitCameraText();
      const dimensions = getRoomDimensions();
      if (!dimensions.width || !dimensions.height) return;
      stopCameraMomentum();

      // Use the actual CSS-pixel dimensions, including fractional desktop
      // widths, so the scene, random letter positions and snap edges agree.
      const { width, height } = viewport.getBoundingClientRect();
      renderedVideoWidth = dimensions.width * (height / dimensions.height);
      minOffset = Math.min(0, width - renderedVideoWidth);

      const cover = levelRooms[activeRoomIndex]?.videoCover;
      if (cover) {
        cover.style.width = `${renderedVideoWidth}px`;
        cover.style.height = `${height}px`;
      }
      letterWorld.style.width = `${renderedVideoWidth}px`;
      letterWorld.style.height = `${height}px`;
      anomalyWorld.style.width = `${renderedVideoWidth}px`;
      anomalyWorld.style.height = `${height}px`;
      spiderWorld.style.width = `${renderedVideoWidth}px`;
      spiderWorld.style.height = `${height}px`;
      // Keep full-canvas overlays registered even if a PNG uses a different
      // aspect ratio from the original room video.
      jumpscareVideo.style.width = `${renderedVideoWidth}px`;
      jumpscareVideo.style.height = `${height}px`;
      if (anomalyActive && anomalyRoomIndex === activeRoomIndex && anomalyMeta) {
        anomalyWorldBox = getScaledAnomalyBox(anomalyMeta);
        setOverlayImageStyles(anomalyImage, anomalyBitmap, { height: `${height}px`, width: `${renderedVideoWidth}px` });
      }

      // Preserve the freely dragged camera position when the frame resizes.
      offsetX = clamp(offsetX, minOffset, 0);
      applyWorldOffset(false);
      if (spiderActive && spiderRoomIndex === activeRoomIndex) layoutSpider();
      layoutActiveDoll();
    }

    function buildSnapPoints() {
      // These points retain the original opening view only; manual camera
      // movement uses continuous dragging instead of snapping between them.
      const step = Math.max(1, viewport.getBoundingClientRect().width);
      const totalTravel = Math.abs(minOffset);
      const points = [0];
      for (let x = step; x < totalTravel; x += step) points.push(-x);
      if (minOffset < 0 && Math.abs(points[points.length - 1] - minOffset) > 1) points.push(minOffset);
      snapPoints = points;
    }

    function nearestSnapIndex(value) {
      let best = 0;
      let distance = Infinity;
      snapPoints.forEach((point, index) => {
        const d = Math.abs(point - value);
        if (d < distance) { distance = d; best = index; }
      });
      return best;
    }

    function applyWorldOffset(animate = false, observeDecoys = false) {
      const cameraMoved = Math.abs(offsetX - lastAppliedWorldOffset) > .01;
      lastAppliedWorldOffset = offsetX;
      roomImage.classList.toggle("snapping", animate);
      video.classList.toggle("snapping", animate);
      const videoCover = levelRooms[activeRoomIndex]?.videoCover;
      videoCover?.classList.toggle("snapping", animate);
      letterWorld.classList.toggle("snapping", animate);
      anomalyWorld.classList.toggle("snapping", animate);
      spiderWorld.classList.toggle("snapping", animate);
      dollWorld.classList.toggle("snapping", animate);
      jumpscareVideo.classList.toggle("snapping", animate);
      const transform = `translateX(${offsetX}px)`;
      roomImage.style.transform = transform;
      video.style.transform = transform;
      if (videoCover) videoCover.style.transform = transform;
      letterWorld.style.transform = transform;
      anomalyWorld.style.transform = transform;
      spiderWorld.style.transform = transform;
      dollWorld.style.transform = `translateX(${offsetX * CONFIG.doll.parallaxMultiplier}px)`;
      jumpscareVideo.style.transform = transform;
      // Only actual camera gestures/coasting can fix a decoy. Resizing and
      // layout updates also reposition the world, but do not count as looking away.
      if (observeDecoys) {
        updateDecoyVisibilityState({ allowCorrection: cameraMoved });
        updateSpiderVisibilityState();
      }
    }

    function startWord(index) {
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      clearLevelTimeout(wordAdvanceTimer);
      wordAdvanceTimer = null;
      wordTransitionPending = false;
      wordIndex = index % words.length;
      currentWord = words[wordIndex];
      selectedCount = 0;
      selectionHistory = [];
      updateLevelStatus();
      createHudWord();
      createScatteredLetters();
      updateCameraControls();
    }

    function createHudWord() {
      wordDisplay.replaceChildren();
      wordDisplay.lang = CONFIG.language.code;
      wordDisplay.dir = isArabic() ? "rtl" : "ltr";
      if (isArabic()) {
        const prefix = document.createElement("span"), remaining = document.createElement("span");
        prefix.className = "arabic-hud-prefix";
        remaining.className = "arabic-hud-remaining";
        wordDisplay.append(prefix, remaining);
        renderArabicHud();
        fitHudWord();
        return;
      }
      [...currentWord].forEach((letter, index) => {
        const slot = document.createElement("span");
        slot.className = "hud-letter";
        slot.dataset.index = index;
        slot.textContent = "·";
        wordDisplay.appendChild(slot);
      });
      fitHudWord();
    }

    function renderArabicHud(count = selectedCount) {
      // One text node is essential: separate flex letters interrupt Arabic shaping.
      wordDisplay.querySelector(".arabic-hud-prefix").textContent = currentWord.slice(0, count);
      wordDisplay.querySelector(".arabic-hud-remaining").textContent = "·".repeat(Math.max(0, currentWord.length - count));
      wordDisplay.setAttribute("aria-label", `${currentWord.slice(0, count)} ${count}/${currentWord.length}`);
    }

    function arabicHudCaptureTarget(index) {
      const prefix = wordDisplay.querySelector(".arabic-hud-prefix");
      const range = document.createRange();
      range.setStart(prefix.firstChild, index);
      range.setEnd(prefix.firstChild, index + 1);
      const rect = range.getBoundingClientRect();
      return rect.height ? rect : prefix.getBoundingClientRect();
    }

    function fitHudWord() {
      const width = wordDisplay.getBoundingClientRect().width;
      if (isArabic()) {
        const measure = document.createElement("canvas").getContext("2d");
        const maximum = CONFIG.letters.hudMaxFontPx;
        measure.font = `${maximum}px "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", Tahoma, serif`;
        const prefixWidths = Array.from({ length: currentWord.length + 1 }, (_, count) => measure.measureText(currentWord.slice(0, count)).width);
        measure.font = `${maximum}px "Game Arabic", "Noto Naskh Arabic", Tahoma, serif`;
        let widest = 1;
        for (let count = 0; count <= currentWord.length; count++) {
          widest = Math.max(widest, prefixWidths[count] + measure.measureText("·".repeat(currentWord.length - count)).width + CONFIG.letters.hudGapPx * 2);
        }
        wordDisplay.style.setProperty("--hud-letter-size", `${Math.max(CONFIG.letters.hudMinFontPx, Math.min(maximum, maximum * width / widest))}px`);
        return;
      }
      const size = Math.min(CONFIG.letters.hudMaxFontPx, (width - Math.max(0, currentWord.length - 1) * CONFIG.letters.hudGapPx) /
        Math.max(1, currentWord.length * CONFIG.letters.hudGlyphWidthRatio));
      wordDisplay.style.setProperty("--hud-letter-size", `${Math.max(CONFIG.letters.hudMinFontPx, size)}px`);
    }

    function updateCameraControls() {
      updateLevelStatus();
      const blocked = gameplayPaused || menuPage !== null || !gameplayStarted || handVisible || gameOver || roomCompleted || !roomsReady;
      if (blocked || hintActive) stopKeyboardInput();
      snapButton.disabled = blocked || hintActive || wordTransitionPending || captureInProgress;
      if (usesSingleRoomControls()) {
        prevRoomButton.disabled = blocked || !isPuzzleLevel();
        nextRoomButton.disabled = blocked || hintActive;
        nextRoomButton.setAttribute("aria-label", CONFIG.text.exit);
      } else {
        prevRoomButton.disabled = blocked || hintActive || levelRooms.length < 2 || !CONFIG.rooms.wrapNavigation && activeRoomIndex === 0;
        nextRoomButton.disabled = blocked || hintActive || levelRooms.length < 2 || !CONFIG.rooms.wrapNavigation && activeRoomIndex === levelRooms.length - 1;
        prevRoomButton.setAttribute("aria-label", `Previous room. Current room ${activeRoomIndex + 1} of ${levelRoomCount}`);
        nextRoomButton.setAttribute("aria-label", `Next room. Current room ${activeRoomIndex + 1} of ${levelRoomCount}`);
      }
      if (isPuzzleLevel()) puzzleHintControl().setAttribute("aria-disabled", String(blocked));
    }

    function updateCameraTimer() {
      if (cameraStartedAt !== null && !gameplayPaused && !document.hidden) {
        cameraRemainingSeconds = Math.max(0, Math.ceil(
          (ROOM_TIME_LIMIT_MS - (performance.now() - cameraStartedAt)) / 1000));
      }
      const minutes = String(Math.floor(cameraRemainingSeconds / 60)).padStart(2, "0");
      const seconds = String(cameraRemainingSeconds % 60).padStart(2, "0");
      cameraTimer.textContent = `${minutes}:${seconds}`;
      if (cameraStartedAt !== null && !gameplayPaused && cameraRemainingSeconds > 0 && cameraRemainingSeconds <= CONFIG.loading.deadlineWarmSeconds &&
          !jumpscareDeadlineWarmStarted && !gameOver && !roomCompleted && !document.hidden) {
        levelRooms.forEach(room => warmJumpscareBeforeDeadline(room));
        jumpscareDeadlineWarmStarted = true;
      }
      if (cameraStartedAt !== null && !gameplayPaused && !document.hidden && cameraRemainingSeconds === 0 && !gameOver && !roomCompleted) {
        endGame("timeout");
      }
    }

    function startCameraTimer() {
      window.clearInterval(cameraTimerInterval);
      pausedCameraElapsedMs = null;
      cameraStartedAt = performance.now();
      cameraRemainingSeconds = ROOM_TIME_LIMIT_MS / 1000;
      updateCameraTimer();
      cameraTimerInterval = window.setInterval(updateCameraTimer, CONFIG.camera.timerRefreshMs);
    }

    function stopCameraTimer() {
      cancelJumpscareStandbySeek();
      if (cameraStartedAt !== null) {
        cameraRemainingSeconds = Math.max(0, Math.ceil(
          (ROOM_TIME_LIMIT_MS - (performance.now() - cameraStartedAt)) / 1000));
      }
      cameraStartedAt = null;
      pausedCameraElapsedMs = null;
      window.clearInterval(cameraTimerInterval);
      cameraTimerInterval = null;
      updateCameraTimer();
    }

    function pauseCameraTimer() {
      if (cameraStartedAt === null) return;
      const elapsed = Math.max(0, Math.min(ROOM_TIME_LIMIT_MS, performance.now() - cameraStartedAt));
      stopCameraTimer();
      pausedCameraElapsedMs = elapsed;
    }

    function resumeCameraTimer() {
      if (pausedCameraElapsedMs === null || gameOver || roomCompleted) return;
      cameraStartedAt = performance.now() - pausedCameraElapsedMs;
      pausedCameraElapsedMs = null;
      updateCameraTimer();
      if (cameraStartedAt !== null) cameraTimerInterval = window.setInterval(updateCameraTimer, CONFIG.camera.timerRefreshMs);
    }

    function currentRoomLetterIndex() {
      return anchors.findIndex((anchor, index) => Number(anchor.dataset.roomIndex) === activeRoomIndex && !tiles[index].classList.contains("selected"));
    }

    function visibleRoomLetterIndices() {
      const indices = [];
      anchors.forEach((anchor, index) => {
        if (!anchor.hidden && Number(anchor.dataset.roomIndex) === activeRoomIndex && !tiles[index].classList.contains("selected")) indices.push(index);
      });
      return indices;
    }

    function shutterLetterIndex() {
      const candidates = isSpreadLetterLevel() ? visibleRoomLetterIndices() : [currentRoomLetterIndex()];
      const frame = viewport.getBoundingClientRect(), centerX = frame.left + frame.width / 2;
      let closest = -1, distance = Infinity;
      for (const index of candidates) {
        if (!isCurrentLetterInFrame(index)) continue;
        const rect = tiles[index].querySelector(".letter-glyph").getBoundingClientRect();
        const dx = Math.abs(rect.left + rect.width / 2 - centerX);
        if (dx < distance) { closest = index; distance = dx; }
      }
      return closest;
    }

    function letterAtPoint(x, y) {
      let closest = -1, distance = Infinity;
      const padding = CONFIG.letters.tapHitPaddingPx;
      for (const index of visibleRoomLetterIndices()) {
        if (!isCurrentLetterInFrame(index)) continue;
        const rect = tiles[index].querySelector(".letter-glyph").getBoundingClientRect();
        if (x < rect.left - padding || x > rect.right + padding || y < rect.top - padding || y > rect.bottom + padding) continue;
        const d = Math.hypot(x - rect.left - rect.width / 2, y - rect.top - rect.height / 2);
        if (d < distance) { closest = index; distance = d; }
      }
      return closest;
    }

    function isSceneTapPoint(x, y) {
      const frame = viewport.getBoundingClientRect(), band = getSafeLetterBand();
      return x >= frame.left && x <= frame.right && y >= frame.top + band.top && y <= frame.top + band.bottom;
    }

    function isCurrentLetterInFrame(index = currentRoomLetterIndex()) {
      const anchor = anchors[index];
      if (!anchor || anchor.hidden) return false;
      const glyph = anchor.querySelector(".letter-glyph");
      const letterRect = glyph.getBoundingClientRect();
      const frame = viewport.getBoundingClientRect();
      // The whole viewport is the camera frame.
      // Use visible glyph bounds rather than the letter's invisible padding.
      const tolerance = CONFIG.letters.captureTolerancePx;
      return letterRect.width > 0 && letterRect.height > 0 &&
        letterRect.left >= frame.left - tolerance && letterRect.right <= frame.right + tolerance &&
        letterRect.top >= frame.top - tolerance && letterRect.bottom <= frame.bottom + tolerance;
    }

    function chooseLetterGlyph(letter, word, index) {
      if (isSequentialLetterLevel() && index === 0) return letter;
      if (!levelIsUnlocked(CONFIG.letters.decoyStartLevel) || !levelType.decoyLetterChance || Math.random() >= levelType.decoyLetterChance) return letter;
      // A decoy must be absent from the entire clue, not just the current slot.
      const alphabet = isArabic() ? "ابتثجحخدذرزسشصضطظعغفقكلمنهويءأإآؤئةى" : "abcdefghijklmnopqrstuvwxyz";
      const candidates = [...alphabet].filter(candidate => !word.includes(candidate));
      return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : letter;
    }

    function correctDecoy(index) {
      const tile = tiles[index];
      if (!tile || tile.dataset.decoy !== "true") return;
      tile.querySelector(".letter-glyph").textContent = tile.dataset.letter;
      tile.setAttribute("aria-label", `Letter ${tile.dataset.letter}`);
      tile.dataset.decoy = "false";
    }

    function updateDecoyVisibilityState({ allowCorrection = false } = {}) {
      if (gameplayPaused || menuPage !== null || !gameplayStarted || gameOver || roomCompleted || wordTransitionPending || captureInProgress) return;
      for (const index of visibleRoomLetterIndices()) {
        const tile = tiles[index];
        if (tile.dataset.decoy !== "true") continue;
        if (isCurrentLetterInFrame(index)) { tile.dataset.decoySeen = "true"; continue; }
        if (!allowCorrection || tile.dataset.decoySeen !== "true") continue;
        const bounds = tile.querySelector(".letter-glyph").getBoundingClientRect(), frame = viewport.getBoundingClientRect();
        if (bounds.right > frame.left && bounds.left < frame.right) continue;
        correctDecoy(index);
      }
    }

    function drawShutterBitmap() {
      shutterBitmapFrame = 0;
      if (!shutterBitmapContext) return;
      // A viewport-sized image surface avoids legacy Android's recolouring
      // of button backgrounds, borders and their CSS filter layers. The real
      // button and its animated core still provide layout and native input.
      const frame = cameraOverlay.getBoundingClientRect();
      const ring = snapButton.getBoundingClientRect();
      const core = snapButton.querySelector(".shutter-core").getBoundingClientRect();
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.round(frame.width * scale);
      const height = Math.round(frame.height * scale);
      if (shutterBitmap.width !== width || shutterBitmap.height !== height) {
        shutterBitmap.width = width;
        shutterBitmap.height = height;
      }
      const context = shutterBitmapContext;
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.clearRect(0, 0, frame.width, frame.height);
      context.strokeStyle = CONFIG.shutter.color;
      context.lineWidth = CONFIG.shutter.ringPx;
      context.beginPath();
      context.arc(ring.left - frame.left + ring.width / 2, ring.top - frame.top + ring.height / 2,
        Math.max(0, Math.min(ring.width, ring.height) / 2 - CONFIG.shutter.ringPx / 2), 0, Math.PI * 2);
      context.stroke();
      context.fillStyle = CONFIG.shutter.color;
      context.beginPath();
      context.arc(core.left - frame.left + core.width / 2, core.top - frame.top + core.height / 2,
        Math.max(0, Math.min(core.width, core.height) / 2), 0, Math.PI * 2);
      context.fill();
      if (performance.now() < shutterBitmapUntil || snapButton.classList.contains("held") || snapButton.classList.contains("snapping")) {
        shutterBitmapFrame = requestAnimationFrame(drawShutterBitmap);
      }
    }

    function refreshShutterBitmap(duration = CONFIG.shutter.bitmapRefreshMs) {
      if (!shutterBitmapContext) return;
      shutterBitmapUntil = Math.max(shutterBitmapUntil, performance.now() + duration);
      if (!shutterBitmapFrame) shutterBitmapFrame = requestAnimationFrame(drawShutterBitmap);
    }

    function snapCamera(targetIndex = null) {
      if (gameplayPaused || menuPage !== null || !gameplayStarted || hintActive || handVisible || gameOver || roomCompleted || wordTransitionPending || captureInProgress) return;
      // Check the real deadline before accepting a photo, even if a browser
      // throttled the interval while the tab was in the background.
      updateCameraTimer();
      if (gameOver) return;
      finishPanGesture();
      stopShutterEffect();
      // A scene tap is targeted (including -1 for a miss); a shutter press
      // chooses the current letter, or the closest X in the spread mode.
      const index = targetIndex === null ? shutterLetterIndex() : targetIndex;
      const letterIsVisible = isCurrentLetterInFrame(index);
      snapButton.classList.remove("snapping");
      void snapButton.offsetWidth;
      snapButton.classList.add("snapping");
      refreshShutterBitmap();
      clearLevelTimeout(shutterAnimationTimer);
      shutterAnimationTimer = levelTimeout(() => snapButton.classList.remove("snapping"), CONFIG.shutter.classResetMs);

      if (letterIsVisible) {
        const tile = tiles[index];
        selectLetter(tile.dataset.letter, index, tile);
      } else drainBatterySlot();
      if (!gameOver) playShutterEffect();
    }

    function updateBatteryUI() {
      batterySlots.forEach((slot, index) => slot.classList.toggle("drained", index >= batterySlotsRemaining));
      batteryPercent.textContent = `${Math.round(batterySlotsRemaining / BATTERY_SLOT_COUNT * 100)}%`;
      cameraBattery.setAttribute("aria-label", `Camera battery: ${batterySlotsRemaining} of ${BATTERY_SLOT_COUNT} slots`);
    }

    function drainBatterySlot(cost = CONFIG.battery.missCost) {
      batterySlotsRemaining = Math.max(0, batterySlotsRemaining - cost);
      updateBatteryUI();
      if (batterySlotsRemaining === 0) endGame("battery");
    }

    function stopShutterEffect() {
      if (shutterSceneAnimation) shutterSceneAnimation.cancel();
      shutterSceneAnimation = null;
    }

    function playShutterEffect() {
      stopShutterEffect();
      // This wrapper is the visible camera window, so zooming stays centred
      // on the current view even after panning to either end of the room.
      const animation = sceneEffects.animate([
        { filter: "blur(0px)", transform: "scale(1)" },
        { filter: `blur(${CONFIG.shutter.blurPx}px)`, transform: `scale(${CONFIG.shutter.zoom})`, offset: CONFIG.shutter.peakFraction },
        { filter: "blur(0px)", transform: "scale(1)" }
      ], { duration: CONFIG.shutter.durationMs, easing: "ease-in-out" });
      shutterSceneAnimation = animation;
      animation.finished.then(() => {
        if (shutterSceneAnimation === animation) shutterSceneAnimation = null;
      }).catch(() => {});
    }

    function finishLetterTransfer({ reveal = true } = {}) {
      clearLevelTimeout(captureFinishTimer);
      captureFinishTimer = null;
      if (captureFlightAnimation) captureFlightAnimation.cancel();
      captureFlightAnimation = null;
      captureEffects.replaceChildren();
      captureInProgress = false;
      if (reveal && currentWord) showCurrentLetter();
      updateCameraControls();
    }

    function flyLetterToWord(anchor, hudSlot) {
      const glyph = anchor.querySelector(".letter-glyph");
      const start = glyph.getBoundingClientRect();
      const target = typeof hudSlot.getBoundingClientRect === "function" ? hudSlot.getBoundingClientRect() : hudSlot;
      const frame = viewport.getBoundingClientRect();
      const style = getComputedStyle(glyph);
      const flight = document.createElement("span");
      flight.className = "captured-letter";
      flight.textContent = glyph.textContent;
      flight.style.left = `${start.left + start.width / 2 - frame.left}px`;
      flight.style.top = `${start.top + start.height / 2 - frame.top}px`;
      flight.style.fontFamily = isArabic() ? '"Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", Tahoma, serif' : style.fontFamily;
      flight.style.fontSize = style.fontSize;
      flight.style.letterSpacing = style.letterSpacing;
      flight.style.color = style.color;
      captureEffects.appendChild(flight);

      const dx = target.left + target.width / 2 - start.left - start.width / 2;
      const dy = target.top + target.height / 2 - start.top - start.height / 2;
      const rotation = (parseFloat(anchor.firstElementChild.style.getPropertyValue("--letter-rotation")) || 0) +
        (parseFloat(anchor.firstElementChild.style.getPropertyValue("--butterfly-bank")) || 0);
      captureInProgress = true;
      updateCameraControls();
      const animation = flight.animate([
        { transform: `translate(-50%, -50%) rotate(${rotation}deg) scale(1)`, opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(0deg) scale(${CONFIG.letters.transferEndScale})`, opacity: 0 }
      ], { duration: LETTER_TRANSFER_MS, easing: "cubic-bezier(.3,.65,.35,1)", fill: "forwards" });
      captureFlightAnimation = animation;
      animation.finished.then(() => {
        if (captureFlightAnimation === animation) finishLetterTransfer();
      }).catch(() => {});
      captureFinishTimer = levelTimeout(() => finishLetterTransfer(), LETTER_TRANSFER_MS + CONFIG.letters.transferFallbackMs);
    }

    function finishShutterGesture() {
      const pointerId = shutterPointerId;
      shutterPointerId = null;
      shutterMoved = false;
      snapButton.classList.remove("held");
      refreshShutterBitmap();
      if (pointerId !== null) {
        try {
          if (snapButton.hasPointerCapture(pointerId)) snapButton.releasePointerCapture(pointerId);
        } catch {}
      }
    }

    snapButton.addEventListener("pointerdown", event => {
      if (snapButton.disabled || event.isPrimary === false || event.button !== 0) return;
      event.stopPropagation();
      stopKeyboardInput();
      finishPanGesture();
      finishShutterGesture();
      shutterPointerId = event.pointerId;
      shutterStartX = event.clientX;
      shutterStartY = event.clientY;
      snapButton.classList.add("held");
      refreshShutterBitmap();
      try { snapButton.setPointerCapture(event.pointerId); } catch {}
    });
    snapButton.addEventListener("pointermove", event => {
      if (event.pointerId !== shutterPointerId) return;
      if (event.pointerType !== "touch" && (event.buttons & 1) === 0) {
        finishShutterGesture();
        return;
      }
      if (Math.hypot(event.clientX - shutterStartX, event.clientY - shutterStartY) > CONFIG.shutter.tapSlopPx) shutterMoved = true;
    });
    snapButton.addEventListener("pointerup", event => {
      if (event.pointerId !== shutterPointerId) return;
      const rect = snapButton.getBoundingClientRect();
      const isTap = !shutterMoved &&
        Math.hypot(event.clientX - shutterStartX, event.clientY - shutterStartY) <= CONFIG.shutter.tapSlopPx &&
        event.clientX >= rect.left && event.clientX <= rect.right &&
        event.clientY >= rect.top && event.clientY <= rect.bottom;
      finishShutterGesture();
      // Mobile browsers may omit the compatibility click after a drag.
      // Capture on release, then ignore that optional click to avoid duplicates.
      if (isTap) snapCamera();
    });
    snapButton.addEventListener("pointercancel", event => {
      if (event.pointerId === shutterPointerId) finishShutterGesture();
    });
    snapButton.addEventListener("lostpointercapture", event => {
      if (event.pointerId === shutterPointerId && !snapButton.hasPointerCapture(event.pointerId)) finishShutterGesture();
    });
    snapButton.addEventListener("click", event => {
      if (event.detail > 0 || event.pointerType) return;
      snapCamera(); // Keyboard and assistive activation still use native click.
    });

    function showCurrentLetter({ animate = true } = {}) {
      anchors.forEach((anchor, index) => {
        const shouldShow = !wordTransitionPending && (!captureInProgress || isSpreadLetterLevel()) &&
          (!isSequentialLetterLevel() || index === selectedCount) &&
          Number(anchor.dataset.roomIndex) === activeRoomIndex && !tiles[index].classList.contains("selected");
        if (!shouldShow) {
          anchor.hidden = true;
          anchor.classList.remove("appearing");
        } else if (anchor.hidden) {
          anchor.hidden = false;
          if (animate) {
            void anchor.offsetWidth;
            anchor.classList.add("appearing");
          }
        }
      });
      updateDecoyVisibilityState();
      if (levelType.flyingLetters && !gameplayPaused && menuPage === null && gameplayStarted && !gameOver && !roomCompleted &&
          !wordTransitionPending && (!captureInProgress || isSpreadLetterLevel()) && visibleRoomLetterIndices().length) startButterflyFlight();
      else stopButterflyFlight();
    }

    function stopButterflyFlight() {
      if (butterflyFlightFrame) cancelAnimationFrame(butterflyFlightFrame);
      butterflyFlightFrame = 0;
      butterflyFlightStates.clear();
    }

    function startButterflyFlight() {
      // One animation loop updates every visible letter. Existing letters keep
      // their velocities when another letter is captured, including overlaps.
      const indices = visibleRoomLetterIndices();
      const visibleAnchors = new Set(indices.map(index => anchors[index]));
      for (const anchor of butterflyFlightStates.keys()) if (!visibleAnchors.has(anchor)) butterflyFlightStates.delete(anchor);
      for (const index of indices) {
        const anchor = anchors[index];
        if (butterflyFlightStates.has(anchor)) continue;
        const tile = tiles[index];
        const radius = Number(anchor.dataset.flightRadius) + CONFIG.butterfly.paddingPx;
        const band = getSafeLetterBand();
        const bounds = { left: radius, right: Math.max(radius, renderedVideoWidth - radius),
          top: band.top + radius, bottom: Math.max(band.top + radius, band.bottom - radius) };
        const phase = Math.random() * Math.PI * 2;
        const swayX = CONFIG.butterfly.minSwayXPx + Math.random() * (CONFIG.butterfly.maxSwayXPx - CONFIG.butterfly.minSwayXPx);
        const swayY = CONFIG.butterfly.minSwayYPx + Math.random() * (CONFIG.butterfly.maxSwayYPx - CONFIG.butterfly.minSwayYPx);
        const x = parseFloat(anchor.style.left);
        const y = parseFloat(anchor.style.top);
        const state = { anchor, tile, bounds, phase, swayX, swayY,
          x: x - Math.sin(phase) * swayX, y: y - Math.sin(phase * CONFIG.butterfly.verticalPhaseMultiplier) * swayY,
          vx: 0, vy: 0, goalX: x, goalY: y, elapsed: 0, nextTurn: 0,
          speed: CONFIG.butterfly.minSpeed + Math.random() * (CONFIG.butterfly.maxSpeed - CONFIG.butterfly.minSpeed), lastTime: performance.now() };
        state.escapeDirection = 1;
        state.evadeNextTurn = 0;
        state.evadeGoalY = y;
        state.escapeTurnUntil = 0;
        state.cameraProximity = 0;
        butterflyFlightStates.set(anchor, state);
      }
      if (butterflyFlightFrame || !butterflyFlightStates.size) return;
      const step = time => {
        butterflyFlightFrame = 0;
        if (gameplayPaused || menuPage !== null || !gameplayStarted || gameOver || roomCompleted || wordTransitionPending ||
            captureInProgress && !isSpreadLetterLevel()) {
          stopButterflyFlight();
          return;
        }
        for (const [anchor, state] of butterflyFlightStates) {
          if (anchor.hidden || state.tile.classList.contains("selected") || Number(anchor.dataset.roomIndex) !== activeRoomIndex) {
            butterflyFlightStates.delete(anchor);
            continue;
          }
          const { tile, bounds, phase, swayX, swayY } = state;
          // Capped elapsed steps prevent a leap when a background tab resumes.
          const dt = Math.min(CONFIG.butterfly.maxStepMs / 1000, Math.max(0, (time - state.lastTime) / 1000));
          state.lastTime = time;
          state.elapsed += dt;
          const t = state.elapsed;
          if (t >= state.nextTurn) {
            // Mostly local wandering, with occasional longer exploratory arcs.
            const travel = Math.random() < CONFIG.butterfly.longArcChance ? CONFIG.butterfly.longHorizontalTravelPx : CONFIG.butterfly.horizontalTravelPx;
            state.goalX = clamp(state.x + (Math.random() * 2 - 1) * travel, bounds.left, bounds.right);
            state.goalY = clamp(state.y + (Math.random() * 2 - 1) * CONFIG.butterfly.verticalTravelPx, bounds.top, bounds.bottom);
            state.nextTurn = t + (CONFIG.butterfly.minTurnMs + Math.random() * (CONFIG.butterfly.maxTurnMs - CONFIG.butterfly.minTurnMs)) / 1000;
          }
          let targetX = state.goalX, targetY = state.goalY;
          let intensity = 0;
          if (levelType.evadesCamera) {
            const viewWidth = viewport.getBoundingClientRect().width;
            const center = -offsetX + viewWidth / 2;
            const letterX = parseFloat(anchor.style.left);
            const relative = letterX - center;
            const proximity = clamp(1 - Math.abs(relative) / (viewWidth * CONFIG.butterfly.evadeApproachScreens), 0, 1);
            state.cameraProximity = proximity;
            intensity = proximity * proximity;
            if (t >= state.escapeTurnUntil && Math.abs(relative) > viewWidth * CONFIG.butterfly.evadeDirectionDeadzoneFraction) state.escapeDirection = Math.sign(relative);
            if (state.escapeDirection < 0 && state.x - bounds.left < CONFIG.butterfly.evadeEdgeMarginPx) {
              state.escapeDirection = 1; state.escapeTurnUntil = t + CONFIG.butterfly.evadeBoundaryTurnMs / 1000;
            } else if (state.escapeDirection > 0 && bounds.right - state.x < CONFIG.butterfly.evadeEdgeMarginPx) {
              state.escapeDirection = -1; state.escapeTurnUntil = t + CONFIG.butterfly.evadeBoundaryTurnMs / 1000;
            }
            if (intensity > 0) {
              if (t >= state.evadeNextTurn) {
                state.evadeGoalY = clamp(state.y + (Math.random() * 2 - 1) * CONFIG.butterfly.evadeVerticalTravelPx, bounds.top, bounds.bottom);
                state.evadeNextTurn = t + CONFIG.butterfly.evadeRetargetMs / 1000;
              }
              const escapeX = clamp(state.x + state.escapeDirection * CONFIG.butterfly.evadeTravelPx, bounds.left, bounds.right);
              targetX += (escapeX - targetX) * intensity;
              targetY += (state.evadeGoalY - targetY) * intensity;
            }
          }
          const dx = targetX - state.x, dy = targetY - state.y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          // Ease the heading and alternate hovering with short bursts of flight.
          const pace = state.speed * (CONFIG.butterfly.minPaceFraction + (1 - CONFIG.butterfly.minPaceFraction) * Math.pow(.5 + .5 * Math.sin(t * CONFIG.butterfly.hoverFrequency + phase), 2)) * Math.min(1, distance / CONFIG.butterfly.slowdownDistancePx) * (1 + intensity * (CONFIG.butterfly.evadeMaxSpeedMultiplier - 1));
          const steering = 1 - Math.exp(-dt * CONFIG.butterfly.steering * (1 + intensity * (CONFIG.butterfly.evadeSteeringMultiplier - 1)));
          state.vx += (dx / distance * pace * CONFIG.butterfly.horizontalSpeedMultiplier - state.vx) * steering;
          state.vy += (dy / distance * pace - state.vy) * steering;
          state.x += state.vx * dt;
          state.y += state.vy * dt;
          // Unequal oscillation frequencies make little loops instead of a
          // straight bounce; a restrained 3D tilt suggests fluttering wings.
          const swayBoost = 1 + intensity * (CONFIG.butterfly.evadeSwayMultiplier - 1);
          const flightX = clamp(state.x + Math.sin(t * CONFIG.butterfly.swayXFrequency + phase) * swayX * swayBoost, bounds.left, bounds.right);
          const flightY = clamp(state.y + Math.sin(t * CONFIG.butterfly.swayYFrequency + phase * CONFIG.butterfly.verticalPhaseMultiplier) * swayY * swayBoost, bounds.top, bounds.bottom);
          anchor.style.left = `${flightX}px`;
          anchor.style.top = `${flightY}px`;
          anchor.dataset.worldX = (flightX - bounds.left) / Math.max(1, bounds.right - bounds.left);
          anchor.dataset.worldY = (flightY - bounds.top) / Math.max(1, bounds.bottom - bounds.top);
          tile.style.setProperty("--butterfly-bank", `${clamp(state.vx * CONFIG.butterfly.bankVelocityMultiplier + Math.sin(t * CONFIG.butterfly.swayXFrequency + phase) * CONFIG.butterfly.bankSwayDeg, -CONFIG.butterfly.maxBankDeg, CONFIG.butterfly.maxBankDeg)}deg`);
          tile.style.setProperty("--butterfly-flutter", `${Math.sin(t * CONFIG.butterfly.flutterFrequency * (1 + intensity * (CONFIG.butterfly.evadeFlutterMultiplier - 1)) + phase) * CONFIG.butterfly.flutterDeg}deg`);
        }
        updateDecoyVisibilityState();
        if (butterflyFlightStates.size) butterflyFlightFrame = requestAnimationFrame(step);
      };
      butterflyFlightFrame = requestAnimationFrame(step);
    }

    function createScatteredLetters() {
      stopButterflyFlight();
      letterWorld.replaceChildren();
      tiles = [];
      anchors = [];

      [...currentWord].forEach((letter, index) => {
        const anchor = document.createElement("div");
        anchor.className = "letter-anchor";
        anchor.hidden = true;
        anchor.dataset.roomIndex = wordLetterRooms[wordIndex][index];
        // Independent uniform coordinates, retained across viewport changes.
        // Y is a fraction of the safe band between the camera UI rows.
        anchor.dataset.worldX = Math.random();
        anchor.dataset.worldY = Math.random();

        const tile = document.createElement("span");
        tile.className = "letter-tile";
        if (levelType.flyingLetters) tile.classList.add("butterfly-letter");
        tile.dataset.index = index;
        tile.dataset.letter = letter;
        tile.style.setProperty("--letter-scale", CONFIG.letters.minScale + Math.random() * (CONFIG.letters.maxScale - CONFIG.letters.minScale));
        tile.style.setProperty("--letter-rotation", `${CONFIG.letters.minRotationDeg + Math.random() * (CONFIG.letters.maxRotationDeg - CONFIG.letters.minRotationDeg)}deg`);
        const modes = CONFIG.letters.vibrationByWord;
        const mode = modes[Math.min(wordIndex, modes.length - 1)];
        if (mode === "all" || mode === "first" && index === 0) {
          tile.classList.add("first-letter");
          for (let step = 1; step <= 3; step++) {
            tile.style.setProperty(`--jitter-x${step}`, `${Math.random() * CONFIG.letters.vibrationPx * 2 - CONFIG.letters.vibrationPx}px`);
            tile.style.setProperty(`--jitter-y${step}`, `${Math.random() * CONFIG.letters.vibrationPx * 2 - CONFIG.letters.vibrationPx}px`);
          }
        }
        const glyph = document.createElement("span");
        glyph.className = "letter-glyph";
        glyph.textContent = chooseLetterGlyph(letter, currentWord, index);
        tile.dataset.decoy = String(glyph.textContent !== letter);
        tile.dataset.decoySeen = "false";
        tile.setAttribute("aria-label", `Letter ${glyph.textContent}`);
        tile.appendChild(glyph);

        anchor.appendChild(tile);
        letterWorld.appendChild(anchor);
        tiles.push(tile);
        anchors.push(anchor);
      });
      relayoutScatteredLetters();
      showCurrentLetter();
    }

    function getSafeLetterBand() {
      const frame = viewport.getBoundingClientRect();
      const top = Math.max(status.getBoundingClientRect().bottom, cameraBattery.getBoundingClientRect().bottom,
        hud.getBoundingClientRect().bottom, cameraTimer.getBoundingClientRect().bottom) - frame.top;
      const bottom = Math.min(snapButton.getBoundingClientRect().top,
        prevRoomButton.getBoundingClientRect().top, nextRoomButton.getBoundingClientRect().top) - frame.top;
      return { top, bottom };
    }

    function relayoutScatteredLetters() {
      const band = getSafeLetterBand();
      const frame = viewport.getBoundingClientRect();
      const worldWidth = renderedVideoWidth || frame.width;
      anchors.forEach((anchor, index) => {
        const wasHidden = anchor.hidden;
        anchor.hidden = false;
        const glyph = anchor.querySelector(".letter-glyph");
        let footprint = glyph.getBoundingClientRect();
        if (levelType.flyingLetters) {
          const radius = Math.hypot(glyph.offsetWidth, glyph.offsetHeight) / 2 + CONFIG.butterfly.radiusPaddingPx;
          anchor.dataset.flightRadius = radius;
          footprint = { width: radius * 2, height: radius * 2 };
        }
        if (tiles[index].dataset.decoy === "true") {
          // Reserve room for both glyphs so correcting it offscreen cannot
          // move the fixed anchor or push the real letter beneath the UI.
          const decoy = glyph.textContent;
          glyph.textContent = tiles[index].dataset.letter;
          const correct = glyph.getBoundingClientRect();
          if (levelType.flyingLetters) {
            const radius = Math.max(Number(anchor.dataset.flightRadius), Math.hypot(glyph.offsetWidth, glyph.offsetHeight) / 2 + CONFIG.butterfly.radiusPaddingPx);
            anchor.dataset.flightRadius = radius;
            footprint = { width: radius * 2, height: radius * 2 };
          } else footprint = { width: Math.max(footprint.width, correct.width), height: Math.max(footprint.height, correct.height) };
          glyph.textContent = decoy;
        }
        anchor.hidden = wasHidden;
        // Include rotation, the first letter's small vibration, and a margin
        // so the complete glyph remains clear of both UI rows and room edges.
        const padding = levelType.flyingLetters ? CONFIG.butterfly.paddingPx : tiles[index].classList.contains("first-letter") ? Math.max(CONFIG.letters.firstPaddingPx, CONFIG.letters.vibrationPx) : CONFIG.letters.paddingPx;
        const minX = footprint.width / 2 + padding;
        const maxX = Math.max(minX, worldWidth - minX);
        const minY = band.top + footprint.height / 2 + padding;
        const maxY = Math.max(minY, band.bottom - footprint.height / 2 - padding);
        anchor.style.left = `${minX + Number(anchor.dataset.worldX) * (maxX - minX)}px`;
        anchor.style.top = `${minY + Number(anchor.dataset.worldY) * (maxY - minY)}px`;
      });
    }

    function selectLetter(letter, tileIndex, tile) {
      if (gameplayPaused || menuPage !== null || !gameplayStarted || hintActive || handVisible || gameOver || roomCompleted || wordTransitionPending || captureInProgress) return;
      updateCameraTimer();
      if (gameOver) return;
      if (tile !== tiles[tileIndex] || anchors[tileIndex].hidden || tile.classList.contains("selected")) return;
      const localAnomaly = anomalyActive && anomalyRoomIndex === activeRoomIndex;
      if (localAnomaly || tile.dataset.decoy === "true") {
        endGame(localAnomaly ? "anomaly" : "decoy");
        return;
      }
      const expectedLetter = currentWord[selectedCount];
      if (letter !== expectedLetter) {
        drainBatterySlot();
        return;
      }

      let hudSlot;
      if (isArabic()) {
        renderArabicHud(selectedCount + 1);
        hudSlot = arabicHudCaptureTarget(selectedCount);
      } else hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
      flyLetterToWord(anchors[tileIndex], hudSlot);
      tile.classList.add("selected");
      const anchor = anchors[tileIndex];
      anchor.classList.add("collected");

      selectionHistory.push(tileIndex);
      if (!isArabic()) {
        hudSlot.textContent = expectedLetter.toUpperCase();
        hudSlot.classList.add("found");
      }
      selectedCount++;

      if (selectedCount === currentWord.length) completeWord();
      showCurrentLetter();
    }

    function undoLastLetter() {
      if (gameplayPaused || menuPage !== null || !gameplayStarted || handVisible || gameOver || roomCompleted || wordTransitionPending) return;
      if (selectedCount <= 0 || !selectionHistory.length) return;
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      selectedCount--;

      const tileIndex = selectionHistory.pop();
      const tile = tiles[tileIndex];
      const anchor = anchors[tileIndex];
      anchor.classList.remove("collected");
      tile.classList.remove("selected");

      if (isArabic()) renderArabicHud();
      else {
        const hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
        hudSlot.textContent = "·";
        hudSlot.classList.remove("found");
      }
      showCurrentLetter();
    }

    function completeWord() {
      if (wordTransitionPending || gameOver || roomCompleted) return;
      wordTransitionPending = true;
      updateCameraControls();
      completedWordCount++;
      // Correct words use power, but only missed photos can spend the last slot.
      const cost = Math.min(CONFIG.battery.wordCost, Math.max(0, batterySlotsRemaining - CONFIG.battery.wordReserve));
      if (cost) drainBatterySlot(cost);
      if (gameOver) return;
      if (completedWordCount >= words.length) {
        roomCompleted = true;
        hidePuzzleHint({ immediate: true });
        recordRoomCompletion();
