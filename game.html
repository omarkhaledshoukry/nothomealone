<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="only light" />
  <title>Room Word Hunt</title>
  <style>
    :root {
      color-scheme: light;
      color-scheme: only light;
      --tarantino-yellow: #f6d20a;
      --letter-beige: rgba(241, 239, 229, 0.80);
      --ink: #090909;
      --game-height: 100vh;
      --view-unit: 1vh;
    }

    @supports (height: 100dvh) {
      :root { --game-height: 100dvh; --view-unit: 1dvh; }
    }

    @font-face {
      font-family: "Dudu Calligraphy";
      src: local("Dudu Calligraphy"), local("DuduCalligraphy"), local("Dudu_Calligraphy"),
        url("./Dudu_Calligraphy.ttf") format("truetype");
      font-display: swap;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    body { cursor: grab; }
    body.grabbing { cursor: grabbing; }

    #game {
      color-scheme: light;
      color-scheme: only light;
      forced-color-adjust: none;
      position: fixed;
      top: var(--game-top, 0px);
      left: var(--game-left, 0px);
      width: var(--game-width, 100%);
      height: var(--game-height);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #portraitViewport {
      --safe-left: max(0px, calc(env(safe-area-inset-left) - var(--frame-left-gap, 0px)));
      --safe-right: max(0px, calc(env(safe-area-inset-right) - var(--frame-right-gap, 0px)));
      position: relative;
      height: 100%;
      aspect-ratio: 10 / 16;
      max-width: 100%;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 40px rgba(0, 0, 0, .8);
      isolation: isolate;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (max-width: 600px) and (orientation: portrait), (pointer: coarse) and (orientation: portrait) {
      #portraitViewport { width: 100%; }
    }

    #sceneEffects {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      transform-origin: 50% 50%;
      will-change: transform, filter;
    }

    #roomImage,
    #roomVideo {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #letterWorld {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #roomImage,
    #roomVideo {
      z-index: 1;
      user-select: none;
      pointer-events: none;
      filter: blur(0px);
      transition: filter 420ms ease;
    }

    #roomImage {
      display: none;
      max-width: none;
      -webkit-user-drag: none;
    }

    #roomImage.snapping,
    #roomVideo.snapping,
    #letterWorld.snapping,
    #anomalyWorld.snapping,
    #jumpscareVideo.snapping {
      transition: transform 420ms cubic-bezier(.22,.72,.22,1), filter 420ms ease;
    }

    #portraitViewport.hand-active #roomImage,
    #portraitViewport.hand-active #roomVideo {
      filter: blur(3px);
    }

    #letterWorld {
      z-index: 2;
      pointer-events: none;
      filter: blur(0.7px);
      transition: filter 420ms ease;
    }

    #portraitViewport.hand-active #letterWorld {
      filter: blur(3px);
    }

    .letter-anchor {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .letter-tile {
      padding: 8px;
      display: inline-grid;
      place-items: center;
      color: var(--letter-beige);
      background: transparent;
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      line-height: 1;
      user-select: none;
      pointer-events: none;
      transform: rotate(var(--letter-rotation, 0deg));
      transform-origin: center;
    }

    .letter-glyph {
      display: block;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: calc(var(--letter-base-size, 53px) * var(--letter-scale, 1));
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: .015em;
      pointer-events: none;
    }

    .letter-anchor.appearing .letter-tile { animation: letterFadeIn 150ms ease-out both; }
    .letter-tile.first-letter .letter-glyph { animation: letterVibrate .4s steps(1, end) infinite; }

    @keyframes letterFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes letterVibrate {
      0%, 100% { translate: 0 0; }
      25% { translate: var(--jitter-x1, 2px) var(--jitter-y1, -1px); }
      50% { translate: var(--jitter-x2, -2px) var(--jitter-y2, 1px); }
      75% { translate: var(--jitter-x3, 1px) var(--jitter-y3, 2px); }
    }

    #captureEffects {
      position: absolute;
      z-index: 11;
      inset: 0;
      pointer-events: none;
    }

    .captured-letter {
      position: absolute;
      display: block;
      line-height: 1;
      font-weight: 400;
      text-transform: uppercase;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .letter-anchor[hidden] {
      display: none;
    }

    #cameraOverlay {
      position: absolute;
      z-index: 10;
      inset: 0;
      color: #fff;
      font-family: "OCR A Std", "OCR A Extended", "Lucida Console", Monaco, monospace;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      text-shadow: none;
      transition: opacity 180ms ease;
    }

    #cameraBattery,
    #cameraTimer {
      position: absolute;
      top: max(5%, calc(env(safe-area-inset-top) + 12px));
      font-size: var(--ui-font-size, 18px);
      line-height: 1;
    }

    #cameraBattery {
      left: max(4.5%, calc(var(--safe-left) + 10px));
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #cameraBattery svg {
      width: var(--battery-width, 40px);
      height: auto;
    }

    #batteryPercent { font-size: .9em; }
    .battery-slot.drained { fill: transparent; }

    #cameraTimer {
      right: max(4.5%, calc(var(--safe-right) + 10px));
    }

    #hud {
      position: absolute;
      top: max(4%, calc(env(safe-area-inset-top) + 8px));
      left: 27%;
      width: 46%;
      padding: 0;
      text-align: center;
      pointer-events: none;
    }

    #wordDisplay {
      min-height: clamp(22px, calc(var(--view-unit) * 4.1), 42px);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .hud-letter {
      min-width: 0;
      color: rgba(255, 255, 255, .58);
      font-size: var(--hud-letter-size, 28px);
      font-weight: 400;
      text-transform: uppercase;
      border: 0;
      line-height: 1.1;
    }

    .hud-letter.found {
      color: #fff;
      border: 0;
      animation: hudPop 160ms ease both;
    }

    #status,
    #cameraRoom {
      position: absolute;
      bottom: max(4.5%, calc(env(safe-area-inset-bottom) + 12px));
      max-width: 34%;
      font-size: var(--ui-font-size, 18px);
      line-height: 1;
      white-space: nowrap;
      font-weight: 400;
    }

    #status { left: max(4.5%, calc(var(--safe-left) + 10px)); }
    #cameraRoom { right: max(4.5%, calc(var(--safe-right) + 10px)); }

    #snapButton {
      appearance: none;
      -webkit-appearance: none;
      position: absolute;
      left: 50%;
      bottom: max(8%, calc(env(safe-area-inset-bottom) + 12px));
      width: clamp(56px, calc(var(--view-unit) * 10), 88px);
      height: clamp(56px, calc(var(--view-unit) * 10), 88px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: translateX(-50%);
      padding: 4px;
      border: 2px solid #fff;
      color: #fff;
      opacity: 1;
      border-radius: 50%;
      outline: none;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .shutter-core {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      transition: transform 90ms ease;
    }

    #snapButton:active:not(:disabled) .shutter-core,
    #snapButton.held .shutter-core { transform: scale(.9); }
    #snapButton.snapping .shutter-core { animation: shutterPress 180ms ease-in-out; }
    #snapButton:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    #snapButton:disabled { cursor: default; opacity: 1; border-color: #fff; }

    #shutterBitmap { display: none; }
    #cameraOverlay.bitmap-shutter #shutterBitmap {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #cameraOverlay.bitmap-shutter #snapButton {
      border-color: transparent;
      background: transparent;
      -webkit-filter: none;
      filter: none;
    }
    #cameraOverlay.bitmap-shutter .shutter-core { visibility: hidden; }

    @keyframes shutterPress {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(.9); }
    }


    #loadingScreen {
      position: absolute;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      pointer-events: auto;
    }

    #loadingScreen {
      z-index: 200;
      transition: opacity 220ms ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loadingWord {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.02em;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: clamp(38px, calc(var(--view-unit) * 6), 62px);
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
    }

    #loadingWord[hidden], #wordLoadError[hidden] { display: none; }
    #wordLoadError {
      width: min(88%, 440px);
      max-height: 90%;
      overflow: auto;
      padding: 20px;
      color: #f1efe5;
      font: 16px/1.45 Arial, Helvetica, sans-serif;
      text-align: left;
      cursor: auto;
    }
    #wordLoadError h2 { margin: 0 0 12px; font-size: 23px; }
    #wordLoadError p { margin: 12px 0; }
    #wordLoadUrl { color: inherit; overflow-wrap: anywhere; }
    .word-error-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .word-error-actions button {
      padding: 10px 14px;
      border: 1px solid currentColor;
      border-radius: 5px;
      color: inherit;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    .loading-letter {
      display: inline-block;
      animation: loadingJitter 0.4s steps(1, end) infinite;
    }

    @keyframes loadingJitter {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(var(--lx1), var(--ly1)); }
      50%  { transform: translate(var(--lx2), var(--ly2)); }
      75%  { transform: translate(var(--lx3), var(--ly3)); }
      100% { transform: translate(0, 0); }
    }

    /* Post-loading clue-note interstitial. */
    #clueIntro {
      position: absolute;
      z-index: 120;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    #clueIntro.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #clueIntro.dismiss {
      opacity: 0;
      pointer-events: none;
    }

    #clueCard {
      position: relative;
      width: min(78%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(calc(var(--view-unit) * -1.5));
    }

    #cluePaperWrap {
      position: relative;
      width: 100%;
    }

    #cluePaper,
    #cluePaperBitmap {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.34));
      color-scheme: light;
      color-scheme: only light;
      forced-color-adjust: none;
      opacity: 1;
      mix-blend-mode: normal;
    }

    #cluePaperBitmap {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      visibility: hidden;
      pointer-events: none;
    }

    #cluePaperWrap.bitmap-paper #cluePaper { visibility: hidden; }
    #cluePaperWrap.bitmap-paper #cluePaperBitmap { visibility: visible; }

    #cluePaperText {
      position: absolute;
      inset: 13% 12% 12% 17%;
      color: #000;
      -webkit-text-fill-color: #000;
      forced-color-adjust: none;
      /* Keep the final ink black when legacy Android forced-dark changes
         text paint colours. The paper image stays outside this filter. */
      -webkit-filter: brightness(0);
      filter: brightness(0);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      text-align: left;
      transform: rotate(-0.4deg);
      pointer-events: none;
    }

    #clueTitle {
      margin: 0 0 10% 0;
      text-align: center;
      font-size: clamp(31px, calc(var(--view-unit) * 5.2), 48px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-decoration: underline;
      text-underline-offset: .12em;
    }

    #clueList {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: clamp(13px, calc(var(--view-unit) * 2.3), 24px);
      font-size: clamp(22px, calc(var(--view-unit) * 3.5), 34px);
      line-height: 1.05;
      text-transform: uppercase;
    }

    #clueList li::before { content: "- "; }

    #readyButton {
      appearance: none;
      border: 0;
      padding: 10px 12px;
      margin-top: 8px;
      align-self: flex-end;
      background: transparent;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: clamp(26px, calc(var(--view-unit) * 4.2), 40px);
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
      cursor: pointer;
      animation: readyJitter 0.4s steps(1, end) infinite;
    }

    @keyframes readyJitter {
      0%   { transform: translate(0,0); }
      25%  { transform: translate(2px,-1px); }
      50%  { transform: translate(-2px,1px); }
      75%  { transform: translate(1px,2px); }
      100% { transform: translate(0,0); }
    }

    /* During the clue card, keep the prepared room soft and hide gameplay UI. */
    #portraitViewport.clue-intro-active #roomImage,
    #portraitViewport.clue-intro-active #roomVideo {
      filter: blur(5px);
    }

    #letterWorld,
    #hud {
      transition: filter 420ms ease, opacity 320ms ease;
    }

    #portraitViewport.clue-intro-active #letterWorld,
    #portraitViewport.clue-intro-active #cameraOverlay {
      opacity: 0;
    }

    #anomalyWorld {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      pointer-events: none;
      will-change: transform;
    }

    #anomalyImage {
      position: absolute;
      display: none;
      height: 100%;
      width: auto;
      max-width: none;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #blackFlash { display: none; }

    #jumpscareVideo {
      position: absolute;
      z-index: 150;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      max-width: none;
      object-fit: fill;
      display: none;
      opacity: 1;
      background: transparent;
      pointer-events: none;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #jumpscareVideo.playing {
      display: block;
      opacity: 1;
    }

    #jumpscareVideo.priming {
      display: block;
      opacity: .001;
    }

    #gameOverScreen {
      position: absolute;
      z-index: 160;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: #000;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      text-align: center;
      cursor: pointer;
    }

    #gameOverScreen.show { display: flex; }
    #gameOverScreen.show #gameOverTitle { animation: gameOverJitter .38s steps(1, end) infinite; }
    #gameOverScreen.show #retryText { animation: gameOverJitter .43s steps(1, end) 75ms infinite; }
    #gameOverTitle { font-size: clamp(42px, calc(var(--view-unit) * 7), 72px); line-height: 1; }
    #retryText { font-size: clamp(20px, calc(var(--view-unit) * 3), 30px); opacity: .78; }

    @keyframes gameOverJitter {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(2px, -1px); }
      40% { transform: translate(-2px, 2px); }
      60% { transform: translate(1px, -2px); }
      80% { transform: translate(-1px, 1px); }
    }


    #handBlocker {
      position: absolute;
      z-index: 30;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      touch-action: none;
    }

    #handBlocker.active {
      pointer-events: auto;
      cursor: grab;
    }

    #handBlocker.dragging {
      cursor: grabbing;
    }

    #handImage {
      position: absolute;
      left: 50%;
      bottom: -10%;
      width: 100%;
      height: auto;
      max-width: none;
      object-fit: contain;
      transform: translate(-50%, 120%);
      transform-origin: 50% 100%;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      will-change: transform;
    }

    #handBlocker.entering #handImage {
      animation: handEnter 520ms cubic-bezier(.18,.82,.28,1) forwards;
    }

    #handBlocker.resting #handImage {
      transform: translate(-50%, 0);
    }

    #handBlocker.exiting #handImage {
      animation: handExit 300ms cubic-bezier(.55,.05,.82,.34) forwards;
    }

    @keyframes handEnter {
      from { transform: translate(-50%, 120%); }
      to { transform: translate(-50%, 0); }
    }

    @keyframes handExit {
      from { transform: translate(-50%, 0); }
      to { transform: translate(-50%, 125%); }
    }

    #message {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--tarantino-yellow);
      font-size: clamp(34px, calc(var(--view-unit) * 6), 62px);
      font-weight: 1000;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-shadow: none;
      opacity: 0;
      transform: scale(.82);
      pointer-events: none;
    }

    #message.show { animation: messageFlash 620ms ease both; }

    @keyframes hudPop {
      from { transform: scale(.68); }
      to { transform: scale(1); }
    }

    @keyframes messageFlash {
      0% { opacity: 0; transform: scale(.82); }
      25%, 68% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="portraitViewport">
      <div id="loadingScreen" aria-live="polite">
        <div id="loadingWord" aria-label="Loading">
          <span class="loading-letter">L</span>
          <span class="loading-letter">O</span>
          <span class="loading-letter">A</span>
          <span class="loading-letter">D</span>
          <span class="loading-letter">I</span>
          <span class="loading-letter">N</span>
          <span class="loading-letter">G</span>
        </div>
        <div id="wordLoadError" role="alert" hidden>
          <h2>Couldn’t load words.txt</h2>
          <p id="wordLoadReason"></p>
          <a id="wordLoadUrl" target="_blank" rel="noopener"></a>
          <p>Retry, or choose your word list directly.</p>
          <div class="word-error-actions">
            <button id="retryWordsButton" type="button">Retry</button>
            <button id="chooseWordsButton" type="button">Choose words.txt</button>
          </div>
          <input id="wordFileInput" type="file" accept=".txt,text/plain" hidden />
        </div>
      </div>

      <div id="clueIntro" aria-hidden="true">
        <div id="clueCard">
          <div id="cluePaperWrap">
            <img id="cluePaper" src="note.png" alt="" draggable="false" />
            <canvas id="cluePaperBitmap" aria-hidden="true"></canvas>
            <div id="cluePaperText">
              <div id="clueTitle">CLUES</div>
              <ul id="clueList"></ul>
            </div>
          </div>
          <button id="readyButton" type="button">READY</button>
        </div>
      </div>

      <div id="sceneEffects">
        <img id="roomImage" alt="" draggable="false" />
        <video id="roomVideo" autoplay muted loop playsinline></video>
        <div id="letterWorld" aria-label="Current letter to photograph"></div>
        <div id="anomalyWorld" aria-hidden="true">
          <img id="anomalyImage" alt="" draggable="false" />
        </div>
      </div>

      <div id="cameraOverlay" aria-hidden="true">
        <div id="cameraBattery" aria-label="Camera battery: 4 of 4 slots">
          <svg viewBox="0 0 44 20" aria-hidden="true">
            <rect x="1" y="2" width="38" height="16" rx="1" fill="rgba(0,0,0,.28)" stroke="white" stroke-width="1.5" />
            <path d="M40 7h3v6h-3z" fill="white" />
            <rect class="battery-slot" x="4" y="5" width="6" height="10" fill="#e0bd38" />
            <rect class="battery-slot" x="12" y="5" width="6" height="10" fill="#a6d33c" />
            <rect class="battery-slot" x="20" y="5" width="6" height="10" fill="#78d936" />
            <rect class="battery-slot" x="28" y="5" width="8" height="10" fill="#52d52f" />
          </svg>
          <span id="batteryPercent">100%</span>
        </div>
        <div id="hud">
          <div id="wordDisplay" aria-live="polite"></div>
        </div>
        <time id="cameraTimer" aria-label="Room time remaining">01:00</time>
        <div id="status">CLUE 1/3</div>
