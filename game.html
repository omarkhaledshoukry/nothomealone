        if (gameplayPaused || !spiderActive || gameOver || roomCompleted) return;
        const elapsed = time - spiderRetreatStartedAt;
        const progress = clamp(elapsed / SPIDER_RETREAT_MS, 0, 1);
        const index = Math.floor(elapsed / SPIDER_FRAME_MS) % spiderFrames.length;
        if (index !== spiderFrameIndex) drawSpiderFrame(index);
        spiderActor.style.transform = `translateY(${-distance * progress * progress}px)`;
        if (progress < 1) spiderRetreatFrame = requestAnimationFrame(step);
        else {
          spiderRetreatStep = null;
          spiderActive = false;
          spiderRetreating = false;
          spiderActor.hidden = true;
          scheduleSpiderCheck();
        }
      };
      spiderRetreatStep = step;
      spiderRetreatFrame = requestAnimationFrame(step);
    }

    function pauseSpiderEncounter() {
      if (spiderRetreatStep && spiderRetreatPausedAt === null) {
        spiderRetreatPausedAt = performance.now();
        if (spiderRetreatFrame) cancelAnimationFrame(spiderRetreatFrame);
        spiderRetreatFrame = 0;
      }
      pauseSpiderSound();
    }

    function resumeSpiderEncounter() {
      if (spiderRetreatStep && spiderRetreatPausedAt !== null) {
        spiderRetreatStartedAt += performance.now() - spiderRetreatPausedAt;
        spiderRetreatPausedAt = null;
        spiderRetreatFrame = requestAnimationFrame(spiderRetreatStep);
      }
      if (pausedSpiderSoundOffset === null) return;
      const generation = levelGeneration, revision = playbackRevision;
      const resumed = resumeSpiderSound();
      if (resumed) resumed.then(() => {
        if (generation === levelGeneration && revision === playbackRevision) resumePausedSpiderSound();
      });
      else resumePausedSpiderSound();
    }

    function stopSpiderEncounter() {
      clearLevelTimeout(spiderTimer);
      spiderTimer = null;
      if (spiderRetreatFrame) cancelAnimationFrame(spiderRetreatFrame);
      spiderRetreatFrame = 0;
      spiderRetreatStep = spiderRetreatPausedAt = null;
      spiderActive = false;
      spiderRetreating = false;
      spiderActor.hidden = true;
      stopSpiderSound();
    }

    function anomalyRoomIsAllowed(number = currentScene?.number) {
      return CONFIG.anomaly.allowedRooms === "all" || CONFIG.anomaly.allowedRooms.includes(number);
    }

    function scheduleAnomalyCheck() {
      clearLevelTimeout(anomalyTimer);
      anomalyTimer = null;
      if (!CONFIG.anomaly.enabled || !levelIsUnlocked(CONFIG.anomaly.startLevel) || !anomalyEnabled || anomalyActive || gameOver || roomCompleted) return;
      const generation = levelGeneration;
      anomalyTimer = levelTimeout(async () => {
        anomalyTimer = null;
        if (!CONFIG.anomaly.enabled || !levelIsUnlocked(CONFIG.anomaly.startLevel) || !anomalyEnabled || anomalyActive || gameOver || roomCompleted) return;
        if (anomalyRoomIsAllowed() && Math.random() < ANOMALY_SPAWN_CHANCE) {
          const placed = await spawnAnomalyOffscreen();
          if (generation === levelGeneration && !placed) scheduleAnomalyCheck();
        } else {
          scheduleAnomalyCheck();
        }
      }, ANOMALY_CHECK_MS);
    }

    async function readAlphaBounds(src) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
            for (let y = 0; y < canvas.height; y++) {
              for (let x = 0; x < canvas.width; x++) {
                if (data[(y * canvas.width + x) * 4 + 3] > CONFIG.anomaly.alphaThreshold) {
                  if (x < minX) minX = x;
                  if (x > maxX) maxX = x;
                  if (y < minY) minY = y;
                  if (y > maxY) maxY = y;
                }
              }
            }
            resolve({
              src, width: img.naturalWidth, height: img.naturalHeight,
              bbox: maxX >= minX ? { left: minX, top: minY, right: maxX + 1, bottom: maxY + 1 } : null
            });
          } catch (error) {
            console.warn("Could not inspect anomaly alpha bounds; using full image bounds.", error);
            resolve({ src, width: img.naturalWidth, height: img.naturalHeight, bbox: { left: 0, top: 0, right: img.naturalWidth, bottom: img.naturalHeight } });
          }
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function currentVisibleWorldRange() {
      const left = -offsetX;
      return { left, right: left + viewport.getBoundingClientRect().width };
    }

    function getScaledAnomalyBox(meta) {
      const scaleX = renderedVideoWidth / meta.width;
      const scaleY = viewport.getBoundingClientRect().height / meta.height;
      return {
        left: meta.bbox.left * scaleX,
        right: meta.bbox.right * scaleX,
        top: meta.bbox.top * scaleY,
        bottom: meta.bbox.bottom * scaleY
      };
    }

    function horizontalBoxesIntersect(a, b) {
      return a.left < b.right && a.right > b.left;
    }

    async function spawnAnomalyOffscreen() {
      if (gameplayPaused || menuPage !== null || !CONFIG.anomaly.enabled || !levelIsUnlocked(CONFIG.anomaly.startLevel) || !anomalyRoomIsAllowed() || anomalyActive || gameOver || roomCompleted || !renderedVideoWidth) return false;
      const generation = levelGeneration;
      const spawnRoomIndex = activeRoomIndex;
      const src = ANOMALY_FILES[Math.floor(Math.random() * ANOMALY_FILES.length)];
      const meta = await readAlphaBounds(src);
      if (generation !== levelGeneration || gameplayPaused || menuPage !== null || !meta || !meta.bbox || !CONFIG.anomaly.enabled || !levelIsUnlocked(CONFIG.anomaly.startLevel) || !anomalyRoomIsAllowed() || gameOver || roomCompleted || spawnRoomIndex !== activeRoomIndex) return false;

      // The anomaly PNG is authored against the same full 1280x720 scene as
      // the video. Keep the PNG fixed at the scene origin so its opaque pixels
      // always land at their authored location; only the panorama itself pans.
      const bbox = getScaledAnomalyBox(meta);

      // Spawn only while the anomaly's ACTUAL non-transparent pixels are fully
      // outside the current viewport. If its authored location is visible now,
      // skip this checkpoint and try again on the next anomaly check.
      const visible = currentVisibleWorldRange();
      const edgePad = CONFIG.anomaly.offscreenMarginPx;
      if (horizontalBoxesIntersect(
        { left: bbox.left, right: bbox.right },
        { left: visible.left - edgePad, right: visible.right + edgePad }
      )) return false;

      anomalyRoomIndex = activeRoomIndex;
      anomalyWorld.style.display = "";
      anomalyMeta = meta;
      anomalyWorldBox = bbox;
      anomalyHasBeenSeen = false;
      anomalyActive = true;
      anomalyImage.src = src;
      setOverlayImageStyles(anomalyImage, anomalyBitmap, { left: "0px", top: "0px",
        height: `${viewport.getBoundingClientRect().height}px`, width: `${renderedVideoWidth}px`, display: "block" });
      anomalyWorld.style.width = `${renderedVideoWidth}px`;
      anomalyWorld.style.height = `${viewport.getBoundingClientRect().height}px`;
      updateAnomalyVisibilityState();
      return true;
    }

    function updateAnomalyVisibilityState() {
      if (!anomalyActive || anomalyRoomIndex !== activeRoomIndex || !anomalyWorldBox || gameOver) return;
      const visible = currentVisibleWorldRange();
      const intersects = horizontalBoxesIntersect(anomalyWorldBox, visible);
      if (intersects) {
        anomalyHasBeenSeen = true;
      } else if (anomalyHasBeenSeen) {
        removeAnomalyAndRestartTimer();
      }
    }

    function removeAnomalyAndRestartTimer() {
      anomalyActive = false;
      anomalyHasBeenSeen = false;
      anomalyMeta = null;
      anomalyWorldBox = null;
      setOverlayImageStyles(anomalyImage, anomalyBitmap, { display: "none" });
      anomalyImage.removeAttribute("src");
      if (!gameOver) scheduleAnomalyCheck();
    }

    function endGame(reason = "other") {
      if (gameOver || roomCompleted) return;
      const chance = (CONFIG.failures[reason] || CONFIG.failures.other).jumpscareChance || 0;
      if (chance >= 1 || chance > 0 && Math.random() < chance) triggerJumpscare(reason);
      else if (beginGameOver(reason)) showGameOver();
    }

    function beginGameOver(reason) {
      if (gameOver || roomCompleted) return false;
      gameOver = true;
      hidePuzzleHint({ immediate: true });
      gameOverReason = Object.prototype.hasOwnProperty.call(CONFIG.failures, reason) ? reason : "other";
      stopButterflyFlight();
      stopSpiderEncounter();
      updateCameraControls();
      stopCameraTimer();
      clearLevelTimeout(wordAdvanceTimer);
      clearLevelTimeout(anomalyTimer);
      clearLevelTimeout(handTimer);
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      // Stop competing room-video decoding once the full-screen scare owns playback.
      const room = levelRooms[activeRoomIndex];
      if (room) { room.videoRun++; room.videoFrameCancel?.(); }
      video.pause();
      video.muted = true;
      // The same cleanup applies when no video is selected by the failure roll.
      handVisible = false;
      handDismissing = false;
      handBlocker.className = "";
      handBlocker.setAttribute("aria-hidden", "true");
      viewport.classList.remove("hand-active");
      return true;
    }

    function triggerJumpscare(reason = "other") {
      if (!beginGameOver(reason)) return;

      // jumpscare.mp4 is 1280x720, the same authored canvas as room.mp4.
      // Put it into that exact panorama coordinate space at the CURRENT camera
      // position first, so the first visible frame perfectly overlays the room.
      const previousOffset = offsetX;
      roomImage.classList.remove("snapping");
      video.classList.remove("snapping");
      letterWorld.classList.remove("snapping");
      anomalyWorld.classList.remove("snapping");
      jumpscareVideo.classList.remove("snapping");
      jumpscareVideo.style.transform = `translateX(${previousOffset}px)`;
      // The first frame is already decoded and parked at time zero. Avoid a
      // redundant seek here, which can delay the first visible scare frame.
      jumpscareVideo.style.display = "block";
      jumpscareVideo.classList.remove("priming");
      jumpscareVideo.classList.add("playing");
      jumpscareVideo.muted = false;
      jumpscareVideo.volume = 1;
      retreatActiveDoll();

      let movementStarted = false;
      const clip = jumpscareVideo, generation = levelGeneration;
      const flyToCentre = () => {
        if (generation !== levelGeneration || movementStarted || !clip.classList.contains("playing")) return;
        if (gameplayPaused || isPageInactive()) { pendingScareCentre = flyToCentre; return; }
        pendingScareCentre = null;
        movementStarted = true;
        requestAnimationFrame(() => {
          if (generation !== levelGeneration || !clip.classList.contains("playing")) return;
          if (gameplayPaused || isPageInactive()) {
            movementStarted = false;
            pendingScareCentre = flyToCentre;
            return;
          }
          offsetX = minOffset / 2;
          applyWorldOffset(true);
        });
      };
      const onScareFrame = () => {
        flyToCentre();
        // Leave the room visible until the video has had a chance to paint.
        // Then keep black behind the clip so the room cannot flash at the end.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (generation === levelGeneration && clip === jumpscareVideo && clip.classList.contains("playing")) {
            viewport.classList.add("scene-blackout");
          }
        }));
      };
      // Show and start playback at the player's current view. Begin the
      // camera flight only after the video presents its first playing frame.
      void jumpscareVideo.offsetWidth;
      if (typeof jumpscareVideo.requestVideoFrameCallback === "function") {
        jumpscareFrameRequest = jumpscareVideo.requestVideoFrameCallback(() => {
          jumpscareFrameRequest = null;
          onScareFrame();
        });
      } else jumpscareVideo.addEventListener("playing", onScareFrame, { once: true });
      const room = levelRooms[activeRoomIndex], revision = playbackRevision;
      try {
        const played = playActiveScare(room, { gesture: reason !== "timeout" });
        if (played) boundedMediaAction(played).catch(error => handleScarePlaybackFailure(room, revision, error));
      } catch (error) { handleScarePlaybackFailure(room, revision, error); }
    }

    function handleScarePlaybackFailure(room, revision, error) {
      if (playbackRevision !== revision || isPageInactive() || menuPage !== null || activeScareRoom() !== room) return;
      if (room.scare.error || error.name === "NotSupportedError") showGameOver();
      else showPlaybackResumePrompt();
    }

    function playActiveScare(room, { gesture = false, refreshAudio = false } = {}) {
      const revision = playbackRevision;
      const audio = requireScareAudio(room, { refreshAudio });
      const start = () => {
        if (revision !== playbackRevision || isPageInactive() || menuPage !== null || activeScareRoom() !== room) return;
        const clip = room.scare;
        if (refreshAudio) clip.pause();
        clip.muted = clip.defaultMuted = false;
        clip.volume = 1;
        if (room.audioGain) room.audioGain.gain.setValueAtTime(1, jumpscareAudioContext.currentTime);
        return clip.paused ? clip.play() : undefined;
      };
      // A timer has no user activation to preserve. Wait for audio before
      // starting the clip so an interrupted context cannot consume the scare silently.
      if (audio && !gesture) return audio.then(start);
      const playing = start();
      return audio ? Promise.all([audio, playing]) : playing;
    }

    function showResultsScreen() {
      viewport.classList.add("scene-blackout");
      gameOverScreen.classList.add("show");
      // Results must already be opaque before either outgoing cover is removed.
      resumePlayback.hidden = true;
      loadingScreen.classList.add("hidden");
    }

    function showGameOver() {
      ++playbackRevision;
      levelResumePending = null;
      resumePlaybackButton.disabled = false;
      pendingScareCentre = null;
      const details = document.getElementById("levelLoadDetails");
      details.hidden = !levelLoadFailure;
      details.textContent = levelLoadFailure?.message || "";
      if (!roomCompleted) {
        const failure = CONFIG.failures[gameOverReason] || CONFIG.failures.other;
        document.getElementById("gameOverTitle").textContent = failure.title;
        document.getElementById("retryText").textContent = CONFIG.text.retry;
        gameOverScreen.setAttribute("aria-label", `${failure.title}. ${CONFIG.text.retry}.`);
      }
      showResultsScreen();
      if (!isPageInactive() && menuPage === null) {
        gameplayPaused = false;
        viewport.classList.remove("level-paused");
      }
      hideDolls();
      stopButterflyFlight();
      stopSpiderEncounter();
      stopCameraTimer();
      snapButton.disabled = true;
      if (jumpscareFrameRequest !== null) {
        jumpscareVideo.cancelVideoFrameCallback?.(jumpscareFrameRequest);
        jumpscareFrameRequest = null;
      }
      jumpscareVideo.pause();
      if (jumpscareAudioGain) jumpscareAudioGain.gain.setValueAtTime(0, jumpscareAudioContext.currentTime);
      jumpscareVideo.classList.remove("playing");
      jumpscareVideo.style.display = "none";
    }



    gameOverScreen.addEventListener("pointerup", retryOrContinue);
    gameOverScreen.addEventListener("keydown", retryOrContinue);

    function scheduleNextHandCheck() {
      clearLevelTimeout(handTimer);
      handTimer = null;
      if (!CONFIG.hand.enabled || !levelIsUnlocked(CONFIG.hand.startLevel) || gameOver || roomCompleted) return;
      const delay = CONFIG.hand.minCheckMs + Math.random() * (CONFIG.hand.maxCheckMs - CONFIG.hand.minCheckMs);
      handTimer = levelTimeout(() => {
        handTimer = null;
        if (!levelIsUnlocked(CONFIG.hand.startLevel)) return;
        if (!handVisible && Math.random() < CONFIG.hand.spawnChance) {
          showHand();
        } else {
          scheduleNextHandCheck();
        }
      }, delay);
    }

    function showHand() {
      if (!CONFIG.hand.enabled || !levelIsUnlocked(CONFIG.hand.startLevel) || handVisible || gameOver || roomCompleted) return;
      handVisible = true;
      handDismissing = false;
      updateCameraControls();
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer();
      stopShutterEffect();
      viewport.classList.add("hand-active");
      handBlocker.className = "active entering";
      handBlocker.setAttribute("aria-hidden", "false");

      // Ensure the animation restarts cleanly every time.
      void handImage.offsetWidth;
      levelTimeout(() => {
        if (!handVisible || handDismissing) return;
        handBlocker.className = "active resting";
      }, CONFIG.hand.enterMs);
    }

    function hideHand({ continueFromDrag = false } = {}) {
      if (!handVisible || handDismissing) return;
      handDismissing = true;
      viewport.classList.remove("hand-active");
      const generation = levelGeneration;
      const pointerId = handPointerId;
      handPointerId = null;
      handDragStarted = false;
      if (pointerId !== null) {
        try { if (handBlocker.hasPointerCapture(pointerId)) handBlocker.releasePointerCapture(pointerId); } catch {}
      }

      if (continueFromDrag) {
        // Continue smoothly from the exact dragged position. Do NOT reset the
        // transform to the resting position first, which caused a visible flicker.
        handBlocker.className = "active";
        setOverlayImageStyles(handImage, handBitmap, { transition: `transform ${CONFIG.hand.dragExitMs}ms cubic-bezier(.55,.05,.82,.34)` });
        const exitY = Math.max(viewport.clientHeight * CONFIG.hand.exitViewportMultiplier, handImage.getBoundingClientRect().height * CONFIG.hand.exitImageMultiplier);

        requestAnimationFrame(() => {
          if (generation !== levelGeneration) return;
          setOverlayImageStyles(handImage, handBitmap, { transform: `translate(-50%, ${exitY}px)` });
        });
      } else {
        handBlocker.className = "active exiting";
      }

      levelTimeout(() => {
        handVisible = false;
        handDismissing = false;
        updateCameraControls();
        handBlocker.className = "";
        handBlocker.setAttribute("aria-hidden", "true");
        setOverlayImageStyles(handImage, handBitmap, { transition: "", transform: "" });
        scheduleNextHandCheck();
      }, CONFIG.hand.exitMs);
    }

    function handPointerDown(event) {
      if (gameplayPaused || !handVisible || handDismissing || (event.button !== undefined && event.button !== 0)) return;
      event.preventDefault();
      event.stopPropagation();
      handPointerId = event.pointerId;
      handStartY = event.clientY;
      handCurrentY = event.clientY;
      handDragStarted = false;
      handBlocker.classList.add("dragging");
      try { handBlocker.setPointerCapture(event.pointerId); } catch {}
    }

    function handPointerMove(event) {
      if (!handVisible || handPointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      handCurrentY = event.clientY;
      const dy = Math.max(0, handCurrentY - handStartY);
      if (dy > CONFIG.hand.dragThresholdPx) handDragStarted = true;

      // Follow only downward gestures; upward movement does not dismiss it.
      if (dy > 0) {
        const maxDrag = viewport.clientHeight * CONFIG.hand.maxDragFraction;
        const visualDy = Math.min(dy, maxDrag);
        setOverlayImageStyles(handImage, handBitmap, { transform: `translate(-50%, ${visualDy}px)` });
      }
    }

    function handPointerUp(event) {
      if (!handVisible || handPointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      const dy = event.clientY - handStartY;
      const threshold = Math.max(CONFIG.hand.dismissMinPx, viewport.clientHeight * CONFIG.hand.dismissHeightFraction);
      handBlocker.classList.remove("dragging");
      try { handBlocker.releasePointerCapture(event.pointerId); } catch {}
      handPointerId = null;

      if (dy >= threshold) {
        // A committed downward swipe continues from the current drag position
        // directly off-screen without jumping back up first.
        hideHand({ continueFromDrag: true });
      } else {
        setOverlayImageStyles(handImage, handBitmap, { transition: `transform ${CONFIG.hand.resetMs}ms ease-out`, transform: "translate(-50%, 0)" });
        levelTimeout(() => {
          setOverlayImageStyles(handImage, handBitmap, { transition: "", transform: "" });
        }, CONFIG.hand.resetCleanupMs);
      }
    }

    handBlocker.addEventListener("pointerdown", handPointerDown);
    handBlocker.addEventListener("pointermove", handPointerMove);
    handBlocker.addEventListener("pointerup", handPointerUp);
    handBlocker.addEventListener("pointercancel", handPointerUp);

    function prepareRoomScene() {
      updateLimits();
      buildSnapPoints();
      offsetX = snapPoints[nearestSnapIndex(minOffset / 2)];
      applyWorldOffset(false);
      anomalyWorld.style.width = `${renderedVideoWidth}px`;
      if (currentWord) relayoutScatteredLetters();
      updateAnomalyVisibilityState();
    }



    function resizeGameViewport() {
      viewportLayoutFrame = 0;
      stopButterflyFlight();
      syncVisibleViewport();
      finishShutterGesture();
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      updateLimits();
      // Keep random coordinates, sizes, rotations and collected progress.
      // Refit the same letters between the newly sized camera UI rows.
      if (currentWord) relayoutScatteredLetters();
      fitHudWord();
      showCurrentLetter({ animate: false });
      updateAnomalyVisibilityState();
      refreshShutterBitmap();
      refreshMessageBitmap();
      fitClueList();
    }

    function requestViewportLayout() {
      if (!viewportLayoutFrame) viewportLayoutFrame = requestAnimationFrame(resizeGameViewport);
    }

    window.addEventListener("resize", requestViewportLayout);
    window.visualViewport?.addEventListener("resize", requestViewportLayout);
    window.visualViewport?.addEventListener("scroll", requestViewportLayout);
    // Refit letter bounds after the bundled font replaces the fallback.
    document.fonts?.ready.then(requestViewportLayout);

    window.addEventListener("keydown", event => {
      if (event.defaultPrevented || event.ctrlKey || event.altKey || event.metaKey || event.isComposing ||
          event.target?.isContentEditable || event.target?.closest?.("input, textarea, select")) return;
      if (event.key === "Backspace" || event.key === "Back") {
        event.preventDefault();
        undoLastLetter();
      }
    });

    viewport.addEventListener("pointerdown", pointerDown);
    // Observe releases before an overlay can stop their propagation, and
    // clean up interruptions so the very next press can drag normally.
    window.addEventListener("pointerup", recoverLevelAudioFromGesture, true);
    window.addEventListener("keydown", recoverLevelAudioFromGesture, true);
    window.addEventListener("pointermove", pointerMove, true);
    window.addEventListener("pointerup", pointerUp, true);
    window.addEventListener("pointercancel", pointerCancel, true);
    viewport.addEventListener("lostpointercapture", event => {
      // Ignore capture loss from an overlay when the room still owns capture.
      if (event.target === viewport && !viewport.hasPointerCapture(event.pointerId)) pointerCancel(event);
    });
    function interruptCameraInput() {
      stopKeyboardInput();
      hidePuzzleHint({ immediate: true });
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer();
      stopShutterEffect();
      if (handPointerId !== null) {
        const pointer = handPointerId;
        handPointerId = null;
        handDragStarted = false;
        try { if (handBlocker.hasPointerCapture(pointer)) handBlocker.releasePointerCapture(pointer); } catch {}
        handBlocker.classList.remove("dragging");
        setOverlayImageStyles(handImage, handBitmap, { transition: "", transform: "" });
      }
    }
    window.addEventListener("blur", interruptCameraInput);

    function isPageInactive() {
      return document.hidden || pageParked;
    }

    function pauseLevelActivity({ cancelPreparation = false } = {}) {
      ++playbackRevision;
      levelResumePending = null;
      gameplayPaused = true;
      resumePlayback.hidden = true;
      resumePlaybackButton.disabled = false;
      viewport.classList.add("level-paused");
      pauseCameraTimer();
      pauseLevelTimeouts();
      interruptCameraInput();
      stopButterflyFlight();
      pauseSpiderEncounter();
      dollRetreatAnimation?.pause();
      if (cancelPreparation) cancelMenuPrimer?.();
      for (const room of roomMediaPool) {
        if (cancelPreparation) room.cancelScarePreparation?.();
        ++room.videoRun;
        room.videoFrameCancel?.();
        room.video.pause();
        room.scare.pause();
      }
      updateCameraControls();
    }

    function resumeLevelSimulation({ audioRestored = false } = {}) {
      if (audioRestored) appleForegroundAudioPending = false;
      gameplayPaused = false;
      resumePlayback.hidden = true;
      viewport.classList.remove("level-paused");
      resumeLevelTimeouts();
      resumeCameraTimer();
      if (gameplayStarted && !gameOver && !roomCompleted) {
        showCurrentLetter({ animate: false });
        resumeSpiderEncounter();
      }
      if (dollRetreatAnimation?.playState === "paused") dollRetreatAnimation.play();
      pendingScareCentre?.();
      updateCameraControls();
    }

    function activeScareRoom() {
      const room = levelRooms[activeRoomIndex];
      return gameOver && room?.scare.classList.contains("playing") ? room : null;
    }

    function showPlaybackResumePrompt() {
      pauseLevelActivity();
      if (isPageInactive() || menuPage !== null || exitConfirmationActive) return;
      resumePlaybackButton.textContent = isArabic() ? "اضغط للمتابعة" : "TAP TO RESUME";
      resumePlayback.hidden = false;
      resumePlaybackButton.focus();
    }

    function boundedMediaAction(action, timeoutMs = CONFIG.loading.resourceTimeoutMs) {
      let timer;
      return Promise.race([action, new Promise((_, reject) => {
        timer = setTimeout(() => {
          const error = new Error("Playback did not start in time.");
          error.name = "TimeoutError";
          reject(error);
        }, timeoutMs);
      })]).finally(() => clearTimeout(timer));
    }

    function watchRoomPlayback(room, attempt) {
      if (!attempt || !room) return;
      const revision = playbackRevision, run = room.videoRun;
      boundedMediaAction(attempt).catch(error => {
        if (revision !== playbackRevision || run !== room.videoRun || gameplayPaused || isPageInactive() ||
            menuPage !== null || gameOver || roomCompleted || levelRooms[activeRoomIndex] !== room) return;
        if (room.video.error) showLevelLoadError(mediaAssetError(room.scene.roomVideo, error, room.video));
        else showPlaybackResumePrompt();
      });
    }

    // IndexedDB can remember an explicitly chosen writable save file. Never
    // request permission during startup or during horror/gameplay events.
    function saveHandleStore(mode, value) {
      return new Promise(resolve => {
        let settled = false;
        const finish = result => { if (!settled) { settled = true; clearTimeout(timer); resolve(result); } };
        const timer = setTimeout(() => finish(null), CONFIG.loading.saveHandleTimeoutMs);
        try {
          const open = indexedDB.open("room-word-hunt-save-handles", 1);
          open.onupgradeneeded = () => { if (!open.result.objectStoreNames.contains("files")) open.result.createObjectStore("files"); };
          open.onerror = open.onblocked = () => finish(null);
          open.onsuccess = () => {
            const db = open.result;
            if (settled) { db.close(); return; }
            let tx, request;
            try {
              tx = db.transaction("files", mode === "put" || mode === "delete" ? "readwrite" : "readonly");
              const store = tx.objectStore("files");
              if (mode === "delete") {
                store.delete(PROGRESS_STORAGE_BASE_KEY);
                request = store.delete(PROGRESS_STORAGE_BASE_KEY + ":ar");
              } else request = mode === "put" ? store.put(value, PROGRESS_STORAGE_KEY) : store.get(PROGRESS_STORAGE_KEY);
            } catch { db.close(); finish(null); return; }
            let result = null;
            request.onsuccess = () => { result = mode === "put" || mode === "delete" ? true : request.result || null; };
            tx.oncomplete = () => { db.close(); finish(result); };
            tx.onerror = tx.onabort = () => { db.close(); finish(null); };
          };
        } catch { finish(null); }
      });
    }

    async function initializeProgress() {
      let selected = savedBrowserProgress();
      let ignoreExternalSave = false;
      for (const store of ["localStorage", "sessionStorage"]) {
        try { if (window[store].getItem(PROGRESS_RESET_KEY) === "1") ignoreExternalSave = true; } catch {}
      }
      const consider = text => {
        try {
          const candidate = parseProgress(text);
          if (candidate.language !== CONFIG.language.code) return;
          if (!selected || progressTime(candidate) > progressTime(selected)) selected = candidate;
        } catch (error) { console.info("Ignoring unavailable/invalid save.txt.", error.message); }
      };
      if (ignoreExternalSave) {
        progressSaveHandle = null;
      } else if (localFolderImport) {
        if (typeof localFolderImport.saveText === "string") consider(localFolderImport.saveText);
      } else {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), CONFIG.loading.saveTimeoutMs);
        try {
          const response = await fetch(new URL(CONFIG.assets.saveFile, document.baseURI), { cache: "no-store", signal: controller.signal });
          if (response.ok) consider(await response.text());
        } catch (error) { console.info("No readable save.txt; using browser progress.", error.message); }
        finally { clearTimeout(timer); }
      }
      if (!ignoreExternalSave && "showSaveFilePicker" in window) {

    function queueSaveFile(text) {
      if (!progressSaveHandle) return progressWriteQueue;
      const handle = progressSaveHandle;
      const generation = progressWriteGeneration;
      progressWriteQueue = progressWriteQueue.catch(() => {}).then(async () => {
        try {
          if (generation !== progressWriteGeneration) return;
          if (await handle.queryPermission({ mode: "readwrite" }) !== "granted") throw new Error("Save permission expired.");
          if (generation !== progressWriteGeneration) return;
          const writable = await handle.createWritable();
          try {
            if (generation !== progressWriteGeneration) { await writable.abort(); return; }
            await writable.write(text);
            if (generation !== progressWriteGeneration) { await writable.abort(); return; }
            await writable.close();
          }
          catch (error) { if (writable.abort) await writable.abort().catch(() => {}); throw error; }
          progressMessage = "save.txt updated";
        } catch (error) {
          progressMessage = "Use Save save.txt to reconnect your file.";
          console.warn("Could not update save.txt.", error.message);
        }
        updateProgressStatus();
      });
      return progressWriteQueue;
    }

      document.getElementById("languageChoices").setAttribute("aria-label", text.language);
      menuShell.querySelectorAll(".menu-back").forEach(button => button.setAttribute("aria-label", text.back));
      document.querySelectorAll(".home-back").forEach(button => button.setAttribute("aria-label", text.home));
      menuShell.querySelectorAll("[data-language]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.language === CONFIG.language.code)));
    }

    function updateMenuControls() {
      const busy = menuPage === "panning" || Boolean(homePlayPending || menuActionPending);
      menuShell.querySelectorAll("button").forEach(button => { button.disabled = busy; });
    }

    function syncHomePoster() {
      const { width, height } = portraitFrame.getBoundingClientRect();
      const scaledWidth = homePoster.naturalHeight ? height * homePoster.naturalWidth / homePoster.naturalHeight : width;
      const shift = Math.min(0, width - scaledWidth);
      menuShell.style.setProperty("--home-pan-x", `${shift}px`);
      return shift;
    }

    function showMenuPage(page = "home", focus = false) {
      if (page !== "panning" && !MENU_PAGES.includes(page)) page = "home";
      menuSwipe = null;
      menuPage = page;
      document.documentElement.classList.add("menu-open");
      menuShell.hidden = false;
      menuShell.dataset.page = page;
      const destination = page === "panning" ? menuShell.dataset.panTarget : page;
      menuShell.dataset.posterPosition = destination === "intro" ? "left" : destination === "home" ? "right" : "center";
      viewport.inert = true;
      viewport.setAttribute("aria-hidden", "true");
      for (const name of MENU_PAGES) document.getElementById(`${name}Page`).hidden = name !== page;
      if (page !== "home") document.getElementById("homeNotice").textContent = "";
      menuShell.scrollTop = 0;
      syncHomePoster();
      updateMenuCopy(); updateMenuControls();
      if (focus) requestAnimationFrame(() => {
        if (menuPage !== page) return;
        const action = page === "home" ? document.getElementById("homePlayButton")
          : page === "intro" ? document.getElementById("homeStartButton")
          : document.getElementById(`${page}Page`)?.querySelector(".menu-back");
        action?.focus();
      });
    }

    function finishHomePan() {
      if (menuPage !== "panning") return;
      window.clearTimeout(homePanTimer);
      homePanTimer = null;
      const target = menuShell.dataset.panTarget;
      delete menuShell.dataset.panTarget;
      showMenuPage(target, true);
    }

    function panHomeTo(target) {
      if (!MENU_ROUTES[menuPage]?.includes(target) || homePlayPending || menuActionPending) return;
      const shift = syncHomePoster(), duration = CONFIG.menu.panMs;
      if (!shift || !duration || window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) {
        showMenuPage(target, true);
        return;
      }
      menuShell.dataset.panTarget = target;
      menuShell.style.setProperty("--home-pan-ms", `${duration}ms`);
      showMenuPage("panning");
      // Some browsers suppress transitionend when the window is resized or hidden.
      homePanTimer = window.setTimeout(finishHomePan, duration + 80);
    }

    function startMenuSwipe(event) {
      if (!event.isPrimary || event.button !== 0) return;
      suppressMenuClick = false;
      menuSwipe = null;
      if (!MENU_ROUTES[menuPage] || homePlayPending || menuActionPending) return;
      menuSwipe = { id: event.pointerId, page: menuPage, x: event.clientX, y: event.clientY };
    }

    function finishMenuSwipe(event) {
      const swipe = menuSwipe;
      if (!swipe || swipe.id !== event.pointerId) return;
      menuSwipe = null;
      if (event.type === "pointercancel" || menuPage !== swipe.page) return;
      const dx = event.clientX - swipe.x, dy = event.clientY - swipe.y;
      const threshold = Math.max(42, Math.min(80, menuShell.clientWidth * .12));
      if (Math.abs(dx) < threshold || Math.abs(dx) < Math.abs(dy) * 1.35) return;
      // A horizontal swipe starting on a button must not also activate it.
      suppressMenuClick = true;
      event.preventDefault();
      if (swipe.page === "home") {
        if (dx > 0) panHomeTo("intro");
      } else if (dx < 0) {
        panHomeTo("home");
      }
    }

    function hideMenuForLoading() {
      menuSwipe = null;
      menuPage = null;
      gameplayPaused = isPageInactive();
      viewport.classList.toggle("level-paused", gameplayPaused);
      loadingScreen.classList.remove("hidden");
      document.documentElement.classList.remove("menu-open");
      menuShell.hidden = true;
      viewport.inert = false;
      viewport.removeAttribute("aria-hidden");
      loadingWord.hidden = false;
      mediaPreparation.hidden = true;
    }

    function selectMenuLanguage(language) {
      if (!["en", "ar"].includes(language) || homePlayPending || menuActionPending) return;
      const preference = JSON.stringify({ language, updatedAt: Date.now() });
      for (const store of ["localStorage", "sessionStorage"]) {
        try { window[store].setItem(MENU_PREFERENCE_KEY, preference); } catch {}
      }
      CONFIG.language.code = language;
      puzzleTextOverride = null;
      gameInitializationStarted = false;
      refreshConfigBindings();
      configureGamePresentation();
      updateMenuCopy();
      document.getElementById("homeNotice").textContent = "";
    }

    function selectLocalLanguage(data, language) {
      if (!data) return false;
      const entry = data.languageFiles?.[language];
      if (entry && typeof entry.wordsText === "string" && typeof entry.wordsSource === "string") {
        Object.assign(data, entry, { language });
        return true;
      }
      return data.language === language && typeof data.wordsText === "string";
    }

    async function bootstrapHome() {
      if (location.protocol === "file:") localFolderImport = restoreLocalFiles();
      if (location.protocol !== "file:" || localFolderImport) await loadGameConfig();
      applyLanguagePreference();
      refreshConfigBindings();
      configureGamePresentation();
      updateMenuCopy();
      cluePaper.src = CONFIG.assets.paperFile;
      handImage.src = CONFIG.assets.handFile;
      // Start the optional download before Play waits on the first room.
      // Local file mode still waits for the selected folder's settings.
      if (/^https?:$/.test(location.protocol)) loadSpiderAssets();
    }

    function primeRetainedScares({ refreshAudio = false } = {}) {
      unlockSpiderSound({ refreshAudio });
      const rooms = roomMediaPool.filter(room => room.metadataReady && !room.scare.error &&
        !room.scare.classList.contains("playing"));
      const audioRestart = refreshAudio
        ? requireScareAudio(rooms.find(room => room.audioGain), { refreshAudio: true })
        : undefined;
      if (audioRestart) audioRestart.catch(() => {});
      else resumeJumpscareAudio({ refreshAudio });
      return Promise.allSettled(rooms.map(room => {
        // The existing warm-up can wait for audio, but play() itself must
        // still be called inside the Retry gesture.
        try { return prepareJumpscarePlayback({ unlockAudio: true, refreshAudio: true, audioRestart }, room); }
        catch (error) { return Promise.reject(error); }
      }));
    }

    function primeMediaFromMenuGesture() {
      unlockSpiderSound();
      let room = roomMediaPool[0];
      if (!room) {
        const count = levelRoomCount;
        levelRoomCount = 1;
        try { room = makeLevelRoom({ number: 0, roomImage: null, roomVideo: null, jumpscare: new URL("media-unlock.mp4", document.baseURI).href }, 0); }
        finally { levelRoomCount = count; }
      }
      const clip = room.scare;
      let attempt;
      try {
        if (room.metadataReady && !clip.error && clip.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          // A previously decoded first frame says nothing about iOS granting
          // sound again. Actually play the retained element on this Play tap.
          attempt = prepareJumpscarePlayback({ unlockAudio: true, refreshAudio: true }, room);
        } else {
          releaseRoomScareSource(room);
          room.mediaLoading = true;
          room.scareURL = MENU_MEDIA_PRIMER;
          clip.src = MENU_MEDIA_PRIMER;
          clip.muted = clip.defaultMuted = false;
          clip.classList.add("priming");
          const audio = unlockJumpscareAudio(room);
          const playing = waitForMedia(clip, "playing", CONFIG.loading.resourceTimeoutMs);
          clip.load();
          // Same native player, silent AAC track: Play supplies this trusted
          // gesture before any asynchronous level/config loading is awaited.
          const played = clip.play();
          const interrupted = new Promise((_, reject) => {
            cancelMenuPrimer = () => reject(mediaPreparationInterrupted());
          });
          attempt = boundedMediaAction(Promise.race([Promise.all([audio, playing, played]), interrupted]));
        }
      } catch (error) { attempt = Promise.reject(error); }
      return attempt.then(() => {
        room.audioUnlocked = sessionMediaUnlocked = true;
        return true;
      }).catch(error => {
        room.audioUnlocked = false;
        if (error.name !== "AbortError") console.info("Media unlock will use the loading-screen fallback if needed.", error.message);
        return false;
      }).finally(() => {
        cancelMenuPrimer = null;
        room.mediaLoading = false;
        clip.pause(); clip.volume = 1; clip.muted = false;
        clip.classList.remove("priming");
      });
    }

    function beginHomePlay() {
      if (menuPage !== "home" || isPageInactive() || homePlayPending || menuActionPending) return homePlayPending;
      const primed = primeMediaFromMenuGesture();
      hideMenuForLoading();
      document.getElementById("homeNotice").textContent = "";
      homePlayPending = Promise.all([homeBootPromise, primed]).then(() => initializeGame())
        .catch(showLevelLoadError).finally(() => { homePlayPending = null; updateMenuControls(); });
      updateMenuControls();
      return homePlayPending;
    }

    function returnToHome() {
      if (menuActionPending) return menuActionPending;
      if (progressInitializedLanguage === CONFIG.language.code) saveProgress();
      pauseLevelActivity({ cancelPreparation: true });
      stopSpiderSound();
      showMenuPage("home");
      menuActionPending = Promise.allSettled([currentLevelLoadPromise, mediaPreparationPending,
        ...roomMediaPool.map(room => room.preparing)]).then(() => {
        resetLevelState();
        gameInitializationStarted = false;
        progressInitializedLanguage = null;
        currentLevelLoadPromise = Promise.resolve();
        showMenuPage("home", true);
      }).finally(() => { menuActionPending = null; updateMenuControls(); });
      updateMenuControls();
      return menuActionPending;
    }

    function clearDataFromHome() {
      if (menuPage !== "home" || homePlayPending || menuActionPending) return menuActionPending;
      menuActionPending = homeBootPromise.then(async () => {
        await Promise.allSettled([currentLevelLoadPromise, mediaPreparationPending]);
        resetLevelState();
        PROGRESS_STORAGE_KEY = PROGRESS_STORAGE_BASE_KEY + (isArabic() ? ":ar" : "");
        resetBrowserProgress();
        clearPreparedLevelCache();
        gameInitializationStarted = false;
        progressInitializedLanguage = null;
        currentLevelLoadPromise = Promise.resolve();
        showMenuPage("home");
        const noticeText = document.createElement("span");
        noticeText.textContent = menuText().cleared;
        noticeText.addEventListener("animationend", () => noticeText.remove(), { once: true });
        document.getElementById("homeNotice").replaceChildren(noticeText);
      }).finally(() => { menuActionPending = null; updateMenuControls(); });
      updateMenuControls();
      return menuActionPending;
    }

    function openExitConfirmation() {
      if (menuPage !== null || gameplayPaused || isPageInactive() || exitConfirmationActive || !gameplayStarted || handVisible || gameOver || roomCompleted) return;
      updateCameraTimer();
      if (gameOver) return;
      hidePuzzleHint({ immediate: true });
      clearLevelTimeout(clueDismissTimer); clueDismissTimer = null;
      exitConfirmationActive = true;
      pauseLevelActivity();
      clueIntro.classList.remove("hint-mode", "dismiss");
      clueIntro.classList.add("exit-mode", "show");
      clueIntro.setAttribute("aria-hidden", "false");
      clueIntro.setAttribute("role", "dialog"); clueIntro.setAttribute("aria-modal", "true");
      clueIntro.setAttribute("aria-labelledby", "exitConfirmTitle");
      document.getElementById("exitConfirmContent").hidden = false;
      viewport.classList.add("hint-active", "hint-transition", "exit-confirm-active");
      updateMenuCopy(); updateCameraControls();
      document.getElementById("exitStayButton").focus();
    }

    function stayInLevel() {
      if (!exitConfirmationActive || isPageInactive()) return;
      exitConfirmationActive = false;
      clueIntro.classList.remove("show");
      clueIntro.setAttribute("aria-hidden", "true");
      clueIntro.removeAttribute("role"); clueIntro.removeAttribute("aria-modal"); clueIntro.removeAttribute("aria-labelledby");
      viewport.classList.remove("hint-active", "exit-confirm-active");
      resumeLevelActivity({ gesture: true });
      levelTimeout(() => {
        if (exitConfirmationActive || hintActive) return;
        clueIntro.classList.remove("exit-mode");
        document.getElementById("exitConfirmContent").hidden = true;
        viewport.classList.remove("hint-transition");
      }, CONFIG.puzzles.hintFadeMs * 2);
      if (resumePlayback.hidden) nextRoomButton.focus();
    }

    function handleMenuKeys(event) {
      if (event.key !== "Escape" || event.defaultPrevented || event.isComposing) return;
      if (exitConfirmationActive) { event.preventDefault(); event.stopImmediatePropagation(); stayInLevel(); }
      else if (["settings", "story", "how"].includes(menuPage)) { event.preventDefault(); event.stopImmediatePropagation(); panHomeTo("home"); }
      else if (menuPage === null && gameplayStarted && !keyboardAction("Escape")) { event.preventDefault(); event.stopImmediatePropagation(); openExitConfirmation(); }
    }

    homePoster.addEventListener("load", syncHomePoster);
    homePoster.addEventListener("error", () => { homePoster.hidden = true; finishHomePan(); });
    homePoster.addEventListener("transitionend", event => {
      if (event.propertyName === "transform" || event.propertyName === "-webkit-transform") finishHomePan();
    });
    menuShell.addEventListener("pointerdown", startMenuSwipe);
    window.addEventListener("pointerup", finishMenuSwipe, true);
    window.addEventListener("pointercancel", finishMenuSwipe, true);
    menuShell.addEventListener("click", event => {
      if (!suppressMenuClick || event.detail === 0) return;
      suppressMenuClick = false;
      event.preventDefault();
      event.stopImmediatePropagation();
    }, true);
    document.getElementById("homeStartButton").addEventListener("click", () => panHomeTo("home"));
    document.getElementById("homeBackButton").addEventListener("click", () => panHomeTo("intro"));
    document.getElementById("homePlayButton").addEventListener("click", beginHomePlay);
    document.getElementById("homeSettingsButton").addEventListener("click", () => panHomeTo("settings"));
    document.getElementById("homeStoryButton").addEventListener("click", () => panHomeTo("story"));
    document.getElementById("homeHowButton").addEventListener("click", () => panHomeTo("how"));
    document.getElementById("homeClearButton").addEventListener("click", clearDataFromHome);
    menuShell.querySelectorAll(".menu-back:not(#homeBackButton)").forEach(button => button.addEventListener("click", () => panHomeTo("home")));
    menuShell.querySelectorAll("[data-language]").forEach(button => button.addEventListener("click", () => selectMenuLanguage(button.dataset.language)));
    document.getElementById("exitStayButton").addEventListener("click", stayInLevel);
    document.getElementById("exitLeaveButton").addEventListener("click", returnToHome);
    document.getElementById("paperHomeButton").addEventListener("click", returnToHome);
    document.getElementById("endHomeButton").addEventListener("click", event => { event.stopPropagation(); returnToHome(); });
    window.addEventListener("keydown", handleMenuKeys, true);

    async function initializeGame(importedFiles = null) {
      if (gameInitializationStarted) return currentLevelLoadPromise;
      await homeBootPromise;
      if (location.protocol === "file:") {
        localFolderImport = importedFiles || localFolderImport || restoreLocalFiles();
        if (!localFolderImport) {
          showLocalFolderPrompt();
          return false;
        }
        localFileControls.hidden = false;
      }
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      if (importedFiles) await loadGameConfig();
      applyLanguagePreference();
      refreshConfigBindings();
      if (location.protocol === "file:" && !selectLocalLanguage(localFolderImport, CONFIG.language.code)) {
        showLocalFolderPrompt(`Choose the game folder containing ${puzzlesFileFor()} and ${wordsFileFor()} for the selected language.`);
        return false;
      }
      gameInitializationStarted = true;
      // Separate language profiles preserve English retries when switching to Arabic.
      PROGRESS_STORAGE_KEY = PROGRESS_STORAGE_BASE_KEY + (isArabic() ? ":ar" : "");
      progressSaveHandle = null;
      progressWriteGeneration++;
      await initializeProgress();
      progressInitializedLanguage = CONFIG.language.code;
      levelBaseURL = new URL(LEVELS_DIRECTORY.replace(/\/?$/, "/"), document.baseURI);
      cluePaper.src = CONFIG.assets.paperFile;
      handImage.src = CONFIG.assets.handFile;
      loadSpiderAssets();
      currentLevelLoadPromise = prepareCurrentLevel();
      await currentLevelLoadPromise;
    }

    async function prepareCurrentLevel() {
      levelType = resumedLevel ? { name: resumedLevel.levelType, ...resumedLevel.rules } : chooseLevelType();
      if (resumedLevel && levelType.name === "puzzle") {
        // Apply the requested flying-letter setting to unfinished regular
        // riddles too, retaining their rooms, riddle and saved time limit.
        levelType.flyingLetters = CONFIG.levels.puzzle.flyingLetters;
        resumedLevel.rules.flyingLetters = levelType.flyingLetters;
      }
      levelRoomCount = resumedLevel?.rules.roomCount || (isSingleRoomLevel() ? 1 : CONFIG.rooms.count);
      ROOM_TIME_LIMIT_MS = levelType.timeLimitMs;
      cameraRemainingSeconds = ROOM_TIME_LIMIT_MS / 1000;
      batterySlotsRemaining = BATTERY_SLOT_COUNT;
      configureGamePresentation();
      resizeGameViewport();
      const roomLoad = loadRandomLevel();
      revealWhenMediaReady();
      updateBatteryUI();
      updateCameraTimer();
      if (isPuzzleLevel()) return roomLoad; // The puzzle answer determines room count before scenes are chosen.
      let wordLoad;
      if (resumedLevel && !resumedLevel.legacy) acceptWordList(resumedLevel.words.join("\n"), "save.txt", "text/plain", { preserveOrder: true });
      else if (resumedLevel?.legacy && resumedLevel.words.length >= levelType.wordCount && resumedLevel.words.every(word => word.length > 0 && word.length <= levelRoomCount)) acceptWordList(resumedLevel.words.join("\n"), "save.txt", "text/plain", { preserveOrder: true });
      else if (localFolderImport) acceptWordList(localFolderImport.wordsText, localFolderImport.wordsSource);
      else wordLoad = loadWords();
      await Promise.allSettled([roomLoad, wordLoad]);
    }
    syncVisibleViewport();
    showMenuPage("intro");
    homeBootPromise = bootstrapHome().catch(error => { console.warn("Using default home settings.", error); updateMenuCopy(); });
  </script>
</body>
</html>
