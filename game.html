        if (ready && !gameOver && !roomCompleted && cameraStartedAt !== null) await seekJumpscareStandbyFrame(0, room);
      } finally { clip.classList.remove("priming"); }
    }

    // Keep desktop audio in the native media player. Routing file:// media
    // through Web Audio can produce CORS silence even when video playback works.
    // Touch devices use gain zero to unlock sound without an audible warm-up.
    function unlockJumpscareAudio(room) {
      const clip = room.scare;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const needsAudioGraph = location.protocol !== "file:" && window.matchMedia("(pointer: coarse)").matches;
      if (!needsAudioGraph || !AudioContextClass) { clip.volume = 0; return Promise.resolve(); }
      if (!jumpscareAudioContext) jumpscareAudioContext = new AudioContextClass();
      if (!room.audioSource) {
        room.audioGain = jumpscareAudioContext.createGain();
        room.audioGain.gain.value = 0;
        room.audioSource = jumpscareAudioContext.createMediaElementSource(clip);
        room.audioSource.connect(room.audioGain);
        room.audioGain.connect(jumpscareAudioContext.destination);
      }
      room.audioGain.gain.setValueAtTime(0, jumpscareAudioContext.currentTime);
      syncActiveScare(room);
      return jumpscareAudioContext.resume().then(() => {
        if (jumpscareAudioContext.state !== "running") throw new Error("Jumpscare audio is not ready.");
      });
    }

    // Restore an interrupted audio context on the next real interaction too.
    window.addEventListener("pointerup", event => {

    function prepareJumpscarePlayback({ unlockAudio = false } = {}, room = levelRooms[activeRoomIndex]) {
      const jumpscareVideo = room.scare;
      if (room.scareReady && (!unlockAudio || room.audioUnlocked)) return Promise.resolve();
      if (room.preparing) return room.preparing;
      const audioReady = unlockAudio ? unlockJumpscareAudio(room) : Promise.resolve();
      jumpscareVideo.classList.add("priming");
      // Unlock the same video from READY. Desktop uses volume zero during
      // warm-up; mobile uses its gain node, since system volume is user-owned.
      const audibleWarmup = unlockAudio;
      jumpscareVideo.muted = !audibleWarmup;
      if (audibleWarmup) jumpscareVideo.defaultMuted = false;
      let frameRequest = null;
      let frameFallback = null;
      let frameFallbackTimer = null;
      let cleanupBuffer = () => {};
      let cleanupFrameError = () => {};

      const buffered = new Promise((resolve, reject) => {
        const check = () => {
          if (jumpscareVideo.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) resolve();
        };
        const failed = () => reject(new Error("Could not load jumpscare.mp4"));
        const events = ["canplaythrough", "canplay", "loadeddata", "progress"];
        events.forEach(type => jumpscareVideo.addEventListener(type, check));
        jumpscareVideo.addEventListener("error", failed);
        cleanupBuffer = () => {
          events.forEach(type => jumpscareVideo.removeEventListener(type, check));
          jumpscareVideo.removeEventListener("error", failed);
        };
        check();
      });
      const decoded = new Promise((resolve, reject) => {
        const failed = () => reject(new Error("Could not decode jumpscare.mp4"));
        jumpscareVideo.addEventListener("error", failed);
        cleanupFrameError = () => jumpscareVideo.removeEventListener("error", failed);
        if (typeof jumpscareVideo.requestVideoFrameCallback === "function") {
          frameRequest = jumpscareVideo.requestVideoFrameCallback(resolve);
          // Some mobile compositors suspend frame callbacks beneath the
          // loader. A decoded current frame is still safe to rewind/cache;
          // the separate buffer and play promises must also finish first.
          const checkDecoded = () => {
            if (jumpscareVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) resolve();
            else frameFallbackTimer = window.setTimeout(checkDecoded, CONFIG.loading.decodedFramePollMs);
          };

        } else {
          frameFallback = () => requestAnimationFrame(() => requestAnimationFrame(resolve));
          jumpscareVideo.addEventListener("playing", frameFallback, { once: true });
        }
      });

      // Call play synchronously: a READY click can supply the required user
      // gesture on browsers that block the initial silent warm-up attempt.
      const playPromise = jumpscareVideo.play();
      const prepare = (async () => {
        try {
          await Promise.all([playPromise, buffered, decoded, audioReady]);
          jumpscareVideo.pause();
          if (jumpscareVideo.currentTime > 0) {
            await new Promise((resolve, reject) => {
              const cleanup = () => {
                jumpscareVideo.removeEventListener("seeked", done);
                jumpscareVideo.removeEventListener("error", failed);
              };
              const done = () => { cleanup(); resolve(); };
              const failed = () => { cleanup(); reject(new Error("Could not prepare jumpscare.mp4")); };
              jumpscareVideo.addEventListener("seeked", done, { once: true });
              jumpscareVideo.addEventListener("error", failed, { once: true });

          jumpscareVideo.volume = 1;
          jumpscareVideo.muted = false;
          jumpscareVideo.classList.remove("priming");
        }

        room.preparing = null;

    const PROGRESS_STORAGE_BASE_KEY = `room-word-hunt/progress/v1:${new URL(".", document.baseURI).href}`;

    function emptyProgress() {

    }

    function validateProgress(value) {
      if (!value || ![1, 2, 3, 4].includes(value.version) || value.game !== "room-word-hunt" ||
          !Number.isSafeInteger(value.completedRooms) || value.completedRooms < 0 || value.completedRooms > 1000000000) throw new Error("Invalid save.txt format.");
      if (value.updatedAt !== null && (typeof value.updatedAt !== "string" || !Number.isFinite(Date.parse(value.updatedAt)))) throw new Error("Invalid save date.");
      const language = value.version >= 3 ? value.language : "en";

      const clean = { version: 4, game: "room-word-hunt", language, completedRooms: value.completedRooms, currentLevel: null, updatedAt: value.updatedAt };
      if (value.currentLevel === null) return clean;
      const level = value.currentLevel;
      if (!level || level.roomNumber !== value.completedRooms + 1 || !Object.prototype.hasOwnProperty.call(CONFIG_DEFAULTS.levels, level.levelType) ||
          !Array.isArray(level.words) || level.words.length < 1 || level.words.length > 20 ||
          !level.words.every(word => validSavedWord(word, language)) ||
          new Set(level.words).size !== level.words.length) throw new Error("Invalid unfinished level in save.txt.");
      if (isPuzzleType(level.levelType) && value.version < 4) throw new Error("Invalid saved puzzle version.");
      const fallback = CONFIG.levels[level.levelType], rules = {};
      for (const key of ["timeLimitMs", "decoyLetterChance", "flyingLetters", "evadesCamera"]) {
        const v = level.rules?.[key] === undefined ? fallback[key] : level.rules[key];
        if (!configValueIsValid(`levels.${level.levelType}.${key}`, v, CONFIG_DEFAULTS.levels[level.levelType][key])) throw new Error(`Invalid saved level rule: ${key}`);
        rules[key] = v;
      }
      if (value.version === 1) {
        if (!Number.isSafeInteger(level.sceneNumber) || level.sceneNumber < 1) throw new Error("Invalid saved scene.");
        rules.wordCount = fallback.wordCount; rules.roomCount = CONFIG.rooms.count;
        clean.currentLevel = { roomNumber: level.roomNumber, sceneNumbers: [level.sceneNumber], activeRoomIndex: 0,
          levelType: level.levelType, words: [...level.words], letterRooms: [], rules, legacy: true };
        return clean;
      }
      const count = level.rules?.roomCount;
      if (!configValueIsValid("rooms.count", count, CONFIG_DEFAULTS.rooms.count) ||
          !Array.isArray(level.sceneNumbers) || level.sceneNumbers.length !== count ||
          !level.sceneNumbers.every(number => Number.isSafeInteger(number) && number > 0) || new Set(level.sceneNumbers).size !== count ||
          !Number.isInteger(level.activeRoomIndex) || level.activeRoomIndex < 0 || level.activeRoomIndex >= count ||
          level.words.some(word => word.length < 1 || word.length > count) ||
          !Array.isArray(level.letterRooms) || level.letterRooms.length !== level.words.length ||
          !level.letterRooms.every((order, wordIndex) => Array.isArray(order) && order.length === level.words[wordIndex].length && new Set(order).size === order.length && order.every(index => Number.isInteger(index) && index >= 0 && index < count))) throw new Error("Invalid room layout in save.txt.");
      rules.roomCount = count; rules.wordCount = level.words.length;
      clean.currentLevel = { roomNumber: level.roomNumber, sceneNumbers: [...level.sceneNumbers], activeRoomIndex: level.activeRoomIndex,
        levelType: level.levelType, words: [...level.words], letterRooms: level.letterRooms.map(order => [...order]), rules };
      if (isPuzzleType(level.levelType)) {
        if (value.version < 4 || level.words.length !== 1 || !level.puzzle ||
            typeof level.puzzle.prompt !== "string" || !level.puzzle.prompt.trim() || level.puzzle.prompt.length > 2048 ||
            level.puzzle.answer !== level.words[0] || parsePuzzleList(`${level.puzzle.prompt} [${level.puzzle.answer}]`, "", language).length !== 1) {

    function parseProgress(text) {

    function progressTime(state) { return Date.parse(state.updatedAt) || 0; }

    function savedBrowserProgress() {
      let newest = null;

          if (candidate.language !== CONFIG.language.code) continue;
          if (!newest || progressTime(candidate) > progressTime(newest)) newest = candidate;
        } catch (error) { console.info("Could not read saved browser progress.", error.message); }
      }
      return newest;
    }

    function saveProgress() {
      const text = JSON.stringify(progressState, null, 2);

    function rememberCurrentRoom() {
      if (roomCompleted || gameOver || !roomsReady || !wordsReadyForClue || progressState.currentLevel && !progressState.currentLevel.legacy) return;
      progressState.currentLevel = { roomNumber: currentRoomNumber, sceneNumbers: levelRooms.map(room => room.scene.number),
        activeRoomIndex, levelType: levelType.name, words: [...words], letterRooms: wordLetterRooms.map(order => [...order]), rules: {
          wordCount: words.length, roomCount: levelRoomCount, timeLimitMs: ROOM_TIME_LIMIT_MS, decoyLetterChance: levelType.decoyLetterChance,
          flyingLetters: Boolean(levelType.flyingLetters), evadesCamera: Boolean(levelType.evadesCamera)

    // IndexedDB can remember an explicitly chosen writable save file. Never
    // request permission during startup or during horror/gameplay events.
    function saveHandleStore(mode, value) {
      return new Promise(resolve => {
        let settled = false;
        const finish = result => { if (!settled) { settled = true; clearTimeout(timer); resolve(result); } };
        const timer = setTimeout(() => finish(null), CONFIG.loading.saveHandleTimeoutMs);
        try {
          const open = indexedDB.open("room-word-hunt-save-handles", 1);
          open.onupgradeneeded = () => { if (!open.result.objectStoreNames.contains("files")) open.result.createObjectStore("files"); };
          open.onerror = open.onblocked = () => finish(null);
          open.onsuccess = () => {
            const db = open.result;
            if (settled) { db.close(); return; }
            let tx, request;
            try {
              tx = db.transaction("files", mode === "put" ? "readwrite" : "readonly");
              const store = tx.objectStore("files");
              request = mode === "put" ? store.put(value, PROGRESS_STORAGE_KEY) : store.get(PROGRESS_STORAGE_KEY);
            } catch { db.close(); finish(null); return; }
            let result = null;
            request.onsuccess = () => { result = mode === "put" ? true : request.result || null; };
            tx.oncomplete = () => { db.close(); finish(result); };
            tx.onerror = tx.onabort = () => { db.close(); finish(null); };
          };
        } catch { finish(null); }
      });
    }

    async function initializeProgress() {
      let selected = savedBrowserProgress();
      const consider = text => {
        try {
          const candidate = parseProgress(text);
          if (candidate.language !== CONFIG.language.code) return;
          if (!selected || progressTime(candidate) > progressTime(selected)) selected = candidate;
        } catch (error) { console.info("Ignoring unavailable/invalid save.txt.", error.message); }
      };
      if (localFolderImport) {
        if (typeof localFolderImport.saveText === "string") consider(localFolderImport.saveText);
      } else {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), CONFIG.loading.saveTimeoutMs);
        try {
          const response = await fetch(new URL(CONFIG.assets.saveFile, document.baseURI), { cache: "no-store", signal: controller.signal });
          if (response.ok) consider(await response.text());
        } catch (error) { console.info("No readable save.txt; using browser progress.", error.message); }
        finally { clearTimeout(timer); }
      }
      if ("showSaveFilePicker" in window) {
        const handle = await saveHandleStore("get");
        try {
          if (handle?.kind === "file" && await handle.queryPermission({ mode: "readwrite" }) === "granted") {
            progressSaveHandle = handle;
            consider(await (await handle.getFile()).text());
          }
        } catch (error) { console.info("Save file access needs to be renewed.", error.message); }
      }
      progressState = selected || emptyProgress();
      resumedLevel = progressState.currentLevel;
      currentRoomNumber = progressState.completedRooms + 1;
      if (!resumedLevel?.legacy) saveProgress();
    }

    function queueSaveFile(text) {
      if (!progressSaveHandle) return progressWriteQueue;
      const handle = progressSaveHandle;

        try {

          try { await writable.write(text); await writable.close(); }
          catch (error) { if (writable.abort) await writable.abort().catch(() => {}); throw error; }
          progressMessage = "save.txt updated";
        } catch (error) {

          console.warn("Could not update save.txt.", error.message);

    function updateProgressStatus() {

    function downloadProgress() {

    async function exportProgress(event) {

          }

            types: [{ description: "Game progress", accept: { "text/plain": [".txt"] } }] });

    });

    async function initializeGame(importedFiles = null) {

          showLocalFolderPrompt();
          return;
        }
        localFileControls.hidden = false;
      }
      gameInitializationStarted = true;
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      await loadGameConfig();
      refreshConfigBindings();
      // Separate language profiles preserve English retries when switching to Arabic.
      PROGRESS_STORAGE_KEY = PROGRESS_STORAGE_BASE_KEY + (isArabic() ? ":ar" : "");
      await initializeProgress();
      levelType = resumedLevel ? { name: resumedLevel.levelType, ...resumedLevel.rules } : chooseLevelType();
      levelRoomCount = resumedLevel?.rules.roomCount || CONFIG.rooms.count;
      ROOM_TIME_LIMIT_MS = levelType.timeLimitMs;
      cameraRemainingSeconds = ROOM_TIME_LIMIT_MS / 1000;
      batterySlotsRemaining = BATTERY_SLOT_COUNT;
      levelBaseURL = new URL(LEVELS_DIRECTORY.replace(/\/?$/, "/"), document.baseURI);
      configureGamePresentation();
      cluePaper.src = CONFIG.assets.paperFile;
      handImage.src = CONFIG.assets.handFile;
      resizeGameViewport();
      loadSpiderAssets();
      loadRandomLevel();
      revealWhenMediaReady();
      updateBatteryUI();
      updateCameraTimer();
      if (isPuzzleLevel()) return; // The puzzle answer determines room count before scenes are chosen.
      if (resumedLevel && !resumedLevel.legacy) acceptWordList(resumedLevel.words.join("\n"), "save.txt", "text/plain", { preserveOrder: true });
      else if (resumedLevel?.legacy && resumedLevel.words.length >= levelType.wordCount && resumedLevel.words.every(word => word.length > 0 && word.length <= levelRoomCount)) acceptWordList(resumedLevel.words.join("\n"), "save.txt", "text/plain", { preserveOrder: true });
      else if (localFolderImport) acceptWordList(localFolderImport.wordsText, localFolderImport.wordsSource);
      else loadWords();
    }
    initializeGame();
  </script>
</body>
</html>
