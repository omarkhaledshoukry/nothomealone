      viewport.style.setProperty("--ui-font-size", `${Math.min(CONFIG.ui.maxFontPx, Math.max(CONFIG.ui.minFontPx, height * CONFIG.ui.fontHeightFraction), width * CONFIG.ui.fontWidthFraction)}px`);
      viewport.style.setProperty("--battery-width", `${Math.min(CONFIG.ui.batteryMaxWidthPx, Math.max(CONFIG.ui.batteryMinWidthPx, height * CONFIG.ui.batteryHeightFraction), width * CONFIG.ui.batteryWidthFraction)}px`);
      hud.style.top = `${status.getBoundingClientRect().bottom - viewport.getBoundingClientRect().top + CONFIG.ui.wordTopGapPx}px`;
      fitHudWord();
      const band = getSafeLetterBand();
      const baseSize = Math.min(CONFIG.letters.maxFontPx, Math.max(CONFIG.letters.minFontPx, height * CONFIG.letters.fontHeightFraction), Math.max(4, (band.bottom - band.top - 30) / 1.5));
      viewport.style.setProperty("--letter-base-size", `${baseSize}px`);
    }

    function updateLimits() {
      fitCameraText();
      const dimensions = getRoomDimensions();
      if (!dimensions.width || !dimensions.height) return;
      stopCameraMomentum();

      // Use the actual CSS-pixel dimensions, including fractional desktop
      // widths, so the scene, random letter positions and snap edges agree.
      const { width, height } = viewport.getBoundingClientRect();
      renderedVideoWidth = dimensions.width * (height / dimensions.height);
      minOffset = Math.min(0, width - renderedVideoWidth);

      const cover = levelRooms[activeRoomIndex]?.videoCover;
      if (cover) {
        cover.style.width = `${renderedVideoWidth}px`;
        cover.style.height = `${height}px`;
      }
      letterWorld.style.width = `${renderedVideoWidth}px`;
      letterWorld.style.height = `${height}px`;
      anomalyWorld.style.width = `${renderedVideoWidth}px`;
      anomalyWorld.style.height = `${height}px`;
      spiderWorld.style.width = `${renderedVideoWidth}px`;
      spiderWorld.style.height = `${height}px`;
      // Keep full-canvas overlays registered even if a PNG uses a different
      // aspect ratio from the original room video.
      jumpscareVideo.style.width = `${renderedVideoWidth}px`;
      jumpscareVideo.style.height = `${height}px`;
      if (anomalyActive && anomalyRoomIndex === activeRoomIndex && anomalyMeta) {
        anomalyWorldBox = getScaledAnomalyBox(anomalyMeta);
        setOverlayImageStyles(anomalyImage, anomalyBitmap, { height: `${height}px`, width: `${renderedVideoWidth}px` });
      }

      // Preserve the freely dragged camera position when the frame resizes.
      offsetX = clamp(offsetX, minOffset, 0);
      applyWorldOffset(false);
      if (spiderActive && spiderRoomIndex === activeRoomIndex) layoutSpider();
    }

    function buildSnapPoints() {
      // These points retain the original opening view only; manual camera
      // movement uses continuous dragging instead of snapping between them.
      const step = Math.max(1, viewport.getBoundingClientRect().width);
      const totalTravel = Math.abs(minOffset);
      const points = [0];
      for (let x = step; x < totalTravel; x += step) points.push(-x);
      if (minOffset < 0 && Math.abs(points[points.length - 1] - minOffset) > 1) points.push(minOffset);
      snapPoints = points;
    }

    function nearestSnapIndex(value) {
      let best = 0;
      let distance = Infinity;
      snapPoints.forEach((point, index) => {
        const d = Math.abs(point - value);
        if (d < distance) { distance = d; best = index; }
      });
      return best;
    }

    function applyWorldOffset(animate = false, observeDecoys = false) {
      const cameraMoved = Math.abs(offsetX - lastAppliedWorldOffset) > .01;
      lastAppliedWorldOffset = offsetX;
      roomImage.classList.toggle("snapping", animate);
      video.classList.toggle("snapping", animate);
      const videoCover = levelRooms[activeRoomIndex]?.videoCover;
      videoCover?.classList.toggle("snapping", animate);
      letterWorld.classList.toggle("snapping", animate);
      anomalyWorld.classList.toggle("snapping", animate);
      spiderWorld.classList.toggle("snapping", animate);
      jumpscareVideo.classList.toggle("snapping", animate);
      const transform = `translateX(${offsetX}px)`;
      roomImage.style.transform = transform;
      video.style.transform = transform;
      if (videoCover) videoCover.style.transform = transform;
      letterWorld.style.transform = transform;
      anomalyWorld.style.transform = transform;
      spiderWorld.style.transform = transform;
      jumpscareVideo.style.transform = transform;
      // Only actual camera gestures/coasting can fix a decoy. Resizing and
      // layout updates also reposition the world, but do not count as looking away.
      if (observeDecoys) {
        updateDecoyVisibilityState({ allowCorrection: cameraMoved });
        updateSpiderVisibilityState();
      }
    }

    function startWord(index) {
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      window.clearTimeout(wordAdvanceTimer);
      wordAdvanceTimer = null;
      wordTransitionPending = false;
      wordIndex = index % words.length;
      currentWord = words[wordIndex];
      selectedCount = 0;
      selectionHistory = [];
      updateLevelStatus();
      createHudWord();
      createScatteredLetters();
      updateCameraControls();
    }

    function createHudWord() {
      wordDisplay.replaceChildren();
      wordDisplay.lang = CONFIG.language.code;
      wordDisplay.dir = isArabic() ? "rtl" : "ltr";
      if (isArabic()) {
        const prefix = document.createElement("span"), remaining = document.createElement("span");
        prefix.className = "arabic-hud-prefix";
        remaining.className = "arabic-hud-remaining";
        wordDisplay.append(prefix, remaining);
        renderArabicHud();
        fitHudWord();
        return;
      }
      [...currentWord].forEach((letter, index) => {
        const slot = document.createElement("span");
        slot.className = "hud-letter";
        slot.dataset.index = index;
        slot.textContent = "·";
        wordDisplay.appendChild(slot);
      });
      fitHudWord();
    }

    function renderArabicHud(count = selectedCount) {
      // One text node is essential: separate flex letters interrupt Arabic shaping.
      wordDisplay.querySelector(".arabic-hud-prefix").textContent = currentWord.slice(0, count);
      wordDisplay.querySelector(".arabic-hud-remaining").textContent = "·".repeat(Math.max(0, currentWord.length - count));
      wordDisplay.setAttribute("aria-label", `${currentWord.slice(0, count)} ${count}/${currentWord.length}`);
    }

    function arabicHudCaptureTarget(index) {
      const prefix = wordDisplay.querySelector(".arabic-hud-prefix");
      const range = document.createRange();
      range.setStart(prefix.firstChild, index);
      range.setEnd(prefix.firstChild, index + 1);
      const rect = range.getBoundingClientRect();
      return rect.height ? rect : prefix.getBoundingClientRect();
    }

    function fitHudWord() {
      const width = wordDisplay.getBoundingClientRect().width;
      if (isArabic()) {
        const measure = document.createElement("canvas").getContext("2d");
        const maximum = CONFIG.letters.hudMaxFontPx;
        measure.font = `${maximum}px "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", Tahoma, serif`;
        const prefixWidths = Array.from({ length: currentWord.length + 1 }, (_, count) => measure.measureText(currentWord.slice(0, count)).width);
        measure.font = `${maximum}px "Game Arabic", "Noto Naskh Arabic", Tahoma, serif`;
        let widest = 1;
        for (let count = 0; count <= currentWord.length; count++) {
          widest = Math.max(widest, prefixWidths[count] + measure.measureText("·".repeat(currentWord.length - count)).width + CONFIG.letters.hudGapPx * 2);
        }
        wordDisplay.style.setProperty("--hud-letter-size", `${Math.max(CONFIG.letters.hudMinFontPx, Math.min(maximum, maximum * width / widest))}px`);
        return;
      }
      const size = Math.min(CONFIG.letters.hudMaxFontPx, (width - Math.max(0, currentWord.length - 1) * CONFIG.letters.hudGapPx) /
        Math.max(1, currentWord.length * CONFIG.letters.hudGlyphWidthRatio));
      wordDisplay.style.setProperty("--hud-letter-size", `${Math.max(CONFIG.letters.hudMinFontPx, size)}px`);
    }

    function updateCameraControls() {
      const blocked = !gameplayStarted || handVisible || gameOver || roomCompleted || !roomsReady;
      snapButton.disabled = blocked || hintActive || wordTransitionPending || captureInProgress;
      prevRoomButton.disabled = blocked || hintActive || levelRooms.length < 2 || !CONFIG.rooms.wrapNavigation && activeRoomIndex === 0;
      nextRoomButton.disabled = blocked || hintActive || levelRooms.length < 2 || !CONFIG.rooms.wrapNavigation && activeRoomIndex === levelRooms.length - 1;
      if (isPuzzleLevel()) status.setAttribute("aria-disabled", String(blocked));
      prevRoomButton.setAttribute("aria-label", `Previous room. Current room ${activeRoomIndex + 1} of ${levelRoomCount}`);
      nextRoomButton.setAttribute("aria-label", `Next room. Current room ${activeRoomIndex + 1} of ${levelRoomCount}`);
    }

    function updateCameraTimer() {
      if (cameraStartedAt !== null) {
        cameraRemainingSeconds = Math.max(0, Math.ceil(
          (ROOM_TIME_LIMIT_MS - (performance.now() - cameraStartedAt)) / 1000));
      }
      const minutes = String(Math.floor(cameraRemainingSeconds / 60)).padStart(2, "0");
      const seconds = String(cameraRemainingSeconds % 60).padStart(2, "0");
      cameraTimer.textContent = `${minutes}:${seconds}`;
      if (cameraStartedAt !== null && cameraRemainingSeconds > 0 && cameraRemainingSeconds <= CONFIG.loading.deadlineWarmSeconds &&
          !jumpscareDeadlineWarmStarted && !gameOver && !roomCompleted && !document.hidden) {
        levelRooms.forEach(room => warmJumpscareBeforeDeadline(room));
        jumpscareDeadlineWarmStarted = true;
      }
      if (cameraStartedAt !== null && cameraRemainingSeconds === 0 && !gameOver && !roomCompleted) {
        endGame("timeout");
      }
    }

    function startCameraTimer() {
      window.clearInterval(cameraTimerInterval);
      cameraStartedAt = performance.now();
      cameraRemainingSeconds = ROOM_TIME_LIMIT_MS / 1000;
      updateCameraTimer();
      cameraTimerInterval = window.setInterval(updateCameraTimer, CONFIG.camera.timerRefreshMs);
    }

    function stopCameraTimer() {
      cancelJumpscareStandbySeek();
      if (cameraStartedAt !== null) {
        cameraRemainingSeconds = Math.max(0, Math.ceil(
          (ROOM_TIME_LIMIT_MS - (performance.now() - cameraStartedAt)) / 1000));
      }
      cameraStartedAt = null;
      window.clearInterval(cameraTimerInterval);
      cameraTimerInterval = null;
      updateCameraTimer();
    }

    function currentRoomLetterIndex() {
      return anchors.findIndex((anchor, index) => Number(anchor.dataset.roomIndex) === activeRoomIndex && !tiles[index].classList.contains("selected"));
    }

    function isCurrentLetterInFrame(index = currentRoomLetterIndex()) {
      const anchor = anchors[index];
      if (!anchor || anchor.hidden) return false;
      const glyph = anchor.querySelector(".letter-glyph");
      const letterRect = glyph.getBoundingClientRect();
      const frame = viewport.getBoundingClientRect();
      // The whole viewport is the camera frame.
      // Use visible glyph bounds rather than the letter's invisible padding.
      const tolerance = CONFIG.letters.captureTolerancePx;
      return letterRect.width > 0 && letterRect.height > 0 &&
        letterRect.left >= frame.left - tolerance && letterRect.right <= frame.right + tolerance &&
        letterRect.top >= frame.top - tolerance && letterRect.bottom <= frame.bottom + tolerance;
    }

    function chooseLetterGlyph(letter, word) {
      if (!levelIsUnlocked(CONFIG.letters.decoyStartLevel) || !levelType.decoyLetterChance || Math.random() >= levelType.decoyLetterChance) return letter;
      // A decoy must be absent from the entire clue, not just the current slot.
      const alphabet = isArabic() ? "ابتثجحخدذرزسشصضطظعغفقكلمنهويءأإآؤئةى" : "abcdefghijklmnopqrstuvwxyz";
      const candidates = [...alphabet].filter(candidate => !word.includes(candidate));
      return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : letter;
    }

    function correctDecoy(index) {
      const tile = tiles[index];
      if (!tile || tile.dataset.decoy !== "true") return;
      tile.querySelector(".letter-glyph").textContent = tile.dataset.letter;
      tile.setAttribute("aria-label", `Letter ${tile.dataset.letter}`);
      tile.dataset.decoy = "false";
    }

    function updateDecoyVisibilityState({ allowCorrection = false } = {}) {
      if (!gameplayStarted || gameOver || roomCompleted || wordTransitionPending || captureInProgress) return;
      const index = currentRoomLetterIndex(), anchor = anchors[index], tile = tiles[index];
      if (!anchor || anchor.hidden || tile.dataset.decoy !== "true") return;
      if (isCurrentLetterInFrame(index)) { tile.dataset.decoySeen = "true"; return; }
      if (!allowCorrection || tile.dataset.decoySeen !== "true") return;
      const bounds = tile.querySelector(".letter-glyph").getBoundingClientRect(), frame = viewport.getBoundingClientRect();
      if (bounds.right > frame.left && bounds.left < frame.right) return;
      correctDecoy(index);
    }

    function drawShutterBitmap() {
      shutterBitmapFrame = 0;
      if (!shutterBitmapContext) return;
      // A viewport-sized image surface avoids legacy Android's recolouring
      // of button backgrounds, borders and their CSS filter layers. The real
      // button and its animated core still provide layout and native input.
      const frame = cameraOverlay.getBoundingClientRect();
      const ring = snapButton.getBoundingClientRect();
      const core = snapButton.querySelector(".shutter-core").getBoundingClientRect();
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.round(frame.width * scale);
      const height = Math.round(frame.height * scale);
      if (shutterBitmap.width !== width || shutterBitmap.height !== height) {
        shutterBitmap.width = width;
        shutterBitmap.height = height;
      }
      const context = shutterBitmapContext;
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.clearRect(0, 0, frame.width, frame.height);
      context.strokeStyle = CONFIG.shutter.color;
      context.lineWidth = CONFIG.shutter.ringPx;
      context.beginPath();
      context.arc(ring.left - frame.left + ring.width / 2, ring.top - frame.top + ring.height / 2,
        Math.max(0, Math.min(ring.width, ring.height) / 2 - CONFIG.shutter.ringPx / 2), 0, Math.PI * 2);
      context.stroke();
      context.fillStyle = CONFIG.shutter.color;
      context.beginPath();
      context.arc(core.left - frame.left + core.width / 2, core.top - frame.top + core.height / 2,
        Math.max(0, Math.min(core.width, core.height) / 2), 0, Math.PI * 2);
      context.fill();
      if (performance.now() < shutterBitmapUntil || snapButton.classList.contains("held") || snapButton.classList.contains("snapping")) {
        shutterBitmapFrame = requestAnimationFrame(drawShutterBitmap);
      }
    }

    function refreshShutterBitmap(duration = CONFIG.shutter.bitmapRefreshMs) {
      if (!shutterBitmapContext) return;
      shutterBitmapUntil = Math.max(shutterBitmapUntil, performance.now() + duration);
      if (!shutterBitmapFrame) shutterBitmapFrame = requestAnimationFrame(drawShutterBitmap);
    }

    function snapCamera() {
      if (!gameplayStarted || hintActive || handVisible || gameOver || roomCompleted || wordTransitionPending || captureInProgress) return;
      // Check the real deadline before accepting a photo, even if a browser
      // throttled the interval while the tab was in the background.
      updateCameraTimer();
      if (gameOver) return;
      finishPanGesture();
      stopShutterEffect();
      const letterIsVisible = isCurrentLetterInFrame();
      snapButton.classList.remove("snapping");
      void snapButton.offsetWidth;
      snapButton.classList.add("snapping");
      refreshShutterBitmap();
      window.clearTimeout(shutterAnimationTimer);
      shutterAnimationTimer = window.setTimeout(() => snapButton.classList.remove("snapping"), CONFIG.shutter.classResetMs);

      if (letterIsVisible) {
        const index = currentRoomLetterIndex();
        const tile = tiles[index];
        selectLetter(tile.dataset.letter, index, tile);
      } else drainBatterySlot();
      if (!gameOver) playShutterEffect();
    }

    function updateBatteryUI() {
      batterySlots.forEach((slot, index) => slot.classList.toggle("drained", index >= batterySlotsRemaining));
      batteryPercent.textContent = `${Math.round(batterySlotsRemaining / BATTERY_SLOT_COUNT * 100)}%`;
      cameraBattery.setAttribute("aria-label", `Camera battery: ${batterySlotsRemaining} of ${BATTERY_SLOT_COUNT} slots`);
    }

    function drainBatterySlot(cost = CONFIG.battery.missCost) {
      batterySlotsRemaining = Math.max(0, batterySlotsRemaining - cost);
      updateBatteryUI();
      if (batterySlotsRemaining === 0) endGame("battery");
    }

    function stopShutterEffect() {
      if (shutterSceneAnimation) shutterSceneAnimation.cancel();
      shutterSceneAnimation = null;
    }

    function playShutterEffect() {
      stopShutterEffect();
      // This wrapper is the visible camera window, so zooming stays centred
      // on the current view even after panning to either end of the room.
      const animation = sceneEffects.animate([
        { filter: "blur(0px)", transform: "scale(1)" },
        { filter: `blur(${CONFIG.shutter.blurPx}px)`, transform: `scale(${CONFIG.shutter.zoom})`, offset: CONFIG.shutter.peakFraction },
        { filter: "blur(0px)", transform: "scale(1)" }
      ], { duration: CONFIG.shutter.durationMs, easing: "ease-in-out" });
      shutterSceneAnimation = animation;
      animation.finished.then(() => {
        if (shutterSceneAnimation === animation) shutterSceneAnimation = null;
      }).catch(() => {});
    }

    function finishLetterTransfer({ reveal = true } = {}) {
      window.clearTimeout(captureFinishTimer);
      captureFinishTimer = null;
      if (captureFlightAnimation) captureFlightAnimation.cancel();
      captureFlightAnimation = null;
      captureEffects.replaceChildren();
      captureInProgress = false;
      if (reveal && currentWord) showCurrentLetter();
      updateCameraControls();
    }

    function flyLetterToWord(anchor, hudSlot) {
      const glyph = anchor.querySelector(".letter-glyph");
      const start = glyph.getBoundingClientRect();
      const target = typeof hudSlot.getBoundingClientRect === "function" ? hudSlot.getBoundingClientRect() : hudSlot;
      const frame = viewport.getBoundingClientRect();
      const style = getComputedStyle(glyph);
      const flight = document.createElement("span");
      flight.className = "captured-letter";
      flight.textContent = glyph.textContent;
      flight.style.left = `${start.left + start.width / 2 - frame.left}px`;
      flight.style.top = `${start.top + start.height / 2 - frame.top}px`;
      flight.style.fontFamily = isArabic() ? '"Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", Tahoma, serif' : style.fontFamily;
      flight.style.fontSize = style.fontSize;
      flight.style.letterSpacing = style.letterSpacing;
      flight.style.color = style.color;
      captureEffects.appendChild(flight);

      const dx = target.left + target.width / 2 - start.left - start.width / 2;
      const dy = target.top + target.height / 2 - start.top - start.height / 2;
      const rotation = (parseFloat(anchor.firstElementChild.style.getPropertyValue("--letter-rotation")) || 0) +
        (parseFloat(anchor.firstElementChild.style.getPropertyValue("--butterfly-bank")) || 0);
      captureInProgress = true;
      updateCameraControls();
      const animation = flight.animate([
        { transform: `translate(-50%, -50%) rotate(${rotation}deg) scale(1)`, opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(0deg) scale(${CONFIG.letters.transferEndScale})`, opacity: 0 }
      ], { duration: LETTER_TRANSFER_MS, easing: "cubic-bezier(.3,.65,.35,1)", fill: "forwards" });
      captureFlightAnimation = animation;
      animation.finished.then(() => {
        if (captureFlightAnimation === animation) finishLetterTransfer();
      }).catch(() => {});
      captureFinishTimer = window.setTimeout(() => finishLetterTransfer(), LETTER_TRANSFER_MS + CONFIG.letters.transferFallbackMs);
    }

    function finishShutterGesture() {
      const pointerId = shutterPointerId;
      shutterPointerId = null;
      shutterMoved = false;
      snapButton.classList.remove("held");
      refreshShutterBitmap();
      if (pointerId !== null) {
        try {
          if (snapButton.hasPointerCapture(pointerId)) snapButton.releasePointerCapture(pointerId);
        } catch {}
      }
    }

    snapButton.addEventListener("pointerdown", event => {
      if (snapButton.disabled || event.isPrimary === false || event.button !== 0) return;
      event.stopPropagation();
      finishPanGesture();
      finishShutterGesture();
      shutterPointerId = event.pointerId;
      shutterStartX = event.clientX;
      shutterStartY = event.clientY;
      snapButton.classList.add("held");
      refreshShutterBitmap();
      try { snapButton.setPointerCapture(event.pointerId); } catch {}
    });
    snapButton.addEventListener("pointermove", event => {
      if (event.pointerId !== shutterPointerId) return;
      if (event.pointerType !== "touch" && (event.buttons & 1) === 0) {
        finishShutterGesture();
        return;
      }
      if (Math.hypot(event.clientX - shutterStartX, event.clientY - shutterStartY) > CONFIG.shutter.tapSlopPx) shutterMoved = true;
    });
    snapButton.addEventListener("pointerup", event => {
      if (event.pointerId !== shutterPointerId) return;
      const rect = snapButton.getBoundingClientRect();
      const isTap = !shutterMoved &&
        Math.hypot(event.clientX - shutterStartX, event.clientY - shutterStartY) <= CONFIG.shutter.tapSlopPx &&
        event.clientX >= rect.left && event.clientX <= rect.right &&
        event.clientY >= rect.top && event.clientY <= rect.bottom;
      finishShutterGesture();
      // Mobile browsers may omit the compatibility click after a drag.
      // Capture on release, then ignore that optional click to avoid duplicates.
      if (isTap) snapCamera();
    });
    snapButton.addEventListener("pointercancel", event => {
      if (event.pointerId === shutterPointerId) finishShutterGesture();
    });
    snapButton.addEventListener("lostpointercapture", event => {
      if (event.pointerId === shutterPointerId && !snapButton.hasPointerCapture(event.pointerId)) finishShutterGesture();
    });
    snapButton.addEventListener("click", event => {
      if (event.detail > 0 || event.pointerType) return;
      snapCamera(); // Keyboard and assistive activation still use native click.
    });

    function showCurrentLetter({ animate = true } = {}) {
      anchors.forEach((anchor, index) => {
        const shouldShow = !wordTransitionPending && !captureInProgress &&
          Number(anchor.dataset.roomIndex) === activeRoomIndex && !tiles[index].classList.contains("selected");
        if (!shouldShow) {
          anchor.hidden = true;
          anchor.classList.remove("appearing");
        } else if (anchor.hidden) {
          anchor.hidden = false;
          if (animate) {
            void anchor.offsetWidth;
            anchor.classList.add("appearing");
          }
        }
      });
      updateDecoyVisibilityState();
      if (levelType.flyingLetters && gameplayStarted && !gameOver && !roomCompleted &&
          !wordTransitionPending && !captureInProgress && anchors[currentRoomLetterIndex()] && !anchors[currentRoomLetterIndex()].hidden) startButterflyFlight();
      else stopButterflyFlight();
    }

    function stopButterflyFlight() {
      if (butterflyFlightFrame) cancelAnimationFrame(butterflyFlightFrame);
      butterflyFlightFrame = 0;
      butterflyFlightState = null;
    }

    function startButterflyFlight() {
      const visibleIndex = currentRoomLetterIndex();
      const anchor = anchors[visibleIndex];
      if (!anchor) return;
      if (butterflyFlightState?.anchor === anchor && butterflyFlightFrame) return;
      stopButterflyFlight();
      const tile = tiles[visibleIndex];
      const radius = Number(anchor.dataset.flightRadius) + CONFIG.butterfly.paddingPx;
      const band = getSafeLetterBand();
      const bounds = { left: radius, right: Math.max(radius, renderedVideoWidth - radius),
        top: band.top + radius, bottom: Math.max(band.top + radius, band.bottom - radius) };
      const phase = Math.random() * Math.PI * 2;
      const swayX = CONFIG.butterfly.minSwayXPx + Math.random() * (CONFIG.butterfly.maxSwayXPx - CONFIG.butterfly.minSwayXPx);
      const swayY = CONFIG.butterfly.minSwayYPx + Math.random() * (CONFIG.butterfly.maxSwayYPx - CONFIG.butterfly.minSwayYPx);
      const x = parseFloat(anchor.style.left);
      const y = parseFloat(anchor.style.top);
      const state = { anchor, tile, bounds, phase, swayX, swayY,
        x: x - Math.sin(phase) * swayX, y: y - Math.sin(phase * CONFIG.butterfly.verticalPhaseMultiplier) * swayY,
        vx: 0, vy: 0, goalX: x, goalY: y, elapsed: 0, nextTurn: 0,
        speed: CONFIG.butterfly.minSpeed + Math.random() * (CONFIG.butterfly.maxSpeed - CONFIG.butterfly.minSpeed), lastTime: performance.now() };
      state.escapeDirection = 1;
      state.evadeNextTurn = 0;
      state.evadeGoalY = y;
      state.escapeTurnUntil = 0;
      state.cameraProximity = 0;
      butterflyFlightState = state;
      const step = time => {
        butterflyFlightFrame = 0;
        if (butterflyFlightState !== state || !gameplayStarted || gameOver || roomCompleted ||
            captureInProgress || wordTransitionPending || anchor !== anchors[currentRoomLetterIndex()] || anchor.hidden) {
          stopButterflyFlight();
          return;
        }
        // Capped elapsed steps prevent a leap when a background tab resumes.
        const dt = Math.min(CONFIG.butterfly.maxStepMs / 1000, Math.max(0, (time - state.lastTime) / 1000));
        state.lastTime = time;
        state.elapsed += dt;
        const t = state.elapsed;
        if (t >= state.nextTurn) {
          // Mostly local wandering, with occasional longer exploratory arcs.
          const travel = Math.random() < CONFIG.butterfly.longArcChance ? CONFIG.butterfly.longHorizontalTravelPx : CONFIG.butterfly.horizontalTravelPx;
          state.goalX = clamp(state.x + (Math.random() * 2 - 1) * travel, bounds.left, bounds.right);
          state.goalY = clamp(state.y + (Math.random() * 2 - 1) * CONFIG.butterfly.verticalTravelPx, bounds.top, bounds.bottom);
          state.nextTurn = t + (CONFIG.butterfly.minTurnMs + Math.random() * (CONFIG.butterfly.maxTurnMs - CONFIG.butterfly.minTurnMs)) / 1000;
        }
        let targetX = state.goalX, targetY = state.goalY;
        let intensity = 0;
        if (levelType.evadesCamera) {
          const viewWidth = viewport.getBoundingClientRect().width;
          const center = -offsetX + viewWidth / 2;
          const letterX = parseFloat(anchor.style.left);
          const relative = letterX - center;
          const proximity = clamp(1 - Math.abs(relative) / (viewWidth * CONFIG.butterfly.evadeApproachScreens), 0, 1);
          state.cameraProximity = proximity;
          intensity = proximity * proximity;
          if (t >= state.escapeTurnUntil && Math.abs(relative) > viewWidth * CONFIG.butterfly.evadeDirectionDeadzoneFraction) state.escapeDirection = Math.sign(relative);
          if (state.escapeDirection < 0 && state.x - bounds.left < CONFIG.butterfly.evadeEdgeMarginPx) {
            state.escapeDirection = 1; state.escapeTurnUntil = t + CONFIG.butterfly.evadeBoundaryTurnMs / 1000;
          } else if (state.escapeDirection > 0 && bounds.right - state.x < CONFIG.butterfly.evadeEdgeMarginPx) {
            state.escapeDirection = -1; state.escapeTurnUntil = t + CONFIG.butterfly.evadeBoundaryTurnMs / 1000;
          }
          if (intensity > 0) {
            if (t >= state.evadeNextTurn) {
              state.evadeGoalY = clamp(state.y + (Math.random() * 2 - 1) * CONFIG.butterfly.evadeVerticalTravelPx, bounds.top, bounds.bottom);
              state.evadeNextTurn = t + CONFIG.butterfly.evadeRetargetMs / 1000;
            }
            const escapeX = clamp(state.x + state.escapeDirection * CONFIG.butterfly.evadeTravelPx, bounds.left, bounds.right);
            targetX += (escapeX - targetX) * intensity;
            targetY += (state.evadeGoalY - targetY) * intensity;
          }
        }
        const dx = targetX - state.x, dy = targetY - state.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        // Ease the heading and alternate hovering with short bursts of flight.
        const pace = state.speed * (CONFIG.butterfly.minPaceFraction + (1 - CONFIG.butterfly.minPaceFraction) * Math.pow(.5 + .5 * Math.sin(t * CONFIG.butterfly.hoverFrequency + phase), 2)) * Math.min(1, distance / CONFIG.butterfly.slowdownDistancePx) * (1 + intensity * (CONFIG.butterfly.evadeMaxSpeedMultiplier - 1));
        const steering = 1 - Math.exp(-dt * CONFIG.butterfly.steering * (1 + intensity * (CONFIG.butterfly.evadeSteeringMultiplier - 1)));
        state.vx += (dx / distance * pace * CONFIG.butterfly.horizontalSpeedMultiplier - state.vx) * steering;
        state.vy += (dy / distance * pace - state.vy) * steering;
        state.x += state.vx * dt;
        state.y += state.vy * dt;
        // Unequal oscillation frequencies make little loops instead of a
        // straight bounce; a restrained 3D tilt suggests fluttering wings.
        const swayBoost = 1 + intensity * (CONFIG.butterfly.evadeSwayMultiplier - 1);
        const flightX = clamp(state.x + Math.sin(t * CONFIG.butterfly.swayXFrequency + phase) * swayX * swayBoost, bounds.left, bounds.right);
        const flightY = clamp(state.y + Math.sin(t * CONFIG.butterfly.swayYFrequency + phase * CONFIG.butterfly.verticalPhaseMultiplier) * swayY * swayBoost, bounds.top, bounds.bottom);
        anchor.style.left = `${flightX}px`;
        anchor.style.top = `${flightY}px`;
        anchor.dataset.worldX = (flightX - bounds.left) / Math.max(1, bounds.right - bounds.left);
        anchor.dataset.worldY = (flightY - bounds.top) / Math.max(1, bounds.bottom - bounds.top);
        tile.style.setProperty("--butterfly-bank", `${clamp(state.vx * CONFIG.butterfly.bankVelocityMultiplier + Math.sin(t * CONFIG.butterfly.swayXFrequency + phase) * CONFIG.butterfly.bankSwayDeg, -CONFIG.butterfly.maxBankDeg, CONFIG.butterfly.maxBankDeg)}deg`);
        tile.style.setProperty("--butterfly-flutter", `${Math.sin(t * CONFIG.butterfly.flutterFrequency * (1 + intensity * (CONFIG.butterfly.evadeFlutterMultiplier - 1)) + phase) * CONFIG.butterfly.flutterDeg}deg`);
        updateDecoyVisibilityState();
        butterflyFlightFrame = requestAnimationFrame(step);
      };
      butterflyFlightFrame = requestAnimationFrame(step);
    }

    function createScatteredLetters() {
      stopButterflyFlight();
      letterWorld.replaceChildren();
      tiles = [];
      anchors = [];

      [...currentWord].forEach((letter, index) => {
        const anchor = document.createElement("div");
        anchor.className = "letter-anchor";
        anchor.hidden = true;
        anchor.dataset.roomIndex = wordLetterRooms[wordIndex][index];
        // Independent uniform coordinates, retained across viewport changes.
        // Y is a fraction of the safe band between the camera UI rows.
        anchor.dataset.worldX = Math.random();
        anchor.dataset.worldY = Math.random();

        const tile = document.createElement("span");
        tile.className = "letter-tile";
        if (levelType.flyingLetters) tile.classList.add("butterfly-letter");
        tile.dataset.index = index;
        tile.dataset.letter = letter;
        tile.style.setProperty("--letter-scale", CONFIG.letters.minScale + Math.random() * (CONFIG.letters.maxScale - CONFIG.letters.minScale));
        tile.style.setProperty("--letter-rotation", `${CONFIG.letters.minRotationDeg + Math.random() * (CONFIG.letters.maxRotationDeg - CONFIG.letters.minRotationDeg)}deg`);
        const modes = CONFIG.letters.vibrationByWord;
        const mode = modes[Math.min(wordIndex, modes.length - 1)];
        if (mode === "all" || mode === "first" && index === 0) {
          tile.classList.add("first-letter");
          for (let step = 1; step <= 3; step++) {
            tile.style.setProperty(`--jitter-x${step}`, `${Math.random() * CONFIG.letters.vibrationPx * 2 - CONFIG.letters.vibrationPx}px`);
            tile.style.setProperty(`--jitter-y${step}`, `${Math.random() * CONFIG.letters.vibrationPx * 2 - CONFIG.letters.vibrationPx}px`);
          }
        }
        const glyph = document.createElement("span");
        glyph.className = "letter-glyph";
        glyph.textContent = chooseLetterGlyph(letter, currentWord);
        tile.dataset.decoy = String(glyph.textContent !== letter);
        tile.dataset.decoySeen = "false";
        tile.setAttribute("aria-label", `Letter ${glyph.textContent}`);
        tile.appendChild(glyph);

        anchor.appendChild(tile);
        letterWorld.appendChild(anchor);
        tiles.push(tile);
        anchors.push(anchor);
      });
      relayoutScatteredLetters();
      showCurrentLetter();
    }

    function getSafeLetterBand() {
      const frame = viewport.getBoundingClientRect();
      const top = Math.max(status.getBoundingClientRect().bottom, cameraBattery.getBoundingClientRect().bottom,
        hud.getBoundingClientRect().bottom, cameraTimer.getBoundingClientRect().bottom) - frame.top;
      const bottom = Math.min(snapButton.getBoundingClientRect().top,
        prevRoomButton.getBoundingClientRect().top, nextRoomButton.getBoundingClientRect().top) - frame.top;
      return { top, bottom };
    }

    function relayoutScatteredLetters() {
      const band = getSafeLetterBand();
      const frame = viewport.getBoundingClientRect();
      const worldWidth = renderedVideoWidth || frame.width;
      anchors.forEach((anchor, index) => {
        const wasHidden = anchor.hidden;
        anchor.hidden = false;
        const glyph = anchor.querySelector(".letter-glyph");
        let footprint = glyph.getBoundingClientRect();
        if (levelType.flyingLetters) {
          const radius = Math.hypot(glyph.offsetWidth, glyph.offsetHeight) / 2 + CONFIG.butterfly.radiusPaddingPx;
          anchor.dataset.flightRadius = radius;
          footprint = { width: radius * 2, height: radius * 2 };
        }
        if (tiles[index].dataset.decoy === "true") {
          // Reserve room for both glyphs so correcting it offscreen cannot
          // move the fixed anchor or push the real letter beneath the UI.
          const decoy = glyph.textContent;
          glyph.textContent = tiles[index].dataset.letter;
          const correct = glyph.getBoundingClientRect();
          if (levelType.flyingLetters) {
            const radius = Math.max(Number(anchor.dataset.flightRadius), Math.hypot(glyph.offsetWidth, glyph.offsetHeight) / 2 + CONFIG.butterfly.radiusPaddingPx);
            anchor.dataset.flightRadius = radius;
            footprint = { width: radius * 2, height: radius * 2 };
          } else footprint = { width: Math.max(footprint.width, correct.width), height: Math.max(footprint.height, correct.height) };
          glyph.textContent = decoy;
        }
        anchor.hidden = wasHidden;
        // Include rotation, the first letter's small vibration, and a margin
        // so the complete glyph remains clear of both UI rows and room edges.
        const padding = levelType.flyingLetters ? CONFIG.butterfly.paddingPx : tiles[index].classList.contains("first-letter") ? Math.max(CONFIG.letters.firstPaddingPx, CONFIG.letters.vibrationPx) : CONFIG.letters.paddingPx;
        const minX = footprint.width / 2 + padding;
        const maxX = Math.max(minX, worldWidth - minX);
        const minY = band.top + footprint.height / 2 + padding;
        const maxY = Math.max(minY, band.bottom - footprint.height / 2 - padding);
        anchor.style.left = `${minX + Number(anchor.dataset.worldX) * (maxX - minX)}px`;
        anchor.style.top = `${minY + Number(anchor.dataset.worldY) * (maxY - minY)}px`;
      });
    }

    function selectLetter(letter, tileIndex, tile) {
      if (!gameplayStarted || handVisible || gameOver || roomCompleted || wordTransitionPending || captureInProgress) return;
      updateCameraTimer();
      if (gameOver) return;
      if (tile !== tiles[tileIndex] || anchors[tileIndex].hidden || tile.classList.contains("selected")) return;
      const localAnomaly = anomalyActive && anomalyRoomIndex === activeRoomIndex;
      if (localAnomaly || tile.dataset.decoy === "true") {
        endGame(localAnomaly ? "anomaly" : "decoy");
        return;
      }
      const expectedLetter = currentWord[selectedCount];
      if (letter !== expectedLetter) {
        drainBatterySlot();
        return;
      }

      let hudSlot;
      if (isArabic()) {
        renderArabicHud(selectedCount + 1);
        hudSlot = arabicHudCaptureTarget(selectedCount);
      } else hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
      flyLetterToWord(anchors[tileIndex], hudSlot);
      tile.classList.add("selected");
      const anchor = anchors[tileIndex];
      anchor.classList.add("collected");

      selectionHistory.push(tileIndex);
      if (!isArabic()) {
        hudSlot.textContent = expectedLetter.toUpperCase();
        hudSlot.classList.add("found");
      }
      selectedCount++;

      if (selectedCount === currentWord.length) completeWord();
      showCurrentLetter();
    }

    function undoLastLetter() {
      if (!gameplayStarted || handVisible || gameOver || roomCompleted || wordTransitionPending) return;
      if (selectedCount <= 0 || !selectionHistory.length) return;
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      selectedCount--;

      const tileIndex = selectionHistory.pop();
      const tile = tiles[tileIndex];
      const anchor = anchors[tileIndex];
      anchor.classList.remove("collected");
      tile.classList.remove("selected");

      if (isArabic()) renderArabicHud();
      else {
        const hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
        hudSlot.textContent = "·";
        hudSlot.classList.remove("found");
      }
      showCurrentLetter();
    }

    function completeWord() {
      if (wordTransitionPending || gameOver || roomCompleted) return;
      wordTransitionPending = true;
      updateCameraControls();
      completedWordCount++;
      // Correct words use power, but only missed photos can spend the last slot.
      const cost = Math.min(CONFIG.battery.wordCost, Math.max(0, batterySlotsRemaining - CONFIG.battery.wordReserve));
      if (cost) drainBatterySlot(cost);
      if (gameOver) return;
      if (completedWordCount >= words.length) {
        roomCompleted = true;
        hidePuzzleHint({ immediate: true });
        recordRoomCompletion();
        stopCameraTimer();
        video.pause();
        video.muted = true;
        window.clearTimeout(anomalyTimer);
        window.clearTimeout(handTimer);
        stopSpiderEncounter();
      }
      if (!roomCompleted && CONFIG.anomaly.enabled && !anomalyEnabled && completedWordCount >= anomalyWordThreshold()) {
        anomalyEnabled = true;
        scheduleAnomalyCheck();
      }
      if (!roomCompleted && !spiderActive && spiderTimer === null) scheduleSpiderCheck();
      updateLevelStatus();
      message.classList.remove("show");
      refreshMessageBitmap();
      void message.offsetWidth;
      message.classList.add("show");
      wordAdvanceTimer = window.setTimeout(() => {
        if (gameOver) return;
        if (roomCompleted) {
          document.getElementById("gameOverTitle").textContent = CONFIG.text.roomComplete;
          document.getElementById("retryText").textContent = CONFIG.text.playAgain;
          gameOverScreen.setAttribute("aria-label", `${CONFIG.text.roomComplete}. ${CONFIG.text.playAgain}.`);
          gameOverScreen.classList.add("show");
          return;
        }
        startWord(wordIndex + 1);
      }, CONFIG.letters.wordTransitionMs);
    }

    function stopCameraMomentum() {
      if (cameraMomentumFrame) cancelAnimationFrame(cameraMomentumFrame);
      cameraMomentumFrame = 0;
    }

    function recordPanMotion(clientX, time) {
      const previous = panMotionSamples[panMotionSamples.length - 1];
      if (!previous || clientX === previous.x) return;
      const delta = clientX - previous.x;
      const direction = Math.sign(delta);
      if (direction !== panMotionDirection) {
        // A reversal starts a new velocity estimate, including at an edge.
        panMotionSamples = [previous];
        panMotionDirection = direction;
        panDirectionTravel = 0;
      }
      panDirectionTravel += Math.abs(delta);
      panMotionSamples.push({ x: clientX, time });
      while (panMotionSamples.length > 2 &&
             panMotionSamples[0].time < time - CAMERA_VELOCITY_WINDOW_MS) {
        panMotionSamples.shift();
      }
    }

    function getPanReleaseVelocity(time) {
      if (panMotionSamples.length < 2) return 0;
      const first = panMotionSamples[0];
      const last = panMotionSamples[panMotionSamples.length - 1];
      const freshness = clamp(1 - (time - last.time) / CAMERA_VELOCITY_WINDOW_MS, 0, 1);
      return (last.x - first.x) * CAMERA_DRAG_GAIN /
        Math.max(16, last.time - first.time) * freshness;
    }

    function startCameraMomentum(velocity, travel) {
      stopCameraMomentum();
      if (!gameplayStarted || isDragging || handVisible || gameOver || roomCompleted || document.hidden) return;
      if (Math.abs(velocity) < CAMERA_MOMENTUM_MIN_SPEED) return;

      const width = viewport.getBoundingClientRect().width;
      const strongFlick = Math.abs(velocity) >= CAMERA_FLICK_SPEED &&
        travel >= Math.max(CONFIG.camera.flickMinTravelPx, width * CONFIG.camera.flickViewportFraction);
      const direction = Math.sign(velocity);
      // A deliberate, fast flick reaches the corresponding edge. Smaller
      // gestures coast a limited distance with the same slowing-down feel.
      const coastDistance = Math.min(Math.abs(velocity) * CONFIG.camera.coastVelocityMultiplier,
        travel * CAMERA_DRAG_GAIN * CONFIG.camera.coastTravelMultiplier, width * CONFIG.camera.coastViewportFraction);
      const target = strongFlick ? (direction < 0 ? minOffset : 0) :
        clamp(offsetX + direction * coastDistance, minOffset, 0);
      const origin = offsetX;
      const distance = Math.abs(target - origin);
      if (distance < 0.5) return;

      const duration = clamp(CONFIG.camera.momentumDurationMultiplier * distance / Math.abs(velocity), CONFIG.camera.momentumMinMs, CONFIG.camera.momentumMaxMs);
      const started = performance.now();
      const step = time => {
        if (isDragging || handVisible || gameOver || document.hidden) {
          stopCameraMomentum();
          return;
        }
        const progress = clamp((time - started) / duration, 0, 1);
        const eased = 1 - Math.pow(1 - progress, CONFIG.camera.momentumEasePower);
        offsetX = clamp(origin + (target - origin) * eased, minOffset, 0);
        if (progress === 1) offsetX = target;
        applyWorldOffset(false, true);
        updateAnomalyVisibilityState();
        cameraMomentumFrame = progress < 1 ? requestAnimationFrame(step) : 0;
      };
      cameraMomentumFrame = requestAnimationFrame(step);
    }

    function finishPanGesture() {
      stopCameraMomentum();
      const pointerId = panPointerId;
      const wasPanning = isDragging;
      // Clear ownership before releasing capture, since that release can
      // itself fire lostpointercapture.
      isDragging = false;
      panPointerId = null;
      panMotionSamples = [];
      panMotionDirection = 0;
      panDirectionTravel = 0;
      movedDuringDrag = false;
      body.classList.remove("grabbing");
      if (pointerId !== null) {
        try {
          if (viewport.hasPointerCapture(pointerId)) viewport.releasePointerCapture(pointerId);
        } catch {}
      }
      if (wasPanning) {
        offsetX = clamp(offsetX, minOffset, 0);
        applyWorldOffset(false);
        updateAnomalyVisibilityState();
      }
    }

    function pointerDown(event) {
      // The clue card and its READY button own their own pointer events.
      if (!gameplayStarted || hintActive || handVisible || gameOver || roomCompleted) return;
      if (event.isPrimary === false) return;
      if (event.button !== undefined && event.button !== 0) return;
      // The shutter keeps its native click/tap. Never capture its press as
      // a camera drag, including when a previous flick is still coasting.
      if (event.target.closest?.("button, [role='button']")) {
        finishPanGesture();
        return;
      }

      // A fresh press always starts a fresh gesture, even if an earlier
      // release happened outside the browser and was never delivered.
      finishPanGesture();
      stopShutterEffect();
      isDragging = true;
      panPointerId = event.pointerId;
      dragStartClientX = event.clientX;
      lastPanClientX = event.clientX;
      // Input timestamps keep touch velocity independent of render delays.
      panMotionSamples = [{ x: event.clientX, time: event.timeStamp }];
      body.classList.add("grabbing");
      applyWorldOffset(false);
      try { viewport.setPointerCapture(event.pointerId); } catch {}
    }

    function pointerMove(event) {
      if (!isDragging || event.pointerId !== panPointerId) return;
      // Recover immediately when the mouse returns after an outside release.
      if (event.pointerType !== "touch" && (event.buttons & 1) === 0) {
        finishPanGesture();
        return;
      }

      recordPanMotion(event.clientX, event.timeStamp);
      const dragDistance = event.clientX - dragStartClientX;
      if (!movedDuringDrag) {
        if (Math.abs(dragDistance) <= CONFIG.camera.dragThresholdPx) return;
        try { viewport.setPointerCapture(event.pointerId); } catch {}
        movedDuringDrag = true;
      }

      // Consume each movement even at the room's edge. Reversing direction
      // then moves immediately instead of having to undo an overshoot first.
      const deltaX = event.clientX - lastPanClientX;
      lastPanClientX = event.clientX;
      offsetX = clamp(offsetX + deltaX * CAMERA_DRAG_GAIN, minOffset, 0);
      applyWorldOffset(false, true);
      updateAnomalyVisibilityState();
    }

    function pointerUp(event) {
      if (!isDragging || event.pointerId !== panPointerId) return;

      const released = event.timeStamp;
      recordPanMotion(event.clientX, released);
      const velocity = movedDuringDrag ? getPanReleaseVelocity(released) : 0;
      const travel = panDirectionTravel;
      if (movedDuringDrag) {
        offsetX = clamp(offsetX + (event.clientX - lastPanClientX) * CAMERA_DRAG_GAIN, minOffset, 0);
        applyWorldOffset(false, true);
      }
      // Release pointer ownership before starting the independent glide, so
      // the next press can immediately stop it and start a fresh drag.
      finishPanGesture();
      startCameraMomentum(velocity, travel);
    }

    function pointerCancel(event) {
      if (!isDragging || event.pointerId !== panPointerId) return;
      finishPanGesture();
    }

    async function loadSpiderAssets() {
      if (!CONFIG.spider.enabled) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (/^https?:$/.test(location.protocol) && AudioContextClass) {
        // Fetch now, decode after READY has unlocked an audio context. Buffer
        // playback avoids reopening a cold media player when the spider moves.
        spiderSoundDataPromise = fetch(SPIDER_SOUND_FILE).then(response => {
          if (!response.ok) throw new Error("Spider sound is unavailable.");
          return response.arrayBuffer();
        }).catch(() => null);
      } else {
        // Browsers block fetch(file://); native local audio still works.
        spiderNativeAudio = new Audio(SPIDER_SOUND_FILE);
        spiderNativeAudio.preload = "auto";
      }
      try {
        spiderFrames = await Promise.all(SPIDER_FRAME_FILES.map(src => new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => image.naturalWidth ? resolve(image) : reject(new Error("Invalid spider image."));
          image.onerror = reject;
          image.src = src;
        })));
        spiderMeta = await readAlphaBounds(SPIDER_FRAME_FILES[0]);
        spiderAssetsReady = Boolean(spiderMeta?.bbox);
      } catch (error) {
        // Optional encounters must not stop rooms loading when assets are absent.
        console.warn("Spider images are unavailable; spider encounters are disabled.");
      }
    }

    function unlockSpiderSound() {
      if (!CONFIG.spider.enabled) return;
      if (spiderSoundReady || spiderSoundPreparing) return;
      if (spiderNativeAudio) {
        spiderNativeAudio.volume = 0;
        spiderNativeAudio.muted = false;
        const played = spiderNativeAudio.play();
        spiderSoundPreparing = Promise.resolve(played).then(() => {
          spiderNativeAudio.pause();
          spiderNativeAudio.currentTime = 0;
          spiderNativeAudio.volume = CONFIG.spider.volume;
          spiderSoundReady = true;
        }).catch(() => {}).finally(() => { spiderSoundPreparing = null; });
        return;
      }
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      try {
        if (!spiderAudioContext) spiderAudioContext = jumpscareAudioContext || new AudioContextClass();
        // resume() must happen synchronously inside READY's trusted handler.
        const resumed = spiderAudioContext.resume();
        const decoded = spiderSoundDataPromise.then(bytes => {
          if (!bytes) throw new Error("Spider sound is unavailable.");
          return new Promise((resolve, reject) => spiderAudioContext.decodeAudioData(bytes.slice(0), resolve, reject));
        }).then(buffer => {
          spiderAudioBuffer = buffer;
          // The supplied WAV begins with silence. Skip that lead-in at playback
          // so the audible effect begins with the upward movement, keeping the file intact.
          const channels = Array.from({ length: buffer.numberOfChannels }, (_, i) => buffer.getChannelData(i));
          let first = 0;
          while (first < buffer.length && !channels.some(channel => Math.abs(channel[first]) > CONFIG.spider.silenceThreshold)) first++;
          spiderSoundOffset = CONFIG.spider.skipLeadingSilence && first < buffer.length ? Math.max(0, (first - CONFIG.spider.soundPreRollSamples) / buffer.sampleRate) : 0;
        });
        spiderSoundPreparing = Promise.all([resumed, decoded]).then(() => {
          spiderSoundReady = true;
        }).catch(() => {}).finally(() => { spiderSoundPreparing = null; });
      } catch (error) { /* Keep the rest of the game available without optional audio. */ }
    }

    function resumeSpiderSound() {
      if (spiderAudioContext && spiderAudioContext.state === "suspended") {
        const resumed = spiderAudioContext.resume();
        if (resumed) resumed.catch(() => {});
      }
    }

    function stopSpiderSound() {
      if (spiderAudioSource) {
        try { spiderAudioSource.stop(); } catch (error) {}
        spiderAudioSource.disconnect();
        spiderAudioSource = null;
      }
      if (spiderNativeAudio) spiderNativeAudio.pause();
    }

    function playSpiderSound() {
      stopSpiderSound();
      if (spiderAudioBuffer && spiderAudioContext) {
        resumeSpiderSound();
        const source = spiderAudioContext.createBufferSource();
        source.buffer = spiderAudioBuffer;
        const gain = spiderAudioContext.createGain();
        gain.gain.value = CONFIG.spider.volume;
        source.connect(gain);
        gain.connect(spiderAudioContext.destination);
        source.onended = () => {
          source.disconnect();
          gain.disconnect();
          if (spiderAudioSource === source) spiderAudioSource = null;
        };
        spiderAudioSource = source;
        source.start(0, spiderSoundOffset);
      } else if (spiderNativeAudio && spiderSoundReady) {
        spiderNativeAudio.currentTime = 0;
        const played = spiderNativeAudio.play();
        if (played) played.catch(() => {});
      }
    }

    function drawSpiderFrame(index) {
      spiderFrameIndex = index;
      const frame = spiderFrames[index];
      if (!frame) return;
      if (!spiderCanvasContext) {
        spiderCanvas.style.display = "none";
        spiderImage.style.display = "block";
        spiderImage.src = frame.src;
        return;
      }
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.ceil(spiderMeta.width * SPIDER_SCALE * ratio);
      const height = Math.ceil(spiderMeta.height * SPIDER_SCALE * ratio);
      if (spiderCanvas.width !== width || spiderCanvas.height !== height) {
        spiderCanvas.width = width;
        spiderCanvas.height = height;
      }
      spiderCanvasContext.clearRect(0, 0, width, height);
      spiderCanvasContext.drawImage(frame, 0, 0, width, height);
    }

    function layoutSpider() {
      if (!spiderMeta) return;
      const width = spiderMeta.width * SPIDER_SCALE;
      spiderWorldX = spiderWorldFraction * Math.max(0, renderedVideoWidth - width);
      spiderActor.style.left = `${spiderWorldX}px`;
      spiderActor.style.top = `${SPIDER_TOP}px`;
      spiderActor.style.width = `${width}px`;
      spiderActor.style.height = `${spiderMeta.height * SPIDER_SCALE}px`;
      spiderLastViewOffset = offsetX;
      drawSpiderFrame(spiderFrameIndex);
    }

    function scheduleSpiderCheck() {
      window.clearTimeout(spiderTimer);
      spiderTimer = null;
      if (!CONFIG.spider.enabled || !levelIsUnlocked(CONFIG.spider.startLevel) || completedWordCount < CONFIG.spider.afterWords || !gameplayStarted || gameOver || roomCompleted || spiderActive) return;
      spiderTimer = window.setTimeout(() => {
        spiderTimer = null;
        if (!CONFIG.spider.enabled || !levelIsUnlocked(CONFIG.spider.startLevel) || completedWordCount < CONFIG.spider.afterWords || !gameplayStarted || gameOver || roomCompleted || spiderActive) return;
        if (Math.random() < SPIDER_SPAWN_CHANCE && spawnSpiderOffscreen()) return;
        scheduleSpiderCheck();
      }, SPIDER_CHECK_MS);
    }

    function spawnSpiderOffscreen() {
      if (!CONFIG.spider.enabled || !levelIsUnlocked(CONFIG.spider.startLevel) || !gameplayStarted || gameOver || roomCompleted || spiderActive || !spiderAssetsReady || !spiderSoundReady) return false;
      const width = spiderMeta.width * SPIDER_SCALE;
      const visible = currentVisibleWorldRange();
      const ranges = [];
      const lastX = renderedVideoWidth - width;
      if (visible.left - CONFIG.spider.offscreenMarginPx - width >= 0) ranges.push([0, Math.min(lastX, visible.left - CONFIG.spider.offscreenMarginPx - width)]);
      if (visible.right + CONFIG.spider.offscreenMarginPx <= lastX) ranges.push([visible.right + CONFIG.spider.offscreenMarginPx, lastX]);
      if (!ranges.length) return false;
      const range = ranges[Math.floor(Math.random() * ranges.length)];
      const x = range[0] + Math.random() * (range[1] - range[0]);
      spiderWorldFraction = x / Math.max(1, lastX);
      spiderActive = true;
      spiderRoomIndex = activeRoomIndex;
      spiderWorld.style.display = "";
      spiderRetreating = false;
      spiderFrameIndex = 0;
      spiderActor.style.transform = "translateY(0px)";
      layoutSpider();
      spiderActor.hidden = false;
      return true;
    }

    function updateSpiderVisibilityState() {
      if (!spiderActive || spiderRoomIndex !== activeRoomIndex || spiderRetreating || gameOver || roomCompleted) return;
      const moved = Math.abs(offsetX - spiderLastViewOffset) > .01;
      spiderLastViewOffset = offsetX;
      if (!moved) return;
      const visible = currentVisibleWorldRange();
      const left = spiderWorldX + spiderMeta.bbox.left * SPIDER_SCALE;
      const right = spiderWorldX + spiderMeta.bbox.right * SPIDER_SCALE;
      const overlap = Math.max(0, Math.min(right, visible.right) - Math.max(left, visible.left));
      if (overlap / (right - left) >= SPIDER_REVEAL_FRACTION) startSpiderRetreat();
    }

    function startSpiderRetreat() {
      if (!spiderActive || spiderRetreating || gameOver || roomCompleted) return;
      spiderRetreating = true;
      playSpiderSound();
      const started = performance.now();
      const distance = spiderMeta.height * SPIDER_SCALE + CONFIG.spider.retreatExtraPx;
      const step = time => {
        spiderRetreatFrame = 0;
        if (!spiderActive || gameOver || roomCompleted) return;
        const elapsed = time - started;
        const progress = clamp(elapsed / SPIDER_RETREAT_MS, 0, 1);
        const index = Math.floor(elapsed / SPIDER_FRAME_MS) % spiderFrames.length;
        if (index !== spiderFrameIndex) drawSpiderFrame(index);
        spiderActor.style.transform = `translateY(${-distance * progress * progress}px)`;
        if (progress < 1) spiderRetreatFrame = requestAnimationFrame(step);
        else {
          spiderActive = false;
          spiderRetreating = false;
          spiderActor.hidden = true;
          scheduleSpiderCheck();
        }
      };
      spiderRetreatFrame = requestAnimationFrame(step);
    }

    function stopSpiderEncounter() {
      window.clearTimeout(spiderTimer);
      spiderTimer = null;
      if (spiderRetreatFrame) cancelAnimationFrame(spiderRetreatFrame);
      spiderRetreatFrame = 0;
      spiderActive = false;
      spiderRetreating = false;
      spiderActor.hidden = true;
      stopSpiderSound();
    }

    function scheduleAnomalyCheck() {
      window.clearTimeout(anomalyTimer);
      anomalyTimer = null;
      if (!CONFIG.anomaly.enabled || !levelIsUnlocked(CONFIG.anomaly.startLevel) || !anomalyEnabled || anomalyActive || gameOver || roomCompleted) return;
      anomalyTimer = window.setTimeout(async () => {
        anomalyTimer = null;
        if (!CONFIG.anomaly.enabled || !levelIsUnlocked(CONFIG.anomaly.startLevel) || !anomalyEnabled || anomalyActive || gameOver || roomCompleted) return;
        if (Math.random() < ANOMALY_SPAWN_CHANCE) {
          const placed = await spawnAnomalyOffscreen();
          if (!placed) scheduleAnomalyCheck();
        } else {
          scheduleAnomalyCheck();
        }
      }, ANOMALY_CHECK_MS);
    }

    async function readAlphaBounds(src) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
            for (let y = 0; y < canvas.height; y++) {
              for (let x = 0; x < canvas.width; x++) {
                if (data[(y * canvas.width + x) * 4 + 3] > CONFIG.anomaly.alphaThreshold) {
                  if (x < minX) minX = x;
                  if (x > maxX) maxX = x;
                  if (y < minY) minY = y;
                  if (y > maxY) maxY = y;
                }
              }
            }
            resolve({
              src, width: img.naturalWidth, height: img.naturalHeight,
              bbox: maxX >= minX ? { left: minX, top: minY, right: maxX + 1, bottom: maxY + 1 } : null
            });
          } catch (error) {
            console.warn("Could not inspect anomaly alpha bounds; using full image bounds.", error);
            resolve({ src, width: img.naturalWidth, height: img.naturalHeight, bbox: { left: 0, top: 0, right: img.naturalWidth, bottom: img.naturalHeight } });
          }
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function currentVisibleWorldRange() {
      const left = -offsetX;
      return { left, right: left + viewport.getBoundingClientRect().width };
    }

    function getScaledAnomalyBox(meta) {
      const scaleX = renderedVideoWidth / meta.width;
      const scaleY = viewport.getBoundingClientRect().height / meta.height;
      return {
        left: meta.bbox.left * scaleX,
        right: meta.bbox.right * scaleX,
        top: meta.bbox.top * scaleY,
        bottom: meta.bbox.bottom * scaleY
      };
    }

    function horizontalBoxesIntersect(a, b) {
      return a.left < b.right && a.right > b.left;
    }

    async function spawnAnomalyOffscreen() {
      if (!CONFIG.anomaly.enabled || !levelIsUnlocked(CONFIG.anomaly.startLevel) || anomalyActive || gameOver || roomCompleted || !renderedVideoWidth) return false;
      const spawnRoomIndex = activeRoomIndex;
      const src = ANOMALY_FILES[Math.floor(Math.random() * ANOMALY_FILES.length)];
      const meta = await readAlphaBounds(src);
      if (!meta || !meta.bbox || !levelIsUnlocked(CONFIG.anomaly.startLevel) || gameOver || roomCompleted || spawnRoomIndex !== activeRoomIndex) return false;

      // The anomaly PNG is authored against the same full 1280x720 scene as
      // the video. Keep the PNG fixed at the scene origin so its opaque pixels
      // always land at their authored location; only the panorama itself pans.
      const bbox = getScaledAnomalyBox(meta);

      // Spawn only while the anomaly's ACTUAL non-transparent pixels are fully
      // outside the current viewport. If its authored location is visible now,
      // skip this checkpoint and try again on the next anomaly check.
      const visible = currentVisibleWorldRange();
      const edgePad = CONFIG.anomaly.offscreenMarginPx;
      if (horizontalBoxesIntersect(
        { left: bbox.left, right: bbox.right },
        { left: visible.left - edgePad, right: visible.right + edgePad }
      )) return false;

      anomalyRoomIndex = activeRoomIndex;
      anomalyWorld.style.display = "";
      anomalyMeta = meta;
      anomalyWorldBox = bbox;
      anomalyHasBeenSeen = false;
      anomalyActive = true;
      anomalyImage.src = src;
      setOverlayImageStyles(anomalyImage, anomalyBitmap, { left: "0px", top: "0px",
        height: `${viewport.getBoundingClientRect().height}px`, width: `${renderedVideoWidth}px`, display: "block" });
      anomalyWorld.style.width = `${renderedVideoWidth}px`;
      anomalyWorld.style.height = `${viewport.getBoundingClientRect().height}px`;
      updateAnomalyVisibilityState();
      return true;
    }

    function updateAnomalyVisibilityState() {
      if (!anomalyActive || anomalyRoomIndex !== activeRoomIndex || !anomalyWorldBox || gameOver) return;
      const visible = currentVisibleWorldRange();
      const intersects = horizontalBoxesIntersect(anomalyWorldBox, visible);
      if (intersects) {
        anomalyHasBeenSeen = true;
      } else if (anomalyHasBeenSeen) {
        removeAnomalyAndRestartTimer();
      }
    }

    function removeAnomalyAndRestartTimer() {
      anomalyActive = false;
      anomalyHasBeenSeen = false;
      anomalyMeta = null;
      anomalyWorldBox = null;
      setOverlayImageStyles(anomalyImage, anomalyBitmap, { display: "none" });
      anomalyImage.removeAttribute("src");
      if (!gameOver) scheduleAnomalyCheck();
    }

    function endGame(reason = "other") {
      if (gameOver || roomCompleted) return;
      const chance = (CONFIG.failures[reason] || CONFIG.failures.other).jumpscareChance || 0;
      if (chance >= 1 || chance > 0 && Math.random() < chance) triggerJumpscare(reason);
      else if (beginGameOver(reason)) showGameOver();
    }

    function beginGameOver(reason) {
      if (gameOver || roomCompleted) return false;
      gameOver = true;
      hidePuzzleHint({ immediate: true });
      gameOverReason = Object.prototype.hasOwnProperty.call(CONFIG.failures, reason) ? reason : "other";
      stopButterflyFlight();
      stopSpiderEncounter();
      updateCameraControls();
      stopCameraTimer();
      window.clearTimeout(wordAdvanceTimer);
      window.clearTimeout(anomalyTimer);
      window.clearTimeout(handTimer);
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      // Stop competing room-video decoding once the full-screen scare owns playback.
      const room = levelRooms[activeRoomIndex];
      if (room) { room.videoRun++; room.videoFrameCancel?.(); }
      video.pause();
      video.muted = true;
      // The same cleanup applies when no video is selected by the failure roll.
      handVisible = false;
      handBlocker.className = "";
      handBlocker.setAttribute("aria-hidden", "true");
      viewport.classList.remove("hand-active");
      return true;
    }

    function triggerJumpscare(reason = "other") {
      if (!beginGameOver(reason)) return;

      // jumpscare.mp4 is 1280x720, the same authored canvas as room.mp4.
      // Put it into that exact panorama coordinate space at the CURRENT camera
      // position first, so the first visible frame perfectly overlays the room.
      const previousOffset = offsetX;
      roomImage.classList.remove("snapping");
      video.classList.remove("snapping");
      letterWorld.classList.remove("snapping");
      anomalyWorld.classList.remove("snapping");
      jumpscareVideo.classList.remove("snapping");
      jumpscareVideo.style.transform = `translateX(${previousOffset}px)`;
      // The first frame is already decoded and parked at time zero. Avoid a
      // redundant seek here, which can delay the first visible scare frame.
      jumpscareVideo.style.display = "block";
      jumpscareVideo.classList.remove("priming");
      jumpscareVideo.classList.add("playing");
      jumpscareVideo.muted = false;
      if (jumpscareAudioGain) {
        jumpscareAudioGain.gain.setValueAtTime(1, jumpscareAudioContext.currentTime);
        resumeJumpscareAudio();
      }

      let movementStarted = false;
      const flyToCentre = () => {
        if (movementStarted || !jumpscareVideo.classList.contains("playing")) return;
        movementStarted = true;
        requestAnimationFrame(() => {
          if (!jumpscareVideo.classList.contains("playing")) return;
          offsetX = minOffset / 2;
          applyWorldOffset(true);
        });
      };
      // Show and start playback at the player's current view. Begin the
      // camera flight only after the video presents its first playing frame.
      void jumpscareVideo.offsetWidth;
      if (typeof jumpscareVideo.requestVideoFrameCallback === "function") {
        jumpscareFrameRequest = jumpscareVideo.requestVideoFrameCallback(() => {
          jumpscareFrameRequest = null;
          flyToCentre();
        });
      } else jumpscareVideo.addEventListener("playing", flyToCentre, { once: true });
      const playPromise = jumpscareVideo.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(error => {
          if (error.name === "NotAllowedError") {
            jumpscareVideo.muted = true;
            const retry = jumpscareVideo.play();
            if (retry) retry.catch(showGameOver);
          } else showGameOver();
        });
      }
    }

    function showGameOver() {
      stopButterflyFlight();
      stopSpiderEncounter();
      stopCameraTimer();
      snapButton.disabled = true;
      if (jumpscareFrameRequest !== null) {
        jumpscareVideo.cancelVideoFrameCallback?.(jumpscareFrameRequest);
        jumpscareFrameRequest = null;
      }
      jumpscareVideo.pause();
      if (jumpscareAudioGain) jumpscareAudioGain.gain.setValueAtTime(0, jumpscareAudioContext.currentTime);
      jumpscareVideo.classList.remove("playing");
      jumpscareVideo.style.display = "none";
      if (!roomCompleted) {
        const failure = CONFIG.failures[gameOverReason] || CONFIG.failures.other;
        document.getElementById("gameOverTitle").textContent = failure.title;
        document.getElementById("retryText").textContent = CONFIG.text.retry;
        gameOverScreen.setAttribute("aria-label", `${failure.title}. ${CONFIG.text.retry}.`);
      }
      gameOverScreen.classList.add("show");
    }



    gameOverScreen.addEventListener("pointerup", retryOrContinue);
    gameOverScreen.addEventListener("keydown", retryOrContinue);

    function scheduleNextHandCheck() {
      window.clearTimeout(handTimer);
      handTimer = null;
      if (!CONFIG.hand.enabled || !levelIsUnlocked(CONFIG.hand.startLevel) || gameOver || roomCompleted) return;
      const delay = CONFIG.hand.minCheckMs + Math.random() * (CONFIG.hand.maxCheckMs - CONFIG.hand.minCheckMs);
      handTimer = window.setTimeout(() => {
        handTimer = null;
        if (!levelIsUnlocked(CONFIG.hand.startLevel)) return;
        if (!handVisible && Math.random() < CONFIG.hand.spawnChance) {
          showHand();
        } else {
          scheduleNextHandCheck();
        }
      }, delay);
    }

    function showHand() {
      if (!CONFIG.hand.enabled || !levelIsUnlocked(CONFIG.hand.startLevel) || handVisible || gameOver || roomCompleted) return;
      handVisible = true;
      updateCameraControls();
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer();
      stopShutterEffect();
      viewport.classList.add("hand-active");
      handBlocker.className = "active entering";
      handBlocker.setAttribute("aria-hidden", "false");

      // Ensure the animation restarts cleanly every time.
      void handImage.offsetWidth;
      window.setTimeout(() => {
        if (!handVisible) return;
        handBlocker.className = "active resting";
      }, CONFIG.hand.enterMs);
    }

    function hideHand({ continueFromDrag = false } = {}) {
      if (!handVisible) return;
      viewport.classList.remove("hand-active");
      handPointerId = null;
      handDragStarted = false;

      if (continueFromDrag) {
        // Continue smoothly from the exact dragged position. Do NOT reset the
        // transform to the resting position first, which caused a visible flicker.
        handBlocker.className = "active";
        setOverlayImageStyles(handImage, handBitmap, { transition: `transform ${CONFIG.hand.dragExitMs}ms cubic-bezier(.55,.05,.82,.34)` });
        const exitY = Math.max(viewport.clientHeight * CONFIG.hand.exitViewportMultiplier, handImage.getBoundingClientRect().height * CONFIG.hand.exitImageMultiplier);

        requestAnimationFrame(() => {
          setOverlayImageStyles(handImage, handBitmap, { transform: `translate(-50%, ${exitY}px)` });
        });
      } else {
        handBlocker.className = "active exiting";
      }

      window.setTimeout(() => {
        handVisible = false;
        updateCameraControls();
        handBlocker.className = "";
        handBlocker.setAttribute("aria-hidden", "true");
        setOverlayImageStyles(handImage, handBitmap, { transition: "", transform: "" });
        scheduleNextHandCheck();
      }, CONFIG.hand.exitMs);
    }

    function handPointerDown(event) {
      if (!handVisible || (event.button !== undefined && event.button !== 0)) return;
      event.preventDefault();
      event.stopPropagation();
      handPointerId = event.pointerId;
      handStartY = event.clientY;
      handCurrentY = event.clientY;
      handDragStarted = false;
      handBlocker.classList.add("dragging");
      try { handBlocker.setPointerCapture(event.pointerId); } catch {}
    }

    function handPointerMove(event) {
      if (!handVisible || handPointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      handCurrentY = event.clientY;
      const dy = Math.max(0, handCurrentY - handStartY);
      if (dy > CONFIG.hand.dragThresholdPx) handDragStarted = true;

      // Follow only downward gestures; upward movement does not dismiss it.
      if (dy > 0) {
        const maxDrag = viewport.clientHeight * CONFIG.hand.maxDragFraction;
        const visualDy = Math.min(dy, maxDrag);
        setOverlayImageStyles(handImage, handBitmap, { transform: `translate(-50%, ${visualDy}px)` });
      }
    }

    function handPointerUp(event) {
      if (!handVisible || handPointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      const dy = event.clientY - handStartY;
      const threshold = Math.max(CONFIG.hand.dismissMinPx, viewport.clientHeight * CONFIG.hand.dismissHeightFraction);
      handBlocker.classList.remove("dragging");
      try { handBlocker.releasePointerCapture(event.pointerId); } catch {}
      handPointerId = null;

      if (dy >= threshold) {
        // A committed downward swipe continues from the current drag position
        // directly off-screen without jumping back up first.
        hideHand({ continueFromDrag: true });
      } else {
        setOverlayImageStyles(handImage, handBitmap, { transition: `transform ${CONFIG.hand.resetMs}ms ease-out`, transform: "translate(-50%, 0)" });
        window.setTimeout(() => {
          setOverlayImageStyles(handImage, handBitmap, { transition: "", transform: "" });
        }, CONFIG.hand.resetCleanupMs);
      }
    }

    handBlocker.addEventListener("pointerdown", handPointerDown);
    handBlocker.addEventListener("pointermove", handPointerMove);
    handBlocker.addEventListener("pointerup", handPointerUp);
    handBlocker.addEventListener("pointercancel", handPointerUp);

    function prepareRoomScene() {
      updateLimits();
      buildSnapPoints();
      offsetX = snapPoints[nearestSnapIndex(minOffset / 2)];
      applyWorldOffset(false);
      anomalyWorld.style.width = `${renderedVideoWidth}px`;
      if (currentWord) relayoutScatteredLetters();
      updateAnomalyVisibilityState();
    }



    function resizeGameViewport() {
      viewportLayoutFrame = 0;
      stopButterflyFlight();
      syncVisibleViewport();
      finishShutterGesture();
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      updateLimits();
      // Keep random coordinates, sizes, rotations and collected progress.
      // Refit the same letters between the newly sized camera UI rows.
      if (currentWord) relayoutScatteredLetters();
      fitHudWord();
      showCurrentLetter({ animate: false });
      updateAnomalyVisibilityState();
      refreshShutterBitmap();
      refreshMessageBitmap();
      fitClueList();
    }

    function requestViewportLayout() {
      if (!viewportLayoutFrame) viewportLayoutFrame = requestAnimationFrame(resizeGameViewport);
    }

    window.addEventListener("resize", requestViewportLayout);
    window.visualViewport?.addEventListener("resize", requestViewportLayout);
    window.visualViewport?.addEventListener("scroll", requestViewportLayout);
    // Refit letter bounds after the bundled font replaces the fallback.
    document.fonts?.ready.then(requestViewportLayout);

    window.addEventListener("keydown", event => {
      if (event.key === "Backspace" || event.key === "Back") {
        event.preventDefault();
        undoLastLetter();
      }
    });

    viewport.addEventListener("pointerdown", pointerDown);
    // Observe releases before an overlay can stop their propagation, and
    // clean up interruptions so the very next press can drag normally.
    window.addEventListener("pointermove", pointerMove, true);
    window.addEventListener("pointerup", pointerUp, true);
    window.addEventListener("pointercancel", pointerCancel, true);
    viewport.addEventListener("lostpointercapture", event => {
      // Ignore capture loss from an overlay when the room still owns capture.
      if (event.target === viewport && !viewport.hasPointerCapture(event.pointerId)) pointerCancel(event);
    });
    function interruptCameraInput() {
      hidePuzzleHint({ immediate: true });
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer();
      stopShutterEffect();
    }
    window.addEventListener("blur", interruptCameraInput);
    window.addEventListener("pagehide", interruptCameraInput);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) interruptCameraInput();
      else {
        if (gameplayStarted && !roomCompleted) {
          resumeJumpscareAudio();
          resumeSpiderSound();
        }
        updateCameraTimer();
        for (const room of levelRooms) if (room.preparing && !room.scareReady) {
          const resume = room.scare.play();
          if (resume) resume.catch(() => {});
        }
      }
    });
    viewport.addEventListener("dragstart", event => event.preventDefault());

    function hideLoadingScreen() {
      // Kept for compatibility; the clue intro now controls the reveal.
      maybeShowClueIntro();
    }

    // Try the image first. Only request the room video if the PNG is missing
    // or cannot be decoded; this also works when opening the game locally.
    let roomMediaReady = false;

    function revealWhenMediaReady() {
      if (roomsReady && levelRooms.every(room => room.backdropReady && room.metadataReady && room.warmAttempted) && !gameOver) {
        videosReadyForClue = true;
        maybeShowClueIntro();
      }
    }

    function resumeJumpscareAudio() {
      if (!jumpscareAudioContext || jumpscareAudioContext.state === "running" || jumpscareAudioContext.state === "closed") return;
      const resumed = jumpscareAudioContext.resume();
      if (resumed) resumed.catch(error => console.warn("Could not resume jumpscare audio.", error));
    }

    function cancelJumpscareStandbySeek() {
      for (const room of levelRooms) {
        if (room.standbySeekCancel) room.standbySeekCancel();
        room.scare.classList.remove("priming");
      }
    }

    function seekJumpscareStandbyFrame(time, room) {
      const clip = room.scare;
      return new Promise(resolve => {
        let settled = false;
        const finish = success => {
          if (settled) return;
          settled = true; clearTimeout(timeout);
          clip.removeEventListener("seeked", done); clip.removeEventListener("error", failed);
          room.standbySeekCancel = null; resolve(success);
        };
        const done = () => finish(true), failed = () => finish(false);
        const timeout = setTimeout(failed, CONFIG.loading.standbySeekTimeoutMs);
        room.standbySeekCancel = failed;
        clip.addEventListener("seeked", done); clip.addEventListener("error", failed);
        try { clip.currentTime = time; } catch { failed(); }
      });
    }

    async function warmJumpscareBeforeDeadline(room = levelRooms[activeRoomIndex]) {
      if (!room || room.deadlineWarmStarted) return;
      room.deadlineWarmStarted = true;
      const clip = room.scare;
      if (!room.scareReady || !clip.paused || !clip.duration) return;
      clip.classList.add("priming");
      try {
        const ready = await seekJumpscareStandbyFrame(Math.min(CONFIG.loading.standbySeekSeconds, clip.duration / 2), room);
