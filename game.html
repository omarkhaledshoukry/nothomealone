<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="only light" />
  <title>Housemaid in Hell</title>
  <link rel="preload" as="image" href="./home.png" />
  <style>
    @font-face {
      font-family: "Game Arabic Paper";
      src: url("./Arabic-Font.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Game Arabic";
      src: local("Noto Naskh Arabic"), local("Amiri"), local("Traditional Arabic"), local("Geeza Pro"),
        url("./NotoNaskhArabic-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      color-scheme: only light;
      --tarantino-yellow: #f6d20a;
      --letter-beige: rgba(241, 239, 229, 0.80);
      --ink: #090909;
      --game-height: 100vh;
      --view-unit: 1vh;
    }

    @supports (height: 100dvh) {
      :root { --game-height: 100dvh; --view-unit: 1dvh; }
    }

    @font-face {
      font-family: "Dudu Calligraphy";
      src: local("Dudu Calligraphy"), local("DuduCalligraphy"), local("Dudu_Calligraphy"),
        url("./Dudu_Calligraphy.ttf") format("truetype");
      font-display: swap;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    body { cursor: grab; }
    body.grabbing { cursor: grabbing; }

    #game {
      color-scheme: light;
      color-scheme: only light;
      forced-color-adjust: none;
      position: fixed;
      top: var(--game-top, 0px);
      left: var(--game-left, 0px);
      width: var(--game-width, 100%);
      height: var(--game-height);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #portraitFrame {
      position: relative;
      height: 100%;
      width: calc(var(--game-height) * var(--frame-aspect, .625));
      max-width: 100%;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 40px rgba(0, 0, 0, .8);
      isolation: isolate;
    }

    #portraitViewport {
      --safe-left: max(0px, calc(env(safe-area-inset-left) - var(--frame-left-gap, 0px)));
      --safe-right: max(0px, calc(env(safe-area-inset-right) - var(--frame-right-gap, 0px)));
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
      isolation: isolate;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (max-width: 600px) and (orientation: portrait), (pointer: coarse) and (orientation: portrait) {
      #portraitFrame { width: 100%; }
    }

    #sceneEffects {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      transform-origin: 50% 50%;
      filter: blur(var(--scene-hand-blur, 0px)) blur(var(--scene-hint-blur, 0px));
      transition: filter 420ms ease;
      will-change: transform, filter;
    }

    .room-image,
    .room-video,
    .room-video-cover {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #letterWorld {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    .room-image,
    .room-video,
    .room-video-cover {
      z-index: 1;
      user-select: none;
      pointer-events: none;
      filter: blur(0px);
      transition: filter 420ms ease;
    }

    .room-image {
      display: none;
      max-width: none;
      -webkit-user-drag: none;
    }

    .room-video-cover {
      display: none;
      max-width: none;
    }

    .room-image.snapping,
    .room-video.snapping,
    .room-video-cover.snapping,
    #letterWorld.snapping,
    #anomalyWorld.snapping,
    #dollWorld.snapping,
    #spiderWorld.snapping,
    .jumpscare-video.snapping {
      transition: transform var(--centre-flight-ms, 420ms) cubic-bezier(.22,.72,.22,1), filter 420ms ease;
    }

    #portraitViewport.hand-active #sceneEffects {
      --scene-hand-blur: var(--hand-blur, 3px);
    }

    #letterWorld {
      z-index: 2;
      pointer-events: none;
      filter: blur(var(--letter-blur, .7px));
      transition: filter 420ms ease;
    }

    .letter-anchor {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .letter-tile {
      padding: 8px;
      display: inline-grid;
      place-items: center;
      color: var(--letter-beige);
      background: transparent;
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      line-height: 1;
      user-select: none;
      pointer-events: none;
      transform: rotate(var(--letter-rotation, 0deg));
      transform-origin: center;
    }

    .letter-glyph {
      display: block;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: calc(var(--letter-base-size, 53px) * var(--letter-scale, 1));
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: .015em;
      pointer-events: none;
    }

    .letter-anchor.appearing .letter-tile { animation: letterFadeIn var(--letter-fade-ms, 150ms) ease-out both; }
    .letter-tile.first-letter .letter-glyph { animation: letterVibrate var(--letter-vibrate-ms, 400ms) steps(1, end) infinite; }
    .letter-tile.butterfly-letter {
      transform: rotate(calc(var(--letter-rotation, 0deg) + var(--butterfly-bank, 0deg)))
        rotateY(var(--butterfly-flutter, 0deg));
      will-change: transform;
    }

    @keyframes letterFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes letterVibrate {
      0%, 100% { translate: 0 0; }
      25% { translate: var(--jitter-x1, 2px) var(--jitter-y1, -1px); }
      50% { translate: var(--jitter-x2, -2px) var(--jitter-y2, 1px); }
      75% { translate: var(--jitter-x3, 1px) var(--jitter-y3, 2px); }
    }

    #captureEffects {
      position: absolute;
      z-index: 11;
      inset: 0;
      pointer-events: none;
    }

    .captured-letter {
      position: absolute;
      display: block;
      line-height: 1;
      font-weight: 400;
      text-transform: uppercase;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .letter-anchor[hidden] {
      display: none;
    }

    #cameraOverlay {
      position: absolute;
      z-index: 10;
      inset: 0;
      color: var(--camera-color, #fff);
      font-family: "OCR A Std", "OCR A Extended", "Lucida Console", Monaco, monospace;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      text-shadow: none;
      transition: opacity var(--clue-fade-ms, 180ms) ease;
    }

    #cameraBattery,
    #cameraTimer,
    #status {
      position: absolute;
      top: max(5%, calc(env(safe-area-inset-top) + 12px));
      font-size: var(--ui-font-size, 18px);
      line-height: 1;
    }

    #cameraBattery {
      left: max(4.5%, calc(var(--safe-left) + 10px));
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #cameraBattery svg {
      width: var(--battery-width, 40px);
      height: auto;
    }

    #batteryPercent { font-size: .9em; }
    .battery-slot.drained { fill: transparent; }

    #cameraTimer {
      right: max(4.5%, calc(var(--safe-right) + 10px));
    }

    #hud {
      position: absolute;
      top: max(4%, calc(env(safe-area-inset-top) + 8px));
      left: 27%;
      width: 46%;
      padding: 0;
      text-align: center;
      pointer-events: none;
    }

    #wordDisplay {
      min-height: clamp(22px, calc(var(--view-unit) * 4.1), 42px);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--hud-letter-gap, 2px);
    }

    .hud-letter {
      min-width: 0;
      color: rgba(255, 255, 255, .58);
      font-size: var(--hud-letter-size, 28px);
      font-weight: 400;
      text-transform: uppercase;
      border: 0;
      line-height: 1.1;
    }

    .hud-letter.found {
      color: #fff;
      border: 0;
      animation: hudPop var(--hud-pop-ms, 160ms) ease both;
    }

    #status {
      left: 50%;
      transform: translateX(-50%);
      font-weight: 400;
      white-space: nowrap;
    }

    #status.puzzle-hint {
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
    }
    #status.puzzle-hint::before { content: ""; position: absolute; inset: -14px -12px; }
    #status.puzzle-hint[aria-disabled="true"] { pointer-events: none; }

    #portraitViewport.hint-transition #sceneEffects { transition: filter var(--hint-fade-ms, 140ms) ease; }
    #portraitViewport.hint-active #sceneEffects { --scene-hint-blur: var(--hint-blur, 5px); }
    #portraitViewport.hint-active #handBlocker { filter: blur(var(--hint-blur, 5px)); }

    #clueIntro.hint-mode {
      visibility: visible;
      pointer-events: none;
      transition: opacity var(--hint-fade-ms, 140ms) ease;
    }
    #clueIntro.hint-mode #readyButton,
    #clueIntro.hint-mode .clue-file-controls { display: none; }
    #clueIntro.hint-mode.show { pointer-events: none; }

    .room-navigation {
      appearance: none;
      -webkit-appearance: none;
      position: absolute;
      bottom: max(3.3%, calc(env(safe-area-inset-bottom) + 4px));
      min-width: 64px;
      min-height: 44px;
      padding: 8px;
      border: 0;
      background: transparent;
      color: var(--camera-color, #fff);
      -webkit-text-fill-color: var(--camera-color, #fff);
      font: inherit;
      font-size: var(--ui-font-size, 18px);
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #prevRoomButton { left: max(2.5%, calc(var(--safe-left) + 2px)); }
    #prevRoomButton.hold-hint { touch-action: none; }
    #nextRoomButton { right: max(2.5%, calc(var(--safe-right) + 2px)); }
    .room-navigation:active { transform: scale(.95); }
    .room-navigation:disabled { opacity: .45; cursor: default; }
    .room-navigation:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }

    #snapButton {
      appearance: none;
      -webkit-appearance: none;
      position: absolute;
      left: 50%;
      bottom: max(var(--shutter-bottom, 8%), calc(env(safe-area-inset-bottom) + 12px));
      width: clamp(var(--shutter-min, 56px), calc(var(--view-unit) * var(--shutter-size-vh, 10)), var(--shutter-max, 88px));
      height: clamp(var(--shutter-min, 56px), calc(var(--view-unit) * var(--shutter-size-vh, 10)), var(--shutter-max, 88px));
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: translateX(-50%);
      padding: var(--shutter-padding, 4px);
      border: var(--shutter-ring, 2px) solid var(--shutter-color, #fff);
      color: #fff;
      opacity: 1;
      border-radius: 50%;
      outline: none;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .shutter-core {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--shutter-color, #fff);
      transition: transform var(--shutter-release-ms, 90ms) ease;
    }

    #snapButton:active:not(:disabled) .shutter-core,
    #snapButton.held .shutter-core { transform: scale(var(--shutter-held-scale, .9)); }
    #snapButton.snapping .shutter-core { animation: shutterPress var(--shutter-press-ms, 180ms) ease-in-out; }
    #snapButton:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    #snapButton:disabled { cursor: default; opacity: 1; border-color: var(--shutter-color, #fff); }

    #shutterBitmap { display: none; }
    #cameraOverlay.bitmap-shutter #shutterBitmap {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #cameraOverlay.bitmap-shutter #snapButton {
      border-color: transparent;
      background: transparent;
      -webkit-filter: none;
      filter: none;
    }
    #cameraOverlay.bitmap-shutter .shutter-core { visibility: hidden; }

    @keyframes shutterPress {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(var(--shutter-held-scale, .9)); }
    }


    #loadingScreen {
      position: absolute;
      z-index: 200;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 1;
      pointer-events: auto;
    }

    /* Cover the outgoing room immediately. Fade only when revealing the
       prepared screen underneath. */
    #loadingScreen.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--loader-fade-ms, 220ms) ease;
    }

    #loadingWord {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.02em;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: clamp(38px, calc(var(--view-unit) * 6), 62px);
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
    }

    #loadingWord[hidden], #wordLoadError[hidden] { display: none; }
    #mediaPreparation, #resumePlayback { position: absolute; inset: 0; z-index: 250; display: flex; align-items: center; justify-content: center; background: #000; cursor: pointer; }
    #mediaPreparation { position: fixed; }
    #mediaPreparation[hidden], #resumePlayback[hidden] { display: none; }
    #portraitViewport.level-paused #sceneEffects,
    #portraitViewport.level-paused #sceneEffects *,
    #portraitViewport.level-paused #handBlocker,
    #portraitViewport.level-paused #handBlocker *,
    #portraitViewport.level-paused #message { animation-play-state: paused; }
    #wordLoadError {
      width: min(88%, 440px);
      max-height: 90%;
      overflow: auto;
      padding: 20px;
      color: #f1efe5;
      font: 16px/1.45 Arial, Helvetica, sans-serif;
      text-align: left;
      cursor: auto;
    }
    #wordLoadError h2 { margin: 0 0 12px; font-size: 23px; }
    #wordLoadError p { margin: 12px 0; }
    #wordLoadUrl { color: inherit; overflow-wrap: anywhere; }
    .word-error-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .word-error-actions button {
      padding: 10px 14px;
      border: 1px solid currentColor;
      border-radius: 5px;
      color: inherit;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    #localFileControls[hidden] { display: none; }
    .clue-file-controls {
      position: absolute;
      left: 4%; right: 4%;
      bottom: max(3%, calc(env(safe-area-inset-bottom) + 8px));
      display: flex; align-items: flex-start; flex-wrap: wrap; gap: 6px 12px;
      pointer-events: auto;
    }
    #localFileControls { pointer-events: auto; }
    .progress-actions { display: flex; flex-wrap: wrap; gap: 6px; max-width: 100%; font: 12px Arial, Helvetica, sans-serif; }
    .progress-actions button { padding: 8px; border: 1px solid currentColor; border-radius: 4px; background: transparent; color: var(--letter-beige); font: inherit; cursor: pointer; }
    .progress-status { flex-basis: 100%; color: var(--letter-beige); font-size: 11px; line-height: 1.3; }
    #gameOverScreen > .progress-actions { position: absolute; bottom: max(3%, calc(env(safe-area-inset-bottom) + 8px)); left: 4%; right: 4%; justify-content: center; }
    #changeLocalFilesButton {
      padding: 8px 10px;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: transparent;
      color: var(--letter-beige);
      font: 13px Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    .loading-letter {
      display: inline-block;
      animation: loadingJitter var(--loading-jitter-ms, 400ms) steps(1, end) infinite;
    }

    @keyframes loadingJitter {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(var(--lx1), var(--ly1)); }
      50%  { transform: translate(var(--lx2), var(--ly2)); }
      75%  { transform: translate(var(--lx3), var(--ly3)); }
      100% { transform: translate(0, 0); }
    }

    /* Post-loading clue-note interstitial. */
    #clueIntro {
      position: absolute;
      z-index: 120;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--clue-fade-ms, 180ms) ease;
    }

    #clueIntro.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #clueIntro.dismiss {
      opacity: 0;
      pointer-events: none;
    }

    #clueCard {
      position: relative;
      width: min(78%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(calc(var(--view-unit) * -1.5));
    }

    #cluePaperWrap {
      position: relative;
      width: 100%;
    }

    #cluePaper,
    #cluePaperBitmap {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.34));
      color-scheme: light;
      color-scheme: only light;
      forced-color-adjust: none;
      opacity: 1;
      mix-blend-mode: normal;
    }

    #cluePaperBitmap {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      visibility: hidden;
      pointer-events: none;
    }

    #cluePaperWrap.bitmap-paper #cluePaper { visibility: hidden; }
    #cluePaperWrap.bitmap-paper #cluePaperBitmap { visibility: visible; }

    #cluePaperText {
      position: absolute;
      inset: 13% 12% 12% 17%;
      color: #000;
      -webkit-text-fill-color: #000;
      forced-color-adjust: none;
      /* Keep the final ink black when legacy Android forced-dark changes
         text paint colours. The paper image stays outside this filter. */
      -webkit-filter: brightness(0);
      filter: brightness(0);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      text-align: left;
      transform: rotate(-0.4deg);
      pointer-events: none;
    }

    #clueTitle {
      margin: 0 0 10% 0;
      text-align: center;
      font-size: clamp(31px, calc(var(--view-unit) * 5.2), 48px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-decoration: underline;
      text-underline-offset: .12em;
    }
    #clueTitle.riddle-title { text-transform: none; }
    :root[data-game-language="ar"] #clueTitle.riddle-title {
      font-family: "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", Tahoma, serif;
      direction: rtl;
      letter-spacing: 0;
    }

    #clueList {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: clamp(13px, calc(var(--view-unit) * 2.3), 24px);
      font-size: clamp(22px, calc(var(--view-unit) * 3.5), 34px);
      line-height: 1.05;
      text-transform: uppercase;
    }

    #clueList li::before { content: "- "; }

    #puzzleText {
      margin: 0;
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: var(--puzzle-font-size, 25px);
      line-height: 1.3;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      text-transform: none;
    }
    #puzzleText[hidden], #clueList[hidden] { display: none; }
    :root[data-game-language="ar"] #puzzleText {
      font-family: "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", Tahoma, serif;
      direction: rtl;
      text-align: right;
    }

    #readyButton,
    #prepareMediaButton,
    #resumePlaybackButton {
      appearance: none;
      border: 0;
      padding: 10px 12px;
      margin-top: 8px;
      align-self: flex-end;
      background: transparent;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: clamp(26px, calc(var(--view-unit) * 4.2), 40px);
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
      cursor: pointer;
      animation: readyJitter 0.4s steps(1, end) infinite;
    }
    #prepareMediaButton, #resumePlaybackButton { margin: 0; align-self: auto; -webkit-text-fill-color: var(--letter-beige); }

    @keyframes readyJitter {
      0%   { transform: translate(0,0); }
      25%  { transform: translate(2px,-1px); }
      50%  { transform: translate(-2px,1px); }
      75%  { transform: translate(1px,2px); }
      100% { transform: translate(0,0); }
    }

    /* During the clue card, keep the prepared room soft and hide gameplay UI. */
    #portraitViewport.clue-intro-active .room-image,
    #portraitViewport.clue-intro-active .room-video,
    #portraitViewport.clue-intro-active .room-video-cover {
      filter: blur(var(--clue-blur, 5px));
    }

    #letterWorld,
    #hud {
      transition: filter 420ms ease, opacity 320ms ease;
    }

    #portraitViewport.clue-intro-active #letterWorld,
    #portraitViewport.clue-intro-active #cameraOverlay {
      opacity: 0;
    }

    #anomalyWorld,
    #spiderWorld {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      pointer-events: none;
      will-change: transform;
    }

    #spiderWorld { z-index: 5; }
    /* Deepest scene overlay: above the room pixels, below letters and props.
       It remains inside sceneEffects so all existing blur triggers still apply. */
    #anomalyWorld { z-index: 1; }
    #dollWorld {
      position: absolute;
      z-index: 4;
      inset: 0;
      pointer-events: none;
      transform-origin: left top;
      will-change: transform;
    }
    /* The doll stays in front of the scare only for its short upward exit. */

    #gameOverScreen {

      z-index: 160;

    #gameOverScreen.show { display: flex; }

    #levelLoadDetails[hidden] { display: none; }
    #gameOverScreen.show #gameOverTitle { animation: gameOverJitter var(--game-over-jitter-ms, 380ms) steps(1, end) infinite; }
    #gameOverScreen.show #retryText { animation: gameOverJitter var(--retry-jitter-ms, 430ms) steps(1, end) var(--retry-jitter-delay, 75ms) infinite; }
    #gameOverTitle { max-width: 94%; overflow-wrap: anywhere; font-size: clamp(var(--game-over-min, 42px), calc(var(--view-unit) * var(--game-over-vh, 7)), var(--game-over-max, 72px)); line-height: 1; }
    #retryText { max-width: 94%; font-size: clamp(var(--retry-min, 20px), calc(var(--view-unit) * var(--retry-vh, 3)), var(--retry-max, 30px)); opacity: .78; }

    @keyframes gameOverJitter {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(2px, -1px); }
      40% { transform: translate(-2px, 2px); }
      60% { transform: translate(1px, -2px); }
      80% { transform: translate(-1px, 1px); }

    #handBlocker {
      position: absolute;
      z-index: 30;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      touch-action: none;
    }

    #handBlocker.active {
      pointer-events: auto;
      cursor: grab;
    }

    #handBlocker.dragging {
      cursor: grabbing;
    }

    #handImage,
    #handBitmap {
      position: absolute;
      left: 50%;
      bottom: -10%;
      width: 100%;
      height: auto;
      max-width: none;
      object-fit: contain;
      transform: translate(-50%, 120%);
      transform-origin: 50% 100%;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      will-change: transform;
    }

    #handBlocker.entering #handImage,
    #handBlocker.entering #handBitmap {
      animation: handEnter var(--hand-enter-ms, 520ms) cubic-bezier(.18,.82,.28,1) forwards;
    }

    #handBlocker.resting #handImage,
    #handBlocker.resting #handBitmap {
      transform: translate(-50%, 0);
    }

    #handBlocker.exiting #handImage,
    #handBlocker.exiting #handBitmap {
      animation: handExit var(--hand-exit-ms, 300ms) cubic-bezier(.55,.05,.82,.34) forwards;
    }

    @keyframes handEnter {
      from { transform: translate(-50%, 120%); }
      to { transform: translate(-50%, 0); }
    }

    @keyframes handExit {
      from { transform: translate(-50%, 0); }
      to { transform: translate(-50%, 125%); }
    }

    #message {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--tarantino-yellow);

      letter-spacing: .04em;

      opacity: 0;
      transform: scale(.82);
      pointer-events: none;
    }

    #message.show { animation: messageFlash var(--found-flash-ms, 620ms) ease both; }

    #handBitmap, #anomalyBitmap, #messageBitmap {
      display: none;
      visibility: hidden;
      color-scheme: light;
      color-scheme: only light;
      forced-color-adjust: none;
      pointer-events: none;
    }
    #messageBitmap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    @keyframes hudPop {
      from { transform: scale(.68); }
      to { transform: scale(1); }
    }

    @keyframes messageFlash {
      0% { opacity: 0; transform: scale(.82); }
      25%, 68% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.08); }
    }

    :root[data-game-language="ar"] .letter-glyph {
      font-family: "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
      text-transform: none;
      letter-spacing: 0;

      direction: rtl;
    }
    :root[data-game-language="ar"] #clueList {
      font-family: "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
      direction: rtl;
      text-align: right;
      text-transform: none;
      letter-spacing: 0;
      line-height: 1.55;
    }
    :root[data-game-language="ar"] #wordDisplay {
      direction: rtl;
      gap: 4px;
      font-family: "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
      font-size: var(--hud-letter-size, 40px);
      line-height: 1.6;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
    }
    .arabic-hud-prefix {
      color: #fff; direction: rtl; unicode-bidi: isolate;
      font-family: "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
    }
    :root[data-game-language="ar"] .captured-letter {
      font-family: "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
      text-transform: none;
      letter-spacing: 0;
      line-height: 1.5;
      direction: rtl;
    }
    .arabic-hud-remaining { color: rgba(255,255,255,.58); direction: rtl; unicode-bidi: isolate; }

    /* Include the outer page too: older Android browsers can highlight a
       touch target's ancestor while the visible room is being replaced. */
    html,
    body,
    #game,
    #portraitViewport,
    #portraitViewport * {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Native edge glow is separate from tap highlighting. Camera movement
       uses transforms, so the page and game frame never need overscroll. */
    html,
    body,
    #game,
    #portraitViewport {
      overscroll-behavior: none;
    }

    #portraitViewport button:focus,
    #portraitViewport [role="button"]:focus {
      outline: none;
    }

    /* This class also preserves keyboard focus on older Android browsers
       that do not support :focus-visible. Pointer input removes the class. */
    #portraitViewport.keyboard-controls button:focus,
    #portraitViewport.keyboard-controls [role="button"]:focus {
      outline: 2px solid var(--camera-color, #fff);
      outline-offset: 3px;
    }
    #menuShell { position: absolute; inset: 0; z-index: 300; display: grid; place-items: center; overflow: auto; background: #000; color: var(--letter-beige); font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; -webkit-text-fill-color: var(--letter-beige); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; cursor: default; }
    #menuShell[hidden], .menu-page[hidden] { display: none !important; }
    html.menu-open, html.menu-open body, #menuShell { touch-action: pan-y; }
    #homeBackdrop { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #homeBackdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #0005, #000a 33%, #000a 70%, #0005); opacity: 0; transition: opacity 220ms ease; }
    #homePoster { position: absolute; top: 0; left: 0; height: 100%; width: auto; min-width: 100%; object-fit: cover; transform: translate3d(var(--home-pan-x, 0px), 0, 0); }
    #menuShell[data-poster-position="left"] #homePoster { transform: translate3d(0, 0, 0); }
    #menuShell[data-poster-position="center"] #homePoster { transform: translate3d(calc(var(--home-pan-x, 0px) / 2), 0, 0); }
    #menuShell[data-poster-position="center"] #homeBackdrop::after { opacity: 1; }
    #menuShell[data-page="panning"] #homePoster { transition: transform var(--home-pan-ms, 650ms) cubic-bezier(.16,.72,.22,1); }
    .menu-page { width: min(88%, 510px); padding: 72px 12px 36px; text-align: center; z-index: 1; }
    #introPage { position: absolute; inset: 0; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 0 5% max(20%, calc(env(safe-area-inset-bottom) + 52px)); }
    #homeStartButton { font-size: clamp(33px, calc(var(--view-unit) * 4.8), 48px); }
    /* Keep the menu at its original vertical position after removing the heading. */
    #homePage { padding-top: calc(30px + clamp(44px, calc(var(--view-unit) * 8.3), 84px) * 1.96 + var(--home-menu-gap, 26px)); padding-bottom: 30px; }
    .menu-page h2 { margin: 0 0 28px; font-size: clamp(32px, calc(var(--view-unit) * 5.5), 54px); font-weight: 400; line-height: 1.1; }
    .home-actions, .language-choices { display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .menu-button, .home-back, .paper-button { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: inherit; -webkit-text-fill-color: currentColor; font: inherit; font-weight: 400; cursor: pointer; animation: readyJitter .4s steps(1, end) infinite; touch-action: manipulation; }
    .menu-button { min-height: 44px; padding: 7px 18px; font-size: clamp(24px, calc(var(--view-unit) * 3.7), 36px); line-height: 1.12; }
    .home-actions > button, .language-choices > button, .paper-actions > button { animation-delay: calc(var(--jitter-phase, 0) * var(--menu-jitter-stagger, 75ms)); }
    .home-actions > :nth-child(2), .language-choices > :nth-child(2), .paper-actions > :nth-child(2) { --jitter-phase: -1; }
    .home-actions > :nth-child(3) { --jitter-phase: -2; }
    .home-actions > :nth-child(4) { --jitter-phase: -3; }
    .home-actions > :nth-child(5) { --jitter-phase: -4; }
    .menu-button:disabled { opacity: .45; cursor: default; }
    .menu-button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: .2em; }
    .menu-back, .home-back { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); width: 50px; height: 50px; padding: 10px; color: var(--letter-beige); z-index: 2; animation-duration: .487s; animation-delay: -.055s; }
    .menu-back svg, .home-back svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .menu-body { margin: 0; font-size: clamp(20px, calc(var(--view-unit) * 3.2), 28px); line-height: 1.38; text-align: start; }
    #homeNotice { min-height: 1.4em; margin: 14px 0 0; font-size: 18px; }
    #homeNotice > span { animation: clearNoticeFade 1800ms ease both; }
    @keyframes clearNoticeFade {
      0%, 25% { opacity: 1; }
      100% { opacity: 0; }
    }
    #menuShell[data-language="ar"] .menu-page:not(#homePage), #menuShell[data-language="ar"] .home-actions, .language-choices [lang="ar"] { font-family: "Game Arabic", "Noto Naskh Arabic", Tahoma, serif; }
    #menuShell[data-language="ar"] .menu-page:not(#homePage) { direction: rtl; }
    #menuShell[data-language="ar"] .menu-body { line-height: 1.65; }
    #menuShell [lang="en"] { font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", cursive; }
    #menuShell button:focus-visible, .home-back:focus-visible, .paper-button:focus-visible { outline: 1px solid currentColor; outline-offset: 5px; }
    #menuShell button { -webkit-tap-highlight-color: transparent; }
    #menuShell button:focus:not(:focus-visible) { outline: none; }
    #menuShell[data-language="ar"] #homeNotice { font-family: "Game Arabic", "Noto Naskh Arabic", Tahoma, serif; }
    #clueIntro.hint-mode .home-back, #clueIntro.exit-mode .home-back { display: none; }

    #exitConfirmContent p { margin: 0; font-size: clamp(18px, calc(var(--view-unit) * 2.7), 26px); line-height: 1.3; }

    #portraitViewport.exit-confirm-active #cameraOverlay { filter: blur(2px); pointer-events: none; }

<body>
  <div id="game">
    <div id="portraitFrame">
    <div id="portraitViewport">
      <div id="loadingScreen" aria-live="polite">

            <button id="chooseGameFolderButton" type="button" hidden>Choose game folder</button>

      </div>

        <button id="homeStartButton" class="menu-button" type="button">START</button>

          <button id="homeClearButton" class="menu-button" type="button">CLEAR DATA</button>
        </nav>
        <p id="homeNotice" role="status" aria-live="polite"></p>
      </div>
      <div id="settingsPage" class="menu-page" hidden>
        <button class="menu-button menu-back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5l-7 7 7 7M7 12h13"/></svg></button>
        <h2 id="settingsTitle">SETTINGS</h2>
        <div id="languageChoices" class="language-choices" role="group" aria-label="Language">

    // Only these exact numbered filenames can enter the scene catalogue.
    // Group by number before choosing anything, so missing partners are skipped.
    function buildSceneCatalog(filenames) {
      const groups = new Map();
      const imageTypes = ["png", "webp", "jpg", "jpeg"];
      const videoTypes = ["mp4", "webm", "m4v", "mov"];
      for (const entry of filenames) {
        const name = typeof entry === "string" ? entry : entry?.name;
        if (!name) continue;
        const match = /^(room|jumpscare)_(\d+)\.(png|webp|jpe?g|mp4|webm|m4v|mov)$/i.exec(name);
        if (!match) continue;
        const number = Number(match[2]);
        if (!Number.isSafeInteger(number) || number < 1) continue;
        if (!groups.has(number)) groups.set(number, { number, images: [], videos: [], scares: [] });
        const group = groups.get(number);
        const extension = match[3].toLowerCase();
        if (match[1].toLowerCase() === "room") {
          (imageTypes.includes(extension) ? group.images : group.videos).push(name);
        } else if (videoTypes.includes(extension)) group.scares.push(name);
      }
      const preferred = (names, types) => names.sort((a, b) =>
        types.indexOf(a.split(".").pop().toLowerCase()) - types.indexOf(b.split(".").pop().toLowerCase()))[0] || null;
      const assetURL = name => name ? new URL(encodeURIComponent(name), levelBaseURL).href : null;
      return [...groups.values()].sort((a, b) => a.number - b.number).flatMap(group => {
        const roomImage = preferred(group.images, imageTypes);
        const roomVideo = preferred(group.videos, videoTypes);
        const jumpscare = preferred(group.scares, videoTypes);
        if ((!roomImage && !roomVideo) || !jumpscare) return [];
        return [{ number: group.number, roomImage: assetURL(roomImage), roomVideo: assetURL(roomVideo), jumpscare: assetURL(jumpscare) }];
      });
    }

    async function fetchLevelResource(url, options = {}, consume = response => response) {
      const controller = new AbortController();

        return await consume(response);
      } finally { window.clearTimeout(timer); }

    async function readLevelDirectory() {

    async function levelAssetExists(name) {
      const url = new URL(name, levelBaseURL);
      if (url.protocol === "file:") {
        // Local HTML cannot fetch a folder, but media metadata remains readable.
        // Probe without playing, then release each temporary media element.
        return new Promise(resolve => {
          const image = /\.(png|webp|jpe?g)$/i.test(name);
          const probe = document.createElement(image ? "img" : "video");
          let timer;
          const finish = exists => {
            window.clearTimeout(timer);
            probe.onload = probe.onloadedmetadata = probe.onerror = null;
            probe.removeAttribute("src");
            if (!image) probe.load();
            resolve(exists);
          };
          probe.onerror = () => finish(false);
          if (image) probe.onload = () => finish(probe.naturalWidth > 0);
          else {
            probe.preload = "metadata";
            probe.muted = true;
            probe.playsInline = true;
            probe.onloadedmetadata = () => finish(probe.videoWidth > 0);
          }
          timer = window.setTimeout(() => finish(false), CONFIG.loading.resourceTimeoutMs);
          probe.src = url.href;
        });
      }
      try {
        const response = await fetchLevelResource(url, { method: "HEAD" });
        if (response.ok) {
          const type = response.headers.get("content-type") || "";
          if (/^video\/|^image\//i.test(type)) return true;
          if (/text\/html/i.test(type)) return false;
        } else if (response.status !== 405 && response.status !== 501) return false;
        // Some static hosts do not implement HEAD. Read just the first chunk
        // and cancel it, rather than downloading every video for discovery.
        return await fetchLevelResource(url, { headers: { Range: "bytes=0-31" } }, async sample => {
          if (!sample.ok || /text\/html/i.test(sample.headers.get("content-type") || "")) return false;
          const reader = sample.body?.getReader();
          if (!reader) return false;
          try {
            const { value } = await reader.read();
            if (!value || value.length < 8) return false;
            const tag = String.fromCharCode(...value.slice(4, 8));
            return tag === "ftyp" || value[0] === 0x1a && value[1] === 0x45 && value[2] === 0xdf && value[3] === 0xa3 ||
              value[0] === 0x89 && value[1] === 0x50 && value[2] === 0x4e && value[3] === 0x47;
          } finally { await reader.cancel().catch(() => {}); }
        });
      } catch { return false; }
    }

          const found = await Promise.all(names.map(levelAssetExists));
          return names.filter((_, i) => found[i]);
        }));
        for (const found of batch) {
          filenames.push(...found);
          absent = found.length ? 0 : absent + 1;
        }
        next += batch.length;
      }
      return buildSceneCatalog(filenames);

        while (absent < LEVEL_PROBE_GAP) {
          const found = await Promise.all(Array.from({ length: CONFIG.loading.levelProbeBatchSize }, (_, i) => next + i).map(async number => {
            if (dollFiles.has(number)) return true;
            const names = [CONFIG.doll.filePattern.replace("{number}", number)];
            if (CONFIG.doll.filePattern === "doll_{number}.png") names.push(`doll${number}.png`);
            for (const name of names) if (await levelAssetExists(name)) { dollFiles.set(number, name); return true; }
            return false;
          }));
          for (const exists of found) absent = exists ? 0 : absent + 1;
          next += found.length;
        }
      })();
      return dollDiscoveryPromise;
    }

    function chooseScene(scenes) {
      return scenes.length ? scenes[Math.floor(Math.random() * scenes.length)] : null;
    }

    function showLevelLoadError(error) {
      console.error("Could not load a matching room/jumpscare pair from levels/.", error);
      levelLoadFailure = error;
      beginGameOver(error.failureReason || "levels");
      showGameOver();
    }

    function makeLevelRoom(scene, index) {
      const pooled = roomMediaPool[index];
      if (pooled) {
        const sameScare = pooled.scene.jumpscare === scene.jumpscare;
        const sameBackdrop = pooled.scene.roomImage === scene.roomImage && pooled.scene.roomVideo === scene.roomVideo;
        if (!sameScare) {
          releaseRoomScareSource(pooled);
        }
        pooled.scene = scene;
        pooled.backdropReady = sameBackdrop && pooled.backdropReady;
        if (!sameBackdrop) pooled.videoCoverReady = false;
        pooled.scare.style.display = "";
        pooled.cameraFraction = .5;
        pooled.deadlineWarmStarted = false;
        pooled.preparationError = null;
        pooled.dollState = pooled.dollActor = pooled.dollImage = null;
        pooled.dollLoaded = false;
        if (levelRoomCount === 1 && pooled.videoCover) { pooled.videoCover.remove(); pooled.videoCover = null; pooled.videoCoverReady = false; }
        else if (levelRoomCount > 1 && !pooled.videoCover) {
          pooled.videoCover = document.createElement("canvas");
          pooled.videoCover.className = "room-video-cover";
          pooled.videoCover.setAttribute("aria-hidden", "true");
          sceneEffects.insertBefore(pooled.videoCover, letterWorld);
        }
        return pooled;
      }
      const primary = roomMediaPool[0];
      const image = index === 0 ? roomImage : primary.image.cloneNode(false);
      const backgroundVideo = index === 0 ? video : primary.video.cloneNode(false);
      const scare = index === 0 ? jumpscareVideo : primary.scare.cloneNode(false);
      if (index) {
        // cloneNode copies src too. Never let a newly inserted pool element
        // start loading another room's old (possibly revoked) Blob URL.
        image.removeAttribute("src");
        backgroundVideo.removeAttribute("src");
        scare.removeAttribute("src");
        image.id = `roomImage-${index}`;
        backgroundVideo.id = `roomVideo-${index}`;
        scare.id = `jumpscareVideo-${index}`;
        sceneEffects.insertBefore(image, letterWorld);
        sceneEffects.insertBefore(backgroundVideo, letterWorld);
        viewport.insertBefore(scare, gameOverScreen);
      }
      // Cached screenshots are only useful when returning to another room.
      // Single-room levels allocate no frame canvas and do no bitmap capture.
      let videoCover = null;
      if (levelRoomCount > 1) {
        videoCover = document.createElement("canvas");
        videoCover.className = "room-video-cover";
        videoCover.setAttribute("aria-hidden", "true");
        sceneEffects.insertBefore(videoCover, letterWorld);
      }
      image.style.display = backgroundVideo.style.display = "none";
      scare.style.display = "";
      const room = { scene, image, video: backgroundVideo, videoCover, scare, media: image,
        videoCoverReady: false, videoFrameCancel: null, videoRun: 0,
        backdropReady: false, metadataReady: false, scareReady: false,
        warmAttempted: false, preparing: null, audioUnlocked: false,
        cancelScarePreparation: null,
        audioGain: null, audioSource: null, cameraFraction: .5, standbySeekCancel: null,
        mediaLoading: false, forceFreshDownload: false,
        dollState: null, dollActor: null, dollImage: null, dollLoaded: false,
        deadlineWarmStarted: false };
      roomMediaPool[index] = room;
      scare.addEventListener("ended", () => {
        if (scare === jumpscareVideo && gameOver && scare.classList.contains("playing")) showGameOver();
      });
      scare.addEventListener("error", () => {
        // The loader owns retries and final failure reporting. A queued error
        // from a replaced source must not end a newly loading/resumed level.
        if (!scare.error) return;
        room.metadataReady = room.scareReady = false;
        room.preparationError = mediaAssetError(room.scene.jumpscare, null, scare);
        if (room.mediaLoading || !gameplayStarted) return;
        if (gameOver || roomCompleted) return;
        if (roomsReady && scare !== jumpscareVideo) return;
        beginGameOver(gameplayStarted ? "other" : "video");
        showGameOver();
      });
      return room;
    }

    function cleanDollPlan(value, count) {
      if (!Array.isArray(value) || value.length !== count) return null;
      if (!value.every(item => item === null || item && typeof item === "object" &&
          Number.isSafeInteger(item.number) && item.number >= 1 && item.number <= 1000000000 &&
          Number.isFinite(item.xFraction) && item.xFraction >= 0 && item.xFraction <= 1 &&
          Number.isFinite(item.yVariation) && Math.abs(item.yVariation) <= 1 &&
          Number.isFinite(item.sizeVariation) && Math.abs(item.sizeVariation) <= 1)) return null;
      return value.map(item => item === null ? null : { number: item.number, xFraction: item.xFraction,
        yVariation: item.yVariation, sizeVariation: item.sizeVariation });
    }

    function chooseRoomDoll(sceneNumber) {
      if (!CONFIG.doll.enabled || !levelIsUnlocked(CONFIG.doll.startLevel)) return null;
      const assignments = CONFIG.doll.roomAssignments;
      const numbers = new Set([...Object.keys(assignments).map(Number), ...dollFiles.keys()]);
      const choices = [...numbers].filter(number => {
        const scenes = Object.prototype.hasOwnProperty.call(assignments, number) ? assignments[number] : assignments["1"] || CONFIG_DEFAULTS.doll.roomAssignments["1"];
        return scenes.includes(sceneNumber);
      });
      if (!choices.length || Math.random() >= CONFIG.doll.spawnChance) return null;
      return { number: choices[Math.floor(Math.random() * choices.length)],
        xFraction: CONFIG.doll.minXFraction + Math.random() * (CONFIG.doll.maxXFraction - CONFIG.doll.minXFraction),
        yVariation: Math.random() * 2 - 1, sizeVariation: Math.random() * 2 - 1 };
    }

    async function preloadLevelDolls() {
      const saved = cleanDollPlan(resumedLevel?.dolls, levelRooms.length);
      const plan = saved || levelRooms.map(room => chooseRoomDoll(room.scene.number));
      levelRooms.forEach((room, index) => { room.dollState = plan[index]; });
      if (!CONFIG.doll.enabled || !levelIsUnlocked(CONFIG.doll.startLevel)) return;
      await Promise.all(levelRooms.map(async room => {
        if (!room.dollState) return;
        const actor = document.createElement("div"), image = new Image(), bitmap = document.createElement("canvas");
        actor.className = "doll-actor";
        actor.hidden = true;
        actor.dataset.dollNumber = room.dollState.number;
        image.className = "doll-image";
        image.alt = "";
        image.draggable = false;
        image.decoding = "async";
        bitmap.className = "doll-bitmap";
        bitmap.setAttribute("aria-hidden", "true");
        actor.append(image, bitmap);
        dollWorld.appendChild(actor);
        room.dollActor = actor; room.dollImage = image;
        preserveOverlayImageColors(image, bitmap);
        const file = dollFiles.get(room.dollState.number) || CONFIG.doll.filePattern.replace("{number}", room.dollState.number);
        let deadline;
        try {
          const loaded = waitForMedia(image, "load", CONFIG.doll.loadTimeoutMs);
          image.src = new URL(encodeURIComponent(file), levelBaseURL).href;
          await loaded;
          if (image.decode) await Promise.race([image.decode(), new Promise((_, reject) => {
            deadline = setTimeout(() => reject(new Error("Doll decode timed out.")), CONFIG.doll.loadTimeoutMs);
          })]);
          room.dollLoaded = Boolean(image.naturalWidth && image.naturalHeight);
        } catch (error) {
          actor.remove(); room.dollActor = null;
          console.warn(`Optional doll ${file} is unavailable; continuing without its artwork.`, error.message);
        } finally { clearTimeout(deadline); }
      }));
    }

    function layoutActiveDoll() {
      const width = viewport.getBoundingClientRect().width, height = viewport.getBoundingClientRect().height;
      const panorama = width + Math.abs(minOffset) * CONFIG.doll.parallaxMultiplier;
      dollWorld.style.width = `${panorama}px`;
      dollWorld.style.height = `${height}px`;
      for (const [index, room] of levelRooms.entries()) {
        if (!room.dollActor) continue;
        if (index !== activeRoomIndex || !room.dollLoaded) { room.dollActor.hidden = true; continue; }
        const state = room.dollState;
        const imageHeight = height * CONFIG.doll.heightViewportFraction * (1 + state.sizeVariation * CONFIG.doll.scaleJitterFraction);
        const imageWidth = imageHeight * room.dollImage.naturalWidth / room.dollImage.naturalHeight;
        Object.assign(room.dollActor.style, { width: `${imageWidth}px`, height: `${imageHeight}px`,
          left: `${state.xFraction * Math.max(0, panorama - imageWidth)}px`,
          top: `${imageHeight * (CONFIG.doll.topImageFraction + state.yVariation * CONFIG.doll.verticalJitterImageFraction)}px` });
        if (!dollsRetreating) room.dollActor.hidden = false;
      }
    }

    function retreatActiveDoll() {
      const actor = levelRooms[activeRoomIndex]?.dollActor;
      if (!actor || actor.hidden || dollsRetreating) return;
      dollsRetreating = true;
      // Lift this already-positioned layer out of the scene's stacking context
      // so the doll visibly exits while the jumpscare video is already playing.
      viewport.insertBefore(dollWorld, gameOverScreen);
      dollWorld.classList.add("exiting");
      const distance = Math.max(0, parseFloat(actor.style.top) + actor.offsetHeight) + CONFIG.doll.retreatExtraPx;
      const animation = actor.animate([{ transform: "translateY(0)" }, { transform: `translateY(${-distance}px)` }],
        { duration: CONFIG.doll.retreatMs, easing: "cubic-bezier(.35,0,.85,.3)", fill: "forwards" });
      dollRetreatAnimation = animation;
      animation.finished.then(() => { actor.hidden = true; }).catch(() => {});
    }

    function hideDolls() {
      if (dollRetreatAnimation) dollRetreatAnimation.cancel();
      dollRetreatAnimation = null;
      for (const room of levelRooms) if (room.dollActor) room.dollActor.hidden = true;
    }

    function waitForMedia(element, successEvent, timeoutMs) {
      return new Promise((resolve, reject) => {
        const cleanup = () => { cancelTimeout(); element.removeEventListener(successEvent, done); element.removeEventListener("error", fail); };
        const done = () => { cleanup(); resolve(); };
        const rejectLoad = () => { cleanup(); reject(new Error(`Could not load ${element.currentSrc || element.src}`)); };
        const fail = () => {
          if (typeof element.readyState === "number" && !element.error) return;
          rejectLoad();
        };
        const cancelTimeout = visibleMediaTimeout(rejectLoad, timeoutMs);
        element.addEventListener(successEvent, done, { once: true });
        element.addEventListener("error", fail);
      });
    }

    function cacheRoomVideoFrame(room) {
      const clip = room.video, cover = room.videoCover;
      if (!cover || clip.readyState < HTMLMediaElement.HAVE_CURRENT_DATA || !clip.videoWidth || !clip.videoHeight) return false;
      try {
        const context = cover.getContext("2d");
        if (!context) return false;
        if (!room.videoCoverReady) {
          // A temporary still only needs the current display resolution.
          // Keep one bounded bitmap per room instead of full-resolution copies.
          const scale = Math.min(1, viewport.clientHeight / clip.videoHeight);
          cover.width = Math.max(1, Math.round(clip.videoWidth * scale));
          cover.height = Math.max(1, Math.round(clip.videoHeight * scale));
        }
        context.drawImage(clip, 0, 0, cover.width, cover.height);
        room.videoCoverReady = true;
        return true;
      } catch { return false; }
    }

    function waitForRoomVideoFrame(room, onFrame = () => {}, timeoutMs = CONFIG.loading.resourceTimeoutMs) {
      room.videoFrameCancel?.();
      const clip = room.video, startTime = clip.currentTime;
      return new Promise(resolve => {
        let settled = false, presented = false, frameRequest = null, paintRequest = null, fallbackTimer;
        const finish = ready => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout); clearTimeout(fallbackTimer);
          if (frameRequest !== null) clip.cancelVideoFrameCallback?.(frameRequest);
          if (paintRequest !== null) cancelAnimationFrame(paintRequest);
          clip.removeEventListener("error", cancel);
          if (room.videoFrameCancel === cancel) room.videoFrameCancel = null;
          resolve(ready);
        };
        const cancel = () => finish(false);
        const frameReady = () => {
          if (settled || presented || clip.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
          presented = true;
          if (paintRequest !== null) cancelAnimationFrame(paintRequest);
          onFrame();
          // Keep the still above the video while its visible layer is painted.
          paintRequest = requestAnimationFrame(() => {
            paintRequest = requestAnimationFrame(() => finish(true));
          });
        };
        const checkLegacyFrame = () => {
          if (settled || presented) return;
          if (!clip.paused && clip.currentTime !== startTime && clip.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) frameReady();
          else paintRequest = requestAnimationFrame(checkLegacyFrame);
        };
        const timeout = timeoutMs > 0 ? setTimeout(cancel, timeoutMs) : null;
        room.videoFrameCancel = cancel;
        clip.addEventListener("error", cancel, { once: true });
        if (typeof clip.requestVideoFrameCallback === "function") {
          frameRequest = clip.requestVideoFrameCallback(() => {
            frameRequest = null;
            frameReady();
          });
          // Some browsers suppress compositor callbacks beneath an opaque cover.
          fallbackTimer = setTimeout(checkLegacyFrame, CONFIG.loading.decodedFrameFallbackMs);
        } else checkLegacyFrame();
      });
    }

    function showRoomVideo(room, { withAudio = gameplayStarted } = {}) {
      if (isPageInactive() || menuPage !== null) return;
      const run = ++room.videoRun;
      // Loading stays silent. READY and PREV/NEXT enable only the active
      // room's soundtrack synchronously inside the player's click/tap.
      room.video.muted = !withAudio;
      if (withAudio) room.video.defaultMuted = false;
      if (!room.videoCover) {
        // The first decoded frame is already loaded. Start directly behind the
        // loader/paper and keep the same video element running through READY.
        room.video.style.opacity = "1";
        const played = room.video.play();
        if (played) played.catch(() => {});
        return played;
      }
      room.videoCover.style.display = room.videoCoverReady ? "block" : "none";
      room.video.style.opacity = room.videoCoverReady ? ".001" : "0";
      const isCurrent = () => run === room.videoRun && levelRooms[activeRoomIndex] === room && !gameOver;
      const frameReady = waitForRoomVideoFrame(room, () => {
        if (isCurrent()) room.video.style.opacity = "1";
      }, 0); // Keep covering a slow/stalled active video until it really presents a frame.
      frameReady.then(ready => {
        if (ready && isCurrent()) room.videoCover.style.display = "none";
      });
      const play = room.video.play();
      if (play) play.catch(() => {
        if (run === room.videoRun) room.videoFrameCancel?.();
        // Keep the cached room visible if autoplay is blocked. READY or a
        // subsequent navigation tap can retry within a real user gesture.
      });
      return play;
    }

    async function preloadRoomBackdrop(room) {
      let failure;
      for (let attempt = 0; attempt < CONFIG.loading.mediaLoadAttempts; attempt++) {
        try { await preloadRoomBackdropAttempt(room, Boolean(attempt || room.forceFreshDownload)); return; }
        catch (error) {
          room.backdropReady = false;
          failure = mediaAssetError(room.scene.roomVideo || room.scene.roomImage, error, room.scene.roomVideo ? room.video : null);
          if (!room.scene.roomVideo) failure.failureReason = "levels";
          console.warn(`Room backdrop load attempt ${attempt + 1} failed.`, failure);
        }
      }
      throw failure;
    }

    function mediaRetryURL(url, fresh) {
      const source = new URL(url, document.baseURI);
      if (fresh && /^https?:$/.test(source.protocol)) source.searchParams.set("__media_retry", `${Date.now()}-${levelGeneration}`);
      return source.href;
    }

    async function preloadRoomBackdropAttempt(room, fresh = false) {
      if (room.backdropReady && !(room.media === room.video && room.video.error)) return;
      if (room.scene.roomImage) {
        try {
          const loaded = waitForMedia(room.image, "load", CONFIG.loading.resourceTimeoutMs);
          room.image.src = mediaRetryURL(room.scene.roomImage, fresh);
          await loaded;
          if (!room.image.naturalWidth || !room.image.naturalHeight) throw new Error("Invalid room image.");
          if (room.image.decode) await room.image.decode();
          room.media = room.image;
          room.backdropReady = true;
          return;
        } catch (error) {
          if (!room.scene.roomVideo) throw error;
        }
      }
      if (!room.scene.roomVideo) throw new Error("No usable room image or video.");
      const loaded = waitForMedia(room.video, "loadeddata", CONFIG.loading.jumpscareDownloadTimeoutMs);
      room.video.preload = "auto";
      room.video.autoplay = false;
      room.video.muted = true;
      room.video.loop = true;
      room.video.playsInline = true;
      room.video.src = mediaRetryURL(room.scene.roomVideo, fresh);
      room.video.load();
      await loaded;
      if (!room.videoCover || isPageInactive() || menuPage !== null) {
        // Keep video download/metadata/first-frame decoding, but skip the
        // old multi-room play -> screenshot -> pause warm-up cycle entirely.
        room.media = room.video;
        room.backdropReady = true;
        return;
      }
      // loadeddata prepares media data, not necessarily the first displayed
      // video layer. Warm it behind the loader and cache an actual frame.
      room.video.style.display = "block";
      room.video.style.opacity = ".001";
      const frameReady = waitForRoomVideoFrame(room);
      const cancelWarmup = room.videoFrameCancel;
      try {
        const play = room.video.play();
        if (play) play.catch(cancelWarmup);
        await frameReady;
      } catch { room.videoFrameCancel?.(); }
      cacheRoomVideoFrame(room);
      room.video.pause();
      room.video.style.display = "none";
      room.video.style.opacity = "1";
      room.media = room.video;
      room.backdropReady = true;
    }

    function syncActiveScare(room) {
      if (room !== levelRooms[activeRoomIndex]) return;
      jumpscareReady = room.scareReady;
      jumpscareWarmAttempted = room.warmAttempted;
      jumpscarePreparing = room.preparing;
      jumpscareMetadataReady = room.metadataReady;
      jumpscareAudioUnlocked = room.audioUnlocked;
      jumpscareAudioGain = room.audioGain;
      jumpscareAudioSource = room.audioSource;
    }

    function activateRoom(index, { initial = false } = {}) {
      const previous = levelRooms[activeRoomIndex];
      if (!initial && previous) {
        previous.cameraFraction = minOffset ? offsetX / minOffset : .5;
        const oldLetter = currentRoomLetterIndex();
        if (oldLetter >= 0 && tiles[oldLetter]?.dataset.decoySeen === "true") correctDecoy(oldLetter);
        if (anomalyActive && anomalyRoomIndex === activeRoomIndex && anomalyHasBeenSeen) removeAnomalyAndRestartTimer();
      }
      stopButterflyFlight();
      stopKeyboardInput();
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      if (!initial && previous && previous.media === previous.video) cacheRoomVideoFrame(previous);
      for (const room of levelRooms) {
        room.videoRun++;
        room.videoFrameCancel?.();
        if (room.videoCover) room.videoCover.style.display = "none";
        room.image.style.display = room.video.style.display = "none";
        room.video.pause();
        room.video.muted = true;
      }
      activeRoomIndex = index;
      const room = levelRooms[index];
      currentScene = room.scene;
      roomImage = room.image; video = room.video; roomMedia = room.media; jumpscareVideo = room.scare;
      ROOM_IMAGE_FILE = currentScene.roomImage; ROOM_VIDEO_FILE = currentScene.roomVideo;
      ROOM_NAME = gameText(CONFIG.text.roomFormat, { number: String(currentRoomNumber).padStart(2, "0") });
      jumpscareSourceURL = currentScene.jumpscare;
      roomMediaReady = room.backdropReady;
      syncActiveScare(room);
      room.media.style.display = "block";
      updateLimits();
      buildSnapPoints();
      offsetX = clamp(room.cameraFraction * minOffset, minOffset, 0);
      applyWorldOffset(false);
      if (room.media === room.video) {
        if (gameplayStarted) watchRoomPlayback(room, showRoomVideo(room, { withAudio: true }));
        else showRoomVideo(room, { withAudio: false });
      }
      if (currentWord) relayoutScatteredLetters();
      anomalyWorld.style.display = anomalyActive && anomalyRoomIndex !== index ? "none" : "";
      spiderWorld.style.display = spiderActive && spiderRoomIndex !== index ? "none" : "";
      if (anomalyActive && anomalyRoomIndex === index && anomalyMeta) {
        anomalyWorldBox = getScaledAnomalyBox(anomalyMeta);
        setOverlayImageStyles(anomalyImage, anomalyBitmap, { height: `${viewport.getBoundingClientRect().height}px`, width: `${renderedVideoWidth}px` });
      }
      if (spiderActive && spiderRoomIndex === index) layoutSpider();
      updateAnomalyVisibilityState();
      showCurrentLetter({ animate: !initial });
      updateCameraControls();
      if (!initial && progressState.currentLevel && !progressState.currentLevel.legacy) {
        progressState.currentLevel.activeRoomIndex = activeRoomIndex;
        progressState.updatedAt = new Date().toISOString();
        saveProgress();
      }
    }

    function switchRoom(direction) {
      if (gameplayPaused || menuPage !== null || !gameplayStarted || hintActive || handVisible || gameOver || roomCompleted || !roomsReady) return;
      updateCameraTimer();
      if (gameOver) return;
      let next = activeRoomIndex + direction;
      if (CONFIG.rooms.wrapNavigation) next = (next + levelRooms.length) % levelRooms.length;
      else next = clamp(next, 0, levelRooms.length - 1);
      if (next !== activeRoomIndex) activateRoom(next);
    }

    // Single-room controls are HINT and an inert EXIT placeholder. Retain the
    // old navigation only for an unfinished multi-room save or re-enabled mode.
    prevRoomButton.addEventListener("click", event => { event.stopPropagation(); if (!usesSingleRoomControls()) switchRoom(-1); });
    nextRoomButton.addEventListener("click", event => { event.stopPropagation(); if (usesSingleRoomControls()) openExitConfirmation(); else switchRoom(1); });

    async function loadRandomLevel() {
      if (levelLoading) return;
      levelLoading = true;
      try {
        const [catalog] = await Promise.all([discoverScenes(), discoverDollFiles()]);
        availableScenes = await resolveSavedScenes(catalog);
        // Retry/resume must retain its original scene set even after config edits.
        if (!resumedLevel) availableScenes = roomMilestonePool(availableScenes);
        if (!resumedLevel) availableScenes = nonRepeatingScenePool(availableScenes, progressState.lastSceneNumber);
        if (!resumedLevel && CONFIG.milestones.enabled && availableScenes.length < levelRoomCount) {
          wordLoadInfo.url = new URL(levelDataFile(), document.baseURI).href;
          showWordLoadError(new Error(`The scene milestone at level ${progressionLevel()} allows ${availableScenes.length} complete room/jumpscare pairs, but rooms.count requires ${levelRoomCount}. Raise milestones.rooms.maxSceneNumbers, lower rooms.count, or add the matching scene files, then reload.`));
          return;
        }
        if (availableScenes.length < levelRoomCount) throw new Error(`This level needs ${levelRoomCount} complete numbered room/jumpscare pairs; found ${availableScenes.length}.`);
        if (isPuzzleLevel()) {
          try { await preparePuzzleForLevel(); }
          catch (error) { showWordLoadError(error); return; }
        }
        let selected;
        if (resumedLevel) {
          selected = resumedLevel.sceneNumbers.map(number => availableScenes.find(scene => scene.number === number));
          if (selected.some(scene => !scene)) throw new Error("A saved room scene is missing from levels/.");
          if (resumedLevel.legacy) {
            const extras = shuffleArray(availableScenes.filter(scene => !selected.includes(scene)));
            selected.push(...extras.slice(0, levelRoomCount - selected.length));
          }
        } else selected = shuffleArray([...availableScenes]).slice(0, levelRoomCount);
        levelRooms = selected.map(makeLevelRoom);
        activeRoomIndex = resumedLevel?.activeRoomIndex || 0;
        const loaded = await Promise.allSettled([preloadLevelDolls(), ...levelRooms.map(async room => {
          const parts = await Promise.allSettled([
            preloadRoomBackdrop(room),
            prepareRoomJumpscare(room)
          ]);
          const failed = parts.find(part => part.status === "rejected");
          if (failed) throw failed.reason;
        })]);
        const failed = loaded.find(part => part.status === "rejected");
        if (failed) throw failed.reason;
        if (gameOver) return;
        roomsReady = true;
        activateRoom(activeRoomIndex, { initial: true });
        rememberCurrentRoom();
        if (loadingPlaybackInterrupted) recoverLoadingPlayback();
        else revealWhenMediaReady();
      } catch (error) { showLevelLoadError(error); }
      finally { levelLoading = false; }
    }

    async function resolveSavedScenes(catalog) {
      if (!resumedLevel) return [...catalog];
      const resolved = [...catalog];
      // A saved scene can be beyond a discovery gap or absent from an old
      // index.json. Probe its exact number, rather than treating the index as
      // proof that the saved files no longer exist.
      await Promise.all(resumedLevel.sceneNumbers.map(async number => {
        let names = [`room_${number}.png`, `room_${number}.mp4`, `jumpscare_${number}.mp4`];
        let found = (await Promise.all(names.map(async name => await levelAssetExists(name) ? name : null))).filter(Boolean);
        if (!buildSceneCatalog(found).length) {
          names = ["webp", "jpg", "jpeg", "webm", "m4v", "mov"].map(ext => `room_${number}.${ext}`)
            .concat(["webm", "m4v", "mov"].map(ext => `jumpscare_${number}.${ext}`));
          found.push(...(await Promise.all(names.map(async name => await levelAssetExists(name) ? name : null))).filter(Boolean));
        }
        const existing = resolved.findIndex(scene => scene.number === number);
        const actual = buildSceneCatalog(found)[0];
        if (actual) {
          if (existing < 0) resolved.push(actual); else resolved[existing] = actual;
        } else if (existing < 0) {
          // HEAD/range discovery can itself be blocked. Actual image/video
          // loading is authoritative; let it try the known saved filenames.
          resolved.push({ number, roomImage: new URL(`room_${number}.png`, levelBaseURL).href,
            roomVideo: new URL(`room_${number}.mp4`, levelBaseURL).href,
            jumpscare: new URL(`jumpscare_${number}.mp4`, levelBaseURL).href });
        }
      }));
      return resolved;
    }

    function mediaAssetError(url, cause, clip = null) {
      const name = decodeURIComponent(new URL(url, document.baseURI).pathname.split("/").pop());
      const code = clip?.error?.code || cause?.mediaCode || 0;
      const details = code === 3 ? "The browser could not decode it." : code === 4 ? "The browser rejected the video source or format." : code === 2 ? "The video transfer failed." : cause?.message || "Media loading failed.";
      const error = new Error(`Could not load ${name}. ${details}${code ? ` (media error ${code})` : ""}`);
      error.failureReason = "video";
      error.assetURL = url;
      error.mediaCode = code;
      error.cause = cause;
      return error;
    }

    function releaseRoomScareSource(room) {
      const oldURL = room.scareURL;
      const loading = room.mediaLoading;
      room.mediaLoading = true;
      room.scare.pause();
      room.scare.removeAttribute("src");
      room.scare.load();
      room.scareURL = null;
      room.metadataReady = room.scareReady = false;
      // Detach and reset the element before revoking the URL it used.
      if (oldURL?.startsWith("blob:")) URL.revokeObjectURL(oldURL);
      room.mediaLoading = loading;
    }

    function clearPreparedLevelCache() {
      levelFileNamesPromise = sceneCatalogPromise = dollDiscoveryPromise = null;
      dollFiles.clear();
      availableScenes = [];
      for (const room of roomMediaPool) {
        releaseRoomScareSource(room);
        room.video.pause();
        room.video.removeAttribute("src");
        room.video.load();
        room.backdropReady = room.videoCoverReady = false;
        room.forceFreshDownload = true;
      }
    }

    async function prepareRoomJumpscare(room) {
      room.mediaLoading = true;
      let failure;
      try {
        for (let attempt = 0; attempt < CONFIG.loading.mediaLoadAttempts; attempt++) {
          try {
            if (attempt || room.forceFreshDownload || room.scare.error) releaseRoomScareSource(room);
            if (!room.metadataReady || room.scare.readyState < HTMLMediaElement.HAVE_METADATA) {
              const downloaded = room.scareURL || await preloadJumpscareFile(room.scene.jumpscare, { fresh: Boolean(attempt || room.forceFreshDownload) });
              // Retry via the original same-origin media URL when a browser
              // rejects a Blob-backed player. The full file was fetched first.
              const source = attempt ? room.scene.jumpscare : downloaded;
              const metadata = waitForMedia(room.scare, "loadedmetadata", CONFIG.loading.jumpscareDownloadTimeoutMs);
              room.scareURL = source;
              room.scare.src = source;
              room.scare.load();
              if (source !== downloaded && downloaded.startsWith("blob:")) URL.revokeObjectURL(downloaded);
              await metadata;
              room.metadataReady = true;
              room.forceFreshDownload = false;
            }
            if (isPageInactive() || menuPage !== null) return;
            prepareJumpscareAudioGraph(room);
            try { await prepareJumpscarePlayback({ unlockAudio: sessionMediaUnlocked }, room); }
            catch (error) {
              room.preparationError = error;
              // Gesture/seek preparation failures remain behind the TAP gate.
              // Actual source failures retry loading before showing an error.
              if (room.scare.error) throw error;
              if (error.name !== "AbortError") console.info("Jumpscare preparation needs another attempt before READY.", error.message);
            }
            return;
          } catch (error) {
            failure = mediaAssetError(room.scene.jumpscare, error, room.scare);
            console.warn(`Jumpscare load attempt ${attempt + 1} failed.`, failure);
          }
        }
        releaseRoomScareSource(room);
        room.forceFreshDownload = true;
        throw failure;
      } finally { room.mediaLoading = false; }
    }

    async function preloadJumpscareFile(url, { fresh = false } = {}) {
      // Keep direct disk playback and its native audio path for file:// games.
      if (!/^https?:$/.test(new URL(url, document.baseURI).protocol)) return url;
      const controller = new AbortController();
      const cancelTimeout = visibleMediaTimeout(() => controller.abort(), CONFIG.loading.jumpscareDownloadTimeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal, cache: fresh ? "reload" : "default" });
        if (!response.ok || /text\/html/i.test(response.headers.get("content-type") || "")) {
          throw new Error(`Video download returned HTTP ${response.status}${/text\/html/i.test(response.headers.get("content-type") || "") ? " (a web page instead of video)" : ""}.`);
        }
        let clip = await response.blob();
        if (!clip.size) throw new Error("The selected jumpscare video is empty.");
        if (!/^video\//i.test(clip.type)) {
          const extension = new URL(url, document.baseURI).pathname.split(".").pop().toLowerCase();
          const type = extension === "webm" ? "video/webm" : extension === "mov" ? "video/quicktime" : "video/mp4";
          clip = new Blob([clip], { type });
        }
        return URL.createObjectURL(clip);
      } finally { cancelTimeout(); }
    }

    function parseWordList(text, contentType = "", language = CONFIG.language.code) {
      if (/text\/html|application\/xhtml\+xml/i.test(contentType) || /^\s*</.test(text)) {
        throw new Error("The server returned a web page instead of the word list.");
      }
      const loaded = [...new Set(text
        .split(/\r\n?|\n/)
        .map(line => line.trim())
        .filter(line => line && !line.startsWith("#"))
        .map(line => normalizeGameWord(line, language))
        .filter(Boolean))];
      if (!loaded.length) throw new Error("The file contains no valid words.");
      return loaded;
    }

    function parsePuzzleList(text, contentType = "", language = CONFIG.language.code) {
      if (typeof text !== "string" || !text.trim() || text.length > 2000000 ||
          /text\/html|application\/xhtml\+xml/i.test(contentType) || /^\s*</.test(text)) {
        throw new Error("The puzzle file is empty, too large, or is a web page instead of text.");
      }
      const puzzles = [], seen = new Set();
      for (const line of text.replace(/^\uFEFF/, "").split(/\r\n?|\n/)) {
        if (!line.trim() || /^\s*[#;]/.test(line)) continue;
        const match = /^(.+?)\s*\[([^\[\]]+)\]\s*$/.exec(line.trim());
        if (!match || match[1].length > 2048) continue;
        const rawAnswer = match[2].trim().normalize("NFKC");
        const answer = normalizeGameWord(rawAnswer, language);
        if (!answer || language !== "ar" && !/^[a-z]+$/i.test(rawAnswer) || answer.length > 32) continue;
        const prompt = match[1].trim(), key = `${prompt}\n${answer}`;
        if (seen.has(key)) continue;
        seen.add(key); puzzles.push({ prompt, answer });
      }
      if (!puzzles.length) throw new Error('No valid puzzles. Use one line per puzzle: A short riddle [answer]. Answers must be single words in the configured language.');
      return puzzles;
    }

    async function preparePuzzleForLevel() {
      wordsLoading = true;
      const file = puzzlesFileFor(), controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), WORDS_TIMEOUT_MS);
      wordLoadInfo = { status: "loading", url: new URL(file, document.baseURI).href, count: 0, error: null };
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      try {
        if (resumedLevel) {
          currentPuzzle = { ...resumedLevel.puzzle };
          acceptWordList(currentPuzzle.answer, "save.txt", "text/plain", { preserveOrder: true });
          return;
        }
        let text, source = wordLoadInfo.url, type = "text/plain";
        if (puzzleTextOverride) { text = puzzleTextOverride.text; source = puzzleTextOverride.source; }
        else if (localFolderImport) {
          if (typeof localFolderImport.puzzlesText !== "string") throw new Error(`The cached local folder has no ${file}. Choose it below, or use Change local files to read the folder again.`);
          text = localFolderImport.puzzlesText; source = localFolderImport.puzzlesSource || file;
        } else {
          const response = await fetch(source, { cache: "no-store", signal: controller.signal });
          if (!response.ok) throw new Error(`The server returned HTTP ${response.status} for ${file}.`);
          text = await response.text(); type = response.headers.get("content-type") || ""; source = response.url;
        }
        const scoped = contentMilestonePool(parsePuzzleList(text, type), "puzzles");
        const eligible = scoped.filter(puzzle =>
          puzzle.answer.length >= CONFIG.puzzles.minAnswerLength && puzzle.answer.length <= CONFIG.puzzles.maxAnswerLength &&
          (isSingleRoomLevel() || puzzle.answer.length <= availableScenes.length));
        if (!eligible.length) throw new Error(`No riddle in the current file pool fits ${CONFIG.puzzles.minAnswerLength}–${CONFIG.puzzles.maxAnswerLength} letters and the ${availableScenes.length} room/jumpscare pairs unlocked at level ${progressionLevel()}. Check your content and scene milestones.`);
        currentPuzzle = { ...eligible[Math.floor(Math.random() * eligible.length)] };
        levelRoomCount = isSingleRoomLevel() ? 1 : Math.max(CONFIG.rooms.count, currentPuzzle.answer.length);
        acceptWordList(currentPuzzle.answer, source, "text/plain");
        wordLoadInfo.count = eligible.length;
      } finally { clearTimeout(timeout); wordsLoading = false; }
    }

    function acceptWordList(text, source, contentType = "", { preserveOrder = false } = {}) {
      const loaded = parseWordList(text, contentType);
      const scoped = isPuzzleLevel() || resumedLevel ? loaded : contentMilestonePool(loaded, "words");
      const maxLength = isSingleRoomLevel() ? 32 : levelRoomCount;
      const eligible = scoped.filter(word => word.length > 0 && word.length <= maxLength);
      const seeded = resumedLevel?.legacy ? resumedLevel.words.filter(word => word.length > 0 && word.length <= levelRoomCount) : [];
      const pool = preserveOrder ? eligible : [...seeded, ...shuffleArray(eligible.filter(word => !seeded.includes(word)))];
      if (pool.length < levelType.wordCount) throw new Error(`${levelDataFile()} needs at least ${levelType.wordCount} unique answers of ${maxLength} letters or fewer; found ${pool.length}.`);
      words = pool.slice(0, levelType.wordCount);
      wordLetterRooms = resumedLevel && !resumedLevel.legacy ? resumedLevel.letterRooms.map(order => [...order]) : words.map(word => {
        if (isSingleRoomLevel()) return Array(word.length).fill(0);
        const order = Array.from({ length: levelRoomCount }, (_, index) => index);
        if (CONFIG.rooms.shuffleLetterRooms) shuffleArray(order);
        return order.slice(0, word.length);
