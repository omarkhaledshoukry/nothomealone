<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="only light" />
  <title>Room Word Hunt</title>
  <style>
    @font-face {
      font-family: "Game Arabic Paper";
      src: url("./Arabic-Font.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Game Arabic";
      src: local("Noto Naskh Arabic"), local("Amiri"), local("Traditional Arabic"), local("Geeza Pro"),
        url("./NotoNaskhArabic-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      color-scheme: only light;
      --tarantino-yellow: #f6d20a;
      --letter-beige: rgba(241, 239, 229, 0.80);
      --ink: #090909;
      --game-height: 100vh;
      --view-unit: 1vh;
    }

    @supports (height: 100dvh) {
      :root { --game-height: 100dvh; --view-unit: 1dvh; }
    }

    @font-face {
      font-family: "Dudu Calligraphy";
      src: local("Dudu Calligraphy"), local("DuduCalligraphy"), local("Dudu_Calligraphy"),
        url("./Dudu_Calligraphy.ttf") format("truetype");
      font-display: swap;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    body { cursor: grab; }
    body.grabbing { cursor: grabbing; }

    #game {
      color-scheme: light;
      color-scheme: only light;
      forced-color-adjust: none;
      position: fixed;
      top: var(--game-top, 0px);
      left: var(--game-left, 0px);
      width: var(--game-width, 100%);
      height: var(--game-height);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #portraitViewport {
      --safe-left: max(0px, calc(env(safe-area-inset-left) - var(--frame-left-gap, 0px)));
      --safe-right: max(0px, calc(env(safe-area-inset-right) - var(--frame-right-gap, 0px)));
      position: relative;
      height: 100%;
      aspect-ratio: var(--frame-aspect, .625);
      max-width: 100%;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 40px rgba(0, 0, 0, .8);
      isolation: isolate;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (max-width: 600px) and (orientation: portrait), (pointer: coarse) and (orientation: portrait) {
      #portraitViewport { width: 100%; }
    }

    #sceneEffects {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      transform-origin: 50% 50%;
      will-change: transform, filter;
    }

    .room-image,
    .room-video,
    .room-video-cover {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #letterWorld {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    .room-image,
    .room-video,
    .room-video-cover {
      z-index: 1;
      user-select: none;
      pointer-events: none;
      filter: blur(0px);
      transition: filter 420ms ease;
    }

    .room-image {
      display: none;
      max-width: none;
      -webkit-user-drag: none;
    }

    .room-video-cover {
      display: none;
      max-width: none;
    }

    .room-image.snapping,
    .room-video.snapping,
    .room-video-cover.snapping,
    #letterWorld.snapping,
    #anomalyWorld.snapping,
    #spiderWorld.snapping,
    .jumpscare-video.snapping {
      transition: transform var(--centre-flight-ms, 420ms) cubic-bezier(.22,.72,.22,1), filter 420ms ease;
    }

    #portraitViewport.hand-active .room-image,
    #portraitViewport.hand-active .room-video,
    #portraitViewport.hand-active .room-video-cover {
      filter: blur(var(--hand-blur, 3px));
    }

    #letterWorld {
      z-index: 2;
      pointer-events: none;
      filter: blur(var(--letter-blur, .7px));
      transition: filter 420ms ease;
    }

    #portraitViewport.hand-active #letterWorld {
      filter: blur(var(--hand-blur, 3px));
    }

    .letter-anchor {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .letter-tile {
      padding: 8px;
      display: inline-grid;
      place-items: center;
      color: var(--letter-beige);
      background: transparent;
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      line-height: 1;
      user-select: none;
      pointer-events: none;
      transform: rotate(var(--letter-rotation, 0deg));
      transform-origin: center;
    }

    .letter-glyph {
      display: block;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: calc(var(--letter-base-size, 53px) * var(--letter-scale, 1));
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: .015em;
      pointer-events: none;
    }

    .letter-anchor.appearing .letter-tile { animation: letterFadeIn var(--letter-fade-ms, 150ms) ease-out both; }
    .letter-tile.first-letter .letter-glyph { animation: letterVibrate var(--letter-vibrate-ms, 400ms) steps(1, end) infinite; }
    .letter-tile.butterfly-letter {
      transform: rotate(calc(var(--letter-rotation, 0deg) + var(--butterfly-bank, 0deg)))
        rotateY(var(--butterfly-flutter, 0deg));
      will-change: transform;
    }

    @keyframes letterFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes letterVibrate {
      0%, 100% { translate: 0 0; }
      25% { translate: var(--jitter-x1, 2px) var(--jitter-y1, -1px); }
      50% { translate: var(--jitter-x2, -2px) var(--jitter-y2, 1px); }
      75% { translate: var(--jitter-x3, 1px) var(--jitter-y3, 2px); }
    }

    #captureEffects {
      position: absolute;
      z-index: 11;
      inset: 0;
      pointer-events: none;
    }

    .captured-letter {
      position: absolute;
      display: block;
      line-height: 1;
      font-weight: 400;
      text-transform: uppercase;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .letter-anchor[hidden] {
      display: none;
    }

    #cameraOverlay {
      position: absolute;
      z-index: 10;
      inset: 0;
      color: var(--camera-color, #fff);
      font-family: "OCR A Std", "OCR A Extended", "Lucida Console", Monaco, monospace;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      text-shadow: none;
      transition: opacity var(--clue-fade-ms, 180ms) ease;
    }

    #cameraBattery,
    #cameraTimer,
    #status {
      position: absolute;
      top: max(5%, calc(env(safe-area-inset-top) + 12px));
      font-size: var(--ui-font-size, 18px);
      line-height: 1;
    }

    #cameraBattery {
      left: max(4.5%, calc(var(--safe-left) + 10px));
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #cameraBattery svg {
      width: var(--battery-width, 40px);
      height: auto;
    }

    #batteryPercent { font-size: .9em; }
    .battery-slot.drained { fill: transparent; }

    #cameraTimer {
      right: max(4.5%, calc(var(--safe-right) + 10px));
    }

    #hud {
      position: absolute;
      top: max(4%, calc(env(safe-area-inset-top) + 8px));
      left: 27%;
      width: 46%;
      padding: 0;
      text-align: center;
      pointer-events: none;
    }

    #wordDisplay {
      min-height: clamp(22px, calc(var(--view-unit) * 4.1), 42px);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--hud-letter-gap, 2px);
    }

    .hud-letter {
      min-width: 0;
      color: rgba(255, 255, 255, .58);
      font-size: var(--hud-letter-size, 28px);
      font-weight: 400;
      text-transform: uppercase;
      border: 0;
      line-height: 1.1;
    }

    .hud-letter.found {
      color: #fff;
      border: 0;
      animation: hudPop var(--hud-pop-ms, 160ms) ease both;
    }

    #status {
      left: 50%;
      transform: translateX(-50%);
      font-weight: 400;
      white-space: nowrap;
    }

    #status.puzzle-hint {
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
    }
    #status.puzzle-hint::before { content: ""; position: absolute; inset: -14px -12px; }
    #status.puzzle-hint[aria-disabled="true"] { pointer-events: none; }

    #portraitViewport.hint-transition #sceneEffects { transition: filter var(--hint-fade-ms, 140ms) ease; }
    #portraitViewport.hint-active #sceneEffects,
    #portraitViewport.hint-active #handBlocker { filter: blur(var(--hint-blur, 5px)); }

    #clueIntro.hint-mode {
      visibility: visible;
      pointer-events: none;
      transition: opacity var(--hint-fade-ms, 140ms) ease;
    }
    #clueIntro.hint-mode #readyButton,
    #clueIntro.hint-mode .clue-file-controls { display: none; }
    #clueIntro.hint-mode.show { pointer-events: none; }

    .room-navigation {
      appearance: none;
      -webkit-appearance: none;
      position: absolute;
      bottom: max(3.3%, calc(env(safe-area-inset-bottom) + 4px));
      min-width: 64px;
      min-height: 44px;
      padding: 8px;
      border: 0;
      background: transparent;
      color: var(--camera-color, #fff);
      -webkit-text-fill-color: var(--camera-color, #fff);
      font: inherit;
      font-size: var(--ui-font-size, 18px);
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #prevRoomButton { left: max(2.5%, calc(var(--safe-left) + 2px)); }
    #nextRoomButton { right: max(2.5%, calc(var(--safe-right) + 2px)); }
    .room-navigation:active { transform: scale(.95); }
    .room-navigation:disabled { opacity: .45; cursor: default; }
    .room-navigation:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }

    #snapButton {
      appearance: none;
      -webkit-appearance: none;
      position: absolute;
      left: 50%;
      bottom: max(var(--shutter-bottom, 8%), calc(env(safe-area-inset-bottom) + 12px));
      width: clamp(var(--shutter-min, 56px), calc(var(--view-unit) * var(--shutter-size-vh, 10)), var(--shutter-max, 88px));
      height: clamp(var(--shutter-min, 56px), calc(var(--view-unit) * var(--shutter-size-vh, 10)), var(--shutter-max, 88px));
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: translateX(-50%);
      padding: var(--shutter-padding, 4px);
      border: var(--shutter-ring, 2px) solid var(--shutter-color, #fff);
      color: #fff;
      opacity: 1;
      border-radius: 50%;
      outline: none;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .shutter-core {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--shutter-color, #fff);
      transition: transform var(--shutter-release-ms, 90ms) ease;
    }

    #snapButton:active:not(:disabled) .shutter-core,
    #snapButton.held .shutter-core { transform: scale(var(--shutter-held-scale, .9)); }
    #snapButton.snapping .shutter-core { animation: shutterPress var(--shutter-press-ms, 180ms) ease-in-out; }
    #snapButton:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    #snapButton:disabled { cursor: default; opacity: 1; border-color: var(--shutter-color, #fff); }

    #shutterBitmap { display: none; }
    #cameraOverlay.bitmap-shutter #shutterBitmap {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #cameraOverlay.bitmap-shutter #snapButton {
      border-color: transparent;
      background: transparent;
      -webkit-filter: none;
      filter: none;
    }
    #cameraOverlay.bitmap-shutter .shutter-core { visibility: hidden; }

    @keyframes shutterPress {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(var(--shutter-held-scale, .9)); }
    }


    #loadingScreen {
      position: absolute;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      pointer-events: auto;
    }

    #loadingScreen {
      z-index: 200;
      transition: opacity var(--loader-fade-ms, 220ms) ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loadingWord {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.02em;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: clamp(38px, calc(var(--view-unit) * 6), 62px);
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
    }

    #loadingWord[hidden], #wordLoadError[hidden] { display: none; }
    #wordLoadError {
      width: min(88%, 440px);
      max-height: 90%;
      overflow: auto;
      padding: 20px;
      color: #f1efe5;
      font: 16px/1.45 Arial, Helvetica, sans-serif;
      text-align: left;
      cursor: auto;
    }
    #wordLoadError h2 { margin: 0 0 12px; font-size: 23px; }
    #wordLoadError p { margin: 12px 0; }
    #wordLoadUrl { color: inherit; overflow-wrap: anywhere; }
    .word-error-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .word-error-actions button {
      padding: 10px 14px;
      border: 1px solid currentColor;
      border-radius: 5px;
      color: inherit;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    #localFileControls[hidden] { display: none; }
    .clue-file-controls {
      position: absolute;
      left: 4%; right: 4%;
      bottom: max(3%, calc(env(safe-area-inset-bottom) + 8px));
      display: flex; align-items: flex-start; flex-wrap: wrap; gap: 6px 12px;
      pointer-events: auto;
    }
    #localFileControls { pointer-events: auto; }
    .progress-actions { display: flex; flex-wrap: wrap; gap: 6px; max-width: 100%; font: 12px Arial, Helvetica, sans-serif; }
    .progress-actions button { padding: 8px; border: 1px solid currentColor; border-radius: 4px; background: transparent; color: var(--letter-beige); font: inherit; cursor: pointer; }
    .progress-status { flex-basis: 100%; color: var(--letter-beige); font-size: 11px; line-height: 1.3; }
    #gameOverScreen > .progress-actions { position: absolute; bottom: max(3%, calc(env(safe-area-inset-bottom) + 8px)); left: 4%; right: 4%; justify-content: center; }
    #changeLocalFilesButton {
      padding: 8px 10px;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: transparent;
      color: var(--letter-beige);
      font: 13px Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    .loading-letter {
      display: inline-block;
      animation: loadingJitter var(--loading-jitter-ms, 400ms) steps(1, end) infinite;
    }

    @keyframes loadingJitter {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(var(--lx1), var(--ly1)); }
      50%  { transform: translate(var(--lx2), var(--ly2)); }
      75%  { transform: translate(var(--lx3), var(--ly3)); }
      100% { transform: translate(0, 0); }
    }

    /* Post-loading clue-note interstitial. */
    #clueIntro {
      position: absolute;
      z-index: 120;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--clue-fade-ms, 180ms) ease;
    }

    #clueIntro.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #clueIntro.dismiss {
      opacity: 0;
      pointer-events: none;
    }

    #clueCard {
      position: relative;
      width: min(78%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(calc(var(--view-unit) * -1.5));
    }

    #cluePaperWrap {
      position: relative;
      width: 100%;
    }

    #cluePaper,
    #cluePaperBitmap {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.34));
      color-scheme: light;
      color-scheme: only light;
      forced-color-adjust: none;
      opacity: 1;
      mix-blend-mode: normal;
    }

    #cluePaperBitmap {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      visibility: hidden;
      pointer-events: none;
    }

    #cluePaperWrap.bitmap-paper #cluePaper { visibility: hidden; }
    #cluePaperWrap.bitmap-paper #cluePaperBitmap { visibility: visible; }

    #cluePaperText {
      position: absolute;
      inset: 13% 12% 12% 17%;
      color: #000;
      -webkit-text-fill-color: #000;
      forced-color-adjust: none;
      /* Keep the final ink black when legacy Android forced-dark changes
         text paint colours. The paper image stays outside this filter. */
      -webkit-filter: brightness(0);
      filter: brightness(0);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      text-align: left;
      transform: rotate(-0.4deg);
      pointer-events: none;
    }

    #clueTitle {
      margin: 0 0 10% 0;
      text-align: center;
      font-size: clamp(31px, calc(var(--view-unit) * 5.2), 48px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-decoration: underline;
      text-underline-offset: .12em;
    }
    #clueTitle.riddle-title { text-transform: none; }

    #clueList {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: clamp(13px, calc(var(--view-unit) * 2.3), 24px);
      font-size: clamp(22px, calc(var(--view-unit) * 3.5), 34px);
      line-height: 1.05;
      text-transform: uppercase;
    }

    #clueList li::before { content: "- "; }

    #puzzleText {
      margin: 0;
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: var(--puzzle-font-size, 25px);
      line-height: 1.3;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      text-transform: none;
    }
    #puzzleText[hidden], #clueList[hidden] { display: none; }
    :root[data-game-language="ar"] #puzzleText {
      font-family: "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", Tahoma, serif;
      direction: rtl;
      text-align: right;
    }

    #readyButton {
      appearance: none;
      border: 0;
      padding: 10px 12px;
      margin-top: 8px;
      align-self: flex-end;
      background: transparent;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: clamp(26px, calc(var(--view-unit) * 4.2), 40px);
      font-weight: 400;
      line-height: 1;
      text-transform: uppercase;
      cursor: pointer;
      animation: readyJitter 0.4s steps(1, end) infinite;
    }

    @keyframes readyJitter {
      0%   { transform: translate(0,0); }
      25%  { transform: translate(2px,-1px); }
      50%  { transform: translate(-2px,1px); }
      75%  { transform: translate(1px,2px); }
      100% { transform: translate(0,0); }
    }

    /* During the clue card, keep the prepared room soft and hide gameplay UI. */
    #portraitViewport.clue-intro-active .room-image,
    #portraitViewport.clue-intro-active .room-video,
    #portraitViewport.clue-intro-active .room-video-cover {
      filter: blur(var(--clue-blur, 5px));
    }

    #letterWorld,
    #hud {
      transition: filter 420ms ease, opacity 320ms ease;
    }

    #portraitViewport.clue-intro-active #letterWorld,
    #portraitViewport.clue-intro-active #cameraOverlay {
      opacity: 0;
    }

    #anomalyWorld,
    #spiderWorld {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      pointer-events: none;
      will-change: transform;
    }

    #spiderWorld { z-index: 4; }
    #spiderActor {
      position: absolute;
      top: -10px;
      pointer-events: none;
      will-change: transform;
    }
    #spiderActor[hidden] { display: none; }
    #spiderCanvas, #spiderImage {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      color-scheme: light;
      color-scheme: only light;
      forced-color-adjust: none;
    }
    #spiderImage { display: none; }

    #anomalyImage,
    #anomalyBitmap {
      position: absolute;
      display: none;
      height: 100%;
      width: auto;
      max-width: none;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #blackFlash { display: none; }

    .jumpscare-video {
      position: absolute;
      z-index: 150;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      max-width: none;
      object-fit: fill;
      display: none;
      opacity: 1;
      background: transparent;
      pointer-events: none;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    .jumpscare-video.playing {
      display: block;
      opacity: 1;
    }

    .jumpscare-video.priming {
      display: block;
      opacity: .001;
    }

    #gameOverScreen {
      position: absolute;
      z-index: 160;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: #000;
      color: var(--letter-beige);
      font-family: "Dudu Calligraphy", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      text-align: center;
      cursor: pointer;
    }

    #gameOverScreen.show { display: flex; }
    #gameOverScreen.show #gameOverTitle { animation: gameOverJitter var(--game-over-jitter-ms, 380ms) steps(1, end) infinite; }
    #gameOverScreen.show #retryText { animation: gameOverJitter var(--retry-jitter-ms, 430ms) steps(1, end) var(--retry-jitter-delay, 75ms) infinite; }
    #gameOverTitle { max-width: 94%; overflow-wrap: anywhere; font-size: clamp(var(--game-over-min, 42px), calc(var(--view-unit) * var(--game-over-vh, 7)), var(--game-over-max, 72px)); line-height: 1; }
    #retryText { max-width: 94%; font-size: clamp(var(--retry-min, 20px), calc(var(--view-unit) * var(--retry-vh, 3)), var(--retry-max, 30px)); opacity: .78; }

    @keyframes gameOverJitter {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(2px, -1px); }
      40% { transform: translate(-2px, 2px); }
      60% { transform: translate(1px, -2px); }
      80% { transform: translate(-1px, 1px); }
    }


    #handBlocker {
      position: absolute;
      z-index: 30;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      touch-action: none;
    }

    #handBlocker.active {
      pointer-events: auto;
      cursor: grab;
    }

    #handBlocker.dragging {
      cursor: grabbing;
    }

    #handImage,
    #handBitmap {
      position: absolute;
      left: 50%;
      bottom: -10%;
      width: 100%;
      height: auto;
      max-width: none;
      object-fit: contain;
      transform: translate(-50%, 120%);
      transform-origin: 50% 100%;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      will-change: transform;
    }

    #handBlocker.entering #handImage,
    #handBlocker.entering #handBitmap {
      animation: handEnter var(--hand-enter-ms, 520ms) cubic-bezier(.18,.82,.28,1) forwards;
    }

    #handBlocker.resting #handImage,
    #handBlocker.resting #handBitmap {
      transform: translate(-50%, 0);
    }

    #handBlocker.exiting #handImage,
    #handBlocker.exiting #handBitmap {
      animation: handExit var(--hand-exit-ms, 300ms) cubic-bezier(.55,.05,.82,.34) forwards;
    }

    @keyframes handEnter {
      from { transform: translate(-50%, 120%); }
      to { transform: translate(-50%, 0); }
    }

    @keyframes handExit {
      from { transform: translate(-50%, 0); }
      to { transform: translate(-50%, 125%); }
    }

    #message {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--tarantino-yellow);
      font-size: clamp(34px, calc(var(--view-unit) * 6), 62px);
      font-weight: 1000;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-shadow: none;
      opacity: 0;
      transform: scale(.82);
      pointer-events: none;
    }

    #message.show { animation: messageFlash var(--found-flash-ms, 620ms) ease both; }

    #handBitmap, #anomalyBitmap, #messageBitmap {
      display: none;
      visibility: hidden;
      color-scheme: light;
      color-scheme: only light;
      forced-color-adjust: none;
      pointer-events: none;
    }
    #messageBitmap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    @keyframes hudPop {
      from { transform: scale(.68); }
      to { transform: scale(1); }
    }

    @keyframes messageFlash {
      0% { opacity: 0; transform: scale(.82); }
      25%, 68% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.08); }
    }

    :root[data-game-language="ar"] .letter-glyph {
      font-family: "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
      text-transform: none;
      letter-spacing: 0;
      line-height: 1.5;
      direction: rtl;
    }
    :root[data-game-language="ar"] #clueList {
      font-family: "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
      direction: rtl;
      text-align: right;
      text-transform: none;
      letter-spacing: 0;
      line-height: 1.55;
    }
    :root[data-game-language="ar"] #wordDisplay {
      direction: rtl;
      gap: 4px;
      font-family: "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
      font-size: var(--hud-letter-size, 40px);
      line-height: 1.6;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
    }
    .arabic-hud-prefix {
      color: #fff; direction: rtl; unicode-bidi: isolate;
      font-family: "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
    }
    :root[data-game-language="ar"] .captured-letter {
      font-family: "Game Arabic Paper", "Game Arabic", "Noto Naskh Arabic", "Geeza Pro", Tahoma, serif;
      text-transform: none;
      letter-spacing: 0;
      line-height: 1.5;
      direction: rtl;
    }
    .arabic-hud-remaining { color: rgba(255,255,255,.58); direction: rtl; unicode-bidi: isolate; }

    /* Include the outer page too: older Android browsers can highlight a
       touch target's ancestor while the visible room is being replaced. */
    html,
    body,
    #game,
    #portraitViewport,
    #portraitViewport * {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Native edge glow is separate from tap highlighting. Camera movement
       uses transforms, so the page and game frame never need overscroll. */
    html,
    body,
    #game,
    #portraitViewport {
      overscroll-behavior: none;
    }

    #portraitViewport button:focus,
    #portraitViewport [role="button"]:focus {
      outline: none;
    }

    /* This class also preserves keyboard focus on older Android browsers
       that do not support :focus-visible. Pointer input removes the class. */
    #portraitViewport.keyboard-controls button:focus,
    #portraitViewport.keyboard-controls [role="button"]:focus {
      outline: 2px solid var(--camera-color, #fff);
      outline-offset: 3px;
    }
  </style>
</head>

      for (const character of text) {

        x += context.measureText(character).width + spacing;
      }
      messageBitmap.style.display = "block";
      messageBitmap.style.visibility = "visible";
      messageText.style.opacity = "0";

    // Only these exact numbered filenames can enter the scene catalogue.
    // Group by number before choosing anything, so missing partners are skipped.
    function buildSceneCatalog(filenames) {
      const groups = new Map();
      const imageTypes = ["png", "webp", "jpg", "jpeg"];
      const videoTypes = ["mp4", "webm", "m4v", "mov"];
      for (const entry of filenames) {
        const name = typeof entry === "string" ? entry : entry?.name;
        if (!name) continue;
        const match = /^(room|jumpscare)_(\d+)\.(png|webp|jpe?g|mp4|webm|m4v|mov)$/i.exec(name);
        if (!match) continue;
        const number = Number(match[2]);
        if (!Number.isSafeInteger(number) || number < 1) continue;
        if (!groups.has(number)) groups.set(number, { number, images: [], videos: [], scares: [] });
        const group = groups.get(number);
        const extension = match[3].toLowerCase();
        if (match[1].toLowerCase() === "room") {
          (imageTypes.includes(extension) ? group.images : group.videos).push(name);
        } else if (videoTypes.includes(extension)) group.scares.push(name);
      }
      const preferred = (names, types) => names.sort((a, b) =>
        types.indexOf(a.split(".").pop().toLowerCase()) - types.indexOf(b.split(".").pop().toLowerCase()))[0] || null;
      const assetURL = name => name ? new URL(encodeURIComponent(name), levelBaseURL).href : null;
      return [...groups.values()].sort((a, b) => a.number - b.number).flatMap(group => {
        const roomImage = preferred(group.images, imageTypes);
        const roomVideo = preferred(group.videos, videoTypes);
        const jumpscare = preferred(group.scares, videoTypes);
        if ((!roomImage && !roomVideo) || !jumpscare) return [];
        return [{ number: group.number, roomImage: assetURL(roomImage), roomVideo: assetURL(roomVideo), jumpscare: assetURL(jumpscare) }];
      });
    }

    async function fetchLevelResource(url, options = {}, consume = response => response) {
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), CONFIG.loading.resourceTimeoutMs);
      try {
        const response = await fetch(url, { cache: "no-store", ...options, signal: controller.signal });
        return await consume(response);
      } finally { window.clearTimeout(timer); }
    }

    async function readLevelIndex() {
      try {
        return await fetchLevelResource(new URL(CONFIG.assets.levelIndexFile, levelBaseURL), {}, async response => {
          if (!response.ok || /text\/html/i.test(response.headers.get("content-type") || "")) return [];
          const data = await response.json();
          return Array.isArray(data) ? data : Array.isArray(data.files) ? data.files : [];
        });
      } catch { return []; }
    }

    async function readLevelDirectory() {
      try {
        return await fetchLevelResource(levelBaseURL, {}, async response => {
          if (!response.ok) return [];
          const html = new DOMParser().parseFromString(await response.text(), "text/html");
          return [...html.querySelectorAll("a[href]")].flatMap(link => {
            try {
              const url = new URL(link.getAttribute("href"), levelBaseURL);
              if (url.origin !== levelBaseURL.origin || !url.pathname.startsWith(levelBaseURL.pathname)) return [];
              const name = decodeURIComponent(url.pathname.slice(levelBaseURL.pathname.length));
              return name && !name.includes("/") ? [name] : [];
            } catch { return []; }
          });
        });
      } catch { return []; }
    }

    async function levelAssetExists(name) {
      const url = new URL(name, levelBaseURL);
      if (url.protocol === "file:") {
        // Local HTML cannot fetch a folder, but media metadata remains readable.
        // Probe without playing, then release each temporary media element.
        return new Promise(resolve => {
          const image = /\.png$/i.test(name);
          const probe = document.createElement(image ? "img" : "video");
          let timer;
          const finish = exists => {
            window.clearTimeout(timer);
            probe.onload = probe.onloadedmetadata = probe.onerror = null;
            probe.removeAttribute("src");
            if (!image) probe.load();
            resolve(exists);
          };
          probe.onerror = () => finish(false);
          if (image) probe.onload = () => finish(probe.naturalWidth > 0);
          else {
            probe.preload = "metadata";
            probe.muted = true;
            probe.playsInline = true;
            probe.onloadedmetadata = () => finish(probe.videoWidth > 0);
          }
          timer = window.setTimeout(() => finish(false), CONFIG.loading.resourceTimeoutMs);
          probe.src = url.href;
        });
      }
      try {
        const response = await fetchLevelResource(url, { method: "HEAD" });
        if (response.ok) {
          const type = response.headers.get("content-type") || "";
          if (/^video\/|^image\//i.test(type)) return true;
          if (/text\/html/i.test(type)) return false;
        } else if (response.status !== 405 && response.status !== 501) return false;
        // Some static hosts do not implement HEAD. Read just the first chunk
        // and cancel it, rather than downloading every video for discovery.
        return await fetchLevelResource(url, { headers: { Range: "bytes=0-31" } }, async sample => {
          if (!sample.ok || /text\/html/i.test(sample.headers.get("content-type") || "")) return false;
          const reader = sample.body?.getReader();
          if (!reader) return false;
          try {
            const { value } = await reader.read();
            if (!value || value.length < 8) return false;
            const tag = String.fromCharCode(...value.slice(4, 8));
            return tag === "ftyp" || value[0] === 0x1a && value[1] === 0x45 && value[2] === 0xdf && value[3] === 0xa3 ||
              value[0] === 0x89 && value[1] === 0x50 && value[2] === 0x4e && value[3] === 0x47;
          } finally { await reader.cancel().catch(() => {}); }
        });
      } catch { return false; }
    }

    async function probeNumberedLevels() {
      const filenames = [];
      let next = 1;
      let absent = 0;
      while (absent < LEVEL_PROBE_GAP) {
        const batch = await Promise.all(Array.from({ length: CONFIG.loading.levelProbeBatchSize }, (_, i) => next + i).map(async number => {
          const names = [`room_${number}.png`, `room_${number}.mp4`, `jumpscare_${number}.mp4`];
          const found = await Promise.all(names.map(levelAssetExists));
          return names.filter((_, i) => found[i]);
        }));
        for (const found of batch) {
          filenames.push(...found);
          absent = found.length ? 0 : absent + 1;
        }
        next += batch.length;
      }
      return buildSceneCatalog(filenames);
    }

    async function discoverScenes() {
      if (levelBaseURL.protocol === "file:") return probeNumberedLevels();
      // An optional index is {"files":["room_1.mp4","jumpscare_1.mp4",...]}
      // or a filename array. Normal web-server directory listings work too.
      const [indexed, listed] = await Promise.all([readLevelIndex(), readLevelDirectory()]);
      const scenes = buildSceneCatalog([...indexed, ...listed]);
      return scenes.length ? scenes : probeNumberedLevels();
    }

    function chooseScene(scenes) {
      return scenes.length ? scenes[Math.floor(Math.random() * scenes.length)] : null;

    function makeLevelRoom(scene, index) {
      const image = index === 0 ? roomImage : roomImage.cloneNode(false);
      const backgroundVideo = index === 0 ? video : video.cloneNode(false);

        sceneEffects.insertBefore(backgroundVideo, letterWorld);

      videoCover.className = "room-video-cover";
      videoCover.setAttribute("aria-hidden", "true");
      sceneEffects.insertBefore(videoCover, letterWorld);
      image.style.display = backgroundVideo.style.display = "none";
      scare.style.display = "";
      const room = { scene, image, video: backgroundVideo, videoCover, scare, media: image,
        videoCoverReady: false, videoFrameCancel: null, videoRun: 0,
        backdropReady: false, metadataReady: false, scareReady: false,
        warmAttempted: false, preparing: null, audioUnlocked: false,
        audioGain: null, audioSource: null, cameraFraction: .5, standbySeekCancel: null,
        deadlineWarmStarted: false };
      scare.addEventListener("ended", () => {
        if (scare === jumpscareVideo && gameOver && scare.classList.contains("playing")) showGameOver();
      });
      scare.addEventListener("error", () => {
        if (gameOver || roomCompleted) return;
        if (roomsReady && scare !== jumpscareVideo) return;
        beginGameOver(gameplayStarted ? "other" : "video");
        loadingScreen.classList.add("hidden");
        showGameOver();
      });
      return room;
    }

    function waitForMedia(element, successEvent, timeoutMs) {
      return new Promise((resolve, reject) => {
        const cleanup = () => { clearTimeout(timer); element.removeEventListener(successEvent, done); element.removeEventListener("error", fail); };
        const done = () => { cleanup(); resolve(); };
        const fail = () => { cleanup(); reject(new Error(`Could not load ${element.currentSrc || element.src}`)); };
        const timer = setTimeout(fail, timeoutMs);
        element.addEventListener(successEvent, done, { once: true });
        element.addEventListener("error", fail, { once: true });
      });
    }

    function cacheRoomVideoFrame(room) {
      const clip = room.video, cover = room.videoCover;
      if (clip.readyState < HTMLMediaElement.HAVE_CURRENT_DATA || !clip.videoWidth || !clip.videoHeight) return false;
      try {
        const context = cover.getContext("2d");
        if (!context) return false;
        if (!room.videoCoverReady) {
          // A temporary still only needs the current display resolution.
          // Keep one bounded bitmap per room instead of full-resolution copies.
          const scale = Math.min(1, viewport.clientHeight / clip.videoHeight);
          cover.width = Math.max(1, Math.round(clip.videoWidth * scale));
          cover.height = Math.max(1, Math.round(clip.videoHeight * scale));
        }
        context.drawImage(clip, 0, 0, cover.width, cover.height);
        room.videoCoverReady = true;
        return true;
      } catch { return false; }
    }

    function waitForRoomVideoFrame(room, onFrame = () => {}, timeoutMs = CONFIG.loading.resourceTimeoutMs) {
      room.videoFrameCancel?.();
      const clip = room.video, startTime = clip.currentTime;
      return new Promise(resolve => {
        let settled = false, presented = false, frameRequest = null, paintRequest = null, fallbackTimer;
        const finish = ready => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout); clearTimeout(fallbackTimer);
          if (frameRequest !== null) clip.cancelVideoFrameCallback?.(frameRequest);
          if (paintRequest !== null) cancelAnimationFrame(paintRequest);
          clip.removeEventListener("error", cancel);
          if (room.videoFrameCancel === cancel) room.videoFrameCancel = null;
          resolve(ready);
        };
        const cancel = () => finish(false);
        const frameReady = () => {
          if (settled || presented || clip.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
          presented = true;
          if (paintRequest !== null) cancelAnimationFrame(paintRequest);
          onFrame();
          // Keep the still above the video while its visible layer is painted.
          paintRequest = requestAnimationFrame(() => {
            paintRequest = requestAnimationFrame(() => finish(true));
          });
        };
        const checkLegacyFrame = () => {
          if (settled || presented) return;
          if (!clip.paused && clip.currentTime !== startTime && clip.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) frameReady();
          else paintRequest = requestAnimationFrame(checkLegacyFrame);
        };
        const timeout = timeoutMs > 0 ? setTimeout(cancel, timeoutMs) : null;
        room.videoFrameCancel = cancel;
        clip.addEventListener("error", cancel, { once: true });
        if (typeof clip.requestVideoFrameCallback === "function") {
          frameRequest = clip.requestVideoFrameCallback(() => {
            frameRequest = null;
            frameReady();
          });
          // Some browsers suppress compositor callbacks beneath an opaque cover.
          fallbackTimer = setTimeout(checkLegacyFrame, CONFIG.loading.decodedFrameFallbackMs);
        } else checkLegacyFrame();
      });
    }

    function showRoomVideo(room, { withAudio = gameplayStarted } = {}) {
      const run = ++room.videoRun;
      // Loading stays silent. READY and PREV/NEXT enable only the active
      // room's soundtrack synchronously inside the player's click/tap.
      room.video.muted = !withAudio;
      if (withAudio) room.video.defaultMuted = false;
      room.videoCover.style.display = room.videoCoverReady ? "block" : "none";
      room.video.style.opacity = room.videoCoverReady ? ".001" : "0";
      const isCurrent = () => run === room.videoRun && levelRooms[activeRoomIndex] === room && !gameOver;
      const frameReady = waitForRoomVideoFrame(room, () => {
        if (isCurrent()) room.video.style.opacity = "1";
      }, 0); // Keep covering a slow/stalled active video until it really presents a frame.
      frameReady.then(ready => {
        if (ready && isCurrent()) room.videoCover.style.display = "none";
      });
      const play = room.video.play();
      if (play) play.catch(() => {
        if (run === room.videoRun) room.videoFrameCancel?.();
        // Keep the cached room visible if autoplay is blocked. READY or a
        // subsequent navigation tap can retry within a real user gesture.
      });
    }

    async function preloadRoomBackdrop(room) {
      if (room.scene.roomImage) {
        try {
          const loaded = waitForMedia(room.image, "load", CONFIG.loading.resourceTimeoutMs);
          room.image.src = room.scene.roomImage;
          await loaded;
          if (!room.image.naturalWidth || !room.image.naturalHeight) throw new Error("Invalid room image.");
          if (room.image.decode) await room.image.decode();
          room.media = room.image;
          room.backdropReady = true;
          return;
        } catch (error) {
          if (!room.scene.roomVideo) throw error;
        }
      }
      if (!room.scene.roomVideo) throw new Error("No usable room image or video.");
      const loaded = waitForMedia(room.video, "loadeddata", CONFIG.loading.jumpscareDownloadTimeoutMs);
      room.video.preload = "auto";
      room.video.autoplay = false;
      room.video.muted = true;
      room.video.loop = true;
      room.video.playsInline = true;
      room.video.src = room.scene.roomVideo;
      room.video.load();
      await loaded;
      // loadeddata prepares media data, not necessarily the first displayed
      // video layer. Warm it behind the loader and cache an actual frame.
      room.video.style.display = "block";
      room.video.style.opacity = ".001";
      const frameReady = waitForRoomVideoFrame(room);
      const cancelWarmup = room.videoFrameCancel;
      try {
        const play = room.video.play();
        if (play) play.catch(cancelWarmup);
        await frameReady;
      } catch { room.videoFrameCancel?.(); }
      cacheRoomVideoFrame(room);
      room.video.pause();
      room.video.style.display = "none";
      room.video.style.opacity = "1";
      room.media = room.video;
      room.backdropReady = true;
    }

    function syncActiveScare(room) {
      if (room !== levelRooms[activeRoomIndex]) return;
      jumpscareReady = room.scareReady;
      jumpscareWarmAttempted = room.warmAttempted;
      jumpscarePreparing = room.preparing;
      jumpscareMetadataReady = room.metadataReady;
      jumpscareAudioUnlocked = room.audioUnlocked;
      jumpscareAudioGain = room.audioGain;
      jumpscareAudioSource = room.audioSource;
    }

    function activateRoom(index, { initial = false } = {}) {
      const previous = levelRooms[activeRoomIndex];
      if (!initial && previous) {
        previous.cameraFraction = minOffset ? offsetX / minOffset : .5;
        const oldLetter = currentRoomLetterIndex();
        if (oldLetter >= 0 && tiles[oldLetter]?.dataset.decoySeen === "true") correctDecoy(oldLetter);
        if (anomalyActive && anomalyRoomIndex === activeRoomIndex && anomalyHasBeenSeen) removeAnomalyAndRestartTimer();
      }
      stopButterflyFlight();
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      if (!initial && previous && previous.media === previous.video) cacheRoomVideoFrame(previous);
      for (const room of levelRooms) {
        room.videoRun++;
        room.videoFrameCancel?.();
        room.videoCover.style.display = "none";
        room.image.style.display = room.video.style.display = "none";
        room.video.pause();
        room.video.muted = true;
      }
      activeRoomIndex = index;
      const room = levelRooms[index];
      currentScene = room.scene;
      roomImage = room.image; video = room.video; roomMedia = room.media; jumpscareVideo = room.scare;
      ROOM_IMAGE_FILE = currentScene.roomImage; ROOM_VIDEO_FILE = currentScene.roomVideo;
      ROOM_NAME = gameText(CONFIG.text.roomFormat, { number: String(currentRoomNumber).padStart(2, "0") });
      jumpscareSourceURL = currentScene.jumpscare;
      roomMediaReady = room.backdropReady;
      syncActiveScare(room);
      room.media.style.display = "block";
      updateLimits();
      buildSnapPoints();
      offsetX = clamp(room.cameraFraction * minOffset, minOffset, 0);
      applyWorldOffset(false);
      if (room.media === room.video) showRoomVideo(room);
      if (currentWord) relayoutScatteredLetters();
      anomalyWorld.style.display = anomalyActive && anomalyRoomIndex !== index ? "none" : "";
      spiderWorld.style.display = spiderActive && spiderRoomIndex !== index ? "none" : "";
      if (anomalyActive && anomalyRoomIndex === index && anomalyMeta) {
        anomalyWorldBox = getScaledAnomalyBox(anomalyMeta);
        setOverlayImageStyles(anomalyImage, anomalyBitmap, { height: `${viewport.getBoundingClientRect().height}px`, width: `${renderedVideoWidth}px` });
      }
      if (spiderActive && spiderRoomIndex === index) layoutSpider();
      updateAnomalyVisibilityState();
      showCurrentLetter({ animate: !initial });
      updateCameraControls();
      if (!initial && progressState.currentLevel && !progressState.currentLevel.legacy) {
        progressState.currentLevel.activeRoomIndex = activeRoomIndex;
        progressState.updatedAt = new Date().toISOString();
        saveProgress();
      }
    }

    function switchRoom(direction) {
      if (!gameplayStarted || hintActive || handVisible || gameOver || roomCompleted || !roomsReady) return;
      updateCameraTimer();
      if (gameOver) return;
      let next = activeRoomIndex + direction;
      if (CONFIG.rooms.wrapNavigation) next = (next + levelRooms.length) % levelRooms.length;
      else next = clamp(next, 0, levelRooms.length - 1);
      if (next !== activeRoomIndex) activateRoom(next);
    }

    prevRoomButton.addEventListener("click", event => { event.stopPropagation(); switchRoom(-1); });
    nextRoomButton.addEventListener("click", event => { event.stopPropagation(); switchRoom(1); });

    async function loadRandomLevel() {
      if (levelLoading) return;
      levelLoading = true;
      try {
        availableScenes = await discoverScenes();
        // Retry/resume must retain its original scene set even after config edits.
        if (!resumedLevel) availableScenes = roomMilestonePool(availableScenes);
        if (!resumedLevel && CONFIG.milestones.enabled && availableScenes.length < levelRoomCount) {
          wordLoadInfo.url = new URL(levelDataFile(), document.baseURI).href;
          showWordLoadError(new Error(`The scene milestone at level ${progressionLevel()} allows ${availableScenes.length} complete room/jumpscare pairs, but rooms.count requires ${levelRoomCount}. Raise milestones.rooms.maxSceneNumbers, lower rooms.count, or add the matching scene files, then reload.`));
          return;
        }
        if (availableScenes.length < levelRoomCount) throw new Error(`This level needs ${levelRoomCount} complete numbered room/jumpscare pairs; found ${availableScenes.length}.`);
        if (isPuzzleLevel()) {
          try { await preparePuzzleForLevel(); }
          catch (error) { showWordLoadError(error); return; }
        }
        let selected;
        if (resumedLevel) {
          selected = resumedLevel.sceneNumbers.map(number => availableScenes.find(scene => scene.number === number));
          if (selected.some(scene => !scene)) throw new Error("A saved room scene is missing from levels/.");
          if (resumedLevel.legacy) {
            const extras = shuffleArray(availableScenes.filter(scene => !selected.includes(scene)));
            selected.push(...extras.slice(0, levelRoomCount - selected.length));
          }
        } else selected = shuffleArray([...availableScenes]).slice(0, levelRoomCount);
        levelRooms = selected.map(makeLevelRoom);
        activeRoomIndex = resumedLevel?.activeRoomIndex || 0;
        await Promise.all(levelRooms.map(async room => {
          await Promise.all([
            preloadRoomBackdrop(room),
            (async () => {
              room.scareURL = await preloadJumpscareFile(room.scene.jumpscare);
              const metadata = waitForMedia(room.scare, "loadedmetadata", CONFIG.loading.jumpscareDownloadTimeoutMs);
              room.scare.src = room.scareURL;
              room.scare.load();
              await metadata;
              room.metadataReady = true;
              await prepareJumpscarePlayback({}, room).catch(() => {});
            })()
          ]);
        }));
        if (gameOver) return;
        roomsReady = true;
        activateRoom(activeRoomIndex, { initial: true });
        rememberCurrentRoom();
        revealWhenMediaReady();
      } catch (error) { showLevelLoadError(error); }
      finally { levelLoading = false; }
    }

    async function preloadJumpscareFile(url) {
      // Keep direct disk playback and its native audio path for file:// games.
      if (!/^https?:$/.test(new URL(url, document.baseURI).protocol)) return url;
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), CONFIG.loading.jumpscareDownloadTimeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok || /text\/html/i.test(response.headers.get("content-type") || "")) {
          throw new Error("Could not download the selected jumpscare video.");
        }
        const clip = await response.blob();
        if (!clip.size) throw new Error("The selected jumpscare video is empty.");
        return URL.createObjectURL(clip);
      } finally { window.clearTimeout(timeout); }
    }

    function parseWordList(text, contentType = "", language = CONFIG.language.code) {
      if (/text\/html|application\/xhtml\+xml/i.test(contentType) || /^\s*</.test(text)) {
        throw new Error("The server returned a web page instead of the word list.");
      }
      const loaded = [...new Set(text
        .split(/\r\n?|\n/)
        .map(line => line.trim())
        .filter(line => line && !line.startsWith("#"))
        .map(line => normalizeGameWord(line, language))
        .filter(Boolean))];
      if (!loaded.length) throw new Error("The file contains no valid words.");
      return loaded;
    }

    function parsePuzzleList(text, contentType = "", language = CONFIG.language.code) {
      if (typeof text !== "string" || !text.trim() || text.length > 2000000 ||
          /text\/html|application\/xhtml\+xml/i.test(contentType) || /^\s*</.test(text)) {
        throw new Error("The puzzle file is empty, too large, or is a web page instead of text.");
      }
      const puzzles = [], seen = new Set();
      for (const line of text.replace(/^\uFEFF/, "").split(/\r\n?|\n/)) {
        if (!line.trim() || /^\s*[#;]/.test(line)) continue;
        const match = /^(.+?)\s*\[([^\[\]]+)\]\s*$/.exec(line.trim());
        if (!match || match[1].length > 2048) continue;
        const rawAnswer = match[2].trim().normalize("NFKC");
        const answer = normalizeGameWord(rawAnswer, language);
        if (!answer || language !== "ar" && !/^[a-z]+$/i.test(rawAnswer) || answer.length > 32) continue;
        const prompt = match[1].trim(), key = `${prompt}\n${answer}`;
        if (seen.has(key)) continue;
        seen.add(key); puzzles.push({ prompt, answer });
      }
      if (!puzzles.length) throw new Error('No valid puzzles. Use one line per puzzle: A short riddle [answer]. Answers must be single words in the configured language.');
      return puzzles;
    }

    async function preparePuzzleForLevel() {
      wordsLoading = true;
      const file = puzzlesFileFor(), controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), WORDS_TIMEOUT_MS);
      wordLoadInfo = { status: "loading", url: new URL(file, document.baseURI).href, count: 0, error: null };
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      try {
        if (resumedLevel) {
          currentPuzzle = { ...resumedLevel.puzzle };
          acceptWordList(currentPuzzle.answer, "save.txt", "text/plain", { preserveOrder: true });
          return;
        }
        let text, source = wordLoadInfo.url, type = "text/plain";
        if (puzzleTextOverride) { text = puzzleTextOverride.text; source = puzzleTextOverride.source; }
        else if (localFolderImport) {
          if (typeof localFolderImport.puzzlesText !== "string") throw new Error(`The cached local folder has no ${file}. Choose it below, or use Change local files to read the folder again.`);
          text = localFolderImport.puzzlesText; source = localFolderImport.puzzlesSource || file;
        } else {
          const response = await fetch(source, { cache: "no-store", signal: controller.signal });
          if (!response.ok) throw new Error(`The server returned HTTP ${response.status} for ${file}.`);
          text = await response.text(); type = response.headers.get("content-type") || ""; source = response.url;
        }
        const scoped = contentMilestonePool(parsePuzzleList(text, type), "puzzles");
        const eligible = scoped.filter(puzzle =>
          puzzle.answer.length >= CONFIG.puzzles.minAnswerLength && puzzle.answer.length <= CONFIG.puzzles.maxAnswerLength &&
          puzzle.answer.length <= availableScenes.length);
        if (!eligible.length) throw new Error(`No riddle in the current file pool fits ${CONFIG.puzzles.minAnswerLength}–${CONFIG.puzzles.maxAnswerLength} letters and the ${availableScenes.length} room/jumpscare pairs unlocked at level ${progressionLevel()}. Check your content and scene milestones.`);
        currentPuzzle = { ...eligible[Math.floor(Math.random() * eligible.length)] };
        levelRoomCount = Math.max(CONFIG.rooms.count, currentPuzzle.answer.length);
        acceptWordList(currentPuzzle.answer, source, "text/plain");
        wordLoadInfo.count = eligible.length;
      } finally { clearTimeout(timeout); wordsLoading = false; }
    }

    function acceptWordList(text, source, contentType = "", { preserveOrder = false } = {}) {
      const loaded = parseWordList(text, contentType);
      const scoped = isPuzzleLevel() || resumedLevel ? loaded : contentMilestonePool(loaded, "words");
      const eligible = scoped.filter(word => word.length > 0 && word.length <= levelRoomCount);
      const seeded = resumedLevel?.legacy ? resumedLevel.words.filter(word => word.length > 0 && word.length <= levelRoomCount) : [];
      const pool = preserveOrder ? eligible : [...seeded, ...shuffleArray(eligible.filter(word => !seeded.includes(word)))];
      if (pool.length < levelType.wordCount) throw new Error(`${WORDS_FILE} needs at least ${levelType.wordCount} unique words of ${levelRoomCount} letters or fewer; found ${pool.length}.`);
      words = pool.slice(0, levelType.wordCount);
      wordLetterRooms = resumedLevel && !resumedLevel.legacy ? resumedLevel.letterRooms.map(order => [...order]) : words.map(word => {
        const order = Array.from({ length: levelRoomCount }, (_, index) => index);
        if (CONFIG.rooms.shuffleLetterRooms) shuffleArray(order);
        return order.slice(0, word.length);
      });
      wordLoadInfo = { status: "loaded", url: source, count: eligible.length, error: null };
      console.info(`Loaded ${eligible.length} matching words of up to ${levelRoomCount} letters from ${source}`);
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      readyButton.disabled = false;
      startWord(0);
      populateClueList();
      wordsReadyForClue = true;
      rememberCurrentRoom();
      maybeShowClueIntro();
    }

    function showWordLoadError(error) {
      const reason = error.name === "AbortError"
        ? "The request timed out. Check your connection and retry."
        : error.message;
      wordLoadInfo = { ...wordLoadInfo, status: "error", count: 0, error: reason };
      wordsReadyForClue = false;
      readyButton.disabled = true;
      loadingWord.hidden = true;
      wordLoadError.hidden = false;
      wordLoadReason.textContent = reason;
      wordLoadTitle.textContent = `Couldn’t load ${levelDataFile()}`;
      wordLoadHelp.textContent = isPuzzleLevel() ? "Retry, or choose your puzzle text file directly." : "Retry, or choose your word list directly.";
      document.getElementById("retryWordsButton").hidden = false;
      document.getElementById("chooseWordsButton").textContent = `Choose ${levelDataFile()}`;
      wordLoadUrl.hidden = false;
      wordLoadUrl.href = wordLoadInfo.url;
      wordLoadUrl.textContent = wordLoadInfo.url;
      console.warn("Could not load the word list.", wordLoadInfo);
    }

    function showLocalFolderPrompt(reason = "") {
      loadingScreen.classList.remove("hidden");
      loadingWord.hidden = true;
      wordLoadError.hidden = false;
      wordLoadTitle.textContent = "Choose your game folder";
      wordLoadReason.textContent = reason || "Select the folder containing config.txt, your word list and puzzle file.";
      wordLoadHelp.textContent = "The text files will be read together. A missing or invalid config uses the built-in settings.";
      wordLoadUrl.hidden = true;
      document.getElementById("retryWordsButton").hidden = true;
      chooseGameFolderButton.hidden = false;
      document.getElementById("chooseWordsButton").textContent = "Choose word list only";
      if (!("webkitdirectory" in gameFolderInput)) chooseGameFolderButton.textContent = "Choose config and words";
      readyButton.disabled = true;
      wordLoadInfo = { ...wordLoadInfo, status: reason ? "error" : "waiting-for-folder", error: reason || null };
    }

    function rememberLocalFiles(data) {
      // Cache imported settings, words and optional save text for reopening; never media.
      // Storage may be blocked for file://, so it must remain optional.
      let stored = false;
      for (const store of ["localStorage", "sessionStorage"]) {
        try { window[store].setItem(LOCAL_FILES_CACHE_KEY, JSON.stringify(data)); stored = true; } catch {}
      }
      return stored;
    }

    function restoreLocalFiles() {
      for (const store of ["sessionStorage", "localStorage"]) {
       try {
        const raw = window[store].getItem(LOCAL_FILES_CACHE_KEY);
        if (!raw) continue;
        const data = JSON.parse(raw);
        if (![1, 2, 3].includes(data.version) || typeof data.wordsText !== "string" ||
            typeof data.wordsSource !== "string" ||
            !(data.configText === null || typeof data.configText === "string")) throw new Error("Invalid saved local files.");
        let cachedLanguage = "en";
        try { cachedLanguage = parseGameConfig(data.configText || 'language.code="en"').resolved.language.code; } catch {}
        if (data.wordsText.trim()) parseWordList(data.wordsText, "", cachedLanguage);
        else parsePuzzleList(data.puzzlesText, "", cachedLanguage);
        return data;
       } catch {
        try { window[store].removeItem(LOCAL_FILES_CACHE_KEY); } catch {}
       }
      }
      return null;
    }

    function selectedFolderPath(path) {
      const normalized = decodeURIComponent(path.replace(/\\/g, "/"));
      if (/^[a-z][a-z\d+.-]*:|^\//i.test(normalized)) throw new Error("The configured word list must be inside the selected folder.");
      const parts = [];
      for (const part of normalized.split("/")) {
        if (!part || part === ".") continue;
        if (part === "..") {
          if (!parts.length) throw new Error("The configured word list is outside the selected folder.");
          parts.pop();
        } else parts.push(part);
      }
      return parts.join("/");
    }

    async function importGameFolder(files) {
      if (location.protocol !== "file:" || folderImportBusy || wordsLoading || gameInitializationStarted || !files.length) return;
      folderImportBusy = true;
      chooseGameFolderButton.disabled = true;
      document.getElementById("chooseWordsButton").disabled = true;
      wordLoadReason.textContent = "Reading local files…";
      try {
        const entries = new Map();
        let folderName = "Game folder";
        for (const file of files) {
          const path = file.webkitRelativePath;
          if (path) {
            const slash = path.indexOf("/");
            folderName = path.slice(0, slash);
            entries.set(path.slice(slash + 1), file);
          } else entries.set(file.name, file);
        }
        const find = path => entries.get(path) || [...entries].find(([name]) => name.toLowerCase() === path.toLowerCase())?.[1];
        const configFile = find(CONFIG_FILE);
        let configText = null;
        if (configFile) {
          try { configText = await configFile.text(); }
          catch (error) { console.warn("Could not read local config; using built-in settings.", error); }
        }
        let selectedConfig = CONFIG_DEFAULTS;
        if (configText !== null) {
          try { selectedConfig = parseGameConfig(configText).resolved; }
          catch { /* The same built-in fallback as automatic config loading. */ }
        }
        const wordsPath = selectedFolderPath(wordsFileFor(selectedConfig));
        const wordsFile = find(wordsPath);
        const needsWords = Object.entries(selectedConfig.levels).some(([name, level]) => !isPuzzleType(name) && level.chance > 0);
        if (!wordsFile && needsWords) throw new Error(`The selected folder does not contain ${wordsPath}. Choose the folder containing that file.`);
        const wordsText = wordsFile ? await wordsFile.text() : "";
        if (wordsFile) parseWordList(wordsText, wordsFile.type, selectedConfig.language.code);
        const puzzlesPath = selectedFolderPath(puzzlesFileFor(selectedConfig)), puzzlesFile = find(puzzlesPath);
        const needsPuzzles = Object.entries(selectedConfig.levels).some(([name, level]) => isPuzzleType(name) && level.chance > 0);
        if (!puzzlesFile && needsPuzzles) throw new Error(`The selected folder does not contain ${puzzlesPath}. Add it beside config.txt, then choose the folder again.`);
        const puzzlesText = puzzlesFile ? await puzzlesFile.text() : null;
        if (puzzlesFile) parsePuzzleList(puzzlesText, puzzlesFile.type, selectedConfig.language.code);
        let saveText = null;
        try {
          const saveFile = find(selectedFolderPath(selectedConfig.assets.saveFile));
          if (saveFile) saveText = await saveFile.text();
        } catch (error) { console.info("No readable local save.txt.", error.message); }
        const data = { version: 3, language: selectedConfig.language.code, configText, wordsText, wordsSource: `${folderName}/${wordsPath}`,
          puzzlesText, puzzlesSource: `${folderName}/${puzzlesPath}`, saveText };
        rememberLocalFiles(data);
        await initializeGame(data);
      } catch (error) {
        showLocalFolderPrompt(error.message);
      } finally {
        folderImportBusy = false;
        chooseGameFolderButton.disabled = false;
        document.getElementById("chooseWordsButton").disabled = false;
        gameFolderInput.value = "";
      }
    }

    chooseGameFolderButton.addEventListener("click", () => gameFolderInput.click());
    gameFolderInput.addEventListener("change", () => importGameFolder([...gameFolderInput.files]));
    document.getElementById("changeLocalFilesButton").addEventListener("click", () => {
      if (gameplayStarted || gameplayStarting) return;
      for (const store of ["localStorage", "sessionStorage"]) {
        try { window[store].removeItem(LOCAL_FILES_CACHE_KEY); } catch {}
      }
      location.reload();
    });

    async function loadWords() {
      if (isPuzzleLevel()) return loadRandomLevel();
      if (wordsLoading || gameplayStarted) return;
      wordsLoading = true;
      readyButton.disabled = true;
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      wordLoadInfo = { status: "loading", url: new URL(WORDS_FILE, document.baseURI).href, count: 0, error: null };
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), WORDS_TIMEOUT_MS);
      try {
        const response = await fetch(wordLoadInfo.url, { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error(`The server returned HTTP ${response.status} for ${WORDS_FILE}.`);
        const text = await response.text();
        acceptWordList(text, response.url, response.headers.get("content-type") || "");
      } catch (error) {
        if (error instanceof TypeError) {
          error = new Error(location.protocol === "file:"
            ? `This browser blocked automatic loading from a local HTML file. Choose ${WORDS_FILE} below, or open the hosted game.`
            : `The browser could not read ${WORDS_FILE}. Check the file address below and your connection.`);
        }
        showWordLoadError(error);
      } finally {
        window.clearTimeout(timeout);
        wordsLoading = false;
      }
    }

    document.getElementById("retryWordsButton").addEventListener("click", loadWords);
    document.getElementById("chooseWordsButton").addEventListener("click", () => wordFileInput.click());
    wordFileInput.addEventListener("change", async () => {
      const file = wordFileInput.files[0];
      if (!file || wordsLoading || folderImportBusy || gameplayStarted) return;
      wordsLoading = true;
      try {
        const text = await file.text();
        if (location.protocol === "file:" && !gameInitializationStarted) {
          const puzzleAnswer = /\[([^\[\]]+)\]\s*$/m.exec(text)?.[1];
          const language = /[ء-ي]/.test(puzzleAnswer || text) ? "ar" : "en";
          if (puzzleAnswer) parsePuzzleList(text, file.type, language);
          else parseWordList(text, file.type, language);
          const data = { version: 3, language, configText: `language.code=${JSON.stringify(language)}\nlevels.standard.chance=${puzzleAnswer ? 0 : 1}\nlevels.puzzle.chance=${puzzleAnswer ? 1 : 0}\nlevels.flyingPuzzle.chance=0`,
            wordsText: puzzleAnswer ? "" : text, wordsSource: file.name, puzzlesText: puzzleAnswer ? text : null, puzzlesSource: file.name };
          rememberLocalFiles(data);
          await initializeGame(data);
        } else if (isPuzzleLevel()) {
          parsePuzzleList(text, file.type);
          puzzleTextOverride = { text, source: file.name };
          if (localFolderImport) {
            localFolderImport.puzzlesText = text; localFolderImport.puzzlesSource = file.name;
            rememberLocalFiles(localFolderImport);
          }
          await loadRandomLevel();
        } else acceptWordList(text, file.name, file.type);
      } catch (error) {
        if (location.protocol === "file:" && !gameInitializationStarted) showLocalFolderPrompt(error.message);
        else showWordLoadError(error);
      } finally {
        wordFileInput.value = "";
        wordsLoading = false;
      }
    });

    function fitClueList() {
      if (!cluePaper.naturalHeight) return;
      if (isPuzzleLevel()) {
        let size = Math.min(CONFIG.puzzles.maxFontPx, Math.max(CONFIG.puzzles.minFontPx,
          viewport.getBoundingClientRect().height * CONFIG.puzzles.fontHeightFraction));
        puzzleText.style.fontSize = `${size}px`;
        const text = document.getElementById("cluePaperText"), title = document.getElementById("clueTitle");
        const available = Math.max(1, text.clientHeight - title.offsetHeight - parseFloat(getComputedStyle(title).marginBottom));
        for (let attempt = 0; attempt < 8 && (puzzleText.scrollHeight > available || puzzleText.scrollWidth > text.clientWidth); attempt++) {
          size *= Math.min(.95, available / Math.max(1, puzzleText.scrollHeight), text.clientWidth / Math.max(1, puzzleText.scrollWidth));
          puzzleText.style.fontSize = `${Math.max(4, size)}px`;
        }
        return;
      }
      if (!clueList.children.length) return;
      clueList.style.fontSize = "";
      clueList.style.gap = "";
      const text = document.getElementById("cluePaperText"), title = document.getElementById("clueTitle");
      const available = Math.max(1, text.clientHeight - title.offsetHeight - parseFloat(getComputedStyle(title).marginBottom));
      const current = getComputedStyle(clueList);
      const scale = Math.min(1, available / Math.max(1, clueList.scrollHeight), clueList.clientWidth / Math.max(1, clueList.scrollWidth));
      if (scale < 1) {
        clueList.style.fontSize = `${parseFloat(current.fontSize) * scale}px`;
        clueList.style.gap = `${parseFloat(current.rowGap) * scale}px`;
      }
    }
    cluePaper.addEventListener("load", fitClueList);

    function populateClueList() {
      clueList.replaceChildren();
      clueList.hidden = isPuzzleLevel();
      puzzleText.hidden = !isPuzzleLevel();
      puzzleText.textContent = isPuzzleLevel() ? currentPuzzle.prompt : "";
      puzzleText.lang = CONFIG.language.code;
      const title = document.getElementById("clueTitle");
      title.textContent = isPuzzleLevel() ? CONFIG.text.puzzleTitle : CONFIG.text.clueTitle;
      title.classList.toggle("riddle-title", isPuzzleLevel());
      if (isPuzzleLevel()) { fitClueList(); return; }
      words.forEach(word => {
        const item = document.createElement("li");
        item.textContent = isArabic() ? word : word.toUpperCase();
        clueList.appendChild(item);
      });
      fitClueList();
    }

    function maybeShowClueIntro() {
      if (clueIntroShown || !wordsReadyForClue || !videosReadyForClue || !languageFontReady) return;
      fitClueList();
      clueIntroShown = true;
      viewport.classList.add("clue-intro-active");
      clueIntro.classList.add("show");
      clueIntro.setAttribute("aria-hidden", "false");

      // Fade the black loader away only once the blurred clue scene is ready beneath it.
      requestAnimationFrame(() => {
        loadingScreen.classList.add("hidden");
      });
    }

    async function beginGameplayFromClues() {
      if (!wordsReadyForClue || gameplayStarted || gameplayStarting || gameOver) return;
      gameplayStarting = true;
      readyButton.disabled = true;
      const activeRoom = levelRooms[activeRoomIndex];
      if (activeRoom && activeRoom.media === activeRoom.video) showRoomVideo(activeRoom, { withAudio: true });
      try {
        // Calling play here also unlocks decoding on browsers that require
        // a user gesture. Gameplay stays on the clue card until it is ready.
        // Start every play/unlock synchronously inside this one trusted READY tap.
        const jumpscarePreparation = Promise.all(levelRooms.map(room => prepareJumpscarePlayback({ unlockAudio: true }, room)));
        // Unlock the optional encounter sound within the same trusted READY tap.
        unlockSpiderSound();
        await jumpscarePreparation;
      } catch (error) {
        if (activeRoom) activeRoom.video.muted = true;
        gameplayStarting = false;
        readyButton.disabled = false;
        return;
      }
      if (gameOver) return;
      gameplayStarting = false;
      gameplayStarted = true;
      cameraOverlay.setAttribute("aria-hidden", "false");
      updateCameraControls();
      startCameraTimer();
      clueIntro.classList.add("dismiss");
      viewport.classList.remove("clue-intro-active");
      anchors.forEach(anchor => { anchor.hidden = true; });
      showCurrentLetter();
      clueDismissTimer = window.setTimeout(() => {
        clueDismissTimer = null;
        clueIntro.classList.remove("show", "dismiss");
        clueIntro.setAttribute("aria-hidden", "true");
      }, CONFIG.ui.clueDismissMs);
      if (CONFIG.anomaly.enabled && completedWordCount >= anomalyWordThreshold()) { anomalyEnabled = true; scheduleAnomalyCheck(); }
      scheduleNextHandCheck();
      scheduleSpiderCheck();
    }

    readyButton.addEventListener("click", beginGameplayFromClues);

    function updateLevelStatus() {
      status.textContent = isPuzzleLevel() ? CONFIG.text.hint : gameText(CONFIG.text.clueFormat, { current: wordIndex + 1, total: words.length });
      status.classList.toggle("puzzle-hint", isPuzzleLevel());
      if (isPuzzleLevel()) {
        status.setAttribute("role", "button");
        status.setAttribute("tabindex", "0");
        status.setAttribute("aria-controls", "clueIntro");
        status.setAttribute("aria-label", `${CONFIG.text.hint}: hold to read the puzzle`);
        status.setAttribute("aria-expanded", String(hintActive));
      } else {
        for (const name of ["role", "tabindex", "aria-controls", "aria-label", "aria-expanded", "aria-disabled"]) status.removeAttribute(name);
      }
    }

    function showPuzzleHint() {
      if (!isPuzzleLevel() || !gameplayStarted || handVisible || gameOver || roomCompleted || !currentPuzzle) return false;
      clearTimeout(hintHideTimer); clearTimeout(clueDismissTimer);
      hintHideTimer = clueDismissTimer = null;
      finishPanGesture(); finishShutterGesture(); stopShutterEffect();
      hintActive = true;
      clueIntro.classList.remove("dismiss");
      clueIntro.classList.add("hint-mode", "show");
      clueIntro.setAttribute("aria-hidden", "false");
      viewport.classList.add("hint-active", "hint-transition");
      status.setAttribute("aria-expanded", "true");
      fitClueList();
      updateCameraControls();
      return true;
    }

    function hidePuzzleHint({ immediate = false } = {}) {
      if (!hintActive && hintPointerId === null && hintKey === null && !(immediate && clueIntro.classList.contains("hint-mode"))) return;
      const pointerId = hintPointerId;
      hintActive = false; hintPointerId = null; hintKey = null;
      if (pointerId !== null) {
        try { if (status.hasPointerCapture(pointerId)) status.releasePointerCapture(pointerId); } catch {}
      }
      clearTimeout(hintHideTimer);
      viewport.classList.remove("hint-active");
      clueIntro.classList.remove("show", "dismiss");
      clueIntro.setAttribute("aria-hidden", "true");
      status.setAttribute("aria-expanded", "false");
      if (immediate) { clueIntro.classList.remove("hint-mode"); viewport.classList.remove("hint-transition"); }
      else hintHideTimer = setTimeout(finishHintFade, CONFIG.puzzles.hintFadeMs * 2);
      updateCameraControls();
    }

    function finishHintFade() {
      if (hintActive) return;
      clearTimeout(hintHideTimer); hintHideTimer = null;
      clueIntro.classList.remove("hint-mode");
      viewport.classList.remove("hint-transition");
    }
    clueIntro.addEventListener("transitionend", event => {
      if (event.target === clueIntro && event.propertyName === "opacity" && !hintActive &&
          Number(getComputedStyle(clueIntro).opacity) === 0) finishHintFade();
    });

    status.addEventListener("pointerdown", event => {
      if (event.isPrimary === false || event.button !== 0 || !isPuzzleLevel()) return;
      event.stopPropagation();
      if (!showPuzzleHint()) return;
      hintPointerId = event.pointerId;
      try { status.setPointerCapture(event.pointerId); } catch {}
    });
    for (const name of ["pointerup", "pointercancel"]) window.addEventListener(name, event => {
      if (event.pointerId === hintPointerId) hidePuzzleHint();
    }, true);
    status.addEventListener("lostpointercapture", event => {
      if (event.pointerId === hintPointerId) hidePuzzleHint();
    });
    status.addEventListener("keydown", event => {
      if (![" ", "Enter"].includes(event.key) || !isPuzzleLevel()) return;
      event.preventDefault(); event.stopPropagation();
      if (!event.repeat && showPuzzleHint()) hintKey = event.key;
    });
    status.addEventListener("keyup", event => {
      if (event.key === hintKey) { event.preventDefault(); hidePuzzleHint(); }
    });
    status.addEventListener("blur", () => { if (hintKey !== null) hidePuzzleHint(); });

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getRoomDimensions() {
      return roomMedia === roomImage
        ? { width: roomImage.naturalWidth, height: roomImage.naturalHeight }
        : { width: video.videoWidth, height: video.videoHeight };
    }

    function syncVisibleViewport() {
      const visible = window.visualViewport;
      const height = visible?.height || window.innerHeight;
      const width = visible?.width || window.innerWidth;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty("--game-height", `${height}px`);
      rootStyle.setProperty("--game-width", `${width}px`);
      rootStyle.setProperty("--game-top", `${visible?.offsetTop || 0}px`);
      rootStyle.setProperty("--game-left", `${visible?.offsetLeft || 0}px`);
      rootStyle.setProperty("--view-unit", `${height / 100}px`);
    }

    function fitCameraText() {
      const { width, height, left, right } = viewport.getBoundingClientRect();
      const visible = window.visualViewport;
      const visibleLeft = visible?.offsetLeft || 0;
      viewport.style.setProperty("--frame-left-gap", `${Math.max(0, left - visibleLeft)}px`);
      viewport.style.setProperty("--frame-right-gap", `${Math.max(0, visibleLeft + (visible?.width || window.innerWidth) - right)}px`);
