      <div id="gameOverScreen" role="button" tabindex="0" aria-label="Game over. Tap to retry.">
        <div id="gameOverTitle">GAME OVER</div>
        <div id="retryText">TAP TO RETRY</div>
      </div>
    </div>
  </div>

  <script>
    const WORDS_FILE = "words.txt";
    const WORDS_TIMEOUT_MS = 15000;
    const LEVELS_DIRECTORY = "levels/";
    // Directory listings / levels/index.json support any numbering, including gaps.
    // Hosts without either use numbered probes and stop after 16 absent numbers.
    const LEVEL_PROBE_GAP = 16;
    let ROOM_IMAGE_FILE = null;
    let ROOM_VIDEO_FILE = null;
    let ROOM_NAME = "ROOM";
    let availableScenes = [];
    let currentScene = null;
    const ANOMALY_FILES = ["anomaly.png"]; // Add more filenames here when needed.
    const ANOMALY_CHECK_MS = 15000;
    const ANOMALY_SPAWN_CHANCE = 0.50;
    const CAMERA_DRAG_GAIN = 1.2;
    const CAMERA_MOMENTUM_MIN_SPEED = 0.25;
    const CAMERA_FLICK_SPEED = 0.75;
    const CAMERA_VELOCITY_WINDOW_MS = 100;
    const LETTER_TRANSFER_MS = 260;
    const BATTERY_SLOT_COUNT = 4;
    const ROOM_TIME_LIMIT_MS = 60000;

    const viewport = document.getElementById("portraitViewport");
    const sceneEffects = document.getElementById("sceneEffects");
    const captureEffects = document.getElementById("captureEffects");
    const video = document.getElementById("roomVideo");
    const roomImage = document.getElementById("roomImage");
    let roomMedia = video;
    const letterWorld = document.getElementById("letterWorld");
    const wordDisplay = document.getElementById("wordDisplay");
    const status = document.getElementById("status");
    const cameraOverlay = document.getElementById("cameraOverlay");
    const cameraBattery = document.getElementById("cameraBattery");
    const hud = document.getElementById("hud");
    const cameraTimer = document.getElementById("cameraTimer");
    const batteryPercent = document.getElementById("batteryPercent");
    const batterySlots = [...document.querySelectorAll(".battery-slot")];
    const cameraRoom = document.getElementById("cameraRoom");
    const snapButton = document.getElementById("snapButton");
    const shutterBitmap = document.getElementById("shutterBitmap");
    const shutterBitmapContext = /Android/i.test(navigator.userAgent) ? shutterBitmap.getContext("2d") : null;
    if (shutterBitmapContext) cameraOverlay.classList.add("bitmap-shutter");
    const message = document.getElementById("message");
    const handBlocker = document.getElementById("handBlocker");
    const handImage = document.getElementById("handImage");
    const loadingScreen = document.getElementById("loadingScreen");
    const loadingWord = document.getElementById("loadingWord");
    const wordLoadError = document.getElementById("wordLoadError");
    const wordLoadReason = document.getElementById("wordLoadReason");
    const wordLoadUrl = document.getElementById("wordLoadUrl");
    const wordFileInput = document.getElementById("wordFileInput");
    const clueIntro = document.getElementById("clueIntro");
    const cluePaper = document.getElementById("cluePaper");
    const cluePaperBitmap = document.getElementById("cluePaperBitmap");
    const cluePaperBitmapContext = /Android/i.test(navigator.userAgent) ? cluePaperBitmap.getContext("2d") : null;
    function preserveCluePaperColors() {
      if (!cluePaperBitmapContext || !cluePaper.naturalWidth || !cluePaper.naturalHeight) return;
      // Older Android dark modes can tint <img> pixels despite color-scheme.
      // Paint the original artwork separately; keep the image for sizing and fallback.
      try {
        cluePaperBitmap.width = cluePaper.naturalWidth;
        cluePaperBitmap.height = cluePaper.naturalHeight;
        cluePaperBitmapContext.drawImage(cluePaper, 0, 0);
        cluePaper.parentElement.classList.add("bitmap-paper");
      } catch (error) {
        cluePaper.parentElement.classList.remove("bitmap-paper");
      }
    }
    cluePaper.addEventListener("load", preserveCluePaperColors);
    if (cluePaper.complete) preserveCluePaperColors();
    const clueList = document.getElementById("clueList");
    const readyButton = document.getElementById("readyButton");
    const anomalyWorld = document.getElementById("anomalyWorld");
    const anomalyImage = document.getElementById("anomalyImage");
    const blackFlash = document.getElementById("blackFlash");
    const jumpscareVideo = document.getElementById("jumpscareVideo");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const body = document.body;

    let words = [];
    let wordsLoading = false;
    let wordLoadInfo = { status: "pending", url: new URL(WORDS_FILE, document.baseURI).href, count: 0, error: null };
    let wordIndex = 0;
    let currentWord = "";
    let selectedCount = 0;
    let batterySlotsRemaining = BATTERY_SLOT_COUNT;
    let tiles = [];
    let anchors = [];
    let selectionHistory = [];
    let captureInProgress = false;
    let captureFlightAnimation = null;
    let captureFinishTimer = null;
    let shutterSceneAnimation = null;
    let viewportLayoutFrame = 0;
    let wordTransitionPending = false;
    let wordAdvanceTimer = null;
    let cameraStartedAt = null;
    let cameraRemainingSeconds = ROOM_TIME_LIMIT_MS / 1000;
    let cameraTimerInterval = null;
    let shutterAnimationTimer = null;
    let shutterBitmapFrame = 0;
    let shutterBitmapUntil = 0;
    let shutterPointerId = null;
    let shutterStartX = 0;
    let shutterStartY = 0;
    let shutterMoved = false;

    let isDragging = false;
    let movedDuringDrag = false;
    let lastPanClientX = 0;
    let offsetX = 0;
    let minOffset = 0;
    let renderedVideoWidth = 0;
    let snapPoints = [0];
    let dragStartClientX = 0;
    let panMotionSamples = [];
    let panMotionDirection = 0;
    let panDirectionTravel = 0;
    let cameraMomentumFrame = 0;
    let panPointerId = null;

    let handVisible = false;
    let handTimer = null;
    let handPointerId = null;
    let handStartY = 0;
    let handCurrentY = 0;
    let handDragStarted = false;

    let completedWordCount = 0;
    let roomCompleted = false;
    let anomalyEnabled = false;
    let anomalyTimer = null;
    let anomalyActive = false;
    let anomalyHasBeenSeen = false;
    let anomalyMeta = null;
    let anomalyWorldBox = null;
    let gameOver = false;
    let wordsReadyForClue = false;
    let videosReadyForClue = false;
    let clueIntroShown = false;
    let gameplayStarted = false;
    let gameplayStarting = false;
    let jumpscareReady = false;
    let jumpscareWarmAttempted = false;
    let jumpscarePreparing = null;
    let jumpscareMetadataReady = jumpscareVideo.readyState >= HTMLMediaElement.HAVE_METADATA;
    let jumpscareFrameRequest = null;
    let jumpscareAudioContext = null;
    let jumpscareAudioGain = null;
    let jumpscareAudioSource = null;
    let jumpscareAudioUnlocked = false;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    const levelBaseURL = new URL(LEVELS_DIRECTORY, document.baseURI);

    // Only these exact numbered filenames can enter the scene catalogue.
    // Group by number before choosing anything, so missing partners are skipped.
    function buildSceneCatalog(filenames) {
      const groups = new Map();
      const imageTypes = ["png", "webp", "jpg", "jpeg"];
      const videoTypes = ["mp4", "webm", "m4v", "mov"];
      for (const entry of filenames) {
        const name = typeof entry === "string" ? entry : entry?.name;
        if (!name) continue;
        const match = /^(room|jumpscare)_(\d+)\.(png|webp|jpe?g|mp4|webm|m4v|mov)$/i.exec(name);
        if (!match) continue;
        const number = Number(match[2]);
        if (!Number.isSafeInteger(number) || number < 1) continue;
        if (!groups.has(number)) groups.set(number, { number, images: [], videos: [], scares: [] });
        const group = groups.get(number);
        const extension = match[3].toLowerCase();
        if (match[1].toLowerCase() === "room") {
          (imageTypes.includes(extension) ? group.images : group.videos).push(name);
        } else if (videoTypes.includes(extension)) group.scares.push(name);
      }
      const preferred = (names, types) => names.sort((a, b) =>
        types.indexOf(a.split(".").pop().toLowerCase()) - types.indexOf(b.split(".").pop().toLowerCase()))[0] || null;
      const assetURL = name => name ? new URL(encodeURIComponent(name), levelBaseURL).href : null;
      return [...groups.values()].sort((a, b) => a.number - b.number).flatMap(group => {
        const roomImage = preferred(group.images, imageTypes);
        const roomVideo = preferred(group.videos, videoTypes);
        const jumpscare = preferred(group.scares, videoTypes);
        if ((!roomImage && !roomVideo) || !jumpscare) return [];
        return [{ number: group.number, roomImage: assetURL(roomImage), roomVideo: assetURL(roomVideo), jumpscare: assetURL(jumpscare) }];
      });
    }

    async function fetchLevelResource(url, options = {}, consume = response => response) {
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), 6000);
      try {
        const response = await fetch(url, { cache: "no-store", ...options, signal: controller.signal });
        return await consume(response);
      } finally { window.clearTimeout(timer); }
    }

    async function readLevelIndex() {
      try {
        return await fetchLevelResource(new URL("index.json", levelBaseURL), {}, async response => {
          if (!response.ok || /text\/html/i.test(response.headers.get("content-type") || "")) return [];
          const data = await response.json();
          return Array.isArray(data) ? data : Array.isArray(data.files) ? data.files : [];
        });
      } catch { return []; }
    }

    async function readLevelDirectory() {
      try {
        return await fetchLevelResource(levelBaseURL, {}, async response => {
          if (!response.ok) return [];
          const html = new DOMParser().parseFromString(await response.text(), "text/html");
          return [...html.querySelectorAll("a[href]")].flatMap(link => {
            try {
              const url = new URL(link.getAttribute("href"), levelBaseURL);
              if (url.origin !== levelBaseURL.origin || !url.pathname.startsWith(levelBaseURL.pathname)) return [];
              const name = decodeURIComponent(url.pathname.slice(levelBaseURL.pathname.length));
              return name && !name.includes("/") ? [name] : [];
            } catch { return []; }
          });
        });
      } catch { return []; }
    }

    async function levelAssetExists(name) {
      const url = new URL(name, levelBaseURL);
      if (url.protocol === "file:") {
        // Local HTML cannot fetch a folder, but media metadata remains readable.
        // Probe without playing, then release each temporary media element.
        return new Promise(resolve => {
          const image = /\.png$/i.test(name);
          const probe = document.createElement(image ? "img" : "video");
          let timer;
          const finish = exists => {
            window.clearTimeout(timer);
            probe.onload = probe.onloadedmetadata = probe.onerror = null;
            probe.removeAttribute("src");
            if (!image) probe.load();
            resolve(exists);
          };
          probe.onerror = () => finish(false);
          if (image) probe.onload = () => finish(probe.naturalWidth > 0);
          else {
            probe.preload = "metadata";
            probe.muted = true;
            probe.playsInline = true;
            probe.onloadedmetadata = () => finish(probe.videoWidth > 0);
          }
          timer = window.setTimeout(() => finish(false), 6000);
          probe.src = url.href;
        });
      }
      try {
        const response = await fetchLevelResource(url, { method: "HEAD" });
        if (response.ok) {
          const type = response.headers.get("content-type") || "";
          if (/^video\/|^image\//i.test(type)) return true;
          if (/text\/html/i.test(type)) return false;
        } else if (response.status !== 405 && response.status !== 501) return false;
        // Some static hosts do not implement HEAD. Read just the first chunk
        // and cancel it, rather than downloading every video for discovery.
        return await fetchLevelResource(url, { headers: { Range: "bytes=0-31" } }, async sample => {
          if (!sample.ok || /text\/html/i.test(sample.headers.get("content-type") || "")) return false;
          const reader = sample.body?.getReader();
          if (!reader) return false;
          try {
            const { value } = await reader.read();
            if (!value || value.length < 8) return false;
            const tag = String.fromCharCode(...value.slice(4, 8));
            return tag === "ftyp" || value[0] === 0x1a && value[1] === 0x45 && value[2] === 0xdf && value[3] === 0xa3 ||
              value[0] === 0x89 && value[1] === 0x50 && value[2] === 0x4e && value[3] === 0x47;
          } finally { await reader.cancel().catch(() => {}); }
        });
      } catch { return false; }
    }

    async function probeNumberedLevels() {
      const filenames = [];
      let next = 1;
      let absent = 0;
      while (absent < LEVEL_PROBE_GAP) {
        const batch = await Promise.all(Array.from({ length: 4 }, (_, i) => next + i).map(async number => {
          const names = [`room_${number}.png`, `room_${number}.mp4`, `jumpscare_${number}.mp4`];
          const found = await Promise.all(names.map(levelAssetExists));
          return names.filter((_, i) => found[i]);
        }));
        for (const found of batch) {
          filenames.push(...found);
          absent = found.length ? 0 : absent + 1;
        }
        next += batch.length;
      }
      return buildSceneCatalog(filenames);
    }

    async function discoverScenes() {
      if (levelBaseURL.protocol === "file:") return probeNumberedLevels();
      // An optional index is {"files":["room_1.mp4","jumpscare_1.mp4",...]}
      // or a filename array. Normal web-server directory listings work too.
      const [indexed, listed] = await Promise.all([readLevelIndex(), readLevelDirectory()]);
      const scenes = buildSceneCatalog([...indexed, ...listed]);
      return scenes.length ? scenes : probeNumberedLevels();
    }

    function chooseScene(scenes) {
      return scenes.length ? scenes[Math.floor(Math.random() * scenes.length)] : null;
    }

    function showLevelLoadError(error) {
      console.error("Could not load a matching room/jumpscare pair from levels/.", error);
      gameOver = true;
      loadingScreen.classList.add("hidden");
      document.getElementById("gameOverTitle").textContent = "LEVELS UNAVAILABLE";
      showGameOver();
    }

    async function loadRandomLevel() {
      try {
        availableScenes = await discoverScenes();
        currentScene = chooseScene(availableScenes);
        if (!currentScene) throw new Error("No complete numbered pairs were found. Use levels/room_1.mp4 and levels/jumpscare_1.mp4, etc.");
        ROOM_IMAGE_FILE = currentScene.roomImage;
        ROOM_VIDEO_FILE = currentScene.roomVideo;
        ROOM_NAME = `ROOM ${String(currentScene.number).padStart(2, "0")}`;
        cameraRoom.textContent = ROOM_NAME;
        console.info(`Found ${availableScenes.length} level pairs; selected room ${currentScene.number}.`);
        // Assign both sources together before any preload or gameplay begins.
        jumpscareVideo.src = currentScene.jumpscare;
        jumpscareVideo.load();
        prepareJumpscarePlayback().catch(() => {});
        if (ROOM_IMAGE_FILE) roomImage.src = ROOM_IMAGE_FILE;
        else useRoomVideo();
      } catch (error) { showLevelLoadError(error); }
    }

    function acceptWordList(text, source, contentType = "") {
      if (/text\/html|application\/xhtml\+xml/i.test(contentType) || /^\s*</.test(text)) {
        throw new Error("The server returned a web page instead of the word list.");
      }
      const loaded = [...new Set(text
        .split(/\r\n?|\n/)
        .map(line => line.trim().toLowerCase())
        .filter(line => line && !line.startsWith("#"))
        .map(line => line.replace(/[^a-z0-9]/g, ""))
        .filter(Boolean))];
      if (!loaded.length) throw new Error("The file contains no valid words.");

      wordLoadInfo = { status: "loaded", url: source, count: loaded.length, error: null };
      console.info(`Loaded ${loaded.length} words from ${source}`);
      words = shuffleArray(loaded);
      // This run uses exactly three randomly selected clues from words.txt.
      words = words.slice(0, Math.min(3, words.length));
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      readyButton.disabled = false;
      startWord(0);
      populateClueList();
      wordsReadyForClue = true;
      maybeShowClueIntro();
    }

    function showWordLoadError(error) {
      const reason = error.name === "AbortError"
        ? "The request timed out. Check your connection and retry."
        : error.message;
      wordLoadInfo = { ...wordLoadInfo, status: "error", count: 0, error: reason };
      wordsReadyForClue = false;
      readyButton.disabled = true;
      loadingWord.hidden = true;
      wordLoadError.hidden = false;
      wordLoadReason.textContent = reason;
      wordLoadUrl.href = wordLoadInfo.url;
      wordLoadUrl.textContent = wordLoadInfo.url;
      console.warn("Could not load the word list.", wordLoadInfo);
    }

    async function loadWords() {
      if (wordsLoading || gameplayStarted) return;
      wordsLoading = true;
      readyButton.disabled = true;
      wordLoadError.hidden = true;
      loadingWord.hidden = false;
      wordLoadInfo = { status: "loading", url: new URL(WORDS_FILE, document.baseURI).href, count: 0, error: null };
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), WORDS_TIMEOUT_MS);
      try {
        const response = await fetch(wordLoadInfo.url, { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error(`The server returned HTTP ${response.status} for words.txt.`);
        const text = await response.text();
        acceptWordList(text, response.url, response.headers.get("content-type") || "");
      } catch (error) {
        if (error instanceof TypeError) {
          error = new Error(location.protocol === "file:"
            ? "This browser blocked automatic loading from a local HTML file. Choose words.txt below, or open the hosted game."
            : "The browser could not read words.txt. Check the file address below and your connection.");
        }
        showWordLoadError(error);
      } finally {
        window.clearTimeout(timeout);
        wordsLoading = false;
      }
    }

    document.getElementById("retryWordsButton").addEventListener("click", loadWords);
    document.getElementById("chooseWordsButton").addEventListener("click", () => wordFileInput.click());
    wordFileInput.addEventListener("change", async () => {
      const file = wordFileInput.files[0];
      if (!file || wordsLoading || gameplayStarted) return;
      wordsLoading = true;
      try {
        acceptWordList(await file.text(), file.name, file.type);
      } catch (error) {
        showWordLoadError(error);
      } finally {
        wordFileInput.value = "";
        wordsLoading = false;
      }
    });

    function populateClueList() {
      clueList.replaceChildren();
      words.forEach(word => {
        const item = document.createElement("li");
        item.textContent = word.toUpperCase();
        clueList.appendChild(item);
      });
    }

    function maybeShowClueIntro() {
      if (clueIntroShown || !wordsReadyForClue || !videosReadyForClue) return;
      clueIntroShown = true;
      viewport.classList.add("clue-intro-active");
      clueIntro.classList.add("show");
      clueIntro.setAttribute("aria-hidden", "false");

      // Fade the black loader away only once the blurred clue scene is ready beneath it.
      requestAnimationFrame(() => {
        loadingScreen.classList.add("hidden");
      });
    }

    async function beginGameplayFromClues() {
      if (!wordsReadyForClue || gameplayStarted || gameplayStarting || gameOver) return;
      gameplayStarting = true;
      readyButton.disabled = true;
      try {
        // Calling play here also unlocks decoding on browsers that require
        // a user gesture. Gameplay stays on the clue card until it is ready.
        await prepareJumpscarePlayback({ unlockAudio: true });
      } catch (error) {
        gameplayStarting = false;
        readyButton.disabled = false;
        return;
      }
      if (gameOver) return;
      gameplayStarting = false;
      gameplayStarted = true;
      cameraOverlay.setAttribute("aria-hidden", "false");
      updateCameraControls();
      startCameraTimer();
      clueIntro.classList.add("dismiss");
      viewport.classList.remove("clue-intro-active");
      if (anchors[selectedCount]) anchors[selectedCount].hidden = true;
      showCurrentLetter();
      window.setTimeout(() => {
        clueIntro.classList.remove("show", "dismiss");
        clueIntro.setAttribute("aria-hidden", "true");
      }, 190);
      scheduleNextHandCheck();
    }

    readyButton.addEventListener("click", beginGameplayFromClues);

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getRoomDimensions() {
      return roomMedia === roomImage
        ? { width: roomImage.naturalWidth, height: roomImage.naturalHeight }
        : { width: video.videoWidth, height: video.videoHeight };
    }

    function syncVisibleViewport() {
      const visible = window.visualViewport;
      const height = visible?.height || window.innerHeight;
      const width = visible?.width || window.innerWidth;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty("--game-height", `${height}px`);
      rootStyle.setProperty("--game-width", `${width}px`);
      rootStyle.setProperty("--game-top", `${visible?.offsetTop || 0}px`);
      rootStyle.setProperty("--game-left", `${visible?.offsetLeft || 0}px`);
      rootStyle.setProperty("--view-unit", `${height / 100}px`);
    }

    function fitCameraText() {
      const { width, height, left, right } = viewport.getBoundingClientRect();
      const visible = window.visualViewport;
      const visibleLeft = visible?.offsetLeft || 0;
      viewport.style.setProperty("--frame-left-gap", `${Math.max(0, left - visibleLeft)}px`);
      viewport.style.setProperty("--frame-right-gap", `${Math.max(0, visibleLeft + (visible?.width || window.innerWidth) - right)}px`);
      viewport.style.setProperty("--ui-font-size", `${Math.min(21, Math.max(14, height * .026), width * .052)}px`);
      viewport.style.setProperty("--battery-width", `${Math.min(44, Math.max(24, height * .05), width * .1)}px`);
      fitHudWord();
      const band = getSafeLetterBand();
      const baseSize = Math.min(53, Math.max(35, height * .054), Math.max(4, (band.bottom - band.top - 30) / 1.5));
      viewport.style.setProperty("--letter-base-size", `${baseSize}px`);
    }

    function updateLimits() {
      fitCameraText();
      const dimensions = getRoomDimensions();
      if (!dimensions.width || !dimensions.height) return;
      stopCameraMomentum();

      // Use the actual CSS-pixel dimensions, including fractional desktop
      // widths, so the scene, random letter positions and snap edges agree.
      const { width, height } = viewport.getBoundingClientRect();
      renderedVideoWidth = dimensions.width * (height / dimensions.height);
      minOffset = Math.min(0, width - renderedVideoWidth);

      letterWorld.style.width = `${renderedVideoWidth}px`;
      letterWorld.style.height = `${height}px`;
      anomalyWorld.style.width = `${renderedVideoWidth}px`;
      anomalyWorld.style.height = `${height}px`;
      // Keep full-canvas overlays registered even if a PNG uses a different
      // aspect ratio from the original room video.
      jumpscareVideo.style.width = `${renderedVideoWidth}px`;
      jumpscareVideo.style.height = `${height}px`;
      if (anomalyActive && anomalyMeta) {
        anomalyWorldBox = getScaledAnomalyBox(anomalyMeta);
        anomalyImage.style.height = `${height}px`;
        anomalyImage.style.width = `${renderedVideoWidth}px`;
      }

      // Preserve the freely dragged camera position when the frame resizes.
      offsetX = clamp(offsetX, minOffset, 0);
      applyWorldOffset(false);
    }

    function buildSnapPoints() {
      // These points retain the original opening view only; manual camera
      // movement uses continuous dragging instead of snapping between them.
      const step = Math.max(1, viewport.getBoundingClientRect().width);
      const totalTravel = Math.abs(minOffset);
      const points = [0];
      for (let x = step; x < totalTravel; x += step) points.push(-x);
      if (minOffset < 0 && Math.abs(points[points.length - 1] - minOffset) > 1) points.push(minOffset);
      snapPoints = points;
    }

    function nearestSnapIndex(value) {
      let best = 0;
      let distance = Infinity;
      snapPoints.forEach((point, index) => {
        const d = Math.abs(point - value);
        if (d < distance) { distance = d; best = index; }
      });
      return best;
    }

    function applyWorldOffset(animate = false) {
      roomImage.classList.toggle("snapping", animate);
      video.classList.toggle("snapping", animate);
      letterWorld.classList.toggle("snapping", animate);
      anomalyWorld.classList.toggle("snapping", animate);
      jumpscareVideo.classList.toggle("snapping", animate);
      const transform = `translateX(${offsetX}px)`;
      roomImage.style.transform = transform;
      video.style.transform = transform;
      letterWorld.style.transform = transform;
      anomalyWorld.style.transform = transform;
      jumpscareVideo.style.transform = transform;
    }

    function startWord(index) {
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      window.clearTimeout(wordAdvanceTimer);
      wordAdvanceTimer = null;
      wordTransitionPending = false;
      wordIndex = index % words.length;
      currentWord = words[wordIndex];
      selectedCount = 0;
      selectionHistory = [];
      status.textContent = `CLUE ${wordIndex + 1}/${words.length}`;
      createHudWord();
      createScatteredLetters();
      updateCameraControls();
    }

    function createHudWord() {
      wordDisplay.replaceChildren();
      [...currentWord].forEach((letter, index) => {
        const slot = document.createElement("span");
        slot.className = "hud-letter";
        slot.dataset.index = index;
        slot.textContent = "·";
        wordDisplay.appendChild(slot);
      });
      fitHudWord();
    }

    function fitHudWord() {
      const width = wordDisplay.getBoundingClientRect().width;
      const size = Math.min(40, (width - Math.max(0, currentWord.length - 1) * 2) /
        Math.max(1, currentWord.length * .67));
      wordDisplay.style.setProperty("--hud-letter-size", `${Math.max(9, size)}px`);
    }

    function updateCameraControls() {
      snapButton.disabled = !gameplayStarted || handVisible || gameOver || roomCompleted || wordTransitionPending || captureInProgress;
    }

    function updateCameraTimer() {
      if (cameraStartedAt !== null) {
        cameraRemainingSeconds = Math.max(0, Math.ceil(
          (ROOM_TIME_LIMIT_MS - (performance.now() - cameraStartedAt)) / 1000));
      }
      const minutes = String(Math.floor(cameraRemainingSeconds / 60)).padStart(2, "0");
      const seconds = String(cameraRemainingSeconds % 60).padStart(2, "0");
      cameraTimer.textContent = `${minutes}:${seconds}`;
      if (cameraStartedAt !== null && cameraRemainingSeconds === 0 && !gameOver && !roomCompleted) {
        triggerJumpscare();
      }
    }

    function startCameraTimer() {
      window.clearInterval(cameraTimerInterval);
      cameraStartedAt = performance.now();
      cameraRemainingSeconds = ROOM_TIME_LIMIT_MS / 1000;
      updateCameraTimer();
      cameraTimerInterval = window.setInterval(updateCameraTimer, 250);
    }

    function stopCameraTimer() {
      if (cameraStartedAt !== null) {
        cameraRemainingSeconds = Math.max(0, Math.ceil(
          (ROOM_TIME_LIMIT_MS - (performance.now() - cameraStartedAt)) / 1000));
      }
      cameraStartedAt = null;
      window.clearInterval(cameraTimerInterval);
      cameraTimerInterval = null;
      updateCameraTimer();
    }

    function isCurrentLetterInFrame() {
      const anchor = anchors[selectedCount];
      if (!anchor || anchor.hidden) return false;
      const glyph = anchor.querySelector(".letter-glyph");
      const letterRect = glyph.getBoundingClientRect();
      const frame = viewport.getBoundingClientRect();
      // The whole viewport is the camera frame.
      // Use visible glyph bounds rather than the letter's invisible padding.
      const tolerance = .5;
      return letterRect.width > 0 && letterRect.height > 0 &&
        letterRect.left >= frame.left - tolerance && letterRect.right <= frame.right + tolerance &&
        letterRect.top >= frame.top - tolerance && letterRect.bottom <= frame.bottom + tolerance;
    }

    function drawShutterBitmap() {
      shutterBitmapFrame = 0;
      if (!shutterBitmapContext) return;
      // A viewport-sized image surface avoids legacy Android's recolouring
      // of button backgrounds, borders and their CSS filter layers. The real
      // button and its animated core still provide layout and native input.
      const frame = cameraOverlay.getBoundingClientRect();
      const ring = snapButton.getBoundingClientRect();
      const core = snapButton.querySelector(".shutter-core").getBoundingClientRect();
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.round(frame.width * scale);
      const height = Math.round(frame.height * scale);
      if (shutterBitmap.width !== width || shutterBitmap.height !== height) {
        shutterBitmap.width = width;
        shutterBitmap.height = height;
      }
      const context = shutterBitmapContext;
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.clearRect(0, 0, frame.width, frame.height);
      context.strokeStyle = "#fff";
      context.lineWidth = 2;
      context.beginPath();
      context.arc(ring.left - frame.left + ring.width / 2, ring.top - frame.top + ring.height / 2,
        Math.max(0, Math.min(ring.width, ring.height) / 2 - 1), 0, Math.PI * 2);
      context.stroke();
      context.fillStyle = "#fff";
      context.beginPath();
      context.arc(core.left - frame.left + core.width / 2, core.top - frame.top + core.height / 2,
        Math.max(0, Math.min(core.width, core.height) / 2), 0, Math.PI * 2);
      context.fill();
      if (performance.now() < shutterBitmapUntil || snapButton.classList.contains("held") || snapButton.classList.contains("snapping")) {
        shutterBitmapFrame = requestAnimationFrame(drawShutterBitmap);
      }
    }

    function refreshShutterBitmap(duration = 220) {
      if (!shutterBitmapContext) return;
      shutterBitmapUntil = Math.max(shutterBitmapUntil, performance.now() + duration);
      if (!shutterBitmapFrame) shutterBitmapFrame = requestAnimationFrame(drawShutterBitmap);
    }

    function snapCamera() {
      if (!gameplayStarted || handVisible || gameOver || roomCompleted || wordTransitionPending || captureInProgress) return;
      // Check the real deadline before accepting a photo, even if a browser
      // throttled the interval while the tab was in the background.
      updateCameraTimer();
      if (gameOver) return;
      finishPanGesture();
      stopShutterEffect();
      const letterIsVisible = isCurrentLetterInFrame();
      snapButton.classList.remove("snapping");
      void snapButton.offsetWidth;
      snapButton.classList.add("snapping");
      refreshShutterBitmap();
      window.clearTimeout(shutterAnimationTimer);
      shutterAnimationTimer = window.setTimeout(() => snapButton.classList.remove("snapping"), 200);

      if (letterIsVisible) {
        const tile = tiles[selectedCount];
        selectLetter(tile.dataset.letter, selectedCount, tile);
      } else drainBatterySlot();
      if (!gameOver) playShutterEffect();
    }

    function updateBatteryUI() {
      batterySlots.forEach((slot, index) => slot.classList.toggle("drained", index >= batterySlotsRemaining));
      batteryPercent.textContent = `${Math.round(batterySlotsRemaining / BATTERY_SLOT_COUNT * 100)}%`;
      cameraBattery.setAttribute("aria-label", `Camera battery: ${batterySlotsRemaining} of ${BATTERY_SLOT_COUNT} slots`);
    }

    function drainBatterySlot() {
      batterySlotsRemaining = Math.max(0, batterySlotsRemaining - 1);
      updateBatteryUI();
      if (batterySlotsRemaining === 0) triggerJumpscare();
    }

    function stopShutterEffect() {
      if (shutterSceneAnimation) shutterSceneAnimation.cancel();
      shutterSceneAnimation = null;
    }

    function playShutterEffect() {
      stopShutterEffect();
      // This wrapper is the visible camera window, so zooming stays centred
      // on the current view even after panning to either end of the room.
      const animation = sceneEffects.animate([
        { filter: "blur(0px)", transform: "scale(1)" },
        { filter: "blur(2px)", transform: "scale(1.014)", offset: .42 },
        { filter: "blur(0px)", transform: "scale(1)" }
      ], { duration: 240, easing: "ease-in-out" });
      shutterSceneAnimation = animation;
      animation.finished.then(() => {
        if (shutterSceneAnimation === animation) shutterSceneAnimation = null;
      }).catch(() => {});
    }

    function finishLetterTransfer({ reveal = true } = {}) {
      window.clearTimeout(captureFinishTimer);
      captureFinishTimer = null;
      if (captureFlightAnimation) captureFlightAnimation.cancel();
      captureFlightAnimation = null;
      captureEffects.replaceChildren();
      captureInProgress = false;
      if (reveal && currentWord) showCurrentLetter();
      updateCameraControls();
    }

    function flyLetterToWord(anchor, hudSlot) {
      const glyph = anchor.querySelector(".letter-glyph");
      const start = glyph.getBoundingClientRect();
      const target = hudSlot.getBoundingClientRect();
      const frame = viewport.getBoundingClientRect();
      const style = getComputedStyle(glyph);
      const flight = document.createElement("span");
      flight.className = "captured-letter";
      flight.textContent = glyph.textContent;
      flight.style.left = `${start.left + start.width / 2 - frame.left}px`;
      flight.style.top = `${start.top + start.height / 2 - frame.top}px`;
      flight.style.fontFamily = style.fontFamily;
      flight.style.fontSize = style.fontSize;
      flight.style.letterSpacing = style.letterSpacing;
      flight.style.color = style.color;
      captureEffects.appendChild(flight);

      const dx = target.left + target.width / 2 - start.left - start.width / 2;
      const dy = target.top + target.height / 2 - start.top - start.height / 2;
      const rotation = parseFloat(anchor.firstElementChild.style.getPropertyValue("--letter-rotation")) || 0;
      captureInProgress = true;
      updateCameraControls();
      const animation = flight.animate([
        { transform: `translate(-50%, -50%) rotate(${rotation}deg) scale(1)`, opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(0deg) scale(.5)`, opacity: 0 }
      ], { duration: LETTER_TRANSFER_MS, easing: "cubic-bezier(.3,.65,.35,1)", fill: "forwards" });
      captureFlightAnimation = animation;
      animation.finished.then(() => {
        if (captureFlightAnimation === animation) finishLetterTransfer();
      }).catch(() => {});
      captureFinishTimer = window.setTimeout(() => finishLetterTransfer(), LETTER_TRANSFER_MS + 40);
    }

    function finishShutterGesture() {
      const pointerId = shutterPointerId;
      shutterPointerId = null;
      shutterMoved = false;
      snapButton.classList.remove("held");
      refreshShutterBitmap();
      if (pointerId !== null) {
        try {
          if (snapButton.hasPointerCapture(pointerId)) snapButton.releasePointerCapture(pointerId);
        } catch {}
      }
    }

    snapButton.addEventListener("pointerdown", event => {
      if (snapButton.disabled || event.isPrimary === false || event.button !== 0) return;
      event.stopPropagation();
      finishPanGesture();
      finishShutterGesture();
      shutterPointerId = event.pointerId;
      shutterStartX = event.clientX;
      shutterStartY = event.clientY;
      snapButton.classList.add("held");
      refreshShutterBitmap();
      try { snapButton.setPointerCapture(event.pointerId); } catch {}
    });
    snapButton.addEventListener("pointermove", event => {
      if (event.pointerId !== shutterPointerId) return;
      if (event.pointerType !== "touch" && (event.buttons & 1) === 0) {
        finishShutterGesture();
        return;
      }
      if (Math.hypot(event.clientX - shutterStartX, event.clientY - shutterStartY) > 8) shutterMoved = true;
    });
    snapButton.addEventListener("pointerup", event => {
      if (event.pointerId !== shutterPointerId) return;
      const rect = snapButton.getBoundingClientRect();
      const isTap = !shutterMoved &&
        Math.hypot(event.clientX - shutterStartX, event.clientY - shutterStartY) <= 8 &&
        event.clientX >= rect.left && event.clientX <= rect.right &&
        event.clientY >= rect.top && event.clientY <= rect.bottom;
      finishShutterGesture();
      // Mobile browsers may omit the compatibility click after a drag.
      // Capture on release, then ignore that optional click to avoid duplicates.
      if (isTap) snapCamera();
    });
    snapButton.addEventListener("pointercancel", event => {
      if (event.pointerId === shutterPointerId) finishShutterGesture();
    });
    snapButton.addEventListener("lostpointercapture", event => {
      if (event.pointerId === shutterPointerId && !snapButton.hasPointerCapture(event.pointerId)) finishShutterGesture();
    });
    snapButton.addEventListener("click", event => {
      if (event.detail > 0 || event.pointerType) return;
      snapCamera(); // Keyboard and assistive activation still use native click.
    });

    function showCurrentLetter({ animate = true } = {}) {
      anchors.forEach((anchor, index) => {
        const shouldShow = !wordTransitionPending && !captureInProgress && index === selectedCount;
        if (!shouldShow) {
          anchor.hidden = true;
          anchor.classList.remove("appearing");
        } else if (anchor.hidden) {
          anchor.hidden = false;
          if (animate) {
            void anchor.offsetWidth;
            anchor.classList.add("appearing");
          }
        }
      });
    }

    function createScatteredLetters() {
      letterWorld.replaceChildren();
      tiles = [];
      anchors = [];

      [...currentWord].forEach((letter, index) => {
        const anchor = document.createElement("div");
        anchor.className = "letter-anchor";
        anchor.hidden = true;
        // Independent uniform coordinates, retained across viewport changes.
        // Y is a fraction of the safe band between the camera UI rows.
        anchor.dataset.worldX = Math.random();
        anchor.dataset.worldY = Math.random();

        const tile = document.createElement("span");
        tile.className = "letter-tile";
        tile.dataset.index = index;
        tile.dataset.letter = letter;
        tile.style.setProperty("--letter-scale", .7 + Math.random() * .3);
        tile.style.setProperty("--letter-rotation", `${Math.random() * 50 - 25}deg`);
        if (index === 0) {
          tile.classList.add("first-letter");
          for (let step = 1; step <= 3; step++) {
            tile.style.setProperty(`--jitter-x${step}`, `${Math.random() * 4 - 2}px`);
            tile.style.setProperty(`--jitter-y${step}`, `${Math.random() * 4 - 2}px`);
          }
        }
        tile.setAttribute("aria-label", `Letter ${letter}`);

        const glyph = document.createElement("span");
        glyph.className = "letter-glyph";
        glyph.textContent = letter;
        tile.appendChild(glyph);

        anchor.appendChild(tile);
        letterWorld.appendChild(anchor);
        tiles.push(tile);
        anchors.push(anchor);
      });
      relayoutScatteredLetters();
      showCurrentLetter();
    }

    function getSafeLetterBand() {
      const frame = viewport.getBoundingClientRect();
      const top = Math.max(cameraBattery.getBoundingClientRect().bottom,
        hud.getBoundingClientRect().bottom, cameraTimer.getBoundingClientRect().bottom) - frame.top;
      const bottom = Math.min(snapButton.getBoundingClientRect().top,
        status.getBoundingClientRect().top, cameraRoom.getBoundingClientRect().top) - frame.top;
      return { top, bottom };
    }

    function relayoutScatteredLetters() {
      const band = getSafeLetterBand();
      const frame = viewport.getBoundingClientRect();
      const worldWidth = renderedVideoWidth || frame.width;
      anchors.forEach((anchor, index) => {
        const wasHidden = anchor.hidden;
        anchor.hidden = false;
        const glyph = anchor.querySelector(".letter-glyph");
        const footprint = glyph.getBoundingClientRect();
        anchor.hidden = wasHidden;
        // Include rotation, the first letter's small vibration, and a margin
        // so the complete glyph remains clear of both UI rows and room edges.
        const padding = index === 0 ? 15 : 12;
        const minX = footprint.width / 2 + padding;
        const maxX = Math.max(minX, worldWidth - minX);
        const minY = band.top + footprint.height / 2 + padding;
        const maxY = Math.max(minY, band.bottom - footprint.height / 2 - padding);
        anchor.style.left = `${minX + Number(anchor.dataset.worldX) * (maxX - minX)}px`;
        anchor.style.top = `${minY + Number(anchor.dataset.worldY) * (maxY - minY)}px`;
      });
    }

    function selectLetter(letter, tileIndex, tile) {
      if (!gameplayStarted || handVisible || gameOver || roomCompleted || wordTransitionPending || captureInProgress) return;
      updateCameraTimer();
      if (gameOver) return;
      if (tileIndex !== selectedCount || tile !== tiles[tileIndex] || anchors[tileIndex].hidden) return;
      if (anomalyActive) {
        triggerJumpscare();
        return;
      }
      const expectedLetter = currentWord[selectedCount];
      if (letter !== expectedLetter || tile.classList.contains("selected")) return;

      const hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
      flyLetterToWord(anchors[tileIndex], hudSlot);
      tile.classList.add("selected");
      const anchor = anchors[tileIndex];
      anchor.classList.add("collected");

      selectionHistory.push(tileIndex);
      hudSlot.textContent = expectedLetter.toUpperCase();
      hudSlot.classList.add("found");
      selectedCount++;

      if (selectedCount === currentWord.length) completeWord();
      showCurrentLetter();
    }

    function undoLastLetter() {
      if (!gameplayStarted || handVisible || gameOver || roomCompleted || wordTransitionPending) return;
      if (selectedCount <= 0 || !selectionHistory.length) return;
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      selectedCount--;

      const tileIndex = selectionHistory.pop();
      const tile = tiles[tileIndex];
      const anchor = anchors[tileIndex];
      anchor.classList.remove("collected");
      tile.classList.remove("selected");

      const hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
      hudSlot.textContent = "·";
      hudSlot.classList.remove("found");
      showCurrentLetter();
    }

    function completeWord() {
      if (wordTransitionPending || gameOver || roomCompleted) return;
      wordTransitionPending = true;
      updateCameraControls();
      completedWordCount++;
      // Correct words use power, but only missed photos can spend the last slot.
      if (batterySlotsRemaining > 1) drainBatterySlot();
      if (completedWordCount >= words.length) {
        roomCompleted = true;
        stopCameraTimer();
        window.clearTimeout(anomalyTimer);
        window.clearTimeout(handTimer);
      }
      if (!roomCompleted && !anomalyEnabled && completedWordCount >= 1) {
        anomalyEnabled = true;
        scheduleAnomalyCheck();
      }
      status.textContent = `CLUE ${wordIndex + 1}/${words.length}`;
      message.classList.remove("show");
      void message.offsetWidth;
      message.classList.add("show");
      wordAdvanceTimer = window.setTimeout(() => {
        if (gameOver) return;
        if (roomCompleted) {
          document.getElementById("gameOverTitle").textContent = "ROOM COMPLETE";
          document.getElementById("retryText").textContent = "TAP TO PLAY AGAIN";
          gameOverScreen.setAttribute("aria-label", "Room complete. Tap to play again.");
          gameOverScreen.classList.add("show");
          return;
        }
        startWord(wordIndex + 1);
      }, 650);
    }

    function stopCameraMomentum() {
      if (cameraMomentumFrame) cancelAnimationFrame(cameraMomentumFrame);
      cameraMomentumFrame = 0;
    }

    function recordPanMotion(clientX, time) {
      const previous = panMotionSamples[panMotionSamples.length - 1];
      if (!previous || clientX === previous.x) return;
      const delta = clientX - previous.x;
      const direction = Math.sign(delta);
      if (direction !== panMotionDirection) {
        // A reversal starts a new velocity estimate, including at an edge.
        panMotionSamples = [previous];
        panMotionDirection = direction;
        panDirectionTravel = 0;
      }
      panDirectionTravel += Math.abs(delta);
      panMotionSamples.push({ x: clientX, time });
      while (panMotionSamples.length > 2 &&
             panMotionSamples[0].time < time - CAMERA_VELOCITY_WINDOW_MS) {
        panMotionSamples.shift();
      }
    }

    function getPanReleaseVelocity(time) {
      if (panMotionSamples.length < 2) return 0;
      const first = panMotionSamples[0];
      const last = panMotionSamples[panMotionSamples.length - 1];
      const freshness = clamp(1 - (time - last.time) / CAMERA_VELOCITY_WINDOW_MS, 0, 1);
      return (last.x - first.x) * CAMERA_DRAG_GAIN /
        Math.max(16, last.time - first.time) * freshness;
    }

    function startCameraMomentum(velocity, travel) {
      stopCameraMomentum();
      if (!gameplayStarted || isDragging || handVisible || gameOver || roomCompleted || document.hidden) return;
      if (Math.abs(velocity) < CAMERA_MOMENTUM_MIN_SPEED) return;

      const width = viewport.getBoundingClientRect().width;
      const strongFlick = Math.abs(velocity) >= CAMERA_FLICK_SPEED &&
        travel >= Math.max(48, width * 0.12);
      const direction = Math.sign(velocity);
      // A deliberate, fast flick reaches the corresponding edge. Smaller
      // gestures coast a limited distance with the same slowing-down feel.
      const coastDistance = Math.min(Math.abs(velocity) * 180,
        travel * CAMERA_DRAG_GAIN * 1.75, width * 0.75);
      const target = strongFlick ? (direction < 0 ? minOffset : 0) :
        clamp(offsetX + direction * coastDistance, minOffset, 0);
      const origin = offsetX;
      const distance = Math.abs(target - origin);
      if (distance < 0.5) return;

      const duration = clamp(3 * distance / Math.abs(velocity), 240, 850);
      const started = performance.now();
      const step = time => {
        if (isDragging || handVisible || gameOver || document.hidden) {
          stopCameraMomentum();
          return;
        }
        const progress = clamp((time - started) / duration, 0, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        offsetX = clamp(origin + (target - origin) * eased, minOffset, 0);
        if (progress === 1) offsetX = target;
        applyWorldOffset(false);
        updateAnomalyVisibilityState();
        cameraMomentumFrame = progress < 1 ? requestAnimationFrame(step) : 0;
      };
      cameraMomentumFrame = requestAnimationFrame(step);
    }

    function finishPanGesture() {
      stopCameraMomentum();
      const pointerId = panPointerId;
      const wasPanning = isDragging;
      // Clear ownership before releasing capture, since that release can
      // itself fire lostpointercapture.
      isDragging = false;
      panPointerId = null;
      panMotionSamples = [];
      panMotionDirection = 0;
      panDirectionTravel = 0;
      movedDuringDrag = false;
      body.classList.remove("grabbing");
      if (pointerId !== null) {
        try {
          if (viewport.hasPointerCapture(pointerId)) viewport.releasePointerCapture(pointerId);
        } catch {}
      }
      if (wasPanning) {
        offsetX = clamp(offsetX, minOffset, 0);
        applyWorldOffset(false);
        updateAnomalyVisibilityState();
      }
    }

    function pointerDown(event) {
      // The clue card and its READY button own their own pointer events.
      if (!gameplayStarted || handVisible || gameOver || roomCompleted) return;
      if (event.isPrimary === false) return;
      if (event.button !== undefined && event.button !== 0) return;
      // The shutter keeps its native click/tap. Never capture its press as
      // a camera drag, including when a previous flick is still coasting.
      if (event.target.closest?.("button, [role='button']")) {
        finishPanGesture();
        return;
      }

      // A fresh press always starts a fresh gesture, even if an earlier
      // release happened outside the browser and was never delivered.
      finishPanGesture();
      stopShutterEffect();
      isDragging = true;
      panPointerId = event.pointerId;
      dragStartClientX = event.clientX;
      lastPanClientX = event.clientX;
      // Input timestamps keep touch velocity independent of render delays.
      panMotionSamples = [{ x: event.clientX, time: event.timeStamp }];
      body.classList.add("grabbing");
      applyWorldOffset(false);
      try { viewport.setPointerCapture(event.pointerId); } catch {}
    }

    function pointerMove(event) {
      if (!isDragging || event.pointerId !== panPointerId) return;
      // Recover immediately when the mouse returns after an outside release.
      if (event.pointerType !== "touch" && (event.buttons & 1) === 0) {
        finishPanGesture();
        return;
      }

      recordPanMotion(event.clientX, event.timeStamp);
      const dragDistance = event.clientX - dragStartClientX;
      if (!movedDuringDrag) {
        if (Math.abs(dragDistance) <= 6) return;
        try { viewport.setPointerCapture(event.pointerId); } catch {}
        movedDuringDrag = true;
      }

      // Consume each movement even at the room's edge. Reversing direction
      // then moves immediately instead of having to undo an overshoot first.
      const deltaX = event.clientX - lastPanClientX;
      lastPanClientX = event.clientX;
      offsetX = clamp(offsetX + deltaX * CAMERA_DRAG_GAIN, minOffset, 0);
      applyWorldOffset(false);
      updateAnomalyVisibilityState();
    }

    function pointerUp(event) {
      if (!isDragging || event.pointerId !== panPointerId) return;

      const released = event.timeStamp;
      recordPanMotion(event.clientX, released);
      const velocity = movedDuringDrag ? getPanReleaseVelocity(released) : 0;
      const travel = panDirectionTravel;
      if (movedDuringDrag) {
        offsetX = clamp(offsetX + (event.clientX - lastPanClientX) * CAMERA_DRAG_GAIN, minOffset, 0);
      }
      // Release pointer ownership before starting the independent glide, so
      // the next press can immediately stop it and start a fresh drag.
      finishPanGesture();
      startCameraMomentum(velocity, travel);
    }

    function pointerCancel(event) {
      if (!isDragging || event.pointerId !== panPointerId) return;
      finishPanGesture();
    }

    function scheduleAnomalyCheck() {
      window.clearTimeout(anomalyTimer);
      if (!anomalyEnabled || anomalyActive || gameOver || roomCompleted) return;
      anomalyTimer = window.setTimeout(async () => {
        if (!anomalyEnabled || anomalyActive || gameOver || roomCompleted) return;
        if (Math.random() < ANOMALY_SPAWN_CHANCE) {
          const placed = await spawnAnomalyOffscreen();
          if (!placed) scheduleAnomalyCheck();
        } else {
          scheduleAnomalyCheck();
        }
      }, ANOMALY_CHECK_MS);
    }

    async function readAlphaBounds(src) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
            for (let y = 0; y < canvas.height; y++) {
              for (let x = 0; x < canvas.width; x++) {
                if (data[(y * canvas.width + x) * 4 + 3] > 8) {
                  if (x < minX) minX = x;
                  if (x > maxX) maxX = x;
                  if (y < minY) minY = y;
                  if (y > maxY) maxY = y;
                }
              }
            }
            resolve({
              src, width: img.naturalWidth, height: img.naturalHeight,
              bbox: maxX >= minX ? { left: minX, top: minY, right: maxX + 1, bottom: maxY + 1 } : null
            });
          } catch (error) {
            console.warn("Could not inspect anomaly alpha bounds; using full image bounds.", error);
            resolve({ src, width: img.naturalWidth, height: img.naturalHeight, bbox: { left: 0, top: 0, right: img.naturalWidth, bottom: img.naturalHeight } });
          }
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function currentVisibleWorldRange() {
      const left = -offsetX;
      return { left, right: left + viewport.getBoundingClientRect().width };
    }

    function getScaledAnomalyBox(meta) {
      const scaleX = renderedVideoWidth / meta.width;
      const scaleY = viewport.getBoundingClientRect().height / meta.height;
      return {
        left: meta.bbox.left * scaleX,
        right: meta.bbox.right * scaleX,
        top: meta.bbox.top * scaleY,
        bottom: meta.bbox.bottom * scaleY
      };
    }

    function horizontalBoxesIntersect(a, b) {
      return a.left < b.right && a.right > b.left;
    }

    async function spawnAnomalyOffscreen() {
      if (anomalyActive || gameOver || roomCompleted || !renderedVideoWidth) return false;
      const src = ANOMALY_FILES[Math.floor(Math.random() * ANOMALY_FILES.length)];
      const meta = await readAlphaBounds(src);
      if (!meta || !meta.bbox || gameOver || roomCompleted) return false;

      // The anomaly PNG is authored against the same full 1280x720 scene as
      // the video. Keep the PNG fixed at the scene origin so its opaque pixels
      // always land at their authored location; only the panorama itself pans.
      const bbox = getScaledAnomalyBox(meta);

      // Spawn only while the anomaly's ACTUAL non-transparent pixels are fully
      // outside the current viewport. If its authored location is visible now,
      // skip this checkpoint and try again on the next anomaly check.
      const visible = currentVisibleWorldRange();
      const edgePad = 8;
      if (horizontalBoxesIntersect(
        { left: bbox.left, right: bbox.right },
        { left: visible.left - edgePad, right: visible.right + edgePad }
      )) return false;

      anomalyMeta = meta;
      anomalyWorldBox = bbox;
      anomalyHasBeenSeen = false;
      anomalyActive = true;
      anomalyImage.src = src;
      anomalyImage.style.left = "0px";
      anomalyImage.style.top = "0px";
      anomalyImage.style.height = `${viewport.getBoundingClientRect().height}px`;
      anomalyImage.style.width = `${renderedVideoWidth}px`;
      anomalyImage.style.display = "block";
      anomalyWorld.style.width = `${renderedVideoWidth}px`;
      anomalyWorld.style.height = `${viewport.getBoundingClientRect().height}px`;
      updateAnomalyVisibilityState();
      return true;
    }

    function updateAnomalyVisibilityState() {
      if (!anomalyActive || !anomalyWorldBox || gameOver) return;
      const visible = currentVisibleWorldRange();
      const intersects = horizontalBoxesIntersect(anomalyWorldBox, visible);
      if (intersects) {
        anomalyHasBeenSeen = true;
      } else if (anomalyHasBeenSeen) {
        removeAnomalyAndRestartTimer();
      }
    }

    function removeAnomalyAndRestartTimer() {
      anomalyActive = false;
      anomalyHasBeenSeen = false;
      anomalyMeta = null;
      anomalyWorldBox = null;
      anomalyImage.style.display = "none";
      anomalyImage.removeAttribute("src");
      if (!gameOver) scheduleAnomalyCheck();
    }

    function triggerJumpscare() {
      if (gameOver || roomCompleted) return;
      gameOver = true;
      updateCameraControls();
      stopCameraTimer();
      window.clearTimeout(wordAdvanceTimer);
      window.clearTimeout(anomalyTimer);
      window.clearTimeout(handTimer);
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();

      // jumpscare.mp4 is 1280x720, the same authored canvas as room.mp4.
      // Put it into that exact panorama coordinate space at the CURRENT camera
      // position first, so the first visible frame perfectly overlays the room.
      const previousOffset = offsetX;
      roomImage.classList.remove("snapping");
      video.classList.remove("snapping");
      letterWorld.classList.remove("snapping");
      anomalyWorld.classList.remove("snapping");
      jumpscareVideo.classList.remove("snapping");
      jumpscareVideo.style.transform = `translateX(${previousOffset}px)`;
      // The first frame is already decoded and parked at time zero. Avoid a
      // redundant seek here, which can delay the first visible scare frame.
      jumpscareVideo.style.display = "block";
      jumpscareVideo.classList.add("playing");
      jumpscareVideo.muted = false;
      if (jumpscareAudioGain) {
        jumpscareAudioGain.gain.setValueAtTime(1, jumpscareAudioContext.currentTime);
        resumeJumpscareAudio();
      }

      let movementStarted = false;
      const flyToCentre = () => {
        if (movementStarted || !jumpscareVideo.classList.contains("playing")) return;
        movementStarted = true;
        requestAnimationFrame(() => {
          if (!jumpscareVideo.classList.contains("playing")) return;
          offsetX = minOffset / 2;
          applyWorldOffset(true);
        });
      };
      // Show and start playback at the player's current view. Begin the
      // camera flight only after the video presents its first playing frame.
      void jumpscareVideo.offsetWidth;
      if (typeof jumpscareVideo.requestVideoFrameCallback === "function") {
        jumpscareFrameRequest = jumpscareVideo.requestVideoFrameCallback(() => {
          jumpscareFrameRequest = null;
          flyToCentre();
        });
      } else jumpscareVideo.addEventListener("playing", flyToCentre, { once: true });
      const playPromise = jumpscareVideo.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(error => {
          if (error.name === "NotAllowedError") {
            jumpscareVideo.muted = true;
            const retry = jumpscareVideo.play();
            if (retry) retry.catch(showGameOver);
          } else showGameOver();
        });
      }
    }

    function showGameOver() {
      stopCameraTimer();
      snapButton.disabled = true;
      if (jumpscareFrameRequest !== null) {
        jumpscareVideo.cancelVideoFrameCallback?.(jumpscareFrameRequest);
        jumpscareFrameRequest = null;
      }
      jumpscareVideo.pause();
      if (jumpscareAudioGain) jumpscareAudioGain.gain.setValueAtTime(0, jumpscareAudioContext.currentTime);
      jumpscareVideo.classList.remove("playing");
      jumpscareVideo.style.display = "none";
      gameOverScreen.classList.add("show");
    }

    jumpscareVideo.addEventListener("ended", () => {
      if (gameOver && jumpscareVideo.classList.contains("playing")) showGameOver();
    });
    jumpscareVideo.addEventListener("error", () => {
      gameOver = true;
      loadingScreen.classList.add("hidden");
      if (!gameplayStarted) document.getElementById("gameOverTitle").textContent = "VIDEO UNAVAILABLE";
      showGameOver();
    });
    gameOverScreen.addEventListener("pointerup", () => location.reload());
    gameOverScreen.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") location.reload();
    });

    function scheduleNextHandCheck() {
      window.clearTimeout(handTimer);
      if (gameOver || roomCompleted) return;
      const delay = 8000 + Math.random() * 4000; // 10 seconds ±2 seconds
      handTimer = window.setTimeout(() => {
        if (!handVisible && Math.random() < 0.25) {
          showHand();
        } else {
          scheduleNextHandCheck();
        }
      }, delay);
    }

    function showHand() {
      if (handVisible || gameOver || roomCompleted) return;
      handVisible = true;
      updateCameraControls();
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer();
      stopShutterEffect();
      viewport.classList.add("hand-active");
      handBlocker.className = "active entering";
      handBlocker.setAttribute("aria-hidden", "false");

      // Ensure the animation restarts cleanly every time.
      void handImage.offsetWidth;
      window.setTimeout(() => {
        if (!handVisible) return;
        handBlocker.className = "active resting";
      }, 520);
    }

    function hideHand({ continueFromDrag = false } = {}) {
      if (!handVisible) return;
      viewport.classList.remove("hand-active");
      handPointerId = null;
      handDragStarted = false;

      if (continueFromDrag) {
        // Continue smoothly from the exact dragged position. Do NOT reset the
        // transform to the resting position first, which caused a visible flicker.
        handBlocker.className = "active";
        handImage.style.transition = "transform 280ms cubic-bezier(.55,.05,.82,.34)";
        const exitY = Math.max(viewport.clientHeight * 1.15, handImage.getBoundingClientRect().height * 1.10);

        requestAnimationFrame(() => {
          handImage.style.transform = `translate(-50%, ${exitY}px)`;
        });
      } else {
        handBlocker.className = "active exiting";
      }

      window.setTimeout(() => {
        handVisible = false;
        updateCameraControls();
        handBlocker.className = "";
        handBlocker.setAttribute("aria-hidden", "true");
        handImage.style.transition = "";
        handImage.style.transform = "";
        scheduleNextHandCheck();
      }, 300);
    }

    function handPointerDown(event) {
      if (!handVisible || (event.button !== undefined && event.button !== 0)) return;
      event.preventDefault();
      event.stopPropagation();
      handPointerId = event.pointerId;
      handStartY = event.clientY;
      handCurrentY = event.clientY;
      handDragStarted = false;
      handBlocker.classList.add("dragging");
      try { handBlocker.setPointerCapture(event.pointerId); } catch {}
    }

    function handPointerMove(event) {
      if (!handVisible || handPointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      handCurrentY = event.clientY;
      const dy = Math.max(0, handCurrentY - handStartY);
      if (dy > 4) handDragStarted = true;

      // Follow only downward gestures; upward movement does not dismiss it.
      if (dy > 0) {
        const maxDrag = viewport.clientHeight * 0.55;
        const visualDy = Math.min(dy, maxDrag);
        handImage.style.transform = `translate(-50%, ${visualDy}px)`;
      }
    }

    function handPointerUp(event) {
      if (!handVisible || handPointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      const dy = event.clientY - handStartY;
      const threshold = Math.max(70, viewport.clientHeight * 0.10);
      handBlocker.classList.remove("dragging");
      try { handBlocker.releasePointerCapture(event.pointerId); } catch {}
      handPointerId = null;

      if (dy >= threshold) {
        // A committed downward swipe continues from the current drag position
        // directly off-screen without jumping back up first.
        hideHand({ continueFromDrag: true });
      } else {
        handImage.style.transition = "transform 180ms ease-out";
        handImage.style.transform = "translate(-50%, 0)";
        window.setTimeout(() => {
          handImage.style.transition = "";
          handImage.style.transform = "";
        }, 190);
      }
    }

    handBlocker.addEventListener("pointerdown", handPointerDown);
    handBlocker.addEventListener("pointermove", handPointerMove);
    handBlocker.addEventListener("pointerup", handPointerUp);
    handBlocker.addEventListener("pointercancel", handPointerUp);

    function prepareRoomScene() {
      updateLimits();
      buildSnapPoints();
      offsetX = snapPoints[nearestSnapIndex(minOffset / 2)];
      applyWorldOffset(false);
      anomalyWorld.style.width = `${renderedVideoWidth}px`;
      if (currentWord) relayoutScatteredLetters();
      updateAnomalyVisibilityState();
    }

    video.addEventListener("loadedmetadata", () => {
      if (roomMedia === video) prepareRoomScene();
    });

    function resizeGameViewport() {
      viewportLayoutFrame = 0;
      syncVisibleViewport();
      finishShutterGesture();
      finishLetterTransfer({ reveal: false });
      stopShutterEffect();
      updateLimits();
      // Keep random coordinates, sizes, rotations and collected progress.
      // Refit the same letters between the newly sized camera UI rows.
      if (currentWord) relayoutScatteredLetters();
      fitHudWord();
      showCurrentLetter({ animate: false });
      updateAnomalyVisibilityState();
      refreshShutterBitmap();
    }

    function requestViewportLayout() {
      if (!viewportLayoutFrame) viewportLayoutFrame = requestAnimationFrame(resizeGameViewport);
    }

    window.addEventListener("resize", requestViewportLayout);
    window.visualViewport?.addEventListener("resize", requestViewportLayout);
    window.visualViewport?.addEventListener("scroll", requestViewportLayout);
    // Refit letter bounds after the bundled font replaces the fallback.
    document.fonts?.ready.then(requestViewportLayout);

    window.addEventListener("keydown", event => {
      if (event.key === "Backspace" || event.key === "Back") {
        event.preventDefault();
        undoLastLetter();
      }
    });

    viewport.addEventListener("pointerdown", pointerDown);
    // Observe releases before an overlay can stop their propagation, and
    // clean up interruptions so the very next press can drag normally.
    window.addEventListener("pointermove", pointerMove, true);
    window.addEventListener("pointerup", pointerUp, true);
    window.addEventListener("pointercancel", pointerCancel, true);
    viewport.addEventListener("lostpointercapture", event => {
      // Ignore capture loss from an overlay when the room still owns capture.
      if (event.target === viewport && !viewport.hasPointerCapture(event.pointerId)) pointerCancel(event);
    });
    function interruptCameraInput() {
      finishPanGesture();
      finishShutterGesture();
      finishLetterTransfer();
      stopShutterEffect();
    }
    window.addEventListener("blur", interruptCameraInput);
    window.addEventListener("pagehide", interruptCameraInput);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) interruptCameraInput();
      else {
        if (gameplayStarted && !roomCompleted) resumeJumpscareAudio();
        updateCameraTimer();
        if (jumpscarePreparing && !jumpscareReady) {
          const resume = jumpscareVideo.play();
          if (resume) resume.catch(() => {});
        }
      }
    });
    viewport.addEventListener("dragstart", event => event.preventDefault());

    // Loading screen: prepare the selected room background before revealing it.
    document.querySelectorAll(".loading-letter").forEach((letter, index) => {
      const jitter = () => (Math.random() * 4 - 2).toFixed(2) + "px";
      letter.style.setProperty("--lx1", jitter());
      letter.style.setProperty("--ly1", jitter());
      letter.style.setProperty("--lx2", jitter());
      letter.style.setProperty("--ly2", jitter());
      letter.style.setProperty("--lx3", jitter());
      letter.style.setProperty("--ly3", jitter());
      letter.style.animationDelay = `${index * 37}ms`;
    });

    function hideLoadingScreen() {
      // Kept for compatibility; the clue intro now controls the reveal.
      maybeShowClueIntro();
    }

    // Try the image first. Only request the room video if the PNG is missing
    // or cannot be decoded; this also works when opening the game locally.
    let roomMediaReady = false;

    function revealWhenMediaReady() {
      if (roomMediaReady && jumpscareMetadataReady && jumpscareWarmAttempted && !gameOver) {
        videosReadyForClue = true;
        maybeShowClueIntro();
      }
    }

    function resumeJumpscareAudio() {
      if (!jumpscareAudioContext || jumpscareAudioContext.state === "running" || jumpscareAudioContext.state === "closed") return;
      const resumed = jumpscareAudioContext.resume();
      if (resumed) resumed.catch(error => console.warn("Could not resume jumpscare audio.", error));
    }

    // Keep desktop audio in the native media player. Routing file:// media
    // through Web Audio can produce CORS silence even when video playback works.
    // Touch devices use gain zero to unlock sound without an audible warm-up.
    function unlockJumpscareAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const needsAudioGraph = location.protocol !== "file:" && window.matchMedia("(pointer: coarse)").matches;
      if (!needsAudioGraph || !AudioContextClass) {
        jumpscareVideo.volume = 0;
        return Promise.resolve();
      }
      if (!jumpscareAudioContext) {
        jumpscareAudioContext = new AudioContextClass();
        jumpscareAudioGain = jumpscareAudioContext.createGain();
        jumpscareAudioGain.gain.value = 0;
        jumpscareAudioSource = jumpscareAudioContext.createMediaElementSource(jumpscareVideo);
        jumpscareAudioSource.connect(jumpscareAudioGain);
        jumpscareAudioGain.connect(jumpscareAudioContext.destination);
      }
      jumpscareAudioGain.gain.setValueAtTime(0, jumpscareAudioContext.currentTime);
      // Call resume here, synchronously inside READY's click handler.
      return jumpscareAudioContext.resume().then(() => {
        if (jumpscareAudioContext.state !== "running") throw new Error("Jumpscare audio is not ready.");
      });
    }

    // Restore an interrupted audio context on the next real interaction too.
    window.addEventListener("pointerup", event => {
      if (event.isTrusted && gameplayStarted && !gameOver && !roomCompleted) resumeJumpscareAudio();
    }, true);

    function prepareJumpscarePlayback({ unlockAudio = false } = {}) {
      if (jumpscareReady && (!unlockAudio || jumpscareAudioUnlocked)) return Promise.resolve();
      if (jumpscarePreparing) return jumpscarePreparing;
      const audioReady = unlockAudio ? unlockJumpscareAudio() : Promise.resolve();
      jumpscareVideo.classList.add("priming");
      // Unlock the same video from READY. Desktop uses volume zero during
      // warm-up; mobile uses its gain node, since system volume is user-owned.
      const audibleWarmup = unlockAudio;
      jumpscareVideo.muted = !audibleWarmup;
      if (audibleWarmup) jumpscareVideo.defaultMuted = false;
      let frameRequest = null;
      let frameFallback = null;
      let frameFallbackTimer = null;
      let cleanupBuffer = () => {};
      let cleanupFrameError = () => {};

      const buffered = new Promise((resolve, reject) => {
        const check = () => {
          if (jumpscareVideo.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) resolve();
        };
        const failed = () => reject(new Error("Could not load jumpscare.mp4"));
        const events = ["canplaythrough", "canplay", "loadeddata", "progress"];
        events.forEach(type => jumpscareVideo.addEventListener(type, check));
        jumpscareVideo.addEventListener("error", failed);
        cleanupBuffer = () => {
          events.forEach(type => jumpscareVideo.removeEventListener(type, check));
          jumpscareVideo.removeEventListener("error", failed);
        };
        check();
      });
      const decoded = new Promise((resolve, reject) => {
        const failed = () => reject(new Error("Could not decode jumpscare.mp4"));
        jumpscareVideo.addEventListener("error", failed);
        cleanupFrameError = () => jumpscareVideo.removeEventListener("error", failed);
        if (typeof jumpscareVideo.requestVideoFrameCallback === "function") {
          frameRequest = jumpscareVideo.requestVideoFrameCallback(resolve);
          // Some mobile compositors suspend frame callbacks beneath the
          // loader. A decoded current frame is still safe to rewind/cache;
          // the separate buffer and play promises must also finish first.
          const checkDecoded = () => {
            if (jumpscareVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) resolve();
            else frameFallbackTimer = window.setTimeout(checkDecoded, 100);
          };
          frameFallbackTimer = window.setTimeout(checkDecoded, 250);
        } else {
          frameFallback = () => requestAnimationFrame(() => requestAnimationFrame(resolve));
          jumpscareVideo.addEventListener("playing", frameFallback, { once: true });
        }
      });

      // Call play synchronously: a READY click can supply the required user
      // gesture on browsers that block the initial silent warm-up attempt.
      const playPromise = jumpscareVideo.play();
      const prepare = (async () => {
        try {
          await Promise.all([playPromise, buffered, decoded, audioReady]);
          jumpscareVideo.pause();
          if (jumpscareVideo.currentTime > 0) {
            await new Promise((resolve, reject) => {
              const cleanup = () => {
                jumpscareVideo.removeEventListener("seeked", done);
                jumpscareVideo.removeEventListener("error", failed);
              };
              const done = () => { cleanup(); resolve(); };
              const failed = () => { cleanup(); reject(new Error("Could not prepare jumpscare.mp4")); };
              jumpscareVideo.addEventListener("seeked", done, { once: true });
              jumpscareVideo.addEventListener("error", failed, { once: true });
              jumpscareVideo.currentTime = 0;
            });
          }
          jumpscareReady = true;
          if (unlockAudio) jumpscareAudioUnlocked = true;
        } finally {
          cleanupBuffer();
          cleanupFrameError();
          window.clearTimeout(frameFallbackTimer);
          if (frameRequest !== null) jumpscareVideo.cancelVideoFrameCallback?.(frameRequest);
          if (frameFallback) jumpscareVideo.removeEventListener("playing", frameFallback);
          jumpscareVideo.pause();
          jumpscareVideo.volume = 1;
          jumpscareVideo.muted = false;
          jumpscareVideo.classList.remove("priming");
        }
      })();
      jumpscarePreparing = prepare.finally(() => {
        jumpscarePreparing = null;
        jumpscareWarmAttempted = true;
        revealWhenMediaReady();
      });
      return jumpscarePreparing;
    }

    const markRoomVideoReady = () => {
      if (roomMedia !== video) return;
      roomMediaReady = true;
      revealWhenMediaReady();
    };
    video.addEventListener("loadeddata", markRoomVideoReady, { once: true });
    video.addEventListener("canplay", markRoomVideoReady, { once: true });
    video.addEventListener("error", () => {
      if (roomMedia === video) showLevelLoadError(new Error(`Could not load ${ROOM_VIDEO_FILE}`));
    }, { once: true });

    function useRoomVideo() {
      if (!ROOM_VIDEO_FILE) {
        showLevelLoadError(new Error(`Could not decode ${ROOM_IMAGE_FILE}; no matching room video is available.`));
        return;
      }
      roomMedia = video;
      roomImage.style.display = "none";
      video.style.display = "block";
      video.preload = "auto";
      video.src = ROOM_VIDEO_FILE;
      video.load();
      const playPromise = video.play();
      if (playPromise && typeof playPromise.catch === "function") playPromise.catch(() => {});
    }

    roomImage.addEventListener("load", () => {
      if (!roomImage.naturalWidth || !roomImage.naturalHeight) {
        useRoomVideo();
        return;
      }
      roomMedia = roomImage;
      video.pause();
      video.style.display = "none";
      roomImage.style.display = "block";
      prepareRoomScene();
      roomMediaReady = true;
      revealWhenMediaReady();
    }, { once: true });
    roomImage.addEventListener("error", useRoomVideo, { once: true });

    jumpscareVideo.addEventListener("loadedmetadata", () => {
      jumpscareMetadataReady = true;
      revealWhenMediaReady();
    });
    resizeGameViewport();
    loadRandomLevel();
    revealWhenMediaReady();
    cameraRoom.textContent = ROOM_NAME;
    updateBatteryUI();
    updateCameraTimer();

    loadWords();
  </script>
</body>
</html>
